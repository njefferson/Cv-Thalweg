name: Fishing regulations

# BAKE THE REGULATIONS THIS APP QUOTES, FROM CDFW'S OWN SERVICE.
#
# WHY THIS WORKFLOW EXISTS AND NOT JUST THE TOOL. A regulation typed into
# source is right on the day it is typed and silently wrong afterwards, and the
# reader has no way to tell which they are looking at. A stale regulation is
# worse than none, because it is quoted with a section number and reads as
# authority — somebody keeping a fish on last season's limit is not a rendering
# defect. So the rules are not typed at all: they are asked for, monthly, and
# what CDFW said is what ships, with the date it said it.
#
# The tool's own --check refuses a bake older than 120 days, so if this
# workflow ever stops running the gates go red long before a reader could be
# looking at last season's rules. A schedule that silently stops is the failure
# this is guarding against, and it has to be able to fail loudly.

on:
  workflow_dispatch:
  schedule:
    # 06:25 UTC on the 6th — an odd minute so it is not queued behind everyone
    # else's midnight cron, and a different day from the access-lands bake so
    # two write-token jobs are never in flight against staging at once.
    - cron: '25 6 6 * *'

permissions:
  contents: read

concurrency:
  group: regulations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      # It commits the file it fetched, and nothing else.
      contents: write
    steps:
      # THE CREDENTIAL IS THE POINT HERE. This job commits what it fetched, so
      # `persist-credentials: false` would break it. It is bounded: the job's
      # permissions are contents:write and nothing else, it is dispatch- or
      # schedule-triggered so no outside input reaches it, the only file it adds
      # is the one it generates, and every step between checkout and push is
      # this repo's own code. zizmor: artipacked, declared not left standing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: staging

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Ask CDFW for the sections this app quotes
        run: node tools/fetch-regs.mjs --repo .

      # BEFORE COMMITTING IT, NOT AFTER. This refuses a heading with no rule
      # under it, a table (which does not render where this is read and loses
      # its columns without saying so), a section with no words, and a file
      # that does not say when it was read.
      - name: Check what came back before committing it
        run: node tools/fetch-regs.mjs --repo . --check

      # NOTHING IS COMMITTED IF NOTHING CHANGED — and the date alone changes on
      # every run, so a commit here means the rules moved or the file was
      # re-read after a gap. The only file this job may touch is the one it
      # generates: `git add` names it rather than taking whatever else happens
      # to be in the tree.
      - name: Commit if it moved
        run: |
          git config user.name  "thalweg regulations"
          git config user.email "actions@users.noreply.github.com"
          git add public/regulations.js
          if git diff --cached --quiet; then
            echo "Nothing changed — not even the date, which means the bake did not write."
            exit 0
          fi
          git commit -m "Fishing regulations, in CDFW's words as of today

          Generated by tools/fetch-regs.mjs from the department's own sport
          fishing regulations service. Nothing here is summarised or
          paraphrased: every section ships in the words the service returned,
          with its number and the date it was read. The printed regulations
          remain the authority and the app says so wherever it quotes one."
          git push origin HEAD:staging
