name: Tide stations

# BAKE NOAA'S STATION LIST INTO THE APP.
#
# The app used to ask NOAA for this at run time, from a reader's phone, because
# no station coordinate is ever typed into this app by hand. That rule stands —
# these are still NOAA's numbers, fetched from NOAA, never transcribed. What
# changed is WHEN: once, here, instead of two megabytes on a phone to find out
# where the tide stations are.
#
# It runs on demand and once a month. NOAA adds and retires stations slowly, and
# a reader is told by the app's own button if anything has appeared since the
# last bake — so this is the unhurried half and the button is the live half.

on:
  workflow_dispatch:
  schedule:
    # 07:20 UTC on the 3rd — an odd minute so it is not queued behind everyone
    # else's midnight cron.
    - cron: '20 7 3 * *'

permissions:
  contents: read

concurrency:
  group: stations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      # It commits the file it fetched, and nothing else.
      contents: write
    steps:
      # THE CREDENTIAL IS THE POINT HERE. This job commits what it fetched, so
      # `persist-credentials: false` would break it. It is bounded: the job's
      # permissions are contents:write and nothing else, it is dispatch- or
      # schedule-triggered so no outside input reaches it, the only file it adds
      # is the one it generates, and every step between checkout and push is
      # this repo's own code. zizmor: artipacked, declared not left standing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: staging

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Ask NOAA once
        run: node tools/fetch-stations.mjs

      - name: Check what came back before committing it
        run: node tools/fetch-stations.mjs --check

      # NOTHING IS COMMITTED IF NOTHING CHANGED, and the only file this job may
      # touch is the one it generates — `git add` names it rather than taking
      # whatever else happens to be in the tree.
      - name: Commit if it moved
        run: |
          git config user.name  "thalweg stations"
          git config user.email "actions@users.noreply.github.com"
          git add public/tide-stations.js
          if git diff --cached --quiet; then
            echo "NOAA's list has not changed since the last bake."
            exit 0
          fi
          git commit -m "Tide stations, as NOAA published them today

          Generated by tools/fetch-stations.mjs. These are NOAA's coordinates,
          fetched from NOAA — the app ships them so a reader has the stations on
          the map from first load, offline, without paying for a two-megabyte
          index on a phone."
          git push origin HEAD:staging
