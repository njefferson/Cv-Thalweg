name: River centrelines

# BAKE EACH RIVER'S OWN LINE INTO THE APP.
#
# The profile could only ever follow a line the reader drew, because this app
# had no centreline and its standing rule is that no coordinate is invented
# here. This fetches one from the USGS national hydrography — these are USGS's
# coordinates, fetched from USGS, never transcribed — so the app can profile the
# river itself with no signal and nothing to download.
#
# It runs on demand and once a month, which is far more often than a river
# moves. The point of the schedule is not the water: it is that NHDPlus is
# re-published, and a generated file nobody ever regenerates is one that quietly
# stops matching its source.

on:
  workflow_dispatch:
  schedule:
    # 07:20 UTC on the 3rd — an odd minute so it is not queued behind everyone
    # else's midnight cron.
    - cron: '20 7 3 * *'

permissions:
  contents: read

concurrency:
  group: centrelines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      # It commits the file it fetched, and nothing else.
      contents: write
    steps:
      # THE CREDENTIAL IS THE POINT HERE. This job commits what it fetched, so
      # `persist-credentials: false` would break it. It is bounded: the job's
      # permissions are contents:write and nothing else, it is dispatch- or
      # schedule-triggered so no outside input reaches it, the only file it adds
      # is the one it generates, and every step between checkout and push is
      # this repo's own code. zizmor: artipacked, declared not left standing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: staging

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Ask USGS for the flowlines
        run: node tools/fetch-centrelines.mjs

      - name: Check what came back before committing it
        run: node tools/fetch-centrelines.mjs --check

      # NOTHING IS COMMITTED IF NOTHING CHANGED, and the only file this job may
      # touch is the one it generates — `git add` names it rather than taking
      # whatever else happens to be in the tree.
      - name: Commit if it moved
        run: |
          git config user.name  "thalweg centrelines"
          git config user.email "actions@users.noreply.github.com"
          git add public/river-lines.js
          if git diff --cached --quiet; then
            echo "The centrelines have not moved since the last bake."
            exit 0
          fi
          git commit -m "River centrelines, as USGS publishes them today

          Generated by tools/fetch-centrelines.mjs from NHDPlus High Resolution.
          These are USGS's coordinates, fetched from USGS. The app ships them so
          it can profile the depth down a river's own course offline, without
          this app inventing a line down the middle of anything."
          git push origin HEAD:staging
