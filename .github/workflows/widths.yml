name: USGS river widths

# HOW WIDE EACH RIVER IS, MEASURED ACROSS USGS'S MAPPED WATER SURFACE.
#
# The down-river profile draws the depth; this is the other dimension of the
# same channel. It is geometry rather than a download: the generator casts a
# line across the NHD area polygon perpendicular to the committed centreline
# and takes the distance between the two nearest bank crossings.
#
# It runs on demand and quarterly rather than monthly. NHD is a compilation at
# 1:24,000 and it does not move the way a facility list or a regulation does —
# but it does get recompiled, and a generated file nobody regenerates quietly
# stops matching its source.
#
# It depends on public/river-lines.js: the width is measured ACROSS the course,
# so there has to be a course. The generator refuses to run without one.

on:

  workflow_dispatch:
  schedule:
    # 05:10 UTC on the 9th of January, April, July and October — quarterly, and
    # on a day and minute no other bake in this repo uses, so two jobs never
    # race for the same branch.
    - cron: '10 5 9 1,4,7,10 *'

permissions:
  contents: read

concurrency:
  group: widths-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      # It commits the file it fetched, and nothing else.
      contents: write
    steps:
      # THE CREDENTIAL IS THE POINT HERE. This job commits what it fetched, so
      # `persist-credentials: false` would break it. It is bounded: the job's
      # permissions are contents:write and nothing else, it is dispatch- or
      # schedule-triggered so no outside input reaches it, the only file it adds
      # is the one it generates, and every step between checkout and push is
      # this repo's own code. zizmor: artipacked, declared not left standing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: staging

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Measure the width across USGS's mapped water
        run: node tools/fetch-widths.mjs

      - name: Check what came back before committing it
        run: node tools/fetch-widths.mjs --check

      # NOTHING IS COMMITTED IF NOTHING CHANGED, and the only file this job may
      # touch is the one it generates — `git add` names it rather than taking
      # whatever else happens to be in the tree.
      - name: Commit if it moved
        run: |
          git config user.name  "thalweg access lands"
          git config user.email "actions@users.noreply.github.com"
          git add public/river-widths.js
          if git diff --cached --quiet; then
            echo "CDFW's lands have not changed since the last bake."
            exit 0
          fi
          git commit -m "River widths, measured across USGS's mapped water surface

          Generated by tools/fetch-widths.mjs from the NHD large-scale Area
          layer. It is the MAPPED channel at 1:24,000 and not today's water. A
          null is a refusal — a confluence, a bypass, or a reach where USGS's
          flowline and its own area polygon do not agree."
          git push origin HEAD:staging
