name: CDFW boating facilities

# BAKE CDFW'S OWN RECORD OF WHERE YOU CAN LAUNCH INTO THE APP.
#
# Public boating facilities within a kilometre of each river's course, from the
# FishingGuide service behind CDFW's own Fishing Guide map. The app asserted for
# its whole life that no such list existed; that was written on evidence
# gathered through a firewall, where a refused host and an absent dataset look
# identical from inside. (Hub LESSONS §188.)
#
# It runs on demand and monthly. Facilities close, owners change, and CDFW does
# re-interview — and a generated file nobody regenerates quietly stops matching
# its source.
#
# It depends on public/river-lines.js already being committed: without a course
# to measure against, only a bounding box decides which river a launch is on,
# and these boxes are hundreds of kilometres across.

on:
  workflow_dispatch:
  schedule:
    # 06:25 UTC on the 7th — a different day and minute from the other bakes, so
    # two jobs do not race for the same branch.
    - cron: '25 6 7 * *'

permissions:
  contents: read

concurrency:
  group: ramps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      # It commits the file it fetched, and nothing else.
      contents: write
    steps:
      # THE CREDENTIAL IS THE POINT HERE. This job commits what it fetched, so
      # `persist-credentials: false` would break it. It is bounded: the job's
      # permissions are contents:write and nothing else, it is dispatch- or
      # schedule-triggered so no outside input reaches it, the only file it adds
      # is the one it generates, and every step between checkout and push is
      # this repo's own code. zizmor: artipacked, declared not left standing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: staging

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Ask CDFW for its boating facilities
        run: node tools/fetch-ramps.mjs

      - name: Check what came back before committing it
        run: node tools/fetch-ramps.mjs --check

      # NOTHING IS COMMITTED IF NOTHING CHANGED, and the only file this job may
      # touch is the one it generates — `git add` names it rather than taking
      # whatever else happens to be in the tree.
      - name: Commit if it moved
        run: |
          git config user.name  "thalweg access lands"
          git config user.email "actions@users.noreply.github.com"
          git add public/ramps.js
          if git diff --cached --quiet; then
            echo "CDFW's lands have not changed since the last bake."
            exit 0
          fi
          git commit -m "CDFW boating facilities, as the department publishes them today

          Generated by tools/fetch-ramps.mjs from the FishingGuide service.
          These are CDFW's coordinates and CDFW's own fields. Every row carries
          the year it was last visited, or says it has none — the age is the
          caveat and it travels with the data."
          git push origin HEAD:staging
