name: Gates

# Every gate this repo is held to, run on the runner rather than by hand on a
# laptop. They were run by hand for the first eleven releases, which meant the
# record of whether they passed was a sentence in a commit message.
#
# The hub's gates are CALLED, not copied. hub-gates.yml is a workflow_call
# workflow in the hub: this repo names it and gets every gate the hub owns, so
# adding one there adds it here on the next pin bump. Copying a job that runs
# them is what let four siblings run five gates and three run three, with
# nothing recording why.
#
# The pin is a SHA. A gate that changes under you turns a red run into a
# mystery, and the reusable workflow checks the hub out at exactly this pin.
#
# Actions are pinned by SHA. A tag is a mutable pointer somebody else controls.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything the hub owns, in one line rather than eight steps that drift.
  hub-gates:
    uses: njefferson/noahjefferson/.github/workflows/hub-gates.yml@e2a5b7cb6b59311bdc7379abd0dea442edc8422f
    with:
      pwa: true

  # This repo's own gates stay here. They are about THIS app — its proxy, its
  # rendering, its walks — and nothing in the hub knows about them.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pinned tooling
        run: npm ci

      # First, because it needs no network, no browser and no credentials, and
      # because it is what stands between a survey proxy and an open proxy.
      - name: The proxy's allow-list
        run: node tools/test-worker.mjs

      # playwright-core, not playwright: this repo depends on the core package
      # and `npx playwright install` therefore had nothing to run, which
      # --no-install correctly refused rather than fetching a package at run
      # time in a job that later holds no token but still executes our code.
      - name: Install the browsers the walks drive
        run: npx --no-install playwright-core install --with-deps chromium webkit

      - name: Serve the site for the walks
        run: |
          node tools/serve.mjs & echo $! > /tmp/serve.pid
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8787/ && exit 0
            sleep 1
          done
          echo "the local server never came up"
          exit 1

      - name: Rendering, against stubbed services
        run: node tools/render-test.mjs

      # Six viewport geometries and two browser engines, including WebKit —
      # which is where a first-run defect lived that every Chromium check
      # called correct (hub LESSONS §175).
      - name: Accessibility, offline, and the phone geometries
        run: node tools/a11y.mjs

      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/serve.pid)" 2>/dev/null || true

  # The live suite talks to USGS, NOAA and DWR, so it is its own job: when a
  # public agency is having a bad morning that must not read as this repo
  # being broken. It is reported, and it does not gate the merge.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Serve the site
        run: |
          node tools/serve.mjs & echo $! > /tmp/serve.pid
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8787/ && exit 0
            sleep 1
          done
          exit 1
      - name: End to end, against the real services
        run: node tools/live-test.mjs
      - if: always()
        run: kill "$(cat /tmp/serve.pid)" 2>/dev/null || true
