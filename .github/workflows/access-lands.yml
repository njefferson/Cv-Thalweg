name: CDFW access lands

# BAKE CDFW'S OWN LANDS INTO THE APP.
#
# Places the department owns or operates and says the public may go, within
# twelve kilometres of each river's course. NOT boat ramps: no published
# ramp dataset for these rivers could be found, and this app does not invent
# one.
#
# It runs on demand and monthly. Land changes hands, access notes are rewritten,
# and a generated file nobody regenerates quietly stops matching its source.
#
# It depends on public/access-lands.js already being committed: without a course
# to measure against, only a bounding box decides which river a place is on, and
# that put a wildlife area under the wrong river.

on:
  workflow_dispatch:
  schedule:
    # 07:20 UTC on the 3rd — an odd minute so it is not queued behind everyone
    # else's midnight cron.
    - cron: '40 7 5 * *'

permissions:
  contents: read

concurrency:
  group: access-lands-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      # It commits the file it fetched, and nothing else.
      contents: write
    steps:
      # THE CREDENTIAL IS THE POINT HERE. This job commits what it fetched, so
      # `persist-credentials: false` would break it. It is bounded: the job's
      # permissions are contents:write and nothing else, it is dispatch- or
      # schedule-triggered so no outside input reaches it, the only file it adds
      # is the one it generates, and every step between checkout and push is
      # this repo's own code. zizmor: artipacked, declared not left standing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: staging

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Ask CDFW for its lands
        run: node tools/fetch-access.mjs

      - name: Check what came back before committing it
        run: node tools/fetch-access.mjs --check

      # NOTHING IS COMMITTED IF NOTHING CHANGED, and the only file this job may
      # touch is the one it generates — `git add` names it rather than taking
      # whatever else happens to be in the tree.
      - name: Commit if it moved
        run: |
          git config user.name  "thalweg access lands"
          git config user.email "actions@users.noreply.github.com"
          git add public/access-lands.js
          if git diff --cached --quiet; then
            echo "CDFW's lands have not changed since the last bake."
            exit 0
          fi
          git commit -m "CDFW access lands, as the department publishes them today

          Generated by tools/fetch-access.mjs. These are CDFW's coordinates and
          CDFW's own words about access. They are not boat ramps and this app
          does not call them that: no published list of ramps for these rivers
          could be reached."
          git push origin HEAD:staging
