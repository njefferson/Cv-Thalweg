  return { first:first, last:last, lo:lo, hi:hi, delta:delta, pct:pct, dir:dir,
           dayDelta: day ? last.v - day.v : null,
           span: (last.t - first.t) / (24*3600*1000) };
}

/* The line. Drawn at the width it is actually rendered at, for the reason
   the ribbon is: a fixed viewBox squeezed into a phone renders every
   figure at a fraction of its stated size and leaves the difference as
   dead space. */
function svgText(attrs, str){
  var n = svg('text', attrs); n.textContent = str; return n;
}

function sparkline(pts, opts){
  var W = Math.max(opts.width || 320, 220), H = opts.height || 64;
  var padL = 4, padR = 4, padT = 8, padB = 14;
  var host = svg('svg', { viewBox:'0 0 ' + W + ' ' + H, width:W, height:H,
    class:'spark', role:'img', 'aria-label':opts.label || '' });
  if (!pts || pts.length < 2) return host;
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  var lo = pts[0].v, hi = pts[0].v;
  pts.forEach(function(p){ if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; });
  var pad = (hi - lo) || Math.abs(hi) * 0.02 || 1;
  lo -= pad * 0.12; hi += pad * 0.12;
  function X(t){ return padL + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - padL - padR); }
  function Y(v){ return padT + (1 - (v - lo) / ((hi - lo) || 1)) * (H - padT - padB); }

  /* A day grid, so "how fast" has something to be fast against. */
  var dayMs = 24*3600*1000;
  for (var t = t1; t > t0; t -= dayMs)
    host.appendChild(svg('line', { x1:X(t), x2:X(t), y1:padT, y2:H-padB, class:'spark-grid' }));

  var d = pts.map(function(p,i){ return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
  host.appendChild(svg('path', { d:d + ' L' + X(t1).toFixed(1) + ' ' + (H-padB) +
    ' L' + X(t0).toFixed(1) + ' ' + (H-padB) + ' Z', class:'spark-fill',
    fill: opts.stroke || 'currentColor' }));
  host.appendChild(svg('path', { d:d, class:'spark-line',
    'vector-effect':'non-scaling-stroke',
    stroke: opts.stroke || 'currentColor' }));
  var last = pts[pts.length-1];
  host.appendChild(svg('circle', { cx:X(last.t), cy:Y(last.v), r:3, class:'spark-now',
    fill: opts.stroke || 'currentColor' }));
  host.appendChild(svgText({ x:padL, y:H-3, class:'spark-ax' }, opts.days + ' days ago'));
  host.appendChild(svgText({ x:W-padR, y:H-3, class:'spark-ax', 'text-anchor':'end' }, 'now'));
  return host;
}

/* A box the line is drawn INTO after it is on the page, not a line drawn
   at a width guessed beforehand. The ribbon was built the other way and
   rendered every figure at half size inside a viewBox four times the space
   it had; the difference is invisible until it is measured, so the width
   comes from the element itself. */
function sparkHost(pts, opts){
  var host = el('div',{class:'spark-host'});
  host._draw = function(w){
    host.innerHTML = '';
    var o = {}; for (var k in opts) o[k] = opts[k];
    o.width = w;
    host.appendChild(sparkline(pts, o));
  };
  return host;
}

function drawTrendLines(){
  var hosts = document.querySelectorAll('#panel-water .spark-host');
  Array.prototype.forEach.call(hosts, function(h){
    if (h._draw) h._draw(Math.max(h.clientWidth || 300, 220));
  });
}

function trendSection(river){
  var box = el('div',{});
  var tr = state.trends[river.id];
  if (!tr){ box.appendChild(el('p',{class:'note',text:'Loading the last seven days…'})); return box; }
  if (tr.failed){
    box.appendChild(el('p',{class:'note',
      text:'No history this time — ' + tr.failed + '. The readings above are unaffected.'}));
    return box;
  }
  if (tr.stale) box.appendChild(el('div',{class:'warnbox',
    text:'Stored history, ' + ageText(Date.now() - tr.fetchedAt) +
         '. The network did not answer, so this is the last week that arrived.'}));

  if (tr.flow){
    var fs = trendStats(tr.flow.pts, Math.max(Math.abs(tr.flow.pts[0].v) * 0.03, 5));
    var line = el('p',{class:'trend-say'});
    if (tr.tidal){
      line.textContent = 'Flow at ' + tr.flow.name + ' swings with the tide, so the ' +
        'shape below is the tide rather than what the river is carrying. There is no ' +
        'gauge above the tide on this river to ask instead.';
    } else if (fs){
      var word = fs.dir === 'steady' ? 'Steady' : fs.dir === 'up' ? 'Rising' : 'Falling';
      line.textContent = word + ' — ' + commas(fmt(fs.last.v,0)) + ' cfs now, ' +
        (fs.dir === 'steady' ? 'within ' : fs.delta > 0 ? 'up ' : 'down ') +
        commas(fmt(Math.abs(fs.delta),0)) + ' cfs' +
        (fs.pct === null ? '' : ' (' + fmt(Math.abs(fs.pct),0) + '%)') +
        ' over ' + fmt(fs.span,0) + ' days' +
        (fs.dayDelta === null ? '' :
          ', ' + (Math.abs(fs.dayDelta) < 1 ? 'level' :
            (fs.dayDelta > 0 ? 'up ' : 'down ') + commas(fmt(Math.abs(fs.dayDelta),0))) +
          ' in the last day') + '.';
    }
    box.appendChild(el('h3',{class:'trend-h',text:'Flow — ' + tr.flow.name}));
    box.appendChild(line);
    box.appendChild(sparkHost(tr.flow.pts, { days:tr.days, stroke:'var(--cyan)',
      label: 'Flow at ' + tr.flow.name + ' over ' + tr.days + ' days. ' + line.textContent }));
    box.appendChild(el('p',{class:'rdg-id',
      text: (tr.flow.source || 'USGS') + ' ' + tr.flow.site + ' · low ' +
        commas(fmt(trendStats(tr.flow.pts,0).lo.v,0)) + ', high ' +
        commas(fmt(trendStats(tr.flow.pts,0).hi.v,0)) + ' cfs over the week'}));
  }

  if (tr.temp){
    var ts = trendStats(tr.temp.pts, 0.5);
    var tline = el('p',{class:'trend-say'});
    if (ts){
      var tword = ts.dir === 'steady' ? 'Steady' : ts.dir === 'up' ? 'Warming' : 'Cooling';
      tline.textContent = tword + ' — ' + fmt(ts.last.v,1) + 'F now, ' +
        (ts.dir === 'steady' ? 'within ' : ts.delta > 0 ? 'up ' : 'down ') +
        fmt(Math.abs(ts.delta),1) + 'F over ' + fmt(ts.span,0) + ' days' +
        (ts.dayDelta === null ? '' :
          ', ' + (Math.abs(ts.dayDelta) < 0.2 ? 'level' :
            (ts.dayDelta > 0 ? 'up ' : 'down ') + fmt(Math.abs(ts.dayDelta),1)) +
          ' in the last day') + '.';
    }
    box.appendChild(el('h3',{class:'trend-h',text:'Water temperature — ' + tr.temp.name}));
    box.appendChild(tline);
    box.appendChild(sparkHost(tr.temp.pts, { days:tr.days,
      stroke: tempColour(tr.temp.pts[tr.temp.pts.length-1].v),
      label: 'Water temperature at ' + tr.temp.name + ' over ' + tr.days + ' days. ' + tline.textContent }));
    box.appendChild(el('p',{class:'rdg-id',
      text: (tr.temp.source || 'USGS') + ' ' + tr.temp.site + ' · low ' +
        fmt(trendStats(tr.temp.pts,0).lo.v,1) + ', high ' +
        fmt(trendStats(tr.temp.pts,0).hi.v,1) + 'F over the week'}));
  }

  (tr.noHistory || []).forEach(function(n){
    var many = n.id.indexOf(',') !== -1;
    box.appendChild(el('p',{class:'note',
      text:'No ' + n.what + ' history at ' + n.name + ' (' + n.id + '). ' +
        (many ? 'They answer' : 'It answers') + ' for right now and ' +
        (many ? 'publish' : 'publishes') +
        ' nothing back over the week, so there is no line to draw.'}));
  });

  if (!tr.flow && !tr.temp && !(tr.noHistory || []).length)
    box.appendChild(el('p',{class:'note',text:'No history published for this reach.'}));

  box.appendChild(el('p',{class:'note',
    text:'What the line is: every reading the service published over the last ' +
      tr.days + ' days, thinned to fit the width, with the day marks behind it. ' +
      'Nothing here is smoothed, predicted or extended past the last reading.'}));
  return box;
}

/* =====================================================================
   How deep is it HERE.

   The published surveys are already drawn as a coloured surface; reading a
   colour off a ramp is not a depth. This asks the service for the number
   under the point.

   Two requests, in order, because one is not enough. `identify` returns the
   pixel and is exact — but a survey's rectangular extent is mostly land: of
   four hundred points sampled across the Sacramento survey's whole box,
   ONE had a value. A fingertip covers about a hundred metres at the zoom
   people actually use, so a single-pixel question misses the surveyed
   ribbon nearly every time and answers NoData, which reads as "no survey
   here" when it means "not that exact pixel". So a miss falls through to
   `getSamples` over a hundred metres square, and the nearest point with a
   value is reported WITH ITS DISTANCE, which is the honest form of the
   answer: not the depth where you tapped, but the depth of the nearest
   place anybody measured, and how far away that is.
   ===================================================================== */
var DEPTH_SPAN_M = 100;      /* half-width of the fallback search box */
var DEPTH_MAX_SURVEYS = 3;   /* how many overlapping surveys to ask */

function metresBetween(aLat, aLon, bLat, bLon){
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (bLat - aLat) * rad, dLon = (bLon - aLon) * rad;
  var s = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(aLat*rad) * Math.cos(bLat*rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

/* DWR names these services with the survey date in them. It is read rather
   than assumed: a name without one yields no date and the panel says the
   date is unknown instead of inventing one. */
function surveyDate(name){
  var m = /_(\d{4})(\d{2})(\d{2})_/.exec(String(name || ''));
  if (!m) return null;
  return m[1] + '-' + m[2] + '-' + m[3];
}

/* DWR's service names are machine names: Bathy_NCRO_20230208_SacramentoRiver.
   The reader gets the readable part and the machine name stays beside it, so
   what is on screen can still be matched to what is in the catalogue. */
function surveyLabel(name){
  /* Two naming schemes, both machine names: Bathy_NCRO_20230208_River for a
     multibeam service and i06_Bathy_AGENCY_YEAR_Place for a single beam
     layer. Strip the scheme, keep the place, and leave any year in it —
     a reader choosing between a 1933 survey and a 2024 one needs that. */
  var rest = String(name || '')
    .replace(/^i\d+[_\s]*/i, '')
    .replace(/^Bathy[_\s]*/i, '')
    .replace(/^NCRO[_\s]*/i, '')
    .replace(/^\d{8}[_\s]*/, '');
  rest = rest.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2')
             .replace(/\s+/g, ' ').trim();
  return rest || String(name || 'unnamed survey');
}

function boxHas(box, lat, lon){
  return !!box && lat >= box.s && lat <= box.n && lon >= box.w && lon <= box.e;
}

/* Which surveys cover this point, newest first, with whatever is switched
   on put at the front so the number agrees with the colours on screen. */
function surveysAt(lat, lon){
  var cat = state.catalog;
  if (!cat || !cat.raster) return [];
  var hits = cat.raster.filter(function(r){ return boxHas(r.box, lat, lon); });
  hits.forEach(function(r){ r._date = surveyDate(r.name); });
  hits.sort(function(a, b){
    var aOn = state.layers['r:' + a.name] ? 1 : 0, bOn = state.layers['r:' + b.name] ? 1 : 0;
    if (aOn !== bOn) return bOn - aOn;
    return String(b._date || '').localeCompare(String(a._date || ''));
  });
  return hits;
}

function identifyDepth(path, lat, lon){
  var url = dwr(path + '/identify?f=json&returnGeometry=false&geometryType=esriGeometryPoint' +
    '&geometry=' + encodeURIComponent(JSON.stringify({ x:lon, y:lat, spatialReference:{ wkid:4326 } })));
  return getJSON(url, 20000).then(function(j){
    var v = j && j.value;
    if (v === undefined || v === null || v === '' || v === 'NoData') return null;
    var n = Number(v);
    return isNum(n) ? n : null;
  });
}

/* A square of samples, in the coordinate system the app already works in,
   so nothing here has to know how the survey was projected. */
function sampleNearest(path, lat, lon){
  var d = DEPTH_SPAN_M / 111320;                      /* metres to degrees */
  var dx = d / Math.max(Math.cos(lat * Math.PI / 180), 0.2);
  var g = { xmin:lon-dx, ymin:lat-d, xmax:lon+dx, ymax:lat+d, spatialReference:{ wkid:4326 } };
  var url = dwr(path + '/getSamples?f=json&outSR=4326&geometryType=esriGeometryEnvelope' +
    '&sampleCount=100&geometry=' + encodeURIComponent(JSON.stringify(g)));
  return getJSON(url, 20000).then(function(j){
    var best = null;
    (j && j.samples || []).forEach(function(s){
      if (s.value === '' || s.value === 'NoData' || s.value === null || s.value === undefined) return;
      var v = Number(s.value);
      if (!isNum(v) || !s.location) return;
      var sl = Number(s.location.y), so = Number(s.location.x);
      if (!isNum(sl) || !isNum(so)) return;
      var m = metresBetween(lat, lon, sl, so);
      if (!best || m < best.m) best = { v:v, m:m, lat:sl, lon:so };
    });
    return best;
  });
}

/* The answer, in the order a person would want it: the number under the
   point; failing that the nearest measured point and how far; failing that
   which surveys cover here and could not answer; failing that that none
   does. Each of those is a different fact and none of them is a dash. */
function depthAt(lat, lon){
  /* Not knowing and knowing there is nothing are different answers, and the
     first must never be printed as the second: with no catalogue loaded,
     "no survey covers this point" is a claim about California made by an
     app that has not asked. Same shape as a history request that timed out
     being reported as a gauge publishing nothing. */
  if (!state.catalog || !state.catalog.raster || !state.catalog.raster.length)
    return Promise.resolve({ none:'nocatalog', covering:[] });
  var covering = surveysAt(lat, lon);
  if (!covering.length)
    return Promise.resolve({ none:'nowhere', covering:[] });
  var list = covering.slice(0, DEPTH_MAX_SURVEYS);

  function tryIdentify(i){
    if (i >= list.length) return Promise.resolve(null);
    return identifyDepth(list[i].path, lat, lon).then(function(v){
      if (isNum(v)) return { value:v, survey:list[i], exact:true };
      return tryIdentify(i + 1);
    }, function(){ return tryIdentify(i + 1); });
  }

  return tryIdentify(0).then(function(hit){
    if (hit) return hit;
    return sampleNearest(list[0].path, lat, lon).then(function(near){
      if (near) return { value:near.v, survey:list[0], exact:false,
                         away:near.m, lat:near.lat, lon:near.lon };
      return { none:'notmeasured', covering:list };
    }, function(e){
      return { failed:String(e && e.message || e), covering:list };
    });
  });
}

/* =====================================================================
   THE PROFILE — what the bottom does along a line.

   A point tells you the depth where you are standing. A LINE tells you the
   shape, which is the question actually being asked: where the channel is,
   which side of it you are on, and how fast it drops away. The app is named
   after the deepest line in a channel and could not draw one.

   The line is the READER'S, and that is the whole design. A profile down the
   middle of the river needs a published centreline this app does not have, and
   the app's standing rule is that no coordinate is invented here — so rather
   than guess a centreline, or guess which way "across" points, it profiles
   whatever line you draw. Drawn down the channel it is a long profile; drawn
   bank to bank it is a cross-section; and it is the same code either way.

   ONE REQUEST PER SURVEY, not one per sample. The service answers getSamples
   for a polyline with the samples ordered along it — measured against the live
   ImageServer before this was written, because a rendering rule ArcGIS does
   not understand comes back as HTTP 200 and an empty answer rather than an
   error. Eighty samples down three miles of the Sacramento costs one call.
   ===================================================================== */
var PROFILE_SAMPLES = 90;   /* per survey, per line */

function metresAlong(pts){
  var out = [0];
  for (var i = 1; i < pts.length; i++)
    out.push(out[i - 1] + metresBetween(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]));
  return out;
}

/* Every survey whose box the line passes through, so a line crossing two
   surveys gets a band from each rather than silently taking one. */
function surveysAlong(pts){
  var cat = state.catalog;
  if (!cat || !cat.raster) return [];
  var hit = {};
  pts.forEach(function(p){
    surveysAt(p[0], p[1]).forEach(function(r){ hit[r.name] = r; });
  });
  return Object.keys(hit).map(function(k){ return hit[k]; }).slice(0, DEPTH_MAX_SURVEYS);
}

function sampleLine(path, pts){
  var line = { paths:[ pts.map(function(p){ return [p[1], p[0]]; }) ],
               spatialReference:{ wkid:4326 } };
  var url = dwr(path + '/getSamples?f=json&outSR=4326&geometryType=esriGeometryPolyline' +
    '&sampleCount=' + PROFILE_SAMPLES + '&geometry=' + encodeURIComponent(JSON.stringify(line)));
  return getJSON(url, 25000).then(function(j){
    var out = [];
    (j && j.samples || []).forEach(function(sm){
      if (!sm.location) return;
      var lat = Number(sm.location.y), lon = Number(sm.location.x);
      if (!isNum(lat) || !isNum(lon)) return;
      /* NoData is not zero. A survey that did not measure a spot must leave a
         gap in the line, not a reading at the surface. */
      var v = (sm.value === '' || sm.value === null || sm.value === undefined ||
               sm.value === 'NoData') ? null : Number(sm.value);
      out.push({ lat:lat, lon:lon, v:isNum(v) ? v : null });
    });
    return out;
  });
}

/* Distance of a point from the line, and how far along it that lands — so a
   reader's own position can be put at the right place on the picture rather
   than at the end of it. */
function projectOnLine(pts, lat, lon){
  var best = null, run = 0;
  for (var i = 1; i < pts.length; i++){
    var a = pts[i-1], b = pts[i];
    var segLen = metresBetween(a[0], a[1], b[0], b[1]);
    if (segLen < 1){ run += segLen; continue; }
    /* Local flat approximation: fine over a segment, and this is a picture of
       a river reach rather than a survey of one. */
    var kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
    var ax = 0, ay = 0;
    var bx = (b[1] - a[1]) * kx, by = (b[0] - a[0]) * ky;
    var px = (lon  - a[1]) * kx, py = (lat  - a[0]) * ky;
    var t = ((px - ax) * bx + (py - ay) * by) / (bx * bx + by * by);
    t = Math.max(0, Math.min(1, t));
    var dx = px - bx * t, dy = py - by * t;
    var off = Math.sqrt(dx * dx + dy * dy);
    if (!best || off < best.off) best = { off:off, along:run + segLen * t };
    run += segLen;
  }
  return best;
}

function buildProfile(pts){
  var surveys = surveysAlong(pts);
  if (!surveys.length)
    return Promise.resolve({ none:state.catalog && state.catalog.raster ? 'nowhere' : 'nocatalog',
                             pts:pts });
  return Promise.all(surveys.map(function(sv){
    return sampleLine(sv.path, pts).then(function(rows){
      return { survey:sv, rows:rows };
    }, function(e){ return { survey:sv, failed:String(e && e.message || e), rows:[] }; });
  })).then(function(bands){
    /* Distance along the line for every sample, from the sample's OWN
       position rather than from its index — the service is entitled to space
       them how it likes, and an index would draw an even spacing it never
       promised. */
    bands.forEach(function(b){
      b.pts = b.rows.map(function(r){
        var pr = projectOnLine(pts, r.lat, r.lon);
        return { d: pr ? pr.along : 0, v:r.v, lat:r.lat, lon:r.lon };
      }).sort(function(x, y){ return x.d - y.d; });
      var got = b.pts.filter(function(x){ return isNum(x.v); });
      b.measured = got.length;
      b.deepest = got.length ? Math.min.apply(null, got.map(function(x){ return x.v; })) : null;
    });
    var all = [];
    bands.forEach(function(b){ b.pts.forEach(function(x){ if (isNum(x.v)) all.push(x.v); }); });
    return {
      pts: pts,
      length: metresAlong(pts).pop(),
      bands: bands,
      deepest: all.length ? Math.min.apply(null, all) : null,
      measured: all.length
    };
  });
}

/* ---- drawing it -------------------------------------------------------
   Depth DOWN is the whole point, so the surface is the top edge and deeper is
   further down — the shape a fisherman already has in their head. The vertical
   scale is never shared with the horizontal one: a mile of river against
   thirty feet of water drawn true to scale is a flat line, and the shape is
   what the picture is for. The axis says so rather than letting the drawing
   imply a slope nobody measured. */
function renderProfile(){
  var m = state.profile;
  var sec = $('#profile'), svg = $('#profsvg'), note = $('#profnote');
  if (!m){ sec.hidden = true; svg.innerHTML = ''; return; }
  sec.hidden = false;

  var wrap = $('#profwrap');
  var H = Math.max(90, wrap.clientHeight || 150);
  var base = Math.max(320, wrap.clientWidth || 360);
  var W = Math.round(base * (state.profZoom || 1));
  var padL = 34, padR = 10, padT = 10, padB = 18;
  svg.setAttribute('width', W);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.width = W + 'px';
  svg.innerHTML = '';

  var NS = 'http://www.w3.org/2000/svg';
  function node(t, at){ var n = document.createElementNS(NS, t);
    for (var k in at) if (at[k] !== null && at[k] !== undefined) n.setAttribute(k, at[k]);
    return n; }

  /* CLEARING THE DRAWING DELETED ITS OWN NAME. The <title> is a child of the
     svg, so innerHTML = '' took it with the last render and left a role="img"
     with nothing naming it — invisible on screen and total for anyone reading
     by ear. It is rebuilt with the picture, every time. */
  var ttl = node('title', { id:'profsvgtitle' });
  svg.appendChild(ttl);
  function name(t){ ttl.textContent = t; }

  if (m.none || !isNum(m.deepest)){
    var why = m.none === 'nocatalog'
      ? 'The survey directory has not arrived, so this cannot be answered yet \u2014 which is not the same as there being no survey here.'
      : m.none === 'nowhere'
        ? 'No published survey covers this line. Draw one over water the state has actually measured, and the Depth panel lists which reaches those are.'
        : 'The survey covers this line but measured nothing along it. That is missing data, not flat bottom \u2014 dense weed defeats the sounder and those cells are dropped.';
    note.textContent = why;
    name('No depth along this line. ' + why);
    return;
  }

  /* Deepest at the bottom of the picture, with a little air under it. */
  var maxD = Math.abs(m.deepest) * 1.08 + 1;
  var x = function(d){ return padL + (d / (m.length || 1)) * (W - padL - padR); };
  var y = function(v){ return padT + (Math.abs(v) / maxD) * (H - padT - padB); };

  /* The water itself, so the picture reads as a section through a river and
     not as a graph that happens to go down. */
  svg.appendChild(node('rect', { x:padL, y:padT, width:W - padL - padR,
    height:H - padT - padB, fill:'#0B2430' }));

  /* Depth grid, labelled, because a shape with no numbers is decoration. */
  var step = maxD > 60 ? 20 : maxD > 24 ? 10 : 5;
  for (var d = step; d < maxD; d += step){
    svg.appendChild(node('line', { x1:padL, x2:W - padR, y1:y(d), y2:y(d),
      stroke:'#2E7C76', 'stroke-width':1, opacity:.45 }));
    var lab = node('text', { x:4, y:y(d) + 3, fill:'#9FB3B1', 'font-size':9 });
    lab.textContent = d + 'ft';
    svg.appendChild(lab);
  }

  /* One band per survey. Where two surveys cover the same water they are two
     answers, measured on different days, and the app shows both rather than
     picking one and calling it the bottom. */
  var colours = ['#7BD5D9', '#C9A96A', '#9BD98C'];
  m.bands.forEach(function(b, i){
    var col = colours[i % colours.length];
    /* Runs, split on missing data. A line drawn straight across a gap invents
       a bottom between two places nobody measured. */
    var run = [];
    var runs = [];
    b.pts.forEach(function(pt){
      if (isNum(pt.v)) run.push(pt);
      else if (run.length){ runs.push(run); run = []; }
    });
    if (run.length) runs.push(run);

    runs.forEach(function(r){
      if (r.length === 1){
        svg.appendChild(node('circle', { cx:x(r[0].d), cy:y(r[0].v), r:2, fill:col }));
        return;
      }
      var dd = r.map(function(pt){ return x(pt.d).toFixed(1) + ',' + y(pt.v).toFixed(1); });
      /* The first band gets the filled envelope: surface down to the bottom it
         measured, which is the water you would be fishing through. */
      if (i === 0){
        var area = node('path', { fill:col, opacity:.14,
          d:'M' + x(r[0].d).toFixed(1) + ',' + y(0).toFixed(1) +
            ' L' + dd.join(' L') +
            ' L' + x(r[r.length-1].d).toFixed(1) + ',' + y(0).toFixed(1) + ' Z' });
        svg.appendChild(area);
      }
      svg.appendChild(node('path', { fill:'none', stroke:col,
        'stroke-width': i === 0 ? 2 : 1.4, 'stroke-linejoin':'round',
        'stroke-dasharray': i === 0 ? null : '4 3',
        d:'M' + dd.join(' L') }));
    });
  });

  /* WHERE YOU ARE ON THE LINE. Only when you are actually near it — a marker
     for somebody two miles away is a lie about the picture. */
  var youText = '';
  if (state.here){
    var pr = projectOnLine(m.pts, state.here.lat, state.here.lon);
    if (pr && pr.off < 200){
      svg.appendChild(node('line', { x1:x(pr.along), x2:x(pr.along), y1:padT,
        y2:H - padB, stroke:'#E76F9F', 'stroke-width':2 }));
      var yl = node('text', { x:x(pr.along) + 3, y:padT + 9, fill:'#E76F9F', 'font-size':9 });
      yl.textContent = 'you';
      svg.appendChild(yl);
      youText = ' You are ' + kmText(pr.along) + ' along it, ' + kmText(pr.off) + ' off the line.';
    } else if (pr){
      youText = ' You are ' + kmText(pr.off) + ' from this line, so you are not marked on it.';
    }
  }

  /* Distance ticks along the foot. */
  var span = m.length;
  var dstep = span > 8000 ? 2000 : span > 3000 ? 1000 : span > 1200 ? 500 : 200;
  for (var q = 0; q <= span; q += dstep){
    var t = node('text', { x:x(q), y:H - 5, fill:'#9FB3B1', 'font-size':9,
      'text-anchor': q === 0 ? 'start' : 'middle' });
    t.textContent = kmText(q);
    svg.appendChild(t);
  }

  var names = m.bands.filter(function(b){ return b.measured; })
    .map(function(b){ return readableSurvey(b.survey) + (isNum(b.deepest)
      ? ' (deepest ' + fmt(Math.abs(b.deepest),1) + ' ft)' : ''); });
  var whole = state.profWhole, cross = state.profCross;
  var lead = whole
    ? 'Down the river\u2019s own line, along the ' + kmText(m.length) +
      ' of it the state has surveyed, '
    : cross
      ? 'Straight across the river — ' + kmText(cross.width) + ' bank to bank, ' +
        'cut at right angles to the river’s own line — '
      : 'Along ' + kmText(m.length) + ' of line, ';
  var sentence = lead + 'the deepest published sounding is ' +
    fmt(Math.abs(m.deepest), 1) + ' feet, from ' +
    (names.length === 1 ? names[0] : names.length + ' surveys: ' + names.join('; ')) + '.' +
    youText +
    ' Depths are as the survey published them; the vertical scale is stretched, so read the shape and the numbers, not the slope.';
  note.textContent = sentence;
  name(sentence);
}

/* A survey's name as a reader can use it. */
function readableSurvey(sv){
  if (!sv) return 'a published survey';
  var d = surveyDate(sv.name);
  return surveyLabel(sv.name) + (d ? ', surveyed ' + d : '');
}

/* ---- drawing the line ------------------------------------------------- */
function armProfile(){
  state.profArm = [];
  if (state.profLayer) state.profLayer.clearLayers();
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  announce('Tap the start of your line on the map, then tap the end.');
  renderLayers();
}
function cancelProfile(){
  state.profArm = null;
  renderLayers();
  announce('Line cancelled.');
}
function clearProfile(){
  state.profile = null; state.profArm = null; state.profWhole = null; state.profCross = null;
  if (state.profLayer) state.profLayer.clearLayers();
  renderProfile(); renderLayers(); updateLegend();
  announce('Profile cleared.');
}
function profilePoint(lat, lon){
  state.profArm.push([lat, lon]);
  state.profLayer.clearLayers();
  state.profArm.forEach(function(p){
    L.circleMarker(p, { pane:'herepane', radius:6, weight:3,
      color:'#F2A65A', fillColor:'#0A1214', fillOpacity:1 }).addTo(state.profLayer);
  });
  if (state.profArm.length < 2){
    announce('Start set. Now tap the other end.');
    return;
  }
  var pts = state.profArm.slice();
  state.profArm = null;
  state.profWhole = null; state.profCross = null;   /* a line you drew */
  runProfile(pts);
}

/* THE RIVER'S OWN LINE, and the part of it worth drawing.
   The baked centreline runs the whole main stem — 598 km of Sacramento — and
   the state has surveyed a few reaches of it. Ninety samples spread over the
   whole thing would be six kilometres apart and almost all of them would land
   where nothing was ever measured. So it profiles the longest stretch the
   surveys actually cover, and says which stretch that is rather than quietly
   drawing a different river from the one asked for. */
function surveyedRun(line){
  var covered = line.map(function(p){ return surveysAt(p[0], p[1]).length > 0; });
  var best = null, start = -1;
  for (var i = 0; i <= covered.length; i++){
    if (i < covered.length && covered[i]){ if (start < 0) start = i; }
    else if (start >= 0){
      if (!best || i - start > best[1] - best[0]) best = [start, i];
      start = -1;
    }
  }
  if (!best) return null;
  /* A point either side, so the drawing does not begin and end exactly on the
     edge of what was measured. */
  var a = Math.max(0, best[0] - 1), b = Math.min(line.length, best[1] + 1);
  return { pts: line.slice(a, b), of: line.length, from: a, to: b };
}

/* =====================================================================
   WHERE YOU ARE ALLOWED TO BE.

   NOT BOAT RAMPS. No published boat-ramp dataset for these rivers could be
   reached — the state's one "public access points" service is coastal beaches
   with none on this water — and this app does not invent one. What CDFW does
   publish is its own lands: places the department owns or operates and says
   the public may go. That answers a different question, and it is the question
   this data can answer honestly.

   EACH PIN IS THE MIDDLE OF A PROPERTY, not a spot on the bank, so the
   distance to the river travels with it and is shown. A wildlife area whose
   centre is eight kilometres from the water is a different proposition from
   one on the bank, and a dot alone cannot tell them apart.
   ===================================================================== */
function accessSites(river){
  var a = (typeof ACCESS_LANDS === 'object' && ACCESS_LANDS) || {};
  return (a[river.id] || []);
}

function drawAccessSites(){
  if (!state.accessLayer) return;
  state.accessLayer.clearLayers();
  if (!state.riverId || state.showAccess === false) return;
  var river = byId(state.riverId);
  accessSites(river).forEach(function(s){
    L.circleMarker([s.lat, s.lon], {
      pane:'accesspane', radius:5, weight:2,
      color:'#9BD98C', fillColor:'#0D1A19', fillOpacity:.9
    }).bindPopup(labelNode(s.name,
      [[String(s.km), 'km to the river']],
      s.type + '. ' + (s.access || 'CDFW does not say what the access is.') +
      ' This pin is the middle of the property, not a place on the bank \u2014 and it is not a boat ramp; ' +
      'no published list of those exists for this river.'
    ), LABEL).addTo(state.accessLayer);
  });
}

/* WHERE THE DEPTH ACTUALLY IS.
   The surveys are a handful of reaches on hundreds of kilometres of river, and
   the app opened on the whole basin with nothing marking them — so "I cannot
   see where the depth is" was the correct reading of the screen. They are drawn
   now, and there is one press that takes you to them. */
function drawSurveyBoxes(){
  if (!state.surveyLayer) return;
  state.surveyLayer.clearLayers();
  if (!state.riverId || !state.catalog || !state.catalog.raster) return;
  var river = byId(state.riverId);
  /* The raster list DIRECTLY, not catalogFor — that helper ranks every kind of
     survey and reads fields the catalogue may not have yet while it is still
     loading, so calling it here threw inside selectRiver and took the whole
     river change down with it. A drawing function must not need more of the
     data than it draws. */
  surveysForRiver(river).forEach(function(row){
    L.rectangle([[row.box.s, row.box.w], [row.box.n, row.box.e]], {
      pane:'surveypane', interactive:false,
      color:'#7BD5D9', weight:1, opacity:.55, dashArray:'4 4',
      fillColor:'#7BD5D9', fillOpacity:.05
    }).addTo(state.surveyLayer);
  });
}

function surveysForRiver(river){
  if (!state.catalog || !state.catalog.raster) return [];
  return state.catalog.raster.filter(function(row){
    return row.box && !row.box.unknownWkid && boxesIntersect(row.box, river.bbox);
  });
}

function surveyBounds(river){
  var b = null;
  surveysForRiver(river).forEach(function(row){
    var r = L.latLngBounds([[row.box.s, row.box.w], [row.box.n, row.box.e]]);
    b = b ? b.extend(r) : r;
  });
  return b;
}

function goToDepth(river){
  var b = surveyBounds(river);
  if (!b){
    announce('No published survey for the ' + river.name + ' has arrived yet, so there is nowhere to go.');
    return;
  }
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  mapView(b.pad(0.08), { animate:!reduceMotion });
  drawSurveyBoxes();
  drawAccessSites();
  announce('Showing the reaches of the ' + river.name + ' the state has surveyed.');
}

/* A CROSS-SECTION IS PERPENDICULAR TO THE RIVER, and until the centreline was
   baked in the app had no idea which way that was — so it offered a line across
   whatever the screen happened to show, which at the zoom this app opens on is
   a line across the state. That was not a cross-section, it was a chord.
   Now: find the nearest point on the river's own line, take its local bearing,
   and cut across it. */
/* THE CENTRELINES ARE FETCHED WHEN THEY ARE FIRST WANTED, not at boot. They
   are 39 KB of coordinates that only the profile uses, and a reader opening
   the app to look at the water temperature was paying to parse all of it
   before the map appeared. Precached, so this is a read from the device rather
   than the network, and it works with no signal. */
var riverLinesReady = null;
function loadRiverLines(){
  if (typeof RIVER_LINES === 'object' && RIVER_LINES) return Promise.resolve(RIVER_LINES);
  if (riverLinesReady) return riverLinesReady;
  riverLinesReady = new Promise(function(res, rej){
    var sc = document.createElement('script');
    sc.src = 'river-lines.js';
    sc.onload = function(){
      logNet('river centrelines', 'river-lines.js', true, 'loaded on demand');
      res(typeof RIVER_LINES === 'object' ? RIVER_LINES : null);
    };
    sc.onerror = function(){
      riverLinesReady = null;
      logNet('river centrelines', 'river-lines.js', false, 'did not load');
      rej(new Error('the river centrelines did not load'));
    };
    document.head.appendChild(sc);
  });
  return riverLinesReady;
}
function riverLineFor(id){
  return (typeof RIVER_LINES === 'object' && RIVER_LINES && RIVER_LINES[id]) || null;
}

function nearestOnLine(line, lat, lon){
  var best = -1, bd = Infinity;
  for (var i = 0; i < line.length; i++){
    var d = metresBetween(lat, lon, line[i][0], line[i][1]);
    if (d < bd){ bd = d; best = i; }
  }
  return best < 0 ? null : { i:best, off:bd };
}

function crossSectionAt(river, lat, lon, halfWidthM){
  announce('Reading across the river…');
  loadRiverLines().then(function(){ crossSectionNow(river, lat, lon, halfWidthM); },
    function(){ announce('The river centrelines did not load, so the app cannot tell which way across is.'); });
}
function crossSectionNow(river, lat, lon, halfWidthM){
  var line = riverLineFor(river.id);
  if (!line || line.length < 3){
    announce('This build carries no centreline for the ' + river.name + ', so it cannot tell which way across is.');
    return;
  }
  var n = nearestOnLine(line, lat, lon);
  var a = line[Math.max(0, n.i - 1)], b = line[Math.min(line.length - 1, n.i + 1)];
  var mid = line[n.i];
  /* Local bearing of the river, then a quarter turn. Longitude is squeezed by
     latitude, so the perpendicular has to be computed in metres rather than in
     degrees or it comes out skewed. */
  var kx = 111320 * Math.cos(mid[0] * Math.PI / 180), ky = 110540;
  var dx = (b[1] - a[1]) * kx, dy = (b[0] - a[0]) * ky;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / len, py = dx / len;              /* unit perpendicular, metres */
  var w = halfWidthM || 300;
  var p1 = [mid[0] + (py * -w) / ky, mid[1] + (px * -w) / kx];
  var p2 = [mid[0] + (py *  w) / ky, mid[1] + (px *  w) / kx];
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  state.profWhole = null;
  state.profCross = { at:mid, off:n.off, width:w * 2 };
  runProfile([p1, mid, p2]);
}

function profileRiverLine(river){
  announce('Reading down the river…');
  loadRiverLines().then(function(){ profileRiverNow(river); },
    function(){ announce('The river centrelines did not load, so the app cannot follow the river.'); });
}
function profileRiverNow(river){
  var line = riverLineFor(river.id);
  if (!line || line.length < 2){
    announce('This build carries no centreline for the ' + river.name + '.');
    return;
  }
  var run = surveyedRun(line);
  if (!run){
    state.profile = { none:'nowhere', pts:line };
    $('#profile').hidden = false;
    renderProfile();
    $('#profnote').textContent = 'No published survey covers any part of the ' +
      river.name + '\u2019s course, so there is nothing to draw along it. The line ' +
      'itself is USGS\u2019s; the depth would have to be DWR\u2019s, and they have not ' +
      'measured here.';
    renderLayers();
    return;
  }
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  state.profWhole = run; state.profCross = null;
  runProfile(run.pts);
}

function runProfile(pts){
  if (state.profLayer) state.profLayer.clearLayers();
  /* THE LINE IS THE SUBJECT AND IT LOOKED LIKE A SCRATCH. Reported from a
     phone: "it does not show the river line, just a bunch of dots". Over
     satellite imagery, with sixty pins on top of it, a two-pixel dashed stroke
     is not a line anybody can see. A dark casing under a bright solid stroke
     is how a route is drawn on a map that has a photograph underneath it. */
  L.polyline(pts, { pane:'herepane', color:'#0A1214', weight:7, opacity:.75,
    lineJoin:'round', interactive:false }).addTo(state.profLayer);
  L.polyline(pts, { pane:'herepane', color:'#F2A65A', weight:3.5,
    lineJoin:'round', interactive:false }).addTo(state.profLayer);
  [pts[0], pts[pts.length-1]].forEach(function(pt){
    L.circleMarker(pt, { pane:'herepane', radius:6, weight:3,
      color:'#F2A65A', fillColor:'#0A1214', fillOpacity:1,
      interactive:false }).addTo(state.profLayer);
  });
  state.profile = { loading:true };
  $('#profile').hidden = false;
  $('#profnote').textContent = 'Asking the survey along this line…';
  announce('Reading the bottom along your line.');
  renderLayers();
  updateLegend();   /* the line is on the map now, so the key must say what it is */
  mapView(L.latLngBounds(pts).pad(0.15), { animate:!reduceMotion });
  buildProfile(pts).then(function(model){
    state.profile = model;
    state.profZoom = 1;
    renderProfile();
    announce($('#profnote').textContent);
  }, function(e){
    state.profile = { none:'failed' };
    $('#profnote').textContent = 'The survey did not answer: ' + (e && e.message || e) +
      '. Nothing is drawn, because nothing is known.';
    renderProfile();
  });
}

/* The reading, as a label on the map where the finger is. */
function showDepthAt(lat, lon){
  if (!state.map) return;
  var pop = L.popup(LABEL).setLatLng([lat, lon])
    .setContent(depthNode({ loading:true }, lat, lon)).openOn(state.map);
  depthAt(lat, lon).then(function(res){
    pop.setContent(depthNode(res, lat, lon));
    pop.update();
    announce(depthSentence(res));
  });
}

function depthSentence(res){
  if (res.loading) return 'Reading the depth…';
  if (res.failed)  return 'The depth service did not answer.';
  if (res.none === 'nocatalog') return 'The survey directory has not arrived, so this cannot be answered yet.';
  if (res.none === 'nowhere') return 'No published survey covers this point.';
  if (res.none === 'notmeasured')
    return 'No measured depth within ' + DEPTH_SPAN_M + ' metres of this point.';
  return fmt(Math.abs(res.value), 1) + ' feet ' +
    (res.value <= 0 ? 'deep' : 'ABOVE the survey datum — bank, not bottom') +
    (res.exact ? ' here' : ', ' + fmt(res.away, 0) + ' metres away') + '.';
}

function depthNode(res, lat, lon){
  var box = el('div',{});
  box.appendChild(el('span',{class:'pop-name',text:'Depth here'}));

  if (res.loading){
    box.appendChild(el('p',{class:'note',text:'Asking the survey…'}));
    return box;
  }
  if (res.failed){
    box.appendChild(el('p',{class:'err',
      text:'The survey did not answer: ' + res.failed + '. Nothing is shown, because nothing is known.'}));
    return box;
  }
  if (res.none === 'nocatalog'){
    box.appendChild(el('p',{class:'note',
      text:'The survey directory has not arrived, so this cannot be answered yet. That is not the same as there being no survey here — it means nothing has been asked.'}));
    return box;
  }
  if (res.none === 'nowhere'){
    box.appendChild(el('p',{class:'note',
      text:'No published survey covers this point. Where the state has not measured, this app has nothing to tell you and will not guess.'}));
    return box;
  }
  if (res.none === 'notmeasured'){
    box.appendChild(el('p',{class:'note',
      text:'Nothing measured within ' + DEPTH_SPAN_M + ' metres. ' +
        (res.covering.length === 1 ? 'One survey covers' : res.covering.length + ' surveys cover') +
        ' this point and none of them has a reading here — weed stops a sounder returning, and those patches are dropped rather than filled in.'}));
    return box;
  }

  /* A survey publishes elevation against its own datum: below it is
     negative and that is the depth. A POSITIVE reading is ground above the
     datum — bank, or a bar that was dry when the boat went past — and
     printing its absolute value as a depth would turn dry land into eleven
     feet of water. It is said as what it is instead. */
  var below = res.value <= 0;
  var v = el('div',{class:'pop-vals'});
  var s = el('span',{class:'v water'});
  s.appendChild(document.createTextNode(fmt(Math.abs(res.value), 1)));
  s.appendChild(el('small',{text:'ft'}));
  v.appendChild(s);
  box.appendChild(v);
  if (!below) box.appendChild(el('div',{class:'err',
    text:'That reading is ABOVE the survey’s datum, not below it. This is bank or a bar that was dry when the survey boat went past, not depth of water.'}));

  box.appendChild(el('span',{class:'pop-sub',
    text: res.exact
      ? 'at the point you asked for'
      : fmt(res.away, 0) + ' m away — the nearest place this survey measured'}));
  box.appendChild(el('span',{class:'pop-sub',
    text: surveyLabel(res.survey.name) +
      (res.survey._date ? ', surveyed ' + res.survey._date : ', survey date not published') +
      ' · ' + res.survey.name}));
  box.appendChild(el('p',{class:'note',
    text:'As the survey published it. Thalweg does not restate a vertical datum it has not checked, so treat this as relative, not as a chart sounding. Not for navigation.'}));

  var keep = el('button',{type:'button',text:'Keep this as a mark'});
  keep.addEventListener('click', function(){
    addMark(res.exact ? lat : res.lat, res.exact ? lon : res.lon, {
      depth: res.value, depthFrom: surveyLabel(res.survey.name), depthDate: res.survey._date,
      depthAway: res.exact ? 0 : Math.round(res.away) });
    state.map.closePopup();
  });
  if (state.riverId) box.appendChild(el('div',{class:'rowline'},[keep]));
  else box.appendChild(el('p',{class:'note',
    text:'Pick a river and this can be kept as a mark; a mark belongs to one river.'}));
  return box;
}

/* Which device this is, so the install instructions lead with the one that
   applies. iPadOS Safari calls itself macOS, so the touch count is what
   separates an iPad from a Mac. */
function platformGuess(){
  var ua = navigator.userAgent || '', touch = (navigator.maxTouchPoints || 0) > 1;
  if (/iPhone|iPod/.test(ua)) return 'iphone';
  if (/iPad/.test(ua) || (touch && /Macintosh/.test(ua))) return 'ipad';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}
var INSTALL = [
  { id:'iphone',  label:'iPhone, in Safari',
    how:'Tap the Share button at the bottom, scroll down, then Add to Home Screen.' },
  { id:'ipad',    label:'iPad, in Safari',
    how:'Tap the Share button at the top right, then Add to Home Screen.' },
  { id:'android', label:'Android, in Chrome',
    how:'Tap the three-dot menu, then Install app, or Add to home screen.' },
  { id:'desktop', label:'On a computer, in Chrome or Edge',
    how:'Click the install icon at the right-hand end of the address bar.' }
];
function installList(){
  var here = platformGuess();
  var ul = el('ul',{class:'tight'});
  INSTALL.slice().sort(function(a,b){
    return (a.id === here ? -1 : 0) - (b.id === here ? -1 : 0);
  }).forEach(function(p){
    var li = el('li',{});
    li.appendChild(el('b',{ text:p.label + (p.id === here ? ' — this device. ' : '. ') }));
    li.appendChild(document.createTextNode(p.how));
    ul.appendChild(li);
  });
  return ul;
}

/* Somewhere to send a problem, with the build already in it. */
var REPO = 'https://github.com/njefferson/Cv-Thalweg';
function reportUrl(){
  var body = 'What I expected:\n\nWhat happened instead:\n\n' +
    'Which river and which panel:\n\n' +
    '--- paste the diagnostic report here (the button next to this link copies it) ---\n';
  return REPO + '/issues/new?title=' +
    encodeURIComponent('Thalweg ' + VERSION + ': ') +
    '&body=' + encodeURIComponent(body);
}

function renderAbout(){
  var b = $('#aboutbody'); b.innerHTML = '';
  function h(t){ b.appendChild(el('h3',{text:t})); }
  function para(t){ b.appendChild(el('p',{text:t})); }

  /* The build, first, because the commonest reason to open this panel is
     that something looked wrong and somebody needs to know which Thalweg
     you were looking at. */
  var build = el('p',{class:'note'});
  build.appendChild(el('b',{text:'Version ' + VERSION}));
  build.appendChild(document.createTextNode(' · '));
  build.appendChild(el('span',{id:'aboutbuild',text:'checking which build…'}));
  b.appendChild(build);
  buildLine().then(function(txt){
    var n = document.getElementById('aboutbuild');
    if (n) n.textContent = txt;
  });

  h('What Thalweg is');
  para('Three numbers for four rivers, in one place: how deep the water is, when the tide turns, and how much water is coming down. The Sacramento, the Feather, the American and the Mokelumne, plus the Delta they run into.');
  para('It opens on all four at once because that is usually the real question — not what the Feather is doing, but which of the four is worth the drive. The stacked bars put every gauge where it sits on its river, downstream on the left, coloured by water temperature on one scale so the rivers can be compared at a glance. Pick a single river for its tide, its depth and your own marks.');

  var againRow = el('div',{class:'rowline'});
  var again = el('button',{type:'button',text:'Show the first-visit page again'});
  again.addEventListener('click', function(){ $('#about').close(); showWelcome(); });
  againRow.appendChild(again);
  b.appendChild(againRow);

  h('What it will not do');
  para('It will not tell you where fish are being caught. There is no live catch feed for these rivers, so there is nothing honest to show, and a made-up one would be worse than nothing. No bite forecast, no spot predictor, and none is coming.');
  para('It is not a navigation aid. The depth surveys come from the state, whose own notes say they are not for navigating by, and that restriction travels with them.');
  para('It does not want an account, cannot be logged in to, and carries no analytics, no tracking and no third-party code of any kind. Your marks live on your device and are sent nowhere.');
  para('Where I am, on the map, is the same, with one honest caveat. The button asks your browser, your browser asks you once, and the answer is drawn and then forgotten: it is not saved between visits, and your coordinate is not sent to this app\u2019s servers, to the depth service, or to anyone else. The caveat is that moving the map to you makes it load map tiles for that area, so whoever serves the basemap can tell roughly where you are looking \u2014 to about the size of a tile, a couple of kilometres at that zoom. That is the same thing that happens if you scroll there by hand, and it is a property of every map you have ever used; it is written here because it is true, not because it is unusual. The one thing that sends your exact coordinate anywhere is asking how deep it is at a point, and that only happens when you tap the map yourself.');

  h('Put it on your home screen');
  para('Worth doing. Installed, it opens full screen with no browser chrome, and it keeps working with no signal — which on most of this water is the normal condition rather than the exception. Everything it had already loaded stays: the map you looked at, the depth you switched on, the tide for the week ahead, and all your marks.');
  b.appendChild(installList());
  para('Flow and water temperature are the exception: those need a signal, and when they are old the top of the screen says so in orange rather than letting a stale number sit there looking current.');

  h('What changed');
  RELEASES.forEach(function(r){
    b.appendChild(el('p',{style:'font-weight:600;margin-bottom:.2rem',
      text:'Version ' + r.v + ' — ' + r.date}));
    var u1 = el('ul',{class:'tight'});
    r.changes.forEach(function(c){ u1.appendChild(el('li',{text:c})); });
    b.appendChild(u1);
    if (r.broken && r.broken.length){
      b.appendChild(el('p',{class:'note',style:'margin-bottom:.2rem',
        text:'What is still not right in ' + r.v + ':'}));
      var u2 = el('ul',{class:'tight'});
      r.broken.forEach(function(c){ u2.appendChild(el('li',{text:c})); });
      b.appendChild(u2);
    }
  });

  h('Something looks wrong');
  para('Two taps. Copy the diagnostic, then open a report and paste it in. The diagnostic is plain text you can read before you send it: it says which build you have, what kind of device, which of the services answered and which did not, and how old the readings are. It contains nothing you typed and none of your marks — only how many you have.');
  var btn = el('button',{type:'button',text:'Copy diagnostic report'});
  var ta = el('textarea',{readonly:'readonly','aria-label':'Diagnostic report'});
  btn.addEventListener('click', function(){
    diagnostic().then(function(txt){
      ta.value = txt; ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
      btn.textContent = 'Copied';
      setTimeout(function(){ btn.textContent = 'Copy diagnostic report'; }, 2500);
      announce('Diagnostic report copied.');
    });
  });
  var row = el('div',{class:'rowline'});
  row.appendChild(btn);
  row.appendChild(el('a',{ href:reportUrl(), target:'_blank', rel:'noopener noreferrer',
    text:'Open a report' }));
  b.appendChild(row);
  diagnostic().then(function(t){ ta.value = t; });
  b.appendChild(ta);

  h('Where the numbers come from');
  para('Nothing here is measured by this app. It redraws what four public services publish, and says which one each number came from.');
  var u3 = el('ul',{class:'tight'});
  [ ['River flow, height and temperature — the US Geological Survey',
     'https://waterdata.usgs.gov/ca/nwis/current/?type=flow'],
    ['The Feather River’s gauges — California DWR, through CDEC, because USGS publishes nothing current for that river',
     'https://cdec.water.ca.gov/'],
    ['Tide predictions — NOAA, to the MLLW datum',
     'https://tidesandcurrents.noaa.gov/'],
    ['Depth surveys — California DWR',
     'https://data.cnra.ca.gov/dataset/i06-singlebeam-bathymetry'],
    ['Season and limits — CDFW, Title 14 section 7.40',
     'https://wildlife.ca.gov/Regulations/Freshwater-Sport-Fishing']
  ].forEach(function(s){
    var li = el('li',{});
    li.appendChild(el('a',{href:s[1],rel:'noopener noreferrer',target:'_blank',text:s[0]}));
    u3.appendChild(li);
  });
  b.appendChild(u3);
  para('Each of those sets its own terms and is the authority on its own data. Where a reading is missing you get a dash, never a zero.');

  h('Reading depth honestly');
  para('Weed beats a depth sounder. Where the growth is thick the survey boat gets no return from the bottom, and those patches are dropped — so a blank space beside a tule edge is water nobody measured, not flat ground. In weedy water a reading may be the top of the weed rather than the bed.');
  para('The single beam surveys are lines, not sheets: dots along the track the boat drove. Between two tracks nothing was measured, and nothing is drawn. And every survey is a photograph of one day — sand moves.');
  para('Where a reach has no published survey at all, the Depth panel says so in words instead of offering you a switch that turns nothing on.');

  h('Getting around it without a pointer');
  para('Every control takes the keyboard, with a visible focus ring, and the panels are a proper tab list you can walk with the arrow keys. The map pans with the arrow keys and zooms with plus and minus once it has focus. Two things that look like they need a finger do not: Add at map centre in the Marks panel drops a mark, and Read the depth at the map centre in the Depth panel asks the survey the same question a tap on the map asks. Where I am sits on the map itself and is a real button, so it takes a thumb and the keyboard equally; it is 44px through on both axes, which the map\u2019s own zoom controls are not.');
  para('Colour is never the only thing carrying a fact: every temperature dot has its figure beside it and every provenance flag is a word. Reduced motion is honoured. If anything here is unusable for you that is a fault worth reporting, and the button above is how.');

  h('Where this came from');
  para('Thalweg is one of a set of free apps, all of them built the same way: no account, no tracking, no third-party code, and yours to keep. The accessibility statement below is shared across all of them, so the commitments it makes are the same ones this app is held to.');
  var hubRow = el('div',{class:'rowline'});
  hubRow.appendChild(el('a',{href:'https://noahjefferson.pages.dev',
    rel:'noopener noreferrer', target:'_blank', text:'The rest of the apps'}));
  hubRow.appendChild(el('a',{href:'https://noahjefferson.pages.dev/accessibility',
    rel:'noopener noreferrer', target:'_blank', text:'Accessibility statement'}));
  b.appendChild(hubRow);

  /* A TIP JAR, AND NOTHING THAT NAGS. It lives here, in the panel somebody
     opens when they want to know about the app, and nowhere on the working
     surface — a prompt for money has no business competing with reading the
     water on a riverbank. No counter, no total, no thank-you tier, nothing
     that changes if you give and nothing that changes if you do not. */
  h('If it was useful');
  para('Thalweg is free, has no account, shows no advertising and collects nothing about you, and that is not going to change. It also costs nothing to run beyond the time it takes to build, so there is no bill to help with. If you have got some use out of it and feel like buying a coffee, there is a link below. If you do not, nothing about the app is different \u2014 there is no version you are missing.');
  var tipRow = el('div',{class:'rowline'});
  /* Two, because one of them is probably already on your phone. Not a menu of

    text:'Buy a coffee, via PayPal' }));
  tipRow.appendChild(el('a',{ href:'https://venmo.com/u/NoahJefferson',
    rel:'noopener noreferrer', target:'_blank', class:'tiplink',
    text:'or via Venmo' }));
  b.appendChild(tipRow);
  para('Those links go to PayPal and Venmo, and this app is not involved in either: nothing about a payment comes back here, and Thalweg does not know and cannot know whether anybody used them.', 'note');

  h('Licence');
  para('PolyForm Noncommercial 1.0.0 — free to use, study and change for anything that is not commercial. The map library is Leaflet 1.9.4, included under its own BSD-2-Clause licence.');
}

/* Which build is live, for the panel and for a screenshot. */
function buildLine(){
  return fetch('version', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.commit) return 'build not identified on this host';
      return 'build ' + j.commit.slice(0,7) + (j.branch ? ' (' + j.branch + ')' : '');
    })
    .catch(function(){ return 'build unknown — offline'; });
}

/* Doctrine §7f: a text report that carries what the browser string hides.
   iPadOS Safari reports itself as macOS, so maxTouchPoints is what tells
   an iPad from a Mac. */
function diagnostic(){
  var lines = [];
  function L(k,v){ lines.push(k + ': ' + v); }
  L('Thalweg', VERSION);
  L('When', new Date().toISOString());
  L('User agent', navigator.userAgent);
  L('maxTouchPoints', navigator.maxTouchPoints);
  L('Platform hint', (navigator.maxTouchPoints > 1 &&
      /Macintosh/.test(navigator.userAgent)) ? 'touch device reporting as macOS (an iPad)' : 'as reported');
  L('Viewport', window.innerWidth + 'x' + window.innerHeight +
      ' at dpr ' + (window.devicePixelRatio || 1));
  L('Display mode', window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
      ? 'standalone (installed)' : 'browser tab');
  L('Storage backend', Store.kind);
  L('Ribbon', document.getElementById('ribbonwrap').hidden
      ? 'hidden — not enough height for ' + (state.riverId ? 1 : RIVERS.length) + ' row(s)'
      : 'shown, row height ' + (RIB ? RIB.rowH : '?') + 'px');
  L('Reduced motion', reduceMotion ? 'yes' : 'no');
  L('Online', navigator.onLine ? 'yes' : 'no');
  L('BATHY_PROXY', BATHY_PROXY || '(empty — talking to DWR directly)');
  L('River', state.riverId || 'All');
  L('Depth ramp', state.ramp ? 'on' : 'off');
  L('NOAA chart probe', state.chartUsable === null ? 'not run' : String(state.chartUsable));
  if (state.catalog){
    L('Catalog age', ageText(Date.now() - state.catalog.at));
    L('Multibeam services', state.catalog.raster.length +
      (state.catalog.rasterError ? ' (error: ' + state.catalog.rasterError + ')' : ''));
    L('Single beam layers', state.catalog.single.length +
      (state.catalog.singleError ? ' (error: ' + state.catalog.singleError + ')' : ''));
    var un = state.catalog.raster.concat(state.catalog.single)
      .filter(function(r){ return r.box && r.box.unknownWkid; });
    if (un.length) L('Unplaced (projection not converted)',
      un.map(function(r){ return (r.name || r.title) + ' [wkid ' + r.box.unknownWkid + ']'; }).join('; '));
  } else L('Catalog', 'not loaded');
  RIVERS.forEach(function(r){
    var g = state.gauges[r.id];
    L('Gauges ' + r.id, g ? (g.rows.length + ' rows, ' +
      (g.fetchedAt ? ageText(Date.now() - g.fetchedAt) : 'never') +
      (g.stale ? ', STALE' : '')) : 'not loaded');
  });
  L('Marks on this river', String(state.marks.length) + ' (positions not included)');
  lines.push('');
  lines.push('Service worker:');
  var swPart = Promise.resolve('  not supported');
  if ('serviceWorker' in navigator){
    swPart = navigator.serviceWorker.getRegistration().then(function(reg){
      if (!reg) return '  none registered';
      return '  active=' + (reg.active ? reg.active.state : 'none') +
             ' waiting=' + (reg.waiting ? 'yes' : 'no') +
             ' installing=' + (reg.installing ? 'yes' : 'no');
    }).catch(function(e){ return '  query failed: ' + e; });
  }
  var cachePart = Promise.resolve('  caches API unavailable');
  if (window.caches && caches.keys){
    cachePart = caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){
        return caches.open(k).then(function(c){ return c.keys(); })
          .then(function(rs){ return '  ' + k + ': ' + rs.length + ' entries'; });
      })).then(function(rows){ return rows.join('\n') || '  none'; });
    }).catch(function(e){ return '  cache read failed: ' + e; });
  }
  /* Which build is actually live. The page cannot know this on its own —
     there is no build step to stamp a commit into a static file — so it
     asks the deployment, and says plainly when there is nothing to ask. */
  var buildPart = fetch('version', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j) return '  no /version endpoint on this host';
      return '  commit ' + (j.commit || 'unknown') +
             (j.branch ? ' on ' + j.branch : '') +
             (j.commit ? '' : ' — ' + j.source);
    })
    .catch(function(){ return '  /version did not answer'; });

  return Promise.all([swPart, cachePart, buildPart]).then(function(r){
    lines.push(r[0]);
    lines.push('');
    lines.push('Caches:');
    lines.push(r[1]);
    lines.push('');
    lines.push('Deployed build:');
    lines.push(r[2]);
    lines.push('');
    lines.push('Last network attempts (newest last):');
    state.net.slice(-25).forEach(function(n){
      lines.push('  ' + (n.ok ? 'ok  ' : 'FAIL') + ' ' + n.label +
                 (n.detail ? ' — ' + n.detail : ''));
    });
    return lines.join('\n');
  });
}

/* =====================================================================
   First run. The orientation survives whatever you press to begin: it is
   moved into the About panel, not copied there, so there is one copy of
   these words in the app.
   ===================================================================== */
/* The way out is wired at start-up, before there is any content for it to
   depend on, and it is one handler on the dialog rather than one per button,
   so Close, Start and the Escape key cannot drift into meaning different
   things. A dismiss that depends on the panel's own content is a trap the
   moment that content fails. */
function initWelcome(){
  var dlg = $('#welcome');
  if (!dlg.showModal) return;
  dlg.addEventListener('close', function(){
    try { Store.s.setItem('thalweg:_shared:welcomed', VERSION); } catch(e){}
    /* Closing a dialog returns focus to whatever opened it, and nothing
       opened this one — so focus fell to BODY and a reader on a keyboard or
       a screen reader was left with no position in the app at all. */
    var tab = document.querySelector('[role=tab][aria-selected=true]');
    if (tab) tab.focus();
  });
  $('#welcomeclose').addEventListener('click', function(){ dlg.close(); });
}

function maybeWelcome(){
  var seen = Store.s.getItem('thalweg:_shared:welcomed');
  if (seen === VERSION || !$('#welcome').showModal) return;
  showWelcome();
}

/* Also reachable from the (i) afterwards, which is what makes the panel
   testable more than once per device: dismissing it is remembered, so
   without a way back the only way to see it again is to clear storage. */
function showWelcome(){
  var dlg = $('#welcome');
  var b = $('#welcomebody'); b.innerHTML = '';
  function para(t, cls){ b.appendChild(el('p', cls ? {class:cls, text:t} : {text:t})); }
  function head(t){ b.appendChild(el('h3',{text:t})); }

  para('Three numbers for four rivers, in one place: how deep the water is, when the tide turns, and how much water is coming down. The Sacramento, the Feather, the American and the Mokelumne, and the Delta they run into.');

  head('What you are looking at');
  para('It opens on all four rivers at once, because that is usually the real question — not what the Feather is doing, but which of the four is worth the drive. Each bar is one river with its gauges where they sit along it, downstream on the left, and every dot is coloured by water temperature on the same scale, so the four can be read against each other.');
  para('Pick a single river from the top and you get its tide, its published depth surveys, and somewhere to drop your own marks. On a phone the map is a tab of its own beside Water, Layers, Marks and Brief, so the readings keep the screen until you ask for it.');

  head('Worth knowing before you rely on it');
  var u = el('ul',{class:'tight'});
  [ 'It works with no signal once it has loaded, which on most of this water is the normal condition. Tide predictions are fetched a week ahead so they stay good in your pocket.',
    'Flow and temperature are the exception — those need a signal, and when they go stale the top of the screen says so in orange rather than letting an old number sit there looking current.',
    'No account, no sign-up, no tracking, no third-party code. Your marks stay on this device.',
    'Depth is only where the state has actually surveyed. Where nothing has been surveyed it says so, rather than showing you an empty switch.'
  ].forEach(function(t){ u.appendChild(el('li',{text:t})); });
  b.appendChild(u);

  b.appendChild(el('div',{class:'magbox',
    text:'It does not know where fish are being caught and will not guess — no live catch feed exists for these rivers. It is not a navigation aid: the depth surveys come from the state, whose own notes say they are not for navigating by.'}));

  para('Every number here comes from USGS, NOAA, DWR or CDFW and is labelled with which one, and where a figure is missing this app says why rather than showing you a zero. It is still young: check what you see against something you trust before you rely on it, and what is still not right is listed under the (i).', 'note');

  /* THE INSTALL OFFER SAT IN THE MIDDLE, and a first-time reader scrolling for
     the button went straight past it — reported by somebody meeting the app on
     a phone, who saw a wall of text and a Start button and nothing else. It is
     the last thing before Start now, which is where a scroller actually lands,
     and it is a box rather than a paragraph in a run of paragraphs. */
  var installed = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if (!installed){
    var inst = el('div',{class:'installbox'});
    inst.appendChild(el('h3',{style:'margin-top:0',text:'Put it on your home screen'}));
    inst.appendChild(el('p',{text:'Worth doing before you go. It opens full screen with no browser chrome, and everything it has already loaded keeps working with no signal — which on most of this water is the normal condition rather than the exception.'}));
    inst.appendChild(installList());
    b.appendChild(inst);
  }

  var row = el('div',{class:'rowline'});
  var ok = el('button',{type:'button',text:'Start'});
  ok.addEventListener('click', function(){ dlg.close(); });
  row.appendChild(ok);
  b.appendChild(row);
  /* Not a tiny note beside the button. The one sentence telling a reader where
     everything they just scrolled past has GONE was set in the small print,
     next to the thing they were already reaching for. */
  b.appendChild(el('p',{style:'margin:.5rem 0 0',
    text:'All of this — the install steps, where each number comes from, and what changed since last time — stays under the (i) button in the top corner.'}));

  dlg.showModal();
  /* Left to itself the dialog hands focus to the first thing it can find,
     which is the Start button at the very end of the body — so it opened
     scrolled past everything it exists to say, showing a button and no
     reason for it, with nothing to suggest there was anything above.
     Focus the title instead: the reader starts at the top, and the next
     Tab is the Close beside it. */
  b.scrollTop = 0;
  $('#welcometitle').focus();
}

/* =====================================================================
   Updates. The new version waits; it never takes over under the open
   page. An app that caches itself cannot notice it has gone stale, so
   the noticing has to be built on purpose.
   ===================================================================== */
function initSW(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if (reg.waiting) offerUpdate(reg);
    reg.addEventListener('updatefound', function(){
      var w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', function(){
        if (w.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(reg);
      });
    });
    /* Ask once on load and again when the app is brought back up. */
    setTimeout(function(){ reg.update().catch(function(){}); }, 8000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) reg.update().catch(function(){});
    });
  }).catch(function(e){ logNet('service worker', 'sw.js', false, String(e)); });

  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloading) return;
    reloading = true;
    window.location.reload();
  });
}

function offerUpdate(reg){
  var strip = $('#updatestrip');
  strip.hidden = false;
  $('#updatetext').textContent =
    'A new version of Thalweg is ready. It is waiting — nothing has changed under you.';
  $('#updatebtn').onclick = function(){
    try { Store.s.setItem('thalweg:_shared:justUpdated', '1'); } catch(e){}
    if (reg.waiting) reg.waiting.postMessage({ type:'SKIP_WAITING' });
    $('#updatetext').textContent = 'Loading…';
  };
  $('#updatedismiss').onclick = function(){ strip.hidden = true; };
  announce('A new version of Thalweg is waiting.');
}

/* The page that shows the strip is the old build and has never heard of
   the release it is offering. The only moment anything in the app knows
   what changed is after the reload, so that is when it says so. */
function maybeWhatChanged(){
  if (Store.s.getItem('thalweg:_shared:justUpdated') !== '1') return;
  try { Store.s.removeItem('thalweg:_shared:justUpdated'); } catch(e){}
  showWhatsNew();
}

/* THE READER PRESSED UPDATE AND IS OWED AN ANSWER TO ONE QUESTION. This used
   to open the whole About panel at its top, which is "What Thalweg is" — so
   the one thing they had just asked for was several screens down, under
   everything they already knew. */
function showWhatsNew(){
  var r = RELEASES.filter(function(x){ return x.v === VERSION; })[0];
  var body = $('#newbody');
  body.textContent = '';
  $('#newtitle').textContent = 'What changed in ' + VERSION;

  if (!r){
    /* A version with no note is a defect, not a blank panel. notes-check
       refuses it before it can ship, and this is what a reader sees if one
       ever gets past that. */
    body.appendChild(el('p',{ text:'This version arrived without its notes, which is a fault in the app rather than in your copy. Everything else works.' }));
  } else {
    var u = el('ul',{class:'tight'});
    r.changes.forEach(function(c){ u.appendChild(el('li',{text:c})); });
    body.appendChild(u);
    if (r.broken && r.broken.length){
      body.appendChild(el('p',{class:'note',style:'margin-bottom:.2rem',
        text:'Still not right, and worth knowing before you rely on it:'}));
      var u2 = el('ul',{class:'tight'});
      r.broken.forEach(function(c){ u2.appendChild(el('li',{text:c})); });
      body.appendChild(u2);
    }
  }

  var row = el('div',{class:'rowline'});
  var older = el('button',{type:'button',id:'newolder',text:'Earlier versions, and everything else about Thalweg'});
  older.addEventListener('click', function(){
    $('#whatsnew').close();
    renderAbout();
    var d = $('#about');
    if (d.showModal) d.showModal(); else d.setAttribute('open','open');
    $('#aboutbody').scrollTop = 0;
    $('#abouttitle').focus();
  });
  row.appendChild(older);
  body.appendChild(row);

  var dlg = $('#whatsnew');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','open');
  body.scrollTop = 0;
  $('#newtitle').focus();
  announce('Updated to ' + VERSION + '. ' +
    (r ? r.changes.length + ' change(s) in this version.' : ''));
}

/* =====================================================================
   Boot
   ===================================================================== */
function boot(){
  initPicker();
  initTabs();
  initMap();

  initWelcome();
  $('#aboutbtn').addEventListener('click', function(){
    renderAbout();
    var d = $('#about');
    if (d.showModal) d.showModal(); else d.setAttribute('open','open');
    $('#aboutbody').scrollTop = 0;
    $('#abouttitle').focus();
  });
  $('#aboutclose').addEventListener('click', function(){ $('#about').close(); });
  $('#newclose').addEventListener('click', function(){ $('#whatsnew').close(); });

  $('#profclear').addEventListener('click', clearProfile);
  $('#profin').addEventListener('click', function(){
    state.profZoom = Math.min(8, (state.profZoom || 1) * 1.6); renderProfile(); });
  $('#profout').addEventListener('click', function(){
    state.profZoom = Math.max(1, (state.profZoom || 1) / 1.6); renderProfile(); });

  /* Home. Back to the four-river landing this app opens on, on the Water tab,
     scrolled to the top — all three, because arriving at the landing halfway
     down a panel is not arriving at the landing. */
  $('#homebtn').addEventListener('click', function(){
    selectRiver('');
    selectTab('water');
    var panel = $('#panel-water');
    if (panel) panel.scrollTop = 0;
    announce('Back to all four rivers.');
  });

  var initial = Store.s.getItem('thalweg:_shared:river');
  selectRiver(initial === null ? '' : initial);
  selectTab('water');

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      drawRibbon();
      drawTrendLines();
      if (state.map) mapBecameVisible();
    }, 180);
  });

  window.addEventListener('online',  function(){ refreshData(); announce('Back online.'); });
  /* Coming back to the app is the moment a reader most expects it to have
     looked. It only asked on a ten-minute timer, so an app left open in a
     pocket for an hour and reopened showed the strip and then sat there. */
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && navigator.onLine) refreshData();
  });
  window.addEventListener('offline', function(){ updateStaleness(); announce('Offline. Stored readings only.'); });
  setInterval(function(){ if (navigator.onLine) refreshData(); }, REFRESH_MS);
  setInterval(updateStaleness, 60 * 1000);

  var chip0 = document.getElementById('verchip');
  if (chip0) chip0.textContent = 'v' + VERSION;
  buildLine().then(function(txt){
    var chip = document.getElementById('verchip');
    if (!chip) return;
    var m = /build ([0-9a-f]{7})/.exec(txt);
    if (m) chip.textContent = 'v' + VERSION + ' · ' + m[1];
    chip.title = 'Thalweg ' + VERSION + ' · ' + txt;
  });

  initSW();
  maybeWhatChanged();
  maybeWelcome();
}

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
