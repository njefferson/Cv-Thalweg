     for somebody two miles away is a lie about the picture. */
  var youText = '';
  if (state.here){
    var pr = projectOnLine(m.pts, state.here.lat, state.here.lon);
    if (pr && pr.off < 200){
      svg.appendChild(node('line', { x1:x(pr.along), x2:x(pr.along), y1:padT,
        y2:H - padB, stroke:'#E76F9F', 'stroke-width':2 }));
      var yl = node('text', { x:x(pr.along) + 3, y:padT + 9, fill:'#E76F9F', 'font-size':9 });
      yl.textContent = 'you';
      svg.appendChild(yl);
      youText = ' You are ' + kmText(pr.along) + ' along it, ' + kmText(pr.off) + ' off the line.';
    } else if (pr){
      youText = ' You are ' + kmText(pr.off) + ' from this line, so you are not marked on it.';
    }
  }

  /* Distance ticks along the foot. */
  var span = m.length;
  var dstep = span > 8000 ? 2000 : span > 3000 ? 1000 : span > 1200 ? 500 : 200;
  for (var q = 0; q <= span; q += dstep){
    var t = node('text', { x:x(q), y:H - 5, fill:'#9FB3B1', 'font-size':9,
      'text-anchor': q === 0 ? 'start' : 'middle' });
    t.textContent = kmText(q);
    svg.appendChild(t);
  }

  var names = m.bands.filter(function(b){ return b.measured; })
    .map(function(b){ return readableSurvey(b.survey) + (isNum(b.deepest)
      ? ' (deepest ' + fmt(Math.abs(b.deepest),1) + ' ft)' : ''); });
  var whole = state.profWhole, cross = state.profCross;
  var lead = whole
    ? 'Down the river\u2019s own line, along the ' + kmText(m.length) +
      ' of it the state has surveyed, '
    : cross
      ? 'Straight across the river — ' + kmText(cross.width) + ' bank to bank, ' +
        'cut at right angles to the river’s own line — '
      : 'Along ' + kmText(m.length) + ' of line, ';
  var sentence = lead + 'the deepest published sounding is ' +
    fmt(Math.abs(m.deepest), 1) + ' feet, from ' +
    (names.length === 1 ? names[0] : names.length + ' surveys: ' + names.join('; ')) + '.' +
    youText +
    ' Depths are as the survey published them; the vertical scale is stretched, so read the shape and the numbers, not the slope.';
  note.textContent = sentence;
  name(sentence);

  /* TRACING. The picture says how deep it is somewhere along the line and the
     map says where things are, and until now a reader had to hold the join
     between them in their head. Dragging a finger along the profile now moves
     a mark along the line on the map, so "that deep bit" has a place.
     Pointer events rather than touch or mouse: one code path for a finger, a
     stylus and a mouse, which is three fewer ways to be wrong. */
  var hit = node('rect', { x:padL, y:padT, width:W - padL - padR,
    height:H - padT - padB, fill:'transparent', style:'touch-action:none' });
  svg.appendChild(hit);
  var head = node('line', { x1:padL, x2:padL, y1:padT, y2:H - padB,
    stroke:'#E6F0EF', 'stroke-width':1.5, opacity:0 });
  svg.appendChild(head);
  var read = node('text', { x:padL + 4, y:padT + 10, fill:'#E6F0EF',
    'font-size':10, opacity:0 });
  svg.appendChild(read);

  function trace(ev){
    var box = svg.getBoundingClientRect();
    var px = ev.clientX - box.left;
    var frac = (px - padL) / Math.max(1, (W - padL - padR));
    frac = Math.max(0, Math.min(1, frac));
    var along = frac * m.length;
    head.setAttribute('x1', x(along)); head.setAttribute('x2', x(along));
    head.setAttribute('opacity', 1);

    /* The nearest measured sample of the first band, so the number shown is
       one the survey actually returned rather than a reading off the line. */
    var band = m.bands[0], best = null;
    (band ? band.pts : []).forEach(function(pt){
      if (!isNum(pt.v)) return;
      if (!best || Math.abs(pt.d - along) < Math.abs(best.d - along)) best = pt;
    });
    read.setAttribute('x', Math.min(W - padR - 60, x(along) + 4));
    read.setAttribute('opacity', 1);
    read.textContent = best && Math.abs(best.d - along) < (m.length / 20)
      ? fmt(Math.abs(best.v), 1) + ' ft'
      : 'not measured here';
    var sample = best && Math.abs(best.d - along) < (m.length / 20) ? best : null;
    markTrace(sample, along);
    var at = sample && isNum(sample.lat) ? [sample.lat, sample.lon] : pointAlong(m.pts, along);
    /* A sample carries a position and a value; the SURVEY it came from belongs
       to the band, not to the point inside it. */
    state.traceAt = at ? { at:at, along:along, v: sample ? sample.v : null,
                           survey: (sample && band && band.survey) ? band.survey.name : null } : null;
  }
  /* LIFTING THE FINGER USED TO THROW THE POINT AWAY.

     The whole reason to drag along a profile is to find the deep bit — and the
     moment you found it and let go, the mark on the map vanished, so you had
     seen that a deep bit exists and learnt nothing about WHERE. The point is
     now held: the line stays on the picture, the mark stays on the map, and
     the panel underneath says which bank it is on, how far off the middle, and
     the nearest place the state says you may stand. */
  function release(){
    if (state.traceAt) renderHeld(state.traceAt);
  }
  hit.addEventListener('pointerdown', function(e){ hit.setPointerCapture(e.pointerId); trace(e); });
  hit.addEventListener('pointermove', function(e){ if (e.buttons || e.pointerType === 'touch') trace(e); });
  hit.addEventListener('pointerup', release);
  hit.addEventListener('pointercancel', release);
}

/* WHICH BANK, AND HOW SURE THE APP IS ABOUT SAYING SO.

   The baked centreline runs MOUTH FIRST — pathlength is measured to the outlet
   and the segments are sorted ascending — so index 0 is downstream and the
   downstream direction at a point is line[i] back towards line[i-1]. Getting
   that backwards would swap every left for a right, silently and
   convincingly, which is why it is written down here rather than inferred at
   the call site.

   The sign of the cross product of the downstream vector with the offset says
   which side. Longitude degrees are shorter than latitude ones at this
   latitude, but scaling one axis by a positive constant cannot flip a sign, so
   the test survives working in raw degrees. */
function bankOf(river, lat, lon){
  var n = nearestOnAny(river, lat, lon);
  if (!n || n.line.length < 2) return null;
  var line = n.line;
  var i = n.i > 0 ? n.i : 1;
  var here = line[i], down = line[i - 1];
  var dx = down[1] - here[1], dy = down[0] - here[0];
  var px = lon - here[1],   py = lat - here[0];
  var cross = dx * py - dy * px;
  /* Within a few metres of the middle there is no meaningful side, and
     claiming one would be precision the geometry does not have. */
  if (n.off < 8) return { side:null, off:n.off };
  return { side: cross > 0 ? 'left' : 'right', off:n.off };
}

/* The nearest place the state says the public may go. Not a route and not a
   ramp — this app has neither — but it is the difference between a depth you
   can reach and one you can only look at. */
function nearestAccess(river, lat, lon){
  var best = null;
  accessSites(river).forEach(function(s){
    if (!isNum(s.lat) || !isNum(s.lon)) return;
    var d = metresBetween(lat, lon, s.lat, s.lon);
    if (!best || d < best.d) best = { d:d, site:s };
  });
  return best;
}

/* What the held point is, said in words, under the picture the finger is on. */
function renderHeld(held){
  var box = document.getElementById('profheld');
  if (!box) return;
  box.innerHTML = '';
  if (!held || !held.at) return;
  var river = state.riverId ? byId(state.riverId) : null;
  if (!river) return;
  var lat = held.at[0], lon = held.at[1];

  var line = el('p',{class:'note'});
  line.appendChild(el('b',{ text: isNum(held.v)
    ? fmt(Math.abs(held.v), 1) + ' ft here'
    : 'Not measured here' }));
  box.appendChild(line);

  var b = bankOf(river, lat, lon);
  if (b)
    box.appendChild(el('p',{class:'note',
      text: b.side === null
        ? 'It is within ' + fmt(b.off, 0) + ' m of the middle of the channel, so neither bank is nearer.'
        : 'It is ' + fmt(b.off, 0) + ' m off the middle of the channel, towards the ' +
          b.side + ' bank \u2014 left and right as the river runs, looking downstream.'}));

  var na = nearestAccess(river, lat, lon);
  if (na){
    box.appendChild(el('p',{class:'note',
      text:'Nearest public land: ' + na.site.name + ', ' + kmText(na.d) + ' away. ' +
        'That is the middle of a property rather than a spot on the bank, and it is not a launch.'}));
  } else {
    box.appendChild(el('p',{class:'note',
      text:'CDFW publishes no land of its own near here, which is not the same as there being nowhere to fish from.'}));
  }

  var row = el('div',{class:'rowline'});
  var go = el('button',{type:'button',text:'Show me this point'});
  go.addEventListener('click', function(){
    if (tabNames().indexOf('map') !== -1) selectTab('map');
    mapView([[lat, lon], 15], { animate:!reduceMotion });
    announce('Map centred on the held point.');
  });
  row.appendChild(go);
  if (na){
    var goa = el('button',{type:'button',text:'And the land nearest it'});
    goa.addEventListener('click', function(){
      if (tabNames().indexOf('map') !== -1) selectTab('map');
      mapView(L.latLngBounds([[lat, lon], [na.site.lat, na.site.lon]]).pad(0.35),
        { animate:!reduceMotion });
      announce('Showing the point and the nearest public land together.');
    });
    row.appendChild(goa);
  }
  var keep = el('button',{type:'button',text:'Keep it as a mark'});
  keep.addEventListener('click', function(){
    /* The depth travels with the mark, and so does the survey it came from,
       because a mark outlives the survey it was read from. */
    addMark(lat, lon, isNum(held.v) ? {
      depth: held.v,
      depthFrom: held.survey ? surveyLabel(held.survey) : 'a published survey',
      depthDate: held.survey ? surveyDate(held.survey) : null,
      depthAway: 0
    } : null);
  });
  row.appendChild(keep);
  var clr = el('button',{type:'button',text:'Let it go'});
  clr.addEventListener('click', function(){
    state.traceAt = null;
    markTrace(null, null);
    renderHeld(null);
    renderProfile();
    announce('The held point is cleared.');
  });
  row.appendChild(clr);
  box.appendChild(row);
}

/* A survey's name as a reader can use it. */
function readableSurvey(sv){
  if (!sv) return 'a published survey';
  var d = surveyDate(sv.name);
  return surveyLabel(sv.name) + (d ? ', surveyed ' + d : '');
}

/* The place on the map that the finger on the picture is pointing at. */
function markTrace(sample, along){
  if (!state.traceLayer) return;
  state.traceLayer.clearLayers();
  if (!sample && along === null) return;
  var m = state.profile;
  if (!m || !m.pts) return;
  var at = sample && isNum(sample.lat) ? [sample.lat, sample.lon] : pointAlong(m.pts, along);
  if (!at) return;
  L.circleMarker(at, { pane:'herepane', radius:8, weight:3,
    color:'#E6F0EF', fillColor:'#0A1214', fillOpacity:.9,
    interactive:false }).addTo(state.traceLayer);
}

/* Where a given distance along a polyline lands, for the stretches the survey
   did not measure — the finger is still somewhere real even when the bottom
   is not known there. */
function pointAlong(pts, metres){
  if (!pts || pts.length < 2 || !isNum(metres)) return null;
  var run = 0;
  for (var i = 1; i < pts.length; i++){
    var seg = metresBetween(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]);
    if (run + seg >= metres){
      var t = seg ? (metres - run) / seg : 0;
      return [pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * t,
              pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * t];
    }
    run += seg;
  }
  return pts[pts.length - 1];
}

/* ---- drawing the line ------------------------------------------------- */
function armProfile(){
  state.profArm = [];
  if (state.profLayer) state.profLayer.clearLayers();
  if (state.traceLayer) state.traceLayer.clearLayers();
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  announce('Tap the start of your line on the map, then tap the end.');
  renderLayers();
}
function cancelProfile(){
  state.profArm = null;
  renderLayers();
  announce('Line cancelled.');
}
function clearProfile(){
  state.profile = null; state.profArm = null; state.profWhole = null; state.profCross = null;
  /* The held point belongs to the line it was found on. */
  state.traceAt = null;
  renderHeld(null);
  if (state.profLayer) state.profLayer.clearLayers();
  if (state.traceLayer) state.traceLayer.clearLayers();
  renderProfile(); renderLayers(); updateLegend();
  announce('Profile cleared.');
}
function profilePoint(lat, lon){
  state.profArm.push([lat, lon]);
  state.profLayer.clearLayers();
  state.profArm.forEach(function(p){
    L.circleMarker(p, { pane:'herepane', radius:6, weight:3,
      color:'#F2A65A', fillColor:'#0A1214', fillOpacity:1 }).addTo(state.profLayer);
  });
  if (state.profArm.length < 2){
    announce('Start set. Now tap the other end.');
    return;
  }
  var pts = state.profArm.slice();
  state.profArm = null;
  state.profWhole = null; state.profCross = null;   /* a line you drew */
  runProfile(pts);
}

/* THE RIVER'S OWN LINE, and the part of it worth drawing.
   The baked centreline runs the whole main stem — 598 km of Sacramento — and
   the state has surveyed a few reaches of it. Ninety samples spread over the
   whole thing would be six kilometres apart and almost all of them would land
   where nothing was ever measured. So it profiles the longest stretch the
   surveys actually cover, and says which stretch that is rather than quietly
   drawing a different river from the one asked for. */
function surveyedRun(line){
  var covered = line.map(function(p){ return surveysAt(p[0], p[1]).length > 0; });
  var best = null, start = -1;
  for (var i = 0; i <= covered.length; i++){
    if (i < covered.length && covered[i]){ if (start < 0) start = i; }
    else if (start >= 0){
      if (!best || i - start > best[1] - best[0]) best = [start, i];
      start = -1;
    }
  }
  if (!best) return null;
  /* A point either side, so the drawing does not begin and end exactly on the
     edge of what was measured. */
  var a = Math.max(0, best[0] - 1), b = Math.min(line.length, best[1] + 1);
  return { pts: line.slice(a, b), of: line.length, from: a, to: b };
}

/* =====================================================================
   WHERE YOU ARE ALLOWED TO BE.

   NOT BOAT RAMPS. No published boat-ramp dataset for these rivers could be
   reached — the state's one "public access points" service is coastal beaches
   with none on this water — and this app does not invent one. What CDFW does
   publish is its own lands: places the department owns or operates and says
   the public may go. That answers a different question, and it is the question
   this data can answer honestly.

   EACH PIN IS THE MIDDLE OF A PROPERTY, not a spot on the bank, so the
   distance to the river travels with it and is shown. A wildlife area whose
   centre is eight kilometres from the water is a different proposition from
   one on the bank, and a dot alone cannot tell them apart.
   ===================================================================== */
function accessSites(river){
  var a = (typeof ACCESS_LANDS === 'object' && ACCESS_LANDS) || {};
  return (a[river.id] || []);
}

/* =====================================================================
   WHERE YOU CAN PUT A BOAT IN.
   CDFW's own boating facilities, baked. This section exists because the app
   spent its whole life asserting there was no such list — a sentence written
   on evidence gathered through a firewall, where a refused host and an absent
   dataset look identical. (Hub LESSONS §188.)

   TWO CAVEATS TRAVEL WITH EVERY ONE OF THESE and neither is optional. They
   are interview records, so the year somebody last stood there is printed on
   each, and where CDFW recorded no year the app SAYS there is none rather
   than letting an undated row read as current. And nothing here knows today's
   water: low water takes a ramp out of use for a season and this data has no
   idea what the stage is.
   ===================================================================== */
function rampsFor(river){
  var r = (typeof RAMPS === 'object' && RAMPS) || {};
  return (r[river.id] || []);
}
function rampsMeta(){
  return (typeof RAMPS_META === 'object' && RAMPS_META) || null;
}
/* "last seen in 2012" or the honest absence. Never a guess, and never a blank
   that reads as recent. */
function rampSeen(s){
  return s.seen ? 'Last visited in ' + s.seen + '.'
                : 'CDFW records no date for this one, so there is no telling how old it is.';
}
/* What the record actually offers, in the reader's terms, and nothing invented
   from a field that was empty. */
function rampFacts(s){
  var out = [];
  if (s.lanes) out.push(countWord(s.lanes) + ' ramp lane' + (s.lanes === 1 ? '' : 's'));
  if (s.trailerSpaces) out.push(s.trailerSpaces + ' trailer space' + (s.trailerSpaces === 1 ? '' : 's'));
  if (s.restrooms) out.push('restrooms');
  if (s.fishCleaning) out.push('fish cleaning');
  return out;
}
function rampWhere(s){
  var bits = [];
  if (s.type) bits.push(s.type);
  if (s.county) bits.push(s.county + ' County');
  if (s.owner) bits.push(s.gov ? s.owner : s.owner + ' (privately owned)');
  return bits.join(' \u00b7 ');
}
/* A facility at a confluence is genuinely on both rivers and is listed under
   both. Saying so is what stops it reading as two places. */
function rampAlso(s){
  if (!s.also || !s.also.length) return '';
  var names = s.also.map(function(id){ var r = byId(id); return r ? r.short : id; });
  return ' Also listed under ' + joinNames(names) + '.';
}

function drawRamps(){
  if (!state.rampLayer) return;
  state.rampLayer.clearLayers();
  if (!state.riverId || state.showRamps === false) return;
  var river = byId(state.riverId);
  rampsFor(river).forEach(function(s){
    var facts = rampFacts(s);
    L.marker([s.lat, s.lon], {
      pane:'ramppane', keyboard:false,
      icon: L.divIcon({ className:'ramppin', html:'', iconSize:[12,11] })
    }).bindPopup(labelNode(s.name,
      facts.length ? [[String(s.lanes || ''), s.lanes ? 'lanes' : '']].filter(function(x){ return x[0]; }) : [],
      rampWhere(s) + '. ' + (facts.length ? initialCap(joinNames(facts)) + '. ' : '') +
      rampSeen(s) + rampAlso(s) +
      ' Nothing here knows today\u2019s water \u2014 low water closes ramps and this record cannot see the stage.'
    ), LABEL).addTo(state.rampLayer);
  });
}

function drawAccessSites(){
  if (!state.accessLayer) return;
  state.accessLayer.clearLayers();
  if (!state.riverId || state.showAccess === false) return;
  var river = byId(state.riverId);
  accessSites(river).forEach(function(s){
    /* A SQUARE, NOT A CIRCLE — and the shape is the point, not the colour.
       These were a green ring on a dark fill and an idle tide station is a
       teal ring on a dark fill, at five pixels' radius, on a phone, outdoors.
       They were reported as looking the same, and they do. Hue alone would
       not have fixed it either: it is the one cue a colour-blind reader does
       not get, and the one sunlight takes first.
       A square is also the truer shape. A tide station is a point where a
       measurement is taken; a public access site is a PROPERTY, an area you
       may stand in, and the pin is its middle rather than a spot on the
       bank. */
    L.marker([s.lat, s.lon], {
      pane:'accesspane', keyboard:false,
      icon: L.divIcon({ className:'accesspin', html:'', iconSize:[12,12] })
    }).bindPopup(labelNode(s.name,
      [[String(s.km), 'km to the river']],
      s.type + '. ' + (s.access || 'CDFW does not say what the access is.') +
      ' This pin is the middle of the property, not a place on the bank, and it is not a launch \u2014 ' +
      'the launches are their own layer.'
    ), LABEL).addTo(state.accessLayer);
  });
}

/* WHERE THE DEPTH ACTUALLY IS.
   The surveys are a handful of reaches on hundreds of kilometres of river, and
   the app opened on the whole basin with nothing marking them — so "I cannot
   see where the depth is" was the correct reading of the screen. They are drawn
   now, and there is one press that takes you to them. */
function drawSurveyBoxes(){
  if (!state.surveyLayer) return;
  state.surveyLayer.clearLayers();
  if (!state.riverId || !state.catalog || !state.catalog.raster) return;
  var river = byId(state.riverId);
  /* The raster list DIRECTLY, not catalogFor — that helper ranks every kind of
     survey and reads fields the catalogue may not have yet while it is still
     loading, so calling it here threw inside selectRiver and took the whole
     river change down with it. A drawing function must not need more of the
     data than it draws. */
  surveysForRiver(river).forEach(function(row){
    L.rectangle([[row.box.s, row.box.w], [row.box.n, row.box.e]], {
      pane:'surveypane', interactive:false,
      color:'#7BD5D9', weight:1, opacity:.55, dashArray:'4 4',
      fillColor:'#7BD5D9', fillOpacity:.05
    }).addTo(state.surveyLayer);
  });
}

/* A survey further than this from any of a river's channels is not that
   river's survey, whatever box it happens to fall in. */
var SURVEY_NEAR_M = 4000;

/* WHICH RIVER A SURVEY BELONGS TO, DECIDED BY THE WATER AND NOT BY A BOX.

   The boxes overlap. Measured against the live catalogue on 2026-08-31, not
   one of the twenty published surveys landed on exactly one river: nine landed
   on both the Sacramento and the Mokelumne — among them two San Joaquin
   surveys and one of Old River, offered as Sacramento depth — and eleven
   landed on no river at all, which is why the Delta now exists.

   The rule is the one already used for public land, and for the same reason:
   distance to that river's own channels. It needs the geometry, so until the
   geometry is loaded the old box test stands rather than the panel going
   blank — and asking for the depth panel is what loads it. */
function surveyRiverId(row){
  if (!row.box || row.box.unknownWkid) return null;
  var lat = (row.box.n + row.box.s) / 2, lon = (row.box.e + row.box.w) / 2;
  /* A NAMED RIVER GETS ITS OWN WATER FIRST. The legal Delta reaches up past
     Freeport, and the Delta's channel list includes the Sacramento itself, so
     without this a Sacramento survey inside the Delta boundary would be filed
     under the Delta and be missing from the river a reader picked by name.
     The Delta entry exists for the water that is NOT one of the four. */
  var best = null;
  RIVERS.forEach(function(r){
    if (r.network || !linesFor(r).length) return;
    var n = nearestOnAny(r, lat, lon);
    if (n && (!best || n.off < best.off)) best = { id:r.id, off:n.off };
  });
  if (best && best.off <= SURVEY_NEAR_M) return best.id;

  var net = null;
  RIVERS.forEach(function(r){
    if (!r.network || !linesFor(r).length) return;
    var n = nearestOnAny(r, lat, lon);
    if (n && (!net || n.off < net.off)) net = { id:r.id, off:n.off };
  });
  return (net && net.off <= SURVEY_NEAR_M) ? net.id : null;
}

function haveAnyLines(){
  return RIVERS.some(function(r){ return linesFor(r).length > 0; });
}

function surveysForRiver(river){
  if (!state.catalog || !state.catalog.raster) return [];
  var geometryReady = haveAnyLines();
  return state.catalog.raster.filter(function(row){
    if (!row.box || row.box.unknownWkid) return false;
    if (!geometryReady) return boxesIntersect(row.box, river.bbox);
    return surveyRiverId(row) === river.id;
  });
}

/* Surveys the geometry could not give to anybody — too far from every
   channel this build carries. Named rather than dropped in silence, because a
   survey nobody can see is exactly what the Delta was built to fix. */
function surveysHomeless(){
  if (!state.catalog || !state.catalog.raster || !haveAnyLines()) return [];
  return state.catalog.raster.filter(function(row){
    return row.box && !row.box.unknownWkid && surveyRiverId(row) === null;
  });
}

function surveyBounds(river){
  var b = null;
  surveysForRiver(river).forEach(function(row){
    var r = L.latLngBounds([[row.box.s, row.box.w], [row.box.n, row.box.e]]);
    b = b ? b.extend(r) : r;
  });
  return b;
}

function goToDepth(river){
  var b = surveyBounds(river);
  if (!b){
    announce('No published survey for the ' + river.name + ' has arrived yet, so there is nowhere to go.');
    return;
  }
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  mapView(b.pad(0.08), { animate:!reduceMotion });
  drawSurveyBoxes();
  drawAccessSites();
  drawRamps();
  announce('Showing the reaches of the ' + river.name + ' the state has surveyed.');
}

/* A CROSS-SECTION IS PERPENDICULAR TO THE RIVER, and until the centreline was
   baked in the app had no idea which way that was — so it offered a line across
   whatever the screen happened to show, which at the zoom this app opens on is
   a line across the state. That was not a cross-section, it was a chord.
   Now: find the nearest point on the river's own line, take its local bearing,
   and cut across it. */
/* THE CENTRELINES ARE FETCHED WHEN THEY ARE FIRST WANTED, not at boot. They
   are 39 KB of coordinates that only the profile uses, and a reader opening
   the app to look at the water temperature was paying to parse all of it
   before the map appeared. Precached, so this is a read from the device rather
   than the network, and it works with no signal. */
var riverLinesReady = null;
/* One loader, two files: the four rivers each have a main stem, and the Delta
   has a network of ninety-seven named channels instead. Both are baked, both
   are lazy, and neither is paid for on a landing that does not need it. */
function loadScriptOnce(src, label, has){
  if (has()) return Promise.resolve(true);
  loadScriptOnce._p = loadScriptOnce._p || {};
  if (loadScriptOnce._p[src]) return loadScriptOnce._p[src];
  loadScriptOnce._p[src] = new Promise(function(res, rej){
    var sc = document.createElement('script');
    sc.src = src;
    sc.onload = function(){ logNet(label, src, true, 'loaded on demand'); res(true); };
    sc.onerror = function(){
      loadScriptOnce._p[src] = null;
      logNet(label, src, false, 'did not load');
      rej(new Error(label + ' did not load'));
    };
    document.head.appendChild(sc);
  });
  return loadScriptOnce._p[src];
}

function loadRiverLines(river){
  var wantDelta = river && river.network;
  var jobs = [];
  if (!wantDelta || river === undefined)
    jobs.push(loadScriptOnce('river-lines.js', 'river centrelines',
      function(){ return typeof RIVER_LINES === 'object' && RIVER_LINES; }));
  if (wantDelta || river === undefined)
    jobs.push(loadScriptOnce('delta.js', 'Delta channels',
      function(){ return typeof DELTA === 'object' && DELTA; }));
  return Promise.all(jobs).then(function(){ return true; });
}

function riverLineFor(id){
  return (typeof RIVER_LINES === 'object' && RIVER_LINES && RIVER_LINES[id]) || null;
}

/* EVERY LINE THIS RIVER IS. A river has one; the Delta has ninety-seven, and
   the difference is the whole reason the Delta could not simply be a fifth
   river. Anything that asks "where is the water nearest this point" goes
   through here rather than assuming a single course. */
function linesFor(river){
  if (!river) return [];
  if (river.network)
    return (typeof DELTA === 'object' && DELTA && DELTA.channels)
      ? DELTA.channels.map(function(c){ return c.pts; }) : [];
  var one = riverLineFor(river.id);
  return one ? [one] : [];
}

/* The nearest point across every line, and WHICH line it was on — a bank or a
   cross-section is meaningless without knowing which channel it belongs to. */
function nearestOnAny(river, lat, lon){
  var best = null;
  linesFor(river).forEach(function(line, li){
    var n = nearestOnLine(line, lat, lon);
    if (n && (!best || n.off < best.off)) best = { line:line, li:li, i:n.i, off:n.off };
  });
  return best;
}

function nearestOnLine(line, lat, lon){
  var best = -1, bd = Infinity;
  for (var i = 0; i < line.length; i++){
    var d = metresBetween(lat, lon, line[i][0], line[i][1]);
    if (d < bd){ bd = d; best = i; }
  }
  return best < 0 ? null : { i:best, off:bd };
}

function crossSectionAt(river, lat, lon, halfWidthM){
  announce('Reading across the river…');
  loadRiverLines(river).then(function(){ crossSectionNow(river, lat, lon, halfWidthM); },
    function(){ announce('The river centrelines did not load, so the app cannot tell which way across is.'); });
}
function crossSectionNow(river, lat, lon, halfWidthM){
  /* A cross-section is across ONE channel, and in the Delta the one it is
     across is whichever is nearest — which is exactly the question a reader
     standing on a bank is asking. */
  var n = nearestOnAny(river, lat, lon);
  if (!n || n.line.length < 3){
    announce('This build carries no channel geometry for the ' + river.name + ', so it cannot tell which way across is.');
    return;
  }
  var line = n.line;
  var a = line[Math.max(0, n.i - 1)], b = line[Math.min(line.length - 1, n.i + 1)];
  var mid = line[n.i];
  /* Local bearing of the river, then a quarter turn. Longitude is squeezed by
     latitude, so the perpendicular has to be computed in metres rather than in
     degrees or it comes out skewed. */
  var kx = 111320 * Math.cos(mid[0] * Math.PI / 180), ky = 110540;
  var dx = (b[1] - a[1]) * kx, dy = (b[0] - a[0]) * ky;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / len, py = dx / len;              /* unit perpendicular, metres */
  var w = halfWidthM || 300;
  var p1 = [mid[0] + (py * -w) / ky, mid[1] + (px * -w) / kx];
  var p2 = [mid[0] + (py *  w) / ky, mid[1] + (px *  w) / kx];
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  state.profWhole = null;
  state.profCross = { at:mid, off:n.off, width:w * 2 };
  runProfile([p1, mid, p2]);
}

function profileRiverLine(river){
  announce('Reading down the river…');
  /* Taken NOW, at the press, and carried to the other side of the fetch. */
  var claim = claimView();
  loadRiverLines(river).then(function(){ profileRiverNow(river, claim); },
    function(){ announce('The river centrelines did not load, so the app cannot follow the river.'); });
}
function profileRiverNow(river, claim){
  /* THE DELTA HAS NO COURSE TO FOLLOW, and saying so is the honest answer
     rather than picking a channel and calling it the river. Ninety-seven named
     channels meet and part; there is no single line from a top to a mouth, and
     a profile "down the Delta" would be this app choosing a route and not
     saying it had. Everything that works on one channel — the cross-section, a
     line drawn by hand, the depth at a point — still works. */
  if (river.network){
    announce('The Delta is a network rather than a course, so there is no single line down it to profile. Draw a line across a channel, or use the cross-section.');
    return;
  }
  var line = riverLineFor(river.id);
  if (!line || line.length < 2){
    announce('This build carries no centreline for the ' + river.name + '.');
    return;
  }
  var run = surveyedRun(line);
  if (!run){
    state.profile = { none:'nowhere', pts:line };
    $('#profile').hidden = false;
    renderProfile();
    $('#profnote').textContent = 'No published survey covers any part of the ' +
      river.name + '\u2019s course, so there is nothing to draw along it. The line ' +
      'itself is USGS\u2019s; the depth would have to be DWR\u2019s, and they have not ' +
      'measured here.';
    renderLayers();
    return;
  }
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  state.profWhole = run; state.profCross = null;
  runProfile(run.pts, claim);
}

function runProfile(pts, claim){
  /* A held point is a place on the LAST line. Drawing a new one makes it a
     claim about a line it was never on. */
  state.traceAt = null;
  renderHeld(null);
  if (state.profLayer) state.profLayer.clearLayers();
  if (state.traceLayer) state.traceLayer.clearLayers();
  /* THE LINE IS THE SUBJECT AND IT LOOKED LIKE A SCRATCH. Reported from a
     phone: "it does not show the river line, just a bunch of dots". Over
     satellite imagery, with sixty pins on top of it, a two-pixel dashed stroke
     is not a line anybody can see. A dark casing under a bright solid stroke
     is how a route is drawn on a map that has a photograph underneath it. */
  L.polyline(pts, { pane:'herepane', color:'#0A1214', weight:7, opacity:.75,
    lineJoin:'round', interactive:false }).addTo(state.profLayer);
  L.polyline(pts, { pane:'herepane', color:'#F2A65A', weight:3.5,
    lineJoin:'round', interactive:false }).addTo(state.profLayer);
  [pts[0], pts[pts.length-1]].forEach(function(pt){
    L.circleMarker(pt, { pane:'herepane', radius:6, weight:3,
      color:'#F2A65A', fillColor:'#0A1214', fillOpacity:1,
      interactive:false }).addTo(state.profLayer);
  });
  state.profile = { loading:true };
  $('#profile').hidden = false;
  $('#profnote').textContent = 'Asking the survey along this line…';
  announce('Reading the bottom along your line.');
  renderLayers();
  updateLegend();   /* the line is on the map now, so the key must say what it is */
  mapView(L.latLngBounds(pts).pad(0.15), { animate:!reduceMotion }, claim);
  buildProfile(pts).then(function(model){
    state.profile = model;
    state.profZoom = 1;
    renderProfile();
    announce($('#profnote').textContent);
  }, function(e){
    state.profile = { none:'failed' };
    $('#profnote').textContent = 'The survey did not answer: ' + (e && e.message || e) +
      '. Nothing is drawn, because nothing is known.';
    renderProfile();
  });
}

/* =====================================================================
   A PIN IS 13 PIXELS WIDE AND A FINGER IS NOT.

   Every pin on this map is drawn as a small circle: 13 px across for a public
   access site, 11 for an idle tide station, 19 for the live one. Measured, by
   walking out from each centre and asking the document what is on top. The
   floor for something you press with a finger is 44.

   That alone would only make them fiddly. What made it a defect worth a
   report is WHAT A MISS DOES: the map's own click handler runs, and answers a
   question about the depth of the water under the miss. So pressing a green
   circle marked "places I can go" returned a depth — confidently, with a
   sentence explaining how far the tap had been moved to get it — and the
   circles read as decoration that does nothing.

   THE FIX IS NOT A BIGGER CIRCLE. Drawing a 44 px transparent disc under every
   pin would blanket a zoomed-out map with sixty tide stations and thirty
   access sites, and the depth tap — the thing this app is for — would stop
   working. The tap is resolved in code instead: the nearest pin within a
   finger's width wins, and if none is near, the water gets the tap as before.
   That also lets NEAREST win rather than whichever path happened to paint
   last, which is what a stack of transparent discs would have given.

   Soundings are deliberately not in this list. There are hundreds of them,
   three pixels apart in places, and rescuing a near miss there would mean no
   tap ever reached the water again. They are dense enough to hit directly. */
var TOUCH_SLOP = 22;   /* half of the 44 px floor: the visible dot covers the rest */

/* Highest precedence first, and it is the SAME order the panes already
   encode — a reading wins over a station, a station over a footprint. Rank
   only breaks a tie; a genuinely nearer pin wins regardless of what it is. */
function pinLayers(){
  /* A LAYER MISSING FROM THIS LIST IS A LAYER NOBODY CAN PRESS. The pins are
     eleven and twelve pixels across and a finger is forty-four; what makes any
     of them reachable is this list, not their styling. A new layer that is
     drawn and not listed here looks correct in every screenshot and is inert
     under a thumb — which is the doctrine's own worst case, a feature that is
     present in the source and unreachable on the device. Launches rank below
     the readings and beside the public land, so where a launch sits on top of
     a gauge the reading still wins. */
  return [[state.gaugeLayer, 0], [state.markLayer, 0], [state.hereLayer, 1],
          [state.tideLayer, 2], [state.rampLayer, 3], [state.accessLayer, 4]];
}

function nearestPin(latlng){
  if (!state.map) return null;
  var origin = state.map.latLngToContainerPoint(latlng);
  var best = null;
  pinLayers().forEach(function(pair){
    var layer = pair[0], rank = pair[1];
    if (!layer || !layer.eachLayer) return;
    layer.eachLayer(function(m){
      /* A POPUP IS WHAT MAKES A THING TAPPABLE. Lines, accuracy rings and the
         profile drawing have none, and must not swallow a press. */
      if (!m.getLatLng || !m.getPopup || !m.getPopup()) return;
      var d = origin.distanceTo(state.map.latLngToContainerPoint(m.getLatLng()));
      if (d > TOUCH_SLOP) return;
      if (!best || d < best.d - 0.5 ||
          (Math.abs(d - best.d) <= 0.5 && rank < best.rank))
        best = { m:m, d:d, rank:rank };
    });
  });
  return best && best.m;
}

/* =====================================================================
   A TAP BELONGS ON THE WATER.

   Depth is a property of a river, and a finger on a phone is not a precise
   instrument — so a tap that lands in an orchard beside the Sacramento was
   being answered as a serious question about the depth of an orchard. It is
   not one, and the honest answer to it is not a paragraph about weed.

   The centreline is already baked in, so the app can do what a person would:
   take a tap near the river as meaning the river, and a tap nowhere near it as
   not being about the river at all.

   THE SNAP IS ALWAYS SAID OUT LOUD. Moving somebody's question without telling
   them is worse than refusing it — they asked about one place and would be
   reading the answer for another. */
var SNAP_TAKE_M = 120;    /* inside this, the tap is taken as given */
var SNAP_MAX_M  = 1500;   /* beyond this, it is not a question about the river */

function snapToRiver(lat, lon){
  if (!state.riverId) return { at:[lat, lon], moved:0 };
  var river = byId(state.riverId);
  /* Without the geometry loaded there is nothing to snap to, and guessing
     would be worse than leaving the tap where it fell. In the Delta this is
     ninety-seven channels rather than one line, and the nearest of them wins
     — which is the only sense in which "the river" exists there. */
  var n = nearestOnAny(river, lat, lon);
  if (!n) return { at:[lat, lon], moved:0 };
  var line = n.line;
  if (n.off > SNAP_MAX_M) return { tooFar:true, away:n.off, at:[lat, lon] };
  if (n.off <= SNAP_TAKE_M) return { at:[lat, lon], moved:0 };
  return { at:line[n.i], moved:n.off };
}

/* The reading, as a label on the map where the finger is. */
function showDepthAt(lat, lon){
  if (!state.map) return;
  var snap = snapToRiver(lat, lon);

  if (snap.tooFar){
    var away = L.popup(LABEL).setLatLng([lat, lon]).openOn(state.map);
    var box = el('div',{});
    box.appendChild(el('span',{class:'pop-name',text:'Not on the river'}));
    box.appendChild(el('p',{class:'note',
      text:'That is ' + kmText(snap.away) + ' from the ' + byId(state.riverId).name +
        '. Depth belongs to the river, so there is nothing to read there \u2014 and this app did not ask, rather than asking a question about a field.'}));
    box.appendChild(el('p',{class:'note',
      text:'Nothing you did wrong. Tap on the water and it will read the survey; a tap near the bank is taken as meaning the river.'}));
    var r = el('div',{class:'rowline'});
    var b2 = el('button',{type:'button',text:'Take me to the surveyed water'});
    b2.addEventListener('click', function(){
      state.map.closePopup(); goToDepth(byId(state.riverId));
    });
    r.appendChild(b2);
    box.appendChild(r);
    away.setContent(box);
    announce('That is ' + kmText(snap.away) + ' from the river, so there is no depth to read there. Tap on the water.');
    return;
  }

  var at = snap.at;
  var pop = L.popup(LABEL).setLatLng(at)
    .setContent(depthNode({ loading:true }, at[0], at[1])).openOn(state.map);
  depthAt(at[0], at[1]).then(function(res){
    res.snapped = snap.moved || 0;
    pop.setContent(depthNode(res, at[0], at[1]));
    pop.update();
    announce(depthSentence(res));
  });
}

/* What is said aloud. It carries the same four things the panel does — what
   happened, whose doing it was, and what to do — because somebody reading by
   ear gets this sentence and nothing else. */
function depthSentence(res){
  if (res.loading) return 'Asking the survey how deep it is here.';
  /* THE SNAP IS A PREFIX, NOT A BRANCH. It happened before the question was
     asked, so it is true of every answer that follows — and written as its own
     branch it swallowed the ones underneath it. */
  var moved = res.snapped
    ? 'Your tap was ' + fmt(res.snapped, 0) + ' metres off the river, so it was read on the water. '
    : '';
  if (res.failed)  return moved + 'The depth service did not answer. Nothing you did; it needs a signal. Tap again when you have one.';
  if (res.none === 'nocatalog') return moved + 'The list of surveys has not arrived yet, so there was nothing to ask. Nothing you did. It comes down on its own; try the same spot again in a moment.';
  if (res.none === 'nowhere') return moved + 'You tapped water the state has never surveyed, so there is no depth here. Nothing you did wrong. The dashed outlines on the map are the surveyed reaches; tap inside one.';
  if (res.none === 'notmeasured')
    return moved + 'This is inside a published survey, but nothing was measured within ' + DEPTH_SPAN_M +
      ' metres of it. Nothing you did wrong. A spot nearer the middle of the channel usually has a reading.';
  return moved + fmt(Math.abs(res.value), 1) + ' feet ' +
    (res.value <= 0 ? 'deep' : 'ABOVE the survey datum — bank, not bottom') +
    (res.exact ? ' here' : ', ' + fmt(res.away, 0) + ' metres away') + '.';
}

function depthNode(res, lat, lon){
  var box = el('div',{});
  box.appendChild(el('span',{class:'pop-name',text:'Depth here'}));

  /* MOVING SOMEBODY'S QUESTION WITHOUT SAYING SO IS WORSE THAN REFUSING IT —
     and it is said HERE, above every branch, rather than beside the number.
     Written down there it appeared only when there was a depth to show, so a
     tap that was moved onto unsurveyed water read as the app failing at the
     spot the reader picked, which is not where it looked. */
  if (res.snapped)
    box.appendChild(el('p',{class:'note',
      text:'Your tap landed ' + fmt(res.snapped, 0) + ' m off the ' +
        (state.riverId ? byId(state.riverId).name : 'river') +
        ', so it was read on the water rather than on the bank.'}));

  /* EVERY ANSWER THAT IS NOT A DEPTH SAYS FOUR THINGS: what happened, whether
     the reader did anything wrong, what would have happened, and what to do
     now. The old ones said the first and stopped, so a reader who tapped
     water the state has never surveyed got a sentence about weed and no idea
     whether they had made a mistake, whether it would ever work, or where to
     tap instead. */
  function outcome(what, yours, next, kind){
    box.appendChild(el('p',{class:kind || 'note', text:what}));
    if (yours) box.appendChild(el('p',{class:'note', text:yours}));
    if (next) box.appendChild(el('p',{class:'note', text:next}));
  }
  function actionRow(label, fn){
    var r = el('div',{class:'rowline'});
    var b2 = el('button',{type:'button',text:label});
    b2.addEventListener('click', fn);
    r.appendChild(b2);
    box.appendChild(r);
  }

  if (res.loading){
    box.appendChild(el('p',{class:'note',
      text:'Asking the published survey how deep it is at this point. It usually takes a second or two.'}));
    return box;
  }
  if (res.failed){
    outcome('The depth service did not answer: ' + res.failed + '.',
      'Nothing you did — that is the state\u2019s server, not this app, and nothing is shown because nothing is known.',
      'It needs a signal. Tap the same spot again when you have one; depth is the only part of this app that cannot work offline.',
      'err');
    return box;
  }
  if (res.none === 'nocatalog'){
    outcome('The list of published surveys has not arrived yet, so there was nothing to ask.',
      'Nothing you did. This is not the same as there being no survey here \u2014 it means the question has not been put.',
      'The list comes down on its own as soon as there is a signal. Try the same spot again in a moment.');
    return box;
  }
  if (res.none === 'nowhere'){
    outcome('You tapped water the state has never surveyed, so there is no depth to give you.',
      'Nothing you did wrong. Only a handful of reaches out of hundreds of kilometres have been measured, and outside them this app has nothing and will not guess.',
      'The surveyed reaches are the dashed outlines on the map. Tap anywhere inside one and you get a number.');
    actionRow('Take me to the surveyed water', function(){
      state.map.closePopup();
      goToDepth(byId(state.riverId));
    });
    return box;
  }
  if (res.none === 'notmeasured'){
    var n = res.covering.length;
    outcome('This spot IS inside a published survey, but the survey has no reading within ' +
        DEPTH_SPAN_M + ' metres of it.',
      'Nothing you did wrong. ' + (n === 1 ? 'The one survey covering it' : 'None of the ' + n + ' surveys covering it') +
        ' measured here: weed stops a sounder returning, and the boat only measures where it went, so those patches are left out rather than filled in.',
      'A spot nearer the middle of the channel usually has one. Depth along a line, in the Depth tab, shows you where the gaps are before you go tapping.');
    return box;
  }

  /* A survey publishes elevation against its own datum: below it is
     negative and that is the depth. A POSITIVE reading is ground above the
     datum — bank, or a bar that was dry when the boat went past — and
     printing its absolute value as a depth would turn dry land into eleven
     feet of water. It is said as what it is instead. */
  var below = res.value <= 0;
  var v = el('div',{class:'pop-vals'});
  var s = el('span',{class:'v water'});
  s.appendChild(document.createTextNode(fmt(Math.abs(res.value), 1)));
  s.appendChild(el('small',{text:'ft'}));
  v.appendChild(s);
  box.appendChild(v);
  if (!below) box.appendChild(el('div',{class:'err',
    text:'That reading is ABOVE the survey’s datum, not below it — this is bank, or a bar that was dry when the survey boat went past, and not a depth of water. Nothing you did wrong: it is what the survey recorded there. Tap further out and you will get water.'}));

  box.appendChild(el('span',{class:'pop-sub',
    text: res.exact
      ? 'at the point you asked for'
      : fmt(res.away, 0) + ' m away — the nearest place this survey measured'}));
  box.appendChild(el('span',{class:'pop-sub',
    text: surveyLabel(res.survey.name) +
      (res.survey._date ? ', surveyed ' + res.survey._date : ', survey date not published') +
      ' · ' + res.survey.name}));
  box.appendChild(el('p',{class:'note',
    text:'As the survey published it. Thalweg does not restate a vertical datum it has not checked, so treat this as relative, not as a chart sounding. Not for navigation.'}));

  var keep = el('button',{type:'button',text:'Keep this as a mark'});
  keep.addEventListener('click', function(){
    addMark(res.exact ? lat : res.lat, res.exact ? lon : res.lon, {
      depth: res.value, depthFrom: surveyLabel(res.survey.name), depthDate: res.survey._date,
      depthAway: res.exact ? 0 : Math.round(res.away) });
    state.map.closePopup();
  });
  if (state.riverId) box.appendChild(el('div',{class:'rowline'},[keep]));
  else box.appendChild(el('p',{class:'note',
    text:'Pick a river and this can be kept as a mark; a mark belongs to one river.'}));
  return box;
}
