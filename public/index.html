  if (!t){ announce('Nothing to go back to yet — press Where I am, or keep a mark.'); return; }
  if (tabNames().indexOf('map') !== -1) selectTab('map');
  mapView([t.at, t.zoom], { animate:!reduceMotion });
  announce('Back to ' + t.what + '.');
}

/* Nearest thing worth naming. A distance to the middle of a reach is a number
   about a bounding box; a distance to a gauge is a distance to somewhere that
   exists and has a name on the map. Falls back to the reach only when nothing
   with a position has loaded yet. */
function nearestNamed(lat, lon){
  var best = null;
  Object.keys(state.gauges || {}).forEach(function(rid){
    var payload = state.gauges[rid];
    if (!payload) return;
    (payload.rows || []).forEach(function(r){
      if (!isNum(r.lat) || !isNum(r.lon)) return;
      var d = metresBetween(lat, lon, r.lat, r.lon);
      if (!best || d < best.d) best = { d:d, name:r.name || r.id, river:rid };
    });
  });
  if (best) return best;
  RIVERS.forEach(function(r){
    if (!r.center) return;
    var d = metresBetween(lat, lon, r.center[0], r.center[1]);
    if (!best || d < best.d) best = { d:d, name:'the middle of the ' + r.name, river:r.id };
  });
  return best;
}

function kmText(metres){
  if (!isFinite(metres)) return 'an unknown distance';
  if (metres < 950) return Math.round(metres / 10) * 10 + ' m';
  return (metres / 1000).toFixed(metres < 9500 ? 1 : 0) + ' km';
}

function drawHere(recentre){
  if (!state.hereLayer) return;
  state.hereLayer.clearLayers();
  var h = state.here;
  if (!h) return;

  /* THE RING IS NOT DECORATION. A browser that is 2 km sure of itself and one
     that is 8 m sure both hand back a single pair of numbers, and drawing both
     as the same dot claims a precision the second one has and the first does
     not. The ring is that number, to scale, which is the same rule this app
     applies to a depth it did not measure at the point you asked about. */
  var ring = null;
  /* Non-positive accuracy is not precision, it is an absence. The guard lives
     here as well as where the fix is stored, because this function is the one
     that makes the claim and it must be honest about whatever it is handed. */
  var acc = (isNum(h.acc) && h.acc > 0) ? h.acc : null;
  if (acc !== null){
    ring = L.circle([h.lat, h.lon], {
      pane:'herepane', radius:acc, interactive:false,
      color:'#DA4A85', weight:1, opacity:.7,
      fillColor:'#DA4A85', fillOpacity:.10
    }).addTo(state.hereLayer);
  }

  var near = nearestNamed(h.lat, h.lon);
  var sub = 'Your device\u2019s own position, taken at ' +
    new Date(h.at).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) + '. ' +
    (acc !== null ? 'Good to about ' + kmText(acc) + '. ' : 'Your browser did not say how accurate it is. ') +
    'It is not saved, and your coordinate is not sent anywhere.';

  L.circleMarker([h.lat, h.lon], {
    pane:'herepane', radius:7, weight:3,
    color:'#E76F9F', fillColor:'#0D1A19', fillOpacity:1
  }).bindPopup(labelNode('Where you are',
    near ? [[kmText(near.d).split(' ')[0], kmText(near.d).split(' ')[1] + ' to ' + near.name]] : [],
    sub), LABEL).addTo(state.hereLayer);

  if (recentre){
    if (tabNames().indexOf('map') !== -1) selectTab('map');
    /* THROUGH mapView, LIKE EVERY OTHER MOVE. Calling the map directly skips
        the guard that refuses to animate a jump longer than the window, and
        skips the one that defers a view asked for while the map is hidden. */
    if (ring) mapView(ring.getBounds(), { maxZoom:15, animate:!reduceMotion });
    else mapView([[h.lat, h.lon], 14], { animate:!reduceMotion });
  }

  /* SAY WHERE YOU ARE RELATIVE TO THE THING ON SCREEN. Centring the map on a
     reader two hundred kilometres away is exactly what they asked for and
     leaves them looking at a rectangle with none of this app's river in it,
     with nothing saying why. */
  updateLegend();
  updateBackButton();
  /* THE TIDE PANEL IS BUILT WHEN THE PANEL RENDERS, so a position found
     afterwards did not reach it: a reader pressed Where I am and the tide
     section went on saying nothing about which station was nearest them,
     until some unrelated thing happened to redraw it. Anything that knows
     where the reader is has to tell the panels that use it. */
  if (state.riverId) renderWater();

  var msg = 'You are on the map' +
    (acc !== null ? ', to about ' + kmText(acc) : '') +
    (near ? '. Nearest is ' + near.name + ', ' + kmText(near.d) + ' away' : '') + '.';
  if (near && near.d > 200000)
    msg += ' That is far enough that none of this river is in view at this zoom.';
  announce(msg);
}

function setBasemap(id){
  var def = BASEMAPS.filter(function(b){ return b.id === id; })[0] || BASEMAPS[0];
  if (state.layers.base) state.map.removeLayer(state.layers.base);
  var lyr = L.tileLayer(def.url, {
    maxZoom: 19, attribution: def.attr,
    crossOrigin: true
  });
  /* A basemap that answers with nothing leaves a black rectangle and no
     explanation. If the first tiles do not arrive, the Layers panel says
     which host did not answer rather than leaving you to guess. */
  var got = false;
  state.basemapError = null;
  lyr.on('tileload', function(){ got = true; });
  lyr.on('tileerror', function(){
    if (got || state.basemapId !== def.id) return;
    state.basemapError = def.label + ' did not return tiles. Its host may be unreachable from this network.';
    logNet('basemap ' + def.id, def.url, false, 'tile error');
    if (!document.getElementById('panel-layers').hidden) renderLayers();
  });
  lyr.addTo(state.map);
  lyr.setZIndex(0);
  state.layers.base = lyr;
  state.basemapId = def.id;
  sput('_shared','basemap', def.id);
}

/* =====================================================================
   Water panel — tide where the water is tidal, gauge readings always.
   A river that is not tidal shows no tide section at all rather than an
   empty chart: an empty chart reads as "no tide today".
   ===================================================================== */
/* --- the All view: one card per river ------------------------------- */

/* How much water is coming down: the most downstream gauge that is ABOVE
   the tide.
 *
 * The furthest downstream gauge is the obvious choice and it is wrong on a
 * tidal river. Instantaneous flow at Rio Vista was reading minus eighty-five
 * thousand cubic feet a second while this was being written — a true
 * measurement of a flooding tide pushing the river backwards, and no
 * description at all of what the Sacramento is carrying. The gauge to ask is
 * the lowest one the tide does not reach, which on the Sacramento is Verona.
 *
 * Where every gauge on a river is tidal — the Mokelumne, all three of them —
 * there is no such gauge, and the honest answer is to say so rather than
 * print a tidal swing as discharge.
 */
function downstreamFlow(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var edge = river.tidal ? tidalEdge(river) : null;
  var best = null, bestTidal = null;
  payload.rows.forEach(function(r){
    if (r.context || !isNum(r.flow)) return;
    var v = axisValue(river, r);
    if (!isNum(v)) return;
    var underTide = edge ? (v <= edge.v) : false;
    if (underTide){
      if (bestTidal === null || v < bestTidal.v)
        bestTidal = { v:v, flow:r.flow, name:r.name || r.id, id:r.id,
                      source:r.source, tidal:true };
    } else if (best === null || v < best.v){
      best = { v:v, flow:r.flow, name:r.name || r.id, id:r.id,
               source:r.source, tidal:false };
    }
  });
  return best || bestTidal;
}

/* Clarity across the gauges that have a turbidity sensor. Most do not: the
   American has four gauges and none of them, and CDEC publishes none for the
   Feather. A river with no sensor is a river nobody is measuring, which is a
   different fact from clear water and is said as such. */
function meanTurb(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var t = payload.rows.filter(function(r){ return !r.context && isNum(r.turb); })
                      .map(function(r){ return r.turb; });
  if (!t.length) return null;
  return { f: t.reduce(function(a,b){ return a+b; },0) / t.length, n: t.length };
}

/* Mean of the gauges that have a thermometer, and how many that was. One
   river's worth of water is not one temperature, and saying which gauges
   it came from is the difference between a figure and a guess. */
function meanTemp(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var t = payload.rows.filter(function(r){ return !r.context && isNum(r.tempF); })
                      .map(function(r){ return r.tempF; });
  if (!t.length) return null;
  return { f: t.reduce(function(a,b){ return a+b; },0) / t.length, n: t.length };
}

/* THE NEXT HIGH AND THE NEXT LOW, both, rather than whichever comes first.
   A fisher planning an hour out wants to know which way the water will be
   going and when it stops — one turn answers half of that. */
function nextHighLow(river){
  var t = state.tides[river.id];
  if (!t || !t.hilo || !t.hilo.length) return null;
  var now = Date.now(), out = { high:null, low:null };
  for (var i = 0; i < t.hilo.length; i++){
    var when = new Date(t.hilo[i].t.replace(' ','T'));
    if (when.getTime() <= now) continue;
    var k = t.hilo[i].type === 'H' ? 'high' : 'low';
    if (!out[k]) out[k] = { at:when, v:t.hilo[i].v };
    if (out.high && out.low) break;
  }
  return (out.high || out.low) ? out : null;
}

/* The fortnight, drawn. One bar a day for the span the water covers, today
   marked, the biggest and smallest named. A number on its own does not answer
   "is that a lot" — the shape of the cycle does, and the shape is the thing
   somebody plans a weekend around. */
function springNeapBox(river){
  var sn = springNeap(river);
  if (!sn) return null;

  var box = el('div', {});

  /* THE SENTENCE FIRST, because the picture is inside a role="img" and
     everything it says has to exist in words anyway. */
  var say;
  if (sn.isBiggest)
    say = 'Today is the biggest tide of the fortnight ahead — ' + fmt(sn.today.range, 1) +
      ' ft between the day’s highest water and its lowest. The smallest in that window is ' +
      fmt(sn.smallest.range, 1) + ' ft, on ' + dayLocal(sn.smallest.day + 'T12:00') + '.';
  else if (sn.isSmallest)
    say = 'Today is the smallest tide of the fortnight ahead — ' + fmt(sn.today.range, 1) +
      ' ft between the day’s highest water and its lowest. The biggest in that window is ' +
      fmt(sn.biggest.range, 1) + ' ft, on ' + dayLocal(sn.biggest.day + 'T12:00') + '.';
  else
    say = 'Today the water covers ' + fmt(sn.today.range, 1) +
      ' ft between its highest and its lowest. Across the fortnight ahead that runs from ' +
      fmt(sn.smallest.range, 1) + ' ft on ' + dayLocal(sn.smallest.day + 'T12:00') +
      ' to ' + fmt(sn.biggest.range, 1) + ' ft on ' + dayLocal(sn.biggest.day + 'T12:00') + '.';
  /* The convention named, once, so the words on the screen connect to the
     words used on the bank — and named as the CONVENTION rather than as a
     classification this app is making. */
  if (sn.band === 'spring') say += ' That is the big end of the cycle, the one called springs.';
  else if (sn.band === 'neap') say += ' That is the small end of the cycle, the one called neaps.';
  box.appendChild(el('p', { class:'note', text:say }));

  var narrow = window.matchMedia && window.matchMedia('(max-width:620px)').matches;
  var W = narrow ? 320 : 520, H = 74, pad = 2;
  var n = sn.days.length;
  var bw = Math.max(4, (W - pad * 2) / n - 2);
  var maxR = sn.biggest.range;
  var fig = svg('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%',
    preserveAspectRatio:'xMinYMin meet', style:'height:auto; display:block',
    role:'img', 'aria-label':say });
  var g = svg('g', {});
  sn.days.forEach(function(d, i){
    var x = pad + i * ((W - pad * 2) / n);
    var h = Math.max(1, (d.range / maxR) * (H - 26));
    var isToday = d.day === sn.today.day;
    g.appendChild(svg('rect', { x:x, y:(H - 16) - h, width:bw, height:h,
      fill: isToday ? FLOOD : '#2E7C76',
      'fill-opacity': isToday ? '.95' : '.55' }));
    /* Only today's is labelled. Sixteen dates at 8px is a smear, and the
       biggest and the smallest are named in the sentence above. */
    if (isToday){
      var lb = svg('text', { x:x + bw / 2, y:H - 5, fill:FLOOD, 'font-size':'9',
        'text-anchor':'middle' });
      lb.textContent = 'today ' + fmt(d.range, 1) + ' ft';
      g.appendChild(lb);
    }
  });
  fig.appendChild(g);
  box.appendChild(fig);

  /* AND THE LIMIT OF IT. The swing is the astronomical tide at one station;
     what actually moves where somebody is standing is that plus whatever the
     river is carrying, and this app knows the two separately and must not let
     a tall bar imply the second. */
  box.appendChild(el('p', { class:'note',
    text:'One bar a day, for the sixteen days of predictions this app holds — not the biggest of the month or the year, and it says the fortnight because that is what it can see. It is the swing at this station and nothing else: what the water does where you are standing is that plus whatever the river is carrying, and a big swing on a river in flood is not the same afternoon as a big swing on a low one.' }));
  return box;
}

/* The strip itself. An arrow that means rising or falling, the sentence that
   says the same thing, and — under it — the line that keeps this honest: it is
   a level prediction at one station, not a current where you are standing. */
function tidePhaseBox(river, stationName){
  var ph = tidePhase(river);
  if (!ph) return null;
  var box = el('div',{class:'tidephase'});
  box.style.borderLeftColor = ph.rising ? FLOOD : EBB;

  /* THE ARROW IS DECORATION AND IS MARKED AS SUCH. Everything it means is in
     the sentence beside it, so a reader who cannot see it loses nothing —
     and a reader who can is not told the same thing twice out loud. */
  var a = svg('svg',{ viewBox:'0 0 14 20', width:'12', height:'17',
    class:'arr', 'aria-hidden':'true', focusable:'false' });
  var col = ph.rising ? FLOOD : EBB;
  a.appendChild(svg('line',{ x1:'7', y1: ph.rising ? '19' : '1',
    x2:'7', y2: ph.rising ? '5' : '15', stroke:col, 'stroke-width':'2.4',
    'stroke-linecap':'round' }));
  a.appendChild(svg('path',{ d: ph.rising ? 'M7 1 L13 8 L1 8 Z' : 'M7 19 L13 12 L1 12 Z',
    fill:col }));
  box.appendChild(a);

  var t = el('div',{class:'grow'});
  t.appendChild(el('span',{class:'say',text:tidePhaseWords(ph, stationName)}));
  /* HOW FAR THROUGH THE SWING. "Rising" with four hours to run and "rising"
     with twenty minutes left are the same word about two different
     afternoons, and the reader is the one who has to plan around it. */
  var pct = ph.through === null ? null : Math.round(ph.through * 100);
  var sub = 'A prediction of the water LEVEL at one station, not the current where you are standing — the water can still be running one way while the level goes the other, and the tide turns hours apart between the top of this reach and the bottom.';
  if (pct !== null)
    sub = (pct < 15 ? 'Just turned. ' : pct > 85 ? 'Nearly at the turn. ' : 'About ' + pct + '% through this swing. ') + sub;
  t.appendChild(el('span',{class:'sub',text:sub}));
  box.appendChild(t);
  return box;
}

/* =====================================================================
   SPRINGS AND NEAPS — is today a big tide or a small one.

   After "which way" and "when", this is the question. The swing between high
   and low is not the same every day: it grows and shrinks over about fourteen
   and a half days with the moon, and the difference is large — on this water a
   neap day and a spring day are a couple of feet apart at the same station. A
   big swing moves more water through a channel in the same six hours, which is
   what a bank fisher is actually reading when they talk about the tide being
   "strong" today. Two days both described as "rising, high at 4pm" can be
   completely different afternoons, and nothing in this app said which.

   THE RANGE THAT MATTERS HERE IS THE GREAT DIURNAL ONE. This coast has mixed
   semidiurnal tides: two highs and two lows a day and the pairs are UNEQUAL,
   often by more than a foot. Taking one high minus the next low would report
   whichever pair the arithmetic happened to land on, and would swing about
   from day to day for a reason that is not the moon. The highest high minus
   the lowest low of the day is the span the water actually covers, and it is
   the figure the convention uses.

   IT IS COMPARED AGAINST WHAT WAS FETCHED, AND SAYS SO. The window is sixteen
   days, which contains a biggest and a smallest — enough to place today in the
   cycle, and NOT enough to call it the biggest of the month or the year. The
   app says "in the fortnight ahead" and means exactly that.
   ===================================================================== */

/* One entry per local day in the window, with the span the water covers. A day
   at the edge of the window can hold only part of its turns, which would read
   as an unusually small tide rather than as a clipped day — so a day is only
   counted when it carries at least one high AND one low. */
function tideDayRanges(river){
  var t = state.tides[river.id];
  if (!t || !t.hilo || !t.hilo.length) return [];
  var byDay = {};
  t.hilo.forEach(function(h){
    var v = Number(h.v);
    if (!isNum(v)) return;
    var iso = String(h.t).replace(' ', 'T');
    var when = new Date(iso);
    if (!isFinite(when.getTime())) return;
    var key = iso.slice(0, 10);
    var d = byDay[key] || (byDay[key] = { day:key, hi:null, lo:null, n:0 });
    d.n++;
    if (h.type === 'H'){ if (d.hi === null || v > d.hi) d.hi = v; }
    else               { if (d.lo === null || v < d.lo) d.lo = v; }
  });
  /* A CLIPPED DAY IS NOT A SMALL TIDE. The first and last days of any window
     hold only part of their turns, and a day carrying one high and one low
     when it really had four reports a span the water never stopped at — which
     would read as a neap and sit at the bottom of the chart. A mixed
     semidiurnal day has four turns; three is the floor that keeps the genuine
     three-turn days and refuses the clipped ones. The request begins the day
     BEFORE today for exactly this reason, so today is never the clipped one. */
  return Object.keys(byDay).sort().map(function(k){ return byDay[k]; })
    .filter(function(d){ return d.hi !== null && d.lo !== null && d.n >= 3; })
    .map(function(d){ d.range = d.hi - d.lo; return d; });
}

/* Where today sits between the smallest and the biggest day in the window.
   Returns nothing rather than a guess when the window is too short to hold a
   cycle, or when every day in it is the same size — both of which would make
   "bigger than average" a statement about rounding. */
function springNeap(river){
  var days = tideDayRanges(river);
  if (days.length < 6) return null;
  var todayKey = (function(){
    var n = new Date();
    return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) +
           '-' + ('0' + n.getDate()).slice(-2);
  })();
  var today = null;
  days.forEach(function(d){ if (d.day === todayKey) today = d; });
  if (!today) return null;
  var biggest = days[0], smallest = days[0];
  days.forEach(function(d){
    if (d.range > biggest.range) biggest = d;
    if (d.range < smallest.range) smallest = d;
  });
  var spread = biggest.range - smallest.range;
  /* Under half a foot between the biggest and smallest day there is no cycle
     to speak of, and calling one of them a spring tide would be naming noise. */
  if (!(spread > 0.5)) return null;
  var frac = (today.range - smallest.range) / spread;
  return {
    days: days, today: today, biggest: biggest, smallest: smallest,
    spread: spread, frac: frac,
    /* The plain words, and they are deliberately about THIS WINDOW. */
    band: frac >= 0.8 ? 'spring' : frac <= 0.2 ? 'neap' : 'between',
    isBiggest: today.day === biggest.day,
    isSmallest: today.day === smallest.day,
    windowDays: days.length
  };
}

/* WHICH WAY THE TIDE IS MOVING RIGHT NOW, which is not the same question as
   which way it flows in.

   Everything this app said about the tide was a DIRECTION IN SPACE — the sea
   is downstream, the flood pushes upstream, the wash on the ribbon marks how
   far. All of that is true of the tide in general and none of it tells a
   person standing on a bank at four in the afternoon whether the water in
   front of them is coming up or going down. That is a direction IN TIME, and
   it is the one a fisher plans the next two hours around.

   It is arithmetic on the highs and lows already fetched: between a low and
   the next high the water is rising, between a high and the next low it is
   falling. No new request, and it works with no signal — the predictions are
   brought down a week ahead.

   WHAT IT IS NOT. It is a PREDICTION, at ONE STATION, of the water LEVEL. It
   is not a statement about which way the current is running where you are:
   the water can still be running upstream after high water while the level
   falls, and on this river the tide turns hours apart between the top of a
   reach and the bottom. The measured answer to "which way is the water
   going" is the velocity figure further down, and where the two disagree the
   water is the authority. Both are shown and each says which it is.

   RANGE IS PART OF THE ANSWER. A rise of half a foot and a rise of five feet
   are both "rising" and are not the same afternoon. */
function tidePhase(river){
  var t = state.tides[river.id];
  if (!t || !t.hilo || !t.hilo.length) return null;
  var now = Date.now(), prev = null, next = null;
  for (var i = 0; i < t.hilo.length; i++){
    var when = new Date(t.hilo[i].t.replace(' ','T')).getTime();
    if (!isFinite(when)) continue;
    if (when <= now){ prev = { at:when, type:t.hilo[i].type, v:t.hilo[i].v }; }
    else { next = { at:when, type:t.hilo[i].type, v:t.hilo[i].v }; break; }
  }
  /* WITHOUT THE TURN BEHIND IT THERE IS NO PHASE TO STATE. Stored predictions
     can begin after the last turn, and inferring the direction from the next
     turn alone would be right by luck. */
  if (!next || !prev) return null;
  var rising = next.type === 'H';
  /* The two turns disagreeing about which is higher is a broken prediction,
     not a tide. Better to say nothing than to draw an arrow from it. */
  if (isNum(prev.v) && isNum(next.v)){
    if (rising && next.v <= prev.v) return null;
    if (!rising && next.v >= prev.v) return null;
  }
  var span = next.at - prev.at;
  return {
    rising: rising,
    from: prev, to: next,
    /* How far through the swing, so "rising" can be "just started" or
       "nearly there" — a fisher with an hour left of flood is in a different
       afternoon from one with four. */
    through: span > 0 ? Math.max(0, Math.min(1, (now - prev.at) / span)) : null,
    range: (isNum(prev.v) && isNum(next.v)) ? Math.abs(next.v - prev.v) : null,
    minutes: Math.round((next.at - now) / 60000)
  };
}

/* The same thing in a sentence, because an arrow is not a sentence and this
   has to be readable by something that cannot see the arrow. */
function tidePhaseWords(ph, station){
  if (!ph) return '';
  var mins = ph.minutes, when = mins < 60
    ? mins + (mins === 1 ? ' minute' : ' minutes')
    : Math.floor(mins / 60) + 'h' + (mins % 60 ? ' ' + (mins % 60) + 'm' : '');
  return 'The tide is ' + (ph.rising ? 'rising' : 'falling') +
    (ph.range !== null ? ' — ' + fmt(ph.range, 1) + ' ft between this turn and the next' : '') +
    ', ' + (ph.rising ? 'high' : 'low') + ' water in ' + when +
    (station ? ', predicted at ' + station : '') + '.';
}

/* The next turn, from the predictions already fetched. */
function nextTurn(river){
  var t = state.tides[river.id];
  if (!t || !t.hilo || !t.hilo.length) return null;
  var now = Date.now();
  for (var i = 0; i < t.hilo.length; i++){
    var when = new Date(t.hilo[i].t.replace(' ','T'));
    if (when.getTime() > now)
      return { type: t.hilo[i].type === 'H' ? 'high' : 'low',
               at: when, v: t.hilo[i].v };
  }
  return null;
}

/* How many of this river's reaches are open today. */
function seasonState(river){
  if (!river.reaches.length) return { text:'season not confirmed', tone:'unknown' };
  var open = 0;
  river.reaches.forEach(function(rc){
    var now = new Date();
    for (var i = 0; i < rc.windows.length; i++){
      if (now >= new Date(rc.windows[i][0] + 'T00:00') &&
          now <= new Date(rc.windows[i][1] + 'T23:59')) { open++; return; }
    }
  });
  if (open === 0) return { text:'closed', tone:'shut' };
  if (open === river.reaches.length)
    return { text:'open · ' + open + (open === 1 ? ' reach' : ' reaches'), tone:'open' };
  return { text:open + ' of ' + river.reaches.length + ' reaches open', tone:'part' };
}

function riverCard(river){
  var season = seasonState(river);
  var temp = meanTemp(river);
  var flow = downstreamFlow(river);
  var turn = river.tidal ? nextTurn(river) : null;
  var ph   = river.tidal ? tidePhase(river) : null;
  var sn   = river.tidal ? springNeap(river) : null;
  var payload = state.gauges[river.id];

  var card = el('button',{ type:'button', class:'rivercard' });
  var top = el('div',{class:'rc-top'});
  top.appendChild(el('span',{class:'rc-name',text:river.name}));
  var chip = el('span',{class:'rc-season',text:season.text});
  chip.style.color = season.tone === 'open' ? '#9BD98C'
                   : season.tone === 'shut' ? '#E76F9F'
                   : season.tone === 'part' ? '#C9A96A' : '#9FB3B1';
  top.appendChild(chip);
  card.appendChild(top);

  /* The Feather's gauges are CDEC's and CDEC is the slowest of the four
     services. When it does not answer, this card read "no thermometer
     reporting / no flow reading" — which describes a river with no
     instruments on it, not a request that failed. Say which it is. */
  var mute = payload ? payload.rows.filter(function(r){
    return !r.context && r.declared && r.error; }).length : 0;

  var t = el('div',{class:'rc-temp'});
  var deg = el('span',{class:'rc-deg', text: temp ? fmt(temp.f,0) + 'F' : '—'});
  if (temp) deg.style.color = tempColour(temp.f);
  t.appendChild(deg);
  t.appendChild(el('span',{class:'rc-read',
    text: temp ? (tempReading(temp.f) || '')
        : !payload ? 'still asking'
        : mute ? 'gauges did not answer' : 'no thermometer reporting'}));
  card.appendChild(t);
  if (temp) card.appendChild(el('div',{class:'rc-line',
    text:'mean of ' + temp.n + (temp.n === 1 ? ' gauge' : ' gauges')}));

  /* The tide line below this one is a PREDICTION. This is a measurement of
     what the water is doing at this moment, which on a tidal reach is a
     different and better answer to the same question. */
  if (river.tidal && payload){
    var moving = payload.rows.filter(function(r){ return !r.context && isNum(r.vel); });
    if (moving.length){
      var down = moving.filter(function(r){ return r.vel >= 0; }).length;
      var up   = moving.length - down;
      var fastest = moving.slice().sort(function(a,b){
        return Math.abs(b.vel) - Math.abs(a.vel); })[0];
      var line = el('div',{class:'rc-line'});
      line.appendChild(el('b',{text: up === 0 ? 'running downstream'
        : down === 0 ? 'running upstream' : 'running both ways'}));
      line.appendChild(document.createTextNode(
        up === 0 || down === 0
          ? ' at up to ' + fmt(Math.abs(fastest.vel),2) + ' ft/s, measured now'
          : ' — ' + up + ' of ' + moving.length + ' gauges read upstream, measured now'));
      card.appendChild(line);
    }
  }

  var turb = meanTurb(river);
  if (turb) card.appendChild(el('div',{class:'rc-line',
    text: turbReading(turb.f) + ' — ' + fmt(turb.f,1) + ' FNU across ' +
      turb.n + (turb.n === 1 ? ' gauge' : ' gauges')}));
  else if (payload && !mute) card.appendChild(el('div',{class:'rc-line note',
    text:'no turbidity sensor on this river'}));

  var fl = el('div',{class:'rc-line'});
  if (flow && flow.tidal){
    /* Nothing above the tide on this river, so the number swings with it. */
    fl.appendChild(el('b',{text:commas(fmt(flow.flow,0))}));
    fl.appendChild(document.createTextNode(' cfs at ' + flow.name +
      ' — tidal flow, not what the river is carrying'));
  } else if (flow){
    fl.appendChild(el('b',{text:commas(fmt(flow.flow,0))}));
    fl.appendChild(document.createTextNode(' cfs at ' + flow.name));
  } else if (payload && payload.rows.length){
    fl.appendChild(document.createTextNode(mute
      ? mute + (mute === 1 ? ' gauge on this river did' : ' gauges on this river did') +
        ' not answer, so there is no flow figure — not that the river has none'
      : 'no flow reading'));
  } else {
    fl.appendChild(document.createTextNode('still asking…'));
  }
  card.appendChild(fl);

  if (river.tidal){
    var td = el('div',{class:'rc-line'});
    if (turn){
      /* WHICH WAY IT IS MOVING, BEFORE WHEN IT NEXT TURNS. The card said
         "next H 16:42" and left the reader to work out that the water is
         therefore coming up — which is the fact they wanted and the one the
         card did not state. The arrow is decoration; the word carries it. */
      if (ph){
        var pw = el('span',{text: ph.rising ? '↑ rising ' : '↓ falling '});
        pw.style.color = ph.rising ? FLOOD : EBB;
        td.appendChild(pw);
        td.appendChild(document.createTextNode('· '));
      }
      td.appendChild(document.createTextNode('next ' + turn.type + ' '));
      td.appendChild(el('b',{text:clockLocal(turn.at.toISOString())}));
      td.appendChild(document.createTextNode(' · ' + fmt(turn.v,1) + ' ft'));
      /* AND HOW BIG TODAY IS. Only at the ends of the cycle: a card is four
         lines and "in the middle of the fortnight" is not worth one of them,
         where "biggest of the fortnight" changes what somebody does today. */
      if (sn && (sn.isBiggest || sn.isSmallest))
        td.appendChild(el('span',{class:'rdg-id',
          text:(sn.isBiggest ? 'biggest' : 'smallest') + ' swing of the fortnight, ' +
            fmt(sn.today.range,1) + ' ft'}));
    } else {
      td.appendChild(document.createTextNode('tidal — no prediction loaded'));
    }
    card.appendChild(td);
  }

  card.setAttribute('aria-label', river.name + '. ' + season.text + '. ' +
    (temp ? fmt(temp.f,0) + ' degrees, ' + (tempReading(temp.f) || '') + ' ' : '') +
    (flow ? commas(fmt(flow.flow,0)) + ' cubic feet per second at ' + flow.name +
       (flow.tidal ? ', tidal flow rather than river discharge' : '') + '. ' : '') +
    (ph ? 'The tide is ' + (ph.rising ? 'rising' : 'falling') + '. ' : '') +
    (sn ? 'Today the water covers ' + fmt(sn.today.range,1) + ' feet' +
      (sn.isBiggest ? ', the biggest swing of the fortnight ahead' :
       sn.isSmallest ? ', the smallest swing of the fortnight ahead' : '') + '. ' : '') +
    (turn ? 'Next ' + turn.type + ' at ' + clockLocal(turn.at.toISOString()) + '. ' : '') +
    'Show this river.');
  card.addEventListener('click', function(){
    selectRiver(river.id);
    selectTab('water');
  });
  return card;
}

/* HOW MANY RIVERS THERE ARE, ASKED OF THE RIVER LIST.

   Every sentence in this app that named a number named FOUR, and there have
   been five entries since the Delta arrived. The landing page said "Four
   rivers, one temperature scale"; the note explaining a dropped ribbon said
   "four rows of it will not fit"; the Home button offered to take you "back to
   all four rivers". Each was correct when written and none of them was wrong
   in a way anybody could see by reading the file — the number lived in the
   prose and the truth lived in an array two thousand lines away.

   So the prose asks. `tools/copy-count.mjs` refuses a hardcoded count in
   reader-facing copy, because a rule in a comment is what this repo has just
   demonstrated does not hold.

   AND THIS PARAGRAPH SPENT SEVERAL RELEASES NAMING A GATE THAT DID NOT EXIST.
   The comment was written with the fix and the script was not, so the rule was
   back to being a paragraph — and the first-run page and the About panel both
   went on saying "four rivers" and naming them by hand, four sentences apart
   in two functions, neither aware the table was there. The gate exists now and
   runs on every commit and in CI. On the run that added it, it found two more:
   the Home button's spoken announcement, which said four while the button's own
   label beside it asked the list, and the water-clarity key, which was a typed
   second copy of TURB_BANDS.

   The Delta is counted apart on purpose: it is where the four arrive, not a
   fifth of them, and a sentence calling it a river would be a different
   defect from the one being fixed. */
/* THE WAY TO PICK A RIVER, offered where the reader is rather than as an
   instruction to go and find a control. Two panels refuse to do their job
   without a river — Depth and Marks — and both said so and then left the
   reader to work out where the choosing happens. */
/* The one sentence that explains a missing ribbon, owned by neither renderer
   and written by whichever ran last. */
/* The fade goes when there is nothing more to reach, so the last row is not
   left permanently dimmed by a hint about content that is already on screen. */
function markRibbonScrollEnd(){
  var wrap = document.getElementById('ribbonwrap');
  if (!wrap) return;
  var more = wrap.scrollHeight - wrap.clientHeight - wrap.scrollTop;
  wrap.classList.toggle('atend', more <= 4);
}

function syncRibbonDropNote(){
  var slot = document.getElementById('ribbondropped');
  if (!slot) return;
  var wrap = document.getElementById('ribbonwrap');
  var dropped = !!(wrap && wrap.hidden);
  slot.hidden = !dropped;
  /* AND WHEN IT IS DROPPED, THE ADVICE HAS TO MATCH THE SCREEN IT IS ON.

     The band is bounded by HEIGHT, and a phone held sideways has about two
     hundred pixels of it — less than the same phone upright, not more. A
     reader who turns the phone to get more room is reaching for the wrong
     axis, and the note used to tell them only that the screen was short,
     which is exactly the thing rotating feels like it should fix. */
  /* WHAT IS BEHIND IT, NOT THAT SOMETHING IS MISSING.

     The old sentence said the rows would not fit and told the reader to pick a
     single river — an apology and a detour. It never said what the band is
     FOR, so a reader who had never seen it on a big screen had no idea there
     was anything to want. Content you cannot see and cannot know to look for
     is content that is not there, and that was true of the whole comparison,
     not just the rows below a fold.

     So this names the three things only the stacked view gives, and says they
     are one press away at full size. The button sits directly under it. */
  var n = ribbonRowCount();
  slot.textContent = dropped
    ? countWord(n).charAt(0).toUpperCase() + countWord(n).slice(1) +
      ' rivers side by side — the water temperature along each one, how far up ' +
      'the tide reaches, and where every gauge sits. There is not the height for ' +
      'them here at a size worth reading. Turned sideways they fit at full size, ' +
      'all of them at once.'
    : '';
}

/* =====================================================================
   THE SIDEWAYS VIEW — the picture turns, because the phone cannot be turned.

   Asked for as "a button that rotates the screen without the user having to
   turn on landscape". A web page cannot do that on this hardware and the check
   is not a memory: Safari's engine reports no `screen.orientation.lock` at all,
   and Chromium's throws NotSupportedError. A button calling it would be a
   control that does nothing, which is the defect this app has a rule about.

   Rotating the drawing instead is not a consolation prize. A portrait phone
   turned this way gives the bars the whole long side of the screen — 844 by
   390 on an iPhone 13 — where physically rotating the same phone gives them
   844 by 242, because the browser keeps its chrome and portrait has more
   screen left to spare. Five rows at full height need about 350 of those 390.
   ===================================================================== */
/* The offer follows the DRAW, not the render, for the same reason the note
   explaining a dropped band does: these two run in no fixed order, and a test
   made at render time reads whatever the last draw happened to leave. */
function syncSidewaysOffer(){
  var row = document.getElementById('swopen');
  if (!row) return;
  row.hidden = !sidewaysFits();
}

function sidewaysFits(){
  /* Offered where it helps, which is wider than "the band gave up".
     A band that squeezed its rows down to the legibility floor to get them all
     in is showing every river at 22px when the sideways view would show them
     at 44 — cramped is a reason to offer this, not just incomplete. On a tall
     screen where the rows are already at their natural height it changes
     nothing and is not offered, because a control that changes nothing is
     clutter. */
  return !!(RIB && (RIB.scrolls || RIB.tooTight ||
                    (isNum(RIB.natural) && RIB.rowH < RIB.natural)));
}

function openSideways(){
  var d = $('#sideways');
  if (!d || typeof d.showModal !== 'function') return;
  d.showModal();
  drawSideways();
  var c = $('#swclose');
  if (c) c.focus();
  announce('The rivers, drawn sideways. Press Done to go back.');
}

function drawSideways(){
  var host = $('#swribbon');
  if (!host) return;
  /* THE NOTE FIRST, because it is one of the two things deciding how tall the
     drawing's box is. Written after, the measurement below is of a box that is
     about to change — the same stale-furniture defect the upright band's own
     budget had, and it showed here as thirty pixels of overflow in a view
     whose entire purpose is fitting everything on one screen. */
  var n = $('#swnote');
  if (n) n.textContent =
    'Downstream on the left, all ' + countWord(ribbonRowCount()) +
    ' to one distance scale. This turns the picture, not the phone — a web page cannot rotate the screen itself on this device. Pressing a river is on the upright view.';

  /* The rotated box is as wide as the screen is TALL, and as tall as it is
     wide. Measured off the container rather than computed from innerHeight and
     innerWidth, so the browser's own chrome and the safe-area insets are
     already taken out of both. */
  var body = $('#swbody');
  var W = Math.max(320, Math.round((body && body.clientWidth) || window.innerHeight || 640));
  var H = Math.round((body && body.clientHeight) || 0);

  /* RIB IS A GLOBAL AND THIS DRAW WOULD LEAVE ITS OWN NUMBERS IN IT.
     Everything that asks "did the upright band have room" — the note under a
     dropped ribbon, the offer of this very view — reads that global, and after
     a sideways draw it describes a rotated canvas the size of the whole
     screen. The band would come back believing it had all the room in the
     world. One drawing with two hosts has to leave the state of the first
     alone; borrowing it and putting it back is the whole of that. */
  var keep = RIB;
  try { drawRibbon(undefined, { host: host, W: W, budget: H > 80 ? H : null }); }
  finally { RIB = keep; }
}

function pickRiverRow(){
  var row = el('div',{class:'rowline'});
  var b = el('button',{type:'button',text:'Choose a river'});
  b.addEventListener('click', function(){
    selectTab('water');
    var w = $('#panel-water');
    if (w) w.scrollTop = 0;
    announce('Pick a river from the cards.');
    var first = w && w.querySelector('.rivercard');
    if (first) first.focus();
  });
  row.appendChild(b);
  return row;
}
function initialCap(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
var COUNTWORDS = ['no','one','two','three','four','five','six','seven','eight','nine','ten'];
function countWord(n){ return COUNTWORDS[n] || String(n); }
function riverCount(){ return RIVERS.filter(function(r){ return !r.network; }).length; }
function networkCount(){ return RIVERS.filter(function(r){ return r.network; }).length; }
/* "four rivers", from the list itself. */
function riverCountPhrase(){
  var n = riverCount();
  return countWord(n) + ' river' + (n === 1 ? '' : 's');
}
/* THE PROSE THAT DESCRIBES THIS APP IS BUILT FROM THE RIVER TABLE, NOT TYPED
   BESIDE IT. The first-run page and the About panel both opened with "four
   rivers" and then named them, four sentences apart in two functions, and
   neither knew the table existed. Add a river and both keep saying four; the
   app is then one file with two answers, which is the exact defect the ribbon
   copy already routes through countWord() to avoid. `tools/a11y.mjs` holds the
   rendered copy to this table on every run so it cannot drift back. */
function riverNamesPhrase(){
  return joinNames(RIVERS.filter(function(r){ return !r.network; })
    .map(function(r){ return 'the ' + r.short; }));
}
function networkNamesPhrase(){
  return joinNames(RIVERS.filter(function(r){ return r.network; })
    .map(function(r){ return r.name.replace(/^The /, 'the '); }));
}
/* A river that is not the first one, for the sentence that contrasts one
   against the rest. Naming it in prose pins it to the table the same way. */
function otherRiverExample(){
  var list = RIVERS.filter(function(r){ return !r.network; });
  return (list[1] || list[0] || { short:'river' }).short;
}
function joinNames(names){
  if (!names.length) return '';
  if (names.length === 1) return names[0];
  return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
}
/* "four rivers" or "four rivers and the Delta", from the list itself. */
function riversPhrase(){
  var k = networkCount();
  var base = riverCountPhrase();
  if (!k) return base;
  var names = RIVERS.filter(function(r){ return r.network; })
    .map(function(r){ return r.short; });
  return base + ' and ' + (names.length === 1 ? 'the ' + names[0].replace(/^The /, '')
                                              : names.join(' and '));
}
/* Every row the ribbon draws, which is not the same number. */
function ribbonRowCount(){ return RIVERS.length; }

function renderWater(){
  var p = $('#panel-water'); p.innerHTML = '';

  if (!state.riverId){
    p.appendChild(el('h2',{class:'sec',text:'Which river'}));
    /* A container so the four can sit side by side on a wide screen. On a
       phone it is a plain block and the cards stack exactly as before. */
    /* THE DELTA IS NOT A FIFTH RIVER AND IS NOT PUT IN THE ROW OF THEM.
       Four cards make rows that divide evenly; a fifth leaves an orphan on
       every phone width, which is a layout defect this repo already went and
       fixed once. But the real reason is not the arithmetic: it is where the
       four rivers END, not another of them, and a card sitting in line with
       the Sacramento would say otherwise. It gets its own full-width card
       underneath, which is also room to say what it is. */
    var grid = el('div',{class:'rivergrid'});
    RIVERS.filter(function(r){ return !r.network; })
      .forEach(function(river){ grid.appendChild(riverCard(river)); });
    p.appendChild(grid);
    RIVERS.filter(function(r){ return r.network; }).forEach(function(river){
      var c = riverCard(river);
      c.classList.add('networkcard');
      p.appendChild(c);
    });
    /* This read RIVERS[0] and said "these" about all four, so one river's
       bad minute captioned three rivers of live readings. */
    var old = RIVERS.filter(function(r){ return looksOld(state.gauges[r.id]); });
    if (old.length) p.appendChild(el('div',{class:'warnbox',
      text: (old.length === RIVERS.length
              ? 'These are stored readings — the network did not answer.'
              : 'Stored readings for ' + old.map(function(r){ return r.short; }).join(' and ') +
                ' — those did not answer. The rest are current.') +
            ' Ages are in the header.'}));
    p.appendChild(el('p',{class:'note',
      text: initialCap(riversPhrase()) + ', one temperature scale, in a fixed order. Thalweg does not rank them: reading a thermometer against a threshold is one thing, and telling you where the fishing will be better is a forecast it has no basis for.'}));
    p.appendChild(el('p',{class:'note',
      text:'Tap a river for its tide, its gauges one by one, its published depth surveys and your own marks.'}));
    /* Dropping a view silently is the thing this app is not allowed to do.
       Four ribbon rows at a legible size do not fit above the cards on a
       short screen, and the cards carry more of the answer, so the ribbon
       goes — and says it went, at the bottom, where saying it costs nothing
       above the fold. */
    /* A SLOT, NOT A DECISION. Whether the ribbon fits is settled by
       `drawRibbon`, and the two do not run in a fixed order: this panel can be
       rendered BEFORE the draw that hides the band, in which case a test for
       `hidden` here reads false and the explanation is never written. The
       ribbon then vanishes with nothing said about it, which is the one thing
       this app is not allowed to do — and it is exactly what happened the
       moment the band stopped being hidden on its very first pass.
       So the slot is always here and `syncRibbonDropNote` fills or empties it
       from whichever of the two ran last. */
    p.appendChild(el('p',{class:'note',id:'ribbondropped',hidden:'hidden'}));
    syncRibbonDropNote();
    /* AND THE WAY TO SEE THEM ALL ANYWAY. Where the upright band cannot show
       every row — scrolled, or dropped altogether on a screen with no height
       to give — the picture can be turned instead of the phone. The button
       exists only in that case: on a tall screen every row is already there
       and a control that changes nothing is clutter. */
    var swrow = el('div',{class:'rowline',id:'swopen'});
    var swb = el('button',{type:'button',
      text:'\u21bb  See all ' + countWord(ribbonRowCount()) + ' sideways'});
    swb.addEventListener('click', openSideways);
    swrow.appendChild(swb);
    p.appendChild(swrow);
    syncSidewaysOffer();
    return;
  }

  var rivers = [byId(state.riverId)];

  rivers.forEach(function(river){
    if (rivers.length > 1) p.appendChild(el('h2',{class:'sec',text:river.name}));

    if (river.tidal){
      if (rivers.length === 1) p.appendChild(el('h2',{class:'sec',text:'Tide'}));
      p.appendChild(tideSection(river));
      /* THE TIDE AT A PLACE, THEN THE TIDE ALONG THE RIVER. The section above
         predicts the water level at one station; this one shows which way the
         water is actually running at every gauge that measures it, in river
         order. They answer different questions and the second was missing. */
      if (rivers.length === 1)
        p.appendChild(el('h2',{class:'sec',text:'The tide along the river'}));
      p.appendChild(tideAlongRiver(river));
    }

    if (rivers.length === 1) p.appendChild(el('h2',{class:'sec',text:'Gauges'}));
    var payload = state.gauges[river.id];
    if (!payload){
      p.appendChild(el('p',{class:'note',text:'Loading…'}));
    } else if (payload.failed){
      p.appendChild(el('div',{class:'warnbox',
        text:'No reading reached this device and nothing was stored earlier. Flow, stage and temperature are unknown, not zero.'}));
    } else {
      if (payload.noData) p.appendChild(el('div',{class:'warnbox',
        text:'Nothing answered this time. Every row below is what the request came back with, not a reading.'}));
      if (looksOld(payload) && !payload.noData) p.appendChild(staleBox(payload));
      var onRiver = payload.rows.filter(function(r){ return !r.context; });
      var tribs   = payload.rows.filter(function(r){ return r.context; });
      if (!onRiver.length && river.noLiveGauges)
        p.appendChild(el('div',{class:'warnbox', text:river.noLiveGauges}));
      if (onRiver.length && river.gaugeSourceNote)
        p.appendChild(el('p',{class:'note', text:river.gaugeSourceNote}));
      onRiver.forEach(function(r){ p.appendChild(gaugeRow(r)); });
      if (!onRiver.length && !river.noLiveGauges)
        p.appendChild(el('p',{class:'note',text:'No gauge answered for this reach.'}));
      if (tribs.length){
        p.appendChild(el('h2',{class:'sec',text:'Tributaries, not this river'}));
        tribs.forEach(function(r){ p.appendChild(gaugeRow(r)); });
      }
      if (river.discover && !state.swept[river.id] && !sget(river.id,'found')){
        var swRow = el('div',{class:'rowline'});
        var swBtn = el('button',{type:'button',text:'Look for gauges this app has not named'});
        swBtn.addEventListener('click', function(){
          swBtn.disabled = true;
          swBtn.textContent = 'Sweeping the basin — about nine seconds…';
          state.swept[river.id] = true;
          loadGauges(river).then(function(payload){
            state.gauges[river.id] = payload;
            renderWater(); drawRibbon(); drawGaugeMarkers(); drawTideMarkers(); updateStaleness();
            announce('Sweep finished.');
          }, function(){
            swBtn.disabled = false;
            swBtn.textContent = 'Look for gauges this app has not named';
          });
        });
        swRow.appendChild(swBtn);
        p.appendChild(swRow);
        p.appendChild(el('p',{class:'note',
          text:'The gauges above are the ones this app names and has checked. USGS will also answer a sweep of the whole basin for anything else reporting — 234KB and about nine seconds, which is why it is a button. Asked once, what it finds is kept.'}));
      }

      if (river.weirs){
        p.appendChild(el('h2',{class:'sec',text:'The weirs'}));
        p.appendChild(weirSection(river));
      }

      p.appendChild(el('h2',{class:'sec',text:'The last seven days'}));
      p.appendChild(trendSection(river));
      drawTrendLines();

      var temps = onRiver.map(function(r){
        return isNum(r.tempF) ? r.tempF : null;
      }).filter(function(v){ return v !== null; });
      if (temps.length){
        var avg = temps.reduce(function(a,b){ return a+b; },0)/temps.length;
        var read = tempReading(avg);
        if (read){
          var box = el('p',{class:'note'});
          box.appendChild(el('span',{class:'swatch',style:'background:'+tempColour(avg)}));
          box.appendChild(document.createTextNode(' ' + read +
            ' (mean of ' + temps.length + ' gauge' + (temps.length===1?'':'s') +
            ', ' + fmt(avg,1) + 'F)'));
          p.appendChild(box);
        }
      }
    }
  });
}

function gaugeRow(r){
  var wrap = el('div',{class:'rdg'});
  var name = el('div',{class:'rdg-name'});
  /* The name shown is the one the API returned. A wrong identifier cannot
     look like a plausible reading from somewhere else. */
  name.appendChild(el('span',{ text: r.name || (r.hint ? '(' + r.hint + ')' : 'unknown site') }));
  name.appendChild(flagEl(r.status));
  name.appendChild(el('span',{class:'rdg-id',
    text:(r.source ? r.source + ' ' : '#') + r.id}));
  /* EVERY GAUGE HAS A POSITION AND THERE WAS NO WAY TO GO TO IT. The app knew
     exactly where each one was and left a reader to find it by panning a map
     that opens on the whole basin. */
  if (isNum(r.lat) && isNum(r.lon)){
    var go = el('button',{class:'gobtn',type:'button',
      title:'Show ' + (r.name || r.id) + ' on the map',
      'aria-label':'Show ' + (r.name || r.id) + ' on the map'});
    go.textContent = 'Map';
    go.addEventListener('click', function(){
      if (tabNames().indexOf('map') !== -1) selectTab('map');
      mapView([[r.lat, r.lon], 14], { animate:!reduceMotion });
      announce('Map centred on ' + (r.name || r.id) + '.');
    });
    name.appendChild(go);
  }
  wrap.appendChild(name);

  if (r.error){
    wrap.appendChild(el('div',{class:'err',
      text: r.error + '. Nothing is shown for this site because nothing is known.'}));
    return wrap;
  }
  var vals = el('div',{class:'rdg-vals'});
  function v(value, dp, unit){
    var s = el('span',{class:'v'});
    s.appendChild(document.createTextNode(fmt(value, dp)));
    s.appendChild(el('small',{text:unit}));
    return s;
  }
  vals.appendChild(v(r.flow, 0, 'cfs'));
  vals.appendChild(v(r.stage, 2, 'ft'));
  var f = isNum(r.tempF) ? r.tempF : null;
  var tv = v(f, 1, 'F');
  if (f !== null) tv.style.color = tempColour(f);
  vals.appendChild(tv);
  /* Only where there is a sensor. A dash in this column would say the water
     is unmeasurably clear rather than that nobody is measuring it, so the
     column is absent instead. */
  if (isNum(r.turb)) vals.appendChild(v(r.turb, 1, 'FNU'));
  if (isNum(r.vel))  vals.appendChild(v(Math.abs(r.vel), 2, 'ft/s'));
  wrap.appendChild(vals);
  if (isNum(r.turb)) wrap.appendChild(el('div',{class:'rdg-id',
    text: turbReading(r.turb) + ' — turbidity, how much the water is carrying'}));
  var vr = velReading(r);
  if (vr) wrap.appendChild(el('div',{class: vr.conflict ? 'err' : 'rdg-id',
    text: vr.text + (vr.conflict ? '' : ' — measured, not predicted')}));
  if (r.at) wrap.appendChild(el('div',{class:'rdg-id',
    text: 'reading ' + clockLocal(r.at) + ', ' + dayLocal(r.at)}));
  return wrap;
}


function discoverBox(river){
  var d = el('details',{class:'foldbox'});
  var sum = el('summary',{});
  var seen = sget(river.id,'tidestations');
  /* A STORED RESULT BELONGS TO THE BUILD THAT ASKED. Before the stations were
     baked in, this button stored every station in the river's bounding box —
     and after the bake shipped, that old list was read back under the new
     question and reported as "NOAA had added 44 since this version was built".
     Forty-four is the number of stations that SHIP with it. A stored answer
     whose meaning changed is not a stale answer, it is a wrong one, so it is
     stamped with the bake it was measured against and ignored otherwise. */
  var bakedAt = (typeof TIDE_STATIONS_META === 'object' && TIDE_STATIONS_META && TIDE_STATIONS_META.fetchedAt) || '';
  var valid = seen && seen.against === bakedAt ? seen : null;

  sum.appendChild(el('b',{text:'Stations NOAA has added since this build'}));
  sum.appendChild(el('span',{class:'note',
    text: valid
      ? (valid.list && valid.list.length
          ? ' \u2014 ' + valid.list.length + ' found'
          : ' \u2014 none, last time it was asked')
      : ' \u2014 not asked yet'}));
  d.appendChild(sum);

  var body = el('div',{class:'foldbody'});
  body.appendChild(el('p',{class:'note',style:'margin-top:0',
    text:'The stations on this river already ship with the app and are on the map \u2014 NOAA was asked once, when this version was built, so you never pay for it. This asks the one thing that file cannot answer: whether NOAA has ADDED any since. It costs a two-megabyte download, because NOAA publishes its list as one file and will not filter it, which is why it is a button rather than something that happens to you. Usually the answer is none.'}));

  var said = el('p',{class:'note'});
  function saidText(res){
    if (!res) return 'Not asked on this build yet.';
    var t = 'Last checked ' + clockLocal(new Date(res.at).toISOString()) + ', ' +
            dayLocal(new Date(res.at).toISOString()) + '. ';
    return t + ((res.list && res.list.length)
      ? 'NOAA had added ' + res.list.length + ' station(s) since this version was built: ' +
        res.list.map(function(x){ return x.name || x.id; }).join(', ') +
        '. They are in the list above and they stay there \u2014 you do not need to do this again.'
      : 'NOAA had added none since this version was built. That is the usual answer, and it is kept, so there is no need to check again unless you want to.');
  }
  said.textContent = saidText(valid);

  var row = el('div',{class:'rowline'});
  var btn = el('button',{type:'button',
    text: valid ? 'Check NOAA again' : 'Check NOAA for stations added since this build'});
  btn.addEventListener('click', function(){
    btn.disabled = true;
    btn.textContent = 'Asking NOAA \u2014 this one is a big file\u2026';
    nearbyTideStations(river).then(function(added){
      loadTideFor(river);
      said.textContent = saidText(sget(river.id,'tidestations'));
      announce(added && added.length
        ? added.length + ' station(s) NOAA has added since this build are now in the list, and they stay there.'
        : 'NOAA has not added any stations on this river since this build. That answer is kept.');
      btn.disabled = false;
      btn.textContent = 'Check NOAA again';
    }, function(e){
      btn.disabled = false;
      btn.textContent = 'Try NOAA again';
      said.textContent = 'NOAA did not answer: ' + (e && e.message || e) +
        ' Nothing changed, and the stations already in the list are unaffected.';
      announce('NOAA did not answer.');
    });
  });
  row.appendChild(btn);
  body.appendChild(row);
  body.appendChild(said);
  d.appendChild(body);
  return d;
}

function tideSection(river){
  var box = el('div',{});
  var t = state.tides[river.id];
  if (!t){ box.appendChild(el('p',{class:'note',text:'Loading tide…'})); return box; }
  if (t.failed){
    box.appendChild(el('div',{class:'warnbox',
      text:'No tide prediction available: ' + t.failed}));
    return box;
  }
  if (t.stations && t.stations.length > 1){
    /* THE TIDE IS PREDICTED AT ONE PLACE AND THE PICKER JUST SAID "Station".
       A reader who has not been told assumes a tide is a property of the
       river; on this water it is not. High water at Rio Vista and high water
       at Freeport are hours apart, so a chart read against the wrong station
       is wrong by more than it looks — and nothing on the screen said which
       station it was for, or that it was a choice worth making. */
    box.appendChild(el('p',{class:'note',style:'margin-top:0',
      text:'These are predictions for one place on the river, not for the river. The tide turns at different times along it \u2014 hours apart between the top of this reach and the bottom \u2014 so pick the station nearest where you will actually be.'}));

    var row = el('div',{class:'rowline'});
    var lab = el('label',{for:'tidestation-'+river.id,text:'Predicted at'});
    var sel = el('select',{id:'tidestation-'+river.id});
    t.stations.forEach(function(s){
      var o = el('option',{value:s.id,text:(s.name||s.id)+' — '+s.id});
      if (s.id === t.station) o.setAttribute('selected','selected');
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){ switchTideStation(river, sel.value); });
    row.appendChild(lab); row.appendChild(sel);
    box.appendChild(row);

    /* AND IF THE APP KNOWS WHERE YOU ARE, IT CAN JUST ANSWER. Where I am
       already put a position on the map; the nearest station to it is the one
       question the picker leaves a reader to solve by knowing the estuary. */
    if (state.here){
      var withPos = t.stations.filter(function(s){ return isNum(s.lat) && isNum(s.lon); });
      if (withPos.length){
        var near = withPos.slice().sort(function(a2, b2){
          return metresBetween(state.here.lat, state.here.lon, a2.lat, a2.lon) -
                 metresBetween(state.here.lat, state.here.lon, b2.lat, b2.lon);
        })[0];
        var away = metresBetween(state.here.lat, state.here.lon, near.lat, near.lon);
        if (near.id === t.station){
          box.appendChild(el('p',{class:'note',
            text:'This is the nearest station to where you are, ' + kmText(away) + ' off.'}));
        } else {
          var nrow = el('div',{class:'rowline'});
          var nbtn = el('button',{type:'button',
            text:'Use ' + (near.name || near.id) + ', ' + kmText(away) + ' from you'});
          nbtn.addEventListener('click', function(){
            switchTideStation(river, near.id);
            announce('Tide now predicted at ' + (near.name || near.id) + '.');
          });
          nrow.appendChild(nbtn);
          box.appendChild(nrow);
        }
      }
    }
  }
  /* Asking NOAA what else is out there costs two megabytes, so it is a
     button rather than something that happens to you. Once pressed, the
     result is kept and the question is not asked again. */
  var st = (t.stations||[]).filter(function(s){ return s.id === t.station; })[0];
  if (st && isNum(st.lat) && isNum(st.lon)){
    var srow = el('div',{class:'rowline'});
    var sgo = el('button',{type:'button',text:'Show this station on the map'});
    sgo.addEventListener('click', function(){
      if (tabNames().indexOf('map') !== -1) selectTab('map');
      mapView([[st.lat, st.lon], 13], { animate:!reduceMotion });
      announce('Map centred on ' + (st.name || st.id) + '.');
    });
    srow.appendChild(sgo);
    box.appendChild(srow);
  }
  var head = el('p',{class:'note'});
  head.appendChild(document.createTextNode(
    (st ? st.name + ' — ' : '') + 'station ' + t.station + ', MLLW. '));
  head.appendChild(flagEl(st ? st.status : PROV.VERIFIED));
  box.appendChild(head);

  /* FIRST, BEFORE THE CHART AND BEFORE THE LIST OF TURNS. Everything this
     panel showed was a direction in SPACE — where the sea is, how far up the
     flood reaches — and a person opening it at four in the afternoon wants a
     direction in TIME: is the water in front of me coming up or going down.
     That was derivable from the highs and lows already on the screen and was
     nowhere stated, which left the reader to do the arithmetic the app had
     already done. */
  var phbox = tidePhaseBox(river, st ? (st.name || st.id) : null);
  if (phbox) box.appendChild(phbox);
  else box.appendChild(el('p',{class:'note',
    text:'Whether the tide is rising or falling right now cannot be said from what is stored: it needs the turn before now as well as the one after it, and the stored predictions start later than that. The turns below are unaffected. Reconnect and it comes back.'}));

  /* AND HOW BIG TODAY IS, which is the question after "which way" and "when".
     It goes with the phase rather than further down: the two together are what
     a person asks the tide panel for, and they are one thought.
     ITS SILENCE IS DIFFERENT FROM THE PHASE'S and gets its own sentence. The
     phase needs two turns; this needs a fortnight of them, so a stored copy
     from a week ago has the first and not the second. */
  var snbox = springNeapBox(river);
  if (snbox) box.appendChild(snbox);
  else box.appendChild(el('p',{class:'note',
    text:'How big today’s tide is against the rest of the fortnight cannot be worked out from what is stored: the swing grows and shrinks over about fourteen days, and there are not enough days of predictions here to place today in that. Everything else on this panel is unaffected.'}));

  if (t.hourlyUnavailable){
    box.appendChild(el('p',{class:'note',
      text:'This station publishes highs and lows only, not an hourly curve. The times below are the turns; the water between them is not published and is not drawn.'}));
  } else {
    box.appendChild(tideChart(t, lightPlace(river, t)));
  }
  /* THE LIGHT DOES NOT DEPEND ON THE CURVE, and putting it inside the branch
     that draws one meant the stations without a curve got no light at all.
     Those are the subordinate stations — New Hope Bridge, Terminous — which
     are the ones somebody on the upper Mokelumne would actually pick, and
     nothing about the sun needs an hourly prediction: the times come from the
     date and the position and the turns come from the highs and lows. The
     shading needs the chart; the words never did.
     It is also the same shape as the caveat that lived inside the branch that
     found an overlap, two functions down and half an hour earlier. */
  var lb = lightBox(river, t);
  if (lb) box.appendChild(lb);
  if (t.offline) box.appendChild(el('p',{class:'note',
    text:'Predictions from store. A prediction is arithmetic about the future, so it is still good; the flow and temperature above are not.'}));

  var now = Date.now(), shown = 0;
  (t.hilo||[]).forEach(function(h){
    var when = new Date(h.t.replace(' ','T'));
    if (when.getTime() < now - 3600000 || shown >= 6) return;
    shown++;
    var r = el('div',{class:'hilo'});
    r.appendChild(el('span',{text:(h.type==='H'?'High':'Low')+' · '+dayLocal(h.t.replace(' ','T'))}));
    var b = el('b',{text:clockLocal(h.t.replace(' ','T'))+'  '+fmt(h.v,1)+' ft'});
    r.appendChild(b);
    box.appendChild(r);
  });
  if (!shown) box.appendChild(el('p',{class:'note',
    text:'No high or low water in the stored window. Reconnect to extend it.'}));
  /* IT WAS PUSHING THE TIDE OFF THE SCREEN. This block explains a button most
     readers will never press, and it sat BETWEEN the station picker and the
     tide itself — so a newcomer opening the tide met four sentences about
     NOAA's file sizes before a single high or low. It is last now, and shut.
     Collapsed, not deleted: what it says is true and somebody will want it. */
  if (river.tideDiscover) box.appendChild(discoverBox(river));

  return box;
}

/* =====================================================================
   FIRST AND LAST LIGHT.

   The convention every tide table for anglers carries and this one did not:
   the change of tide matters differently depending on whether it lands in the
   dark, in the low light at either end of the day, or at noon. A fisher plans
   around the overlap. The app had the tide and had no idea when the light was.

   IT IS ARITHMETIC AND COSTS NOTHING. No request, no service, nothing to go
   stale, and it works offline for any date — which is the opposite of almost
   everything else in this app. The position it is computed for is the tide
   station being read, because that is what the curve beside it is for.

   WHAT IT IS NOT. It is a light calculation, not a fishing forecast. Thalweg
   does not tell anybody where or when the fishing will be better, and naming
   the hours of low light is not that: it is the same kind of fact as the tide
   turning at 4:12. What a fish does about it is not something this app knows.

   ONE EPHEMERIS, TWO ANSWERS. The shading needs the sun's altitude at an
   arbitrary instant; the sentences need the named crossings. Computing those
   from two different formulations is how they come to disagree by four minutes
   and nobody can say which is right, so `sunAltitude` and `sunTimes` share the
   position below and the suite asserts the loop closes: at the sunrise this
   returns, that altitude is the sunrise altitude.
   ===================================================================== */
var DEG = Math.PI / 180;
var OBLIQ = 23.4397;                 /* obliquity of the ecliptic */
var ALT_SUN   = -0.833;              /* upper limb, refracted: sun up / down */
var ALT_CIVIL = -6;                  /* civil twilight: first / last light */

function daysSinceJ2000(d){ return d.valueOf() / 86400000 - 10957.5; }

/* Where the sun is on the ecliptic for a given instant. */
function solarEcliptic(days){
  var M = (357.5291 + 0.98560028 * days) % 360;
  var C = 1.9148 * Math.sin(M * DEG) + 0.0200 * Math.sin(2 * M * DEG)
        + 0.0003 * Math.sin(3 * M * DEG);
  var L = (M + C + 180 + 102.9372) % 360;
  return { M:M, L:L, decl: Math.asin(Math.sin(L * DEG) * Math.sin(OBLIQ * DEG)) / DEG };
}

/* How high the sun is, in degrees, at one instant and one place. */
function sunAltitude(date, lat, lon){
  var d = daysSinceJ2000(date), e = solarEcliptic(d);
  var ra = Math.atan2(Math.sin(e.L * DEG) * Math.cos(OBLIQ * DEG),
                      Math.cos(e.L * DEG)) / DEG;
  /* Greenwich mean sidereal time, plus the longitude, minus the sun's right
     ascension, is the hour angle. */
  var H = (280.16 + 360.9856235 * d + lon - ra) * DEG;
  return Math.asin(Math.sin(lat * DEG) * Math.sin(e.decl * DEG) +
                   Math.cos(lat * DEG) * Math.cos(e.decl * DEG) * Math.cos(H)) / DEG;
}

/* The named crossings for the local day containing `date`.

   LONGITUDE IS EAST-POSITIVE, which is the sign this app already carries, and
   the correction is applied ONCE. Applying it in both the day number and the
   noon estimate put every time eight hours out on the first attempt — and the
   declination and the day length were both correct throughout, which is what
   made it look right. */
function sunTimes(date, lat, lon){
  var n = Math.round(daysSinceJ2000(date) - 0.0009 + lon / 360);
  var Jnoon = n + 0.0009 - lon / 360;
  var e = solarEcliptic(Jnoon);
  var Jt = 2451545 + Jnoon + 0.0053 * Math.sin(e.M * DEG)
         - 0.0069 * Math.sin(2 * e.L * DEG);
  var fromJ = function(J){ return new Date((J - 2440587.5) * 86400000); };
  var at = function(alt){
    var cosH = (Math.sin(alt * DEG) - Math.sin(lat * DEG) * Math.sin(e.decl * DEG)) /
               (Math.cos(lat * DEG) * Math.cos(e.decl * DEG));
    /* Above the arctic circle the sun can fail to reach an altitude at all.
       Not this water, and the app must still not divide by a NaN. */
    if (!(cosH >= -1 && cosH <= 1)) return { rise:null, set:null };
    var H = Math.acos(cosH) / DEG;
    return { rise: fromJ(Jt - H / 360), set: fromJ(Jt + H / 360) };
  };
  /* AND THEN SOLVE AGAINST THE ALTITUDE ITSELF, so the two answers really are
     one answer.

     `at` above is the closed form, and it disagreed with `sunAltitude` by 0.18
     degrees — the altitude at the sunrise it returned was -0.65 where sunrise
     is defined as -0.833, about forty-five seconds out, and the same amount in
     the same direction at first light. The first guess at the cause was the
     declination being taken at solar noon rather than at the crossing; fixing
     that changed the answer by a fraction of a second and left the 0.18
     standing, which is how it was established that the real difference is the
     transit estimate. `at` reaches solar noon through a two-term
     equation-of-time approximation; `sunAltitude` goes through sidereal time
     and right ascension, and those are the same quantity computed two ways.

     Nobody can act on forty-five seconds. The point is that two paths through
     one ephemeris disagreed at all, and a disagreement nobody can adjudicate
     is how a defect comes to live in whichever path is read less often.

     So there is one definition now and the other refines to it: Newton on the
     altitude, from the closed form's guess, which is already within a minute.
     Four steps takes it under a second and the closure check has nothing left
     to find. It costs a few dozen evaluations, once per render, of arithmetic
     with no network behind it. */
  var solve = function(guess, alt){
    if (!guess) return null;
    var t = guess.getTime();
    for (var k = 0; k < 4; k++){
      var f  = sunAltitude(new Date(t), lat, lon) - alt;
      /* Numeric slope over a minute, centred, in degrees per millisecond. */
      var f1 = sunAltitude(new Date(t + 30000), lat, lon) -
               sunAltitude(new Date(t - 30000), lat, lon);
      if (!isFinite(f1) || Math.abs(f1) < 1e-12) break;
      var step = f / (f1 / 60000);
      if (!isFinite(step)) break;
      /* A guess that is already within a minute cannot need an hour's
         correction; anything that large means the slope was read near a
         turning point and the closed form is the better answer. */
      if (Math.abs(step) > 3600000) break;
      t -= step;
    }
    return new Date(Math.round(t));
  };
  /* AND SOLAR NOON THE SAME WAY. Left as the closed form's estimate it was the
     one time on this panel still coming from the other method, and it showed:
     rise and set, now solved exactly, straddled it by 35 seconds. Transit is
     where the hour angle is zero, so it is a solve like the others — Newton on
     the altitude, which is stationary there, needs the second derivative, so
     this bisects the hour angle instead. */
  var transit = (function(){
    var hourAngleAt = function(ms){
      var d2 = daysSinceJ2000(new Date(ms)), e2 = solarEcliptic(d2);
      var ra = Math.atan2(Math.sin(e2.L * DEG) * Math.cos(OBLIQ * DEG),
                          Math.cos(e2.L * DEG)) / DEG;
      var h = (280.16 + 360.9856235 * d2 + lon - ra) % 360;
      if (h > 180) h -= 360;
      if (h < -180) h += 360;
      return h;
    };
    var t0 = fromJ(Jt).getTime(), lo = t0 - 3600000, hi = t0 + 3600000;
    if (hourAngleAt(lo) > 0 || hourAngleAt(hi) < 0) return fromJ(Jt);
    for (var k = 0; k < 40; k++){
      var mid = (lo + hi) / 2;
      if (hourAngleAt(mid) < 0) lo = mid; else hi = mid;
    }
    return new Date(Math.round((lo + hi) / 2));
  })();
  var day = at(ALT_SUN), civil = at(ALT_CIVIL);
  return { noon: transit, decl: e.decl,
           sunrise: solve(day.rise, ALT_SUN),     sunset: solve(day.set, ALT_SUN),
           dawn:    solve(civil.rise, ALT_CIVIL), dusk:  solve(civil.set, ALT_CIVIL) };
}

/* Which of the three states the light is in at an instant. */
function lightAt(date, lat, lon){
  var a = sunAltitude(date, lat, lon);
  return a > ALT_SUN ? 'day' : a > ALT_CIVIL ? 'twilight' : 'night';
}

/* Where the tide is read, which is where the light is computed. The station
   carries NOAA's own position; a river's centre is the fallback and is said
   to be one rather than passed off as the station. */
function lightPlace(river, t){
  var st = ((t && t.stations) || []).filter(function(s){ return s.id === t.station; })[0];
  if (st && isNum(st.lat) && isNum(st.lon))
    return { lat:st.lat, lon:st.lon, name: st.name || st.id, exact:true };
  if (river && river.center)
    return { lat:river.center[0], lon:river.center[1], name:river.name, exact:false };
  return null;
}

/* THE LIGHT IN WORDS, and the turns that land in it.

   The shading is inside a role="img" and reaches nobody who cannot see it, and
   a shaded band with nothing naming it is the defect the tide key and the
   reversal mark have each already been. So: first light and last light by the
   clock, and then the part a fisher is actually reading the chart for — which
   of the next turns falls in the low hours at either end of the day.

   IT NAMES AN OVERLAP AND CLAIMS NOTHING ABOUT IT. That anglers plan around
   the change of tide near first or last light is a convention, and saying so
   is a fact about the practice; saying it produces fish would be a forecast,
   which this app does not make. */
function lightBox(river, t){
  var place = lightPlace(river, t);
  if (!place) return null;
  var box = el('div', {});
  var now = new Date();
  var todays = sunTimes(now, place.lat, place.lon);
  if (!todays.dawn || !todays.dusk || !todays.sunrise || !todays.sunset){
    /* Never reached on this water; said rather than divided by. */
    box.appendChild(el('p',{class:'note',
      text:'The sun does not rise or set as usual at this latitude on this date, so first and last light are not shown.'}));
    return box;
  }

  var line = 'First light ' + clockLocal(todays.dawn.toISOString()) +
    ', sunrise ' + clockLocal(todays.sunrise.toISOString()) +
    ', sunset ' + clockLocal(todays.sunset.toISOString()) +
    ', last light ' + clockLocal(todays.dusk.toISOString()) + '.';
  box.appendChild(el('p',{class:'note',text:line}));

  /* WHICH TURNS LAND IN THE LOW LIGHT. Twilight at either end, plus the hour
     on the daylight side of each, which is the window the convention is
     actually about — "the change at first light" is not a single minute. */
  var LOW = 3600000;
  var hits = [];
  (t.hilo || []).forEach(function(h){
    var when = new Date(String(h.t).replace(' ', 'T'));
    var ms = when.getTime();
    if (!isFinite(ms) || ms < Date.now() || ms > Date.now() + 36 * 3600000) return;
    var st = lightAt(when, place.lat, place.lon);
    var near = st === 'twilight';
    if (!near && st === 'day'){
      /* Within an hour of the twilight edge on the daylight side. */
      var d2 = sunTimes(when, place.lat, place.lon);
      if (d2.sunrise && d2.sunset)
        near = (ms - d2.sunrise.getTime() >= 0 && ms - d2.sunrise.getTime() <= LOW) ||
               (d2.sunset.getTime() - ms >= 0 && d2.sunset.getTime() - ms <= LOW);
    }
    if (near) hits.push({ at:when, type:h.type, v:h.v, state:st });
  });

  if (hits.length){
    var say = hits.slice(0, 3).map(function(h){
      return (h.type === 'H' ? 'high' : 'low') + ' water ' +
        clockLocal(h.at.toISOString()) + ' on ' + dayLocal(h.at.toISOString());
    }).join(', ');
    box.appendChild(el('p',{class:'note',
      text:'In the next day and a half the tide turns in the low light at ' + say + '.'}));
  } else {
    box.appendChild(el('p',{class:'note',
      text:'None of the turns in the next day and a half falls in the low light at either end of the day.'}));
  }
  /* THE CAVEAT IS NOT CONDITIONAL ON THERE BEING SOMETHING TO CAVEAT. Written
     inside the branch that found an overlap, it disappeared exactly when the
     answer was "none" — so the reader who most needs to know what this section
     is and is not claiming got the bare sentence and no framing at all. */
  box.appendChild(el('p',{class:'note',
    text:'Fishing the change at first or last light is a convention among anglers. This section says when the two coincide and nothing whatever about what the fish will do — Thalweg does not know that and will not guess it.'}));

  box.appendChild(el('p',{class:'note',
    text:'Computed for ' + place.name + (place.exact ? '' : ', the middle of this reach rather than the station') +
      ' — arithmetic from the date and the position, so it needs no signal and works for any day. First and last light are civil twilight, the sun six degrees below the horizon, which is about when you can read water without a torch.'}));
  return box;
}

function tideChart(t, place){
  var W = 320, H = 110, pad = 16;
  var now = Date.now();
  var pts = (t.hourly||[]).map(function(p){
    return { x:new Date(p.t.replace(' ','T')).getTime(), y:p.v };
  }).filter(function(p){
    return p.x >= now - 6*3600000 && p.x <= now + 24*3600000 && isFinite(p.y);
  });
  var s = svg('svg',{ id:'tidechart', viewBox:'0 0 '+W+' '+H, role:'img' });
  var ttl = svg('title'); ttl.textContent =
    'Predicted tide height, six hours back and twenty-four hours forward, MLLW.';
  s.appendChild(ttl);
  if (pts.length < 2){
    var e = svg('text',{x:W/2,y:H/2,fill:'#9FB3B1','font-size':'11','text-anchor':'middle'});
    e.textContent = 'No prediction in this window.';
    s.appendChild(e); return s;
  }
  var xs = pts.map(function(p){ return p.x; }), ys = pts.map(function(p){ return p.y; });
  var x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);
  var y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  if (y1 - y0 < 0.5){ y0 -= 0.25; y1 += 0.25; }
  var sx = function(v){ return pad + (v-x0)/(x1-x0)*(W-2*pad); };
  var sy = function(v){ return H-pad - (v-y0)/(y1-y0)*(H-2*pad); };

  /* THE LIGHT, BEHIND THE WATER. Night darkest, the twilight at either end of
     it a shade lighter, daylight left as the page. It goes in first so the
     tide is drawn ON it rather than under it.

     SAMPLED FROM THE SUN'S ALTITUDE rather than assembled from rise and set
     times. The window is thirty hours and crosses at least one midnight, so
     interval arithmetic here means stitching two or three days of crossings
     together and getting the joins right; asking how high the sun is at each
     step has no joins in it and cannot put a night in the wrong place. Five
     minutes a step, about 360 of them, and the runs are merged so the drawing
     is a handful of rectangles rather than one per sample. */
  if (place){
