    nl.textContent = 'now'; s.appendChild(nl);
  }
  [[y1,pad+2],[y0,H-pad-2]].forEach(function(p){
    var t2 = svg('text',{x:2,y:p[1],fill:'#9FB3B1','font-size':'9'});
    t2.textContent = fmt(p[0],1); s.appendChild(t2);
  });
  return s;
}

function switchTideStation(river, id){
  var stations = (state.tides[river.id] || {}).stations || [];
  sput(river.id,'tidestation',id);
  loadTide(river, id).then(function(t){
    if (t) t.stations = stations;
    state.tides[river.id] = t;
    renderWater();
    /* The map has to agree about which one is being read, or the marker drawn
       as "the one you are using" is the one you just stopped using. */
    drawTideMarkers();
  });
}

/* =====================================================================
   Layers panel.
   Coverage is uneven and the honest thing is to say where it stops. A
   reach with no published survey says so in words; it does not get an
   empty toggle that turns nothing on.
   ===================================================================== */
function appendBasemap(p){
  p.appendChild(el('h2',{class:'sec',text:'Basemap'}));
  BASEMAPS.forEach(function(b){
    var row = el('div',{class:'rowline'});
    var id = 'base-'+b.id;
    var r = el('input',{type:'radio',name:'basemap',id:id,value:b.id});
    if (state.basemapId === b.id) r.checked = true;
    r.addEventListener('change', function(){ if (r.checked) setBasemap(b.id); });
    row.appendChild(r);
    row.appendChild(el('label',{for:id,text:b.label,class:'grow'}));
    p.appendChild(row);
  });
  if (state.basemapError)
    p.appendChild(el('div',{class:'warnbox', text:state.basemapError}));
}

function renderLayers(){
  var p = $('#panel-layers'); p.innerHTML = '';

  /* DEPTH FIRST. This panel opened with three radio buttons for which picture
     to draw the water on — a preference — and put the thing the app exists for
     underneath them. Somebody looking for depth met a basemap chooser and two
     orange boxes before anything about the bottom. The basemap is still here;
     it is at the end, where a preference belongs. */
  if (!BATHY_PROXY){
    p.appendChild(el('div',{class:'warnbox',
      text:'BATHY_PROXY is empty, so bathymetry requests go straight to gis.water.ca.gov. That is California’s public GIS infrastructure, not a tile API. Fine on a laptop; not fine in public.'}));
  } else if (state.proxyMissing){
    p.appendChild(el('div',{class:'warnbox',
      text:'The bathymetry proxy at ' + BATHY_PROXY + ' did not answer, so no depth is available. If this is a static deploy, the site was published without its functions directory.'}));
  }


  if (!state.catalog){
    p.appendChild(el('p',{class:'note',text:'Reading the DWR service directory…'}));
    appendBasemap(p);
    return;
  }
  var river = state.riverId ? byId(state.riverId) : null;
  if (!river){
    p.appendChild(el('p',{class:'note',
      text:'Depth belongs to a reach, so it comes with a river. Pick one above and the map opens with it — All rivers is for choosing between them, not for reading bottom.'}));
    appendBasemap(p);
    return;
  }
  var cat = catalogFor(state.catalog, river);

  /* Reading a colour off a ramp is not a depth. Tapping the map asks the
     survey for the number, and this is the same question without a pointer:
     §4 wants the route named for the hand that takes it, and a finger on a
     map and a keyboard on a button are two hands, not one. */
  /* THE FIRST QUESTION, AND IT HAD NO ANSWER ON SCREEN. The surveys are a few
     reaches of hundreds of kilometres, the app opens on the whole basin, and
     nothing marked where they were — so "I cannot see where the depth is" was
     a correct reading of the map rather than a reader missing something. */
  p.appendChild(el('h2',{class:'sec',text:'Bathymetry — where the depth is'}));
  var whereRow = el('div',{class:'rowline'});
  var whereBtn = el('button',{type:'button',text:'Take me to the surveyed water'});
  whereBtn.addEventListener('click', function(){ goToDepth(river); });
  whereRow.appendChild(whereBtn);
  p.appendChild(whereRow);
  var nSurveys = surveysForRiver(river).length;
  p.appendChild(el('p',{class:'note',
    text: nSurveys
      ? 'The state has surveyed ' + nSurveys + ' reach(es) of the ' + river.name +
        ', and nothing else. Their outlines are drawn on the map in dashed cyan so you can see what is covered before you go looking for a depth that was never measured.'
      : 'No published multibeam survey has arrived for the ' + river.name + ' yet. That is not the same as there being none \u2014 it means nothing has answered.'}));

  p.appendChild(el('h2',{class:'sec',text:'Depth along a line — the profile'}));
  p.appendChild(el('p',{class:'note',
    text:'This reads the published survey along a line and draws the bottom underneath the map. Down the middle of the river it is a long profile; from one bank to the other it is a cross-section showing which side the channel is on.'}));
  p.appendChild(el('p',{class:'note',
      text:'The river\u2019s own line comes from the USGS national hydrography, baked into this build \u2014 no coordinate down the middle of these rivers was invented here. It follows the main stem, so where a river forks the app takes the longer channel and leaves the other alone rather than drawing a line between two waters that do not meet. Depth only exists where the state has surveyed, so profiling the river gives you the longest surveyed stretch of it, and says which stretch that is.'}));
  var profRow = el('div',{class:'rowline'});
  if (state.profArm){
    profRow.appendChild(el('b',{text: state.profArm.length
      ? 'Now tap the other end of the line.'
      : 'Tap the start of your line on the map.'}));
    var cancel = el('button',{type:'button',text:'Cancel'});
    cancel.addEventListener('click', cancelProfile);
    profRow.appendChild(cancel);
  } else {
    /* THE RIVER'S OWN LINE, which is what "a profile of the river" means and
       what the app could not do until USGS's centreline was baked in. */
    /* Every river in this build ships a line, so the controls are offered
       without waiting for the file — pressing one loads it. Deciding from
       whether it happens to be loaded yet would hide them on a cold open and
       show them on a warm one, which is a control that comes and goes. */
    var haveLine = true;
    if (haveLine){
      var down = el('button',{type:'button',text:'Profile down the river itself'});
      down.addEventListener('click', function(){ profileRiverLine(river); });
      profRow.appendChild(down);
    }
    var draw = el('button',{type:'button',
      text: state.profile ? 'Draw another line' : 'Draw a line to profile'});
    draw.addEventListener('click', armProfile);
    profRow.appendChild(draw);
    /* A CROSS-SECTION IS PERPENDICULAR TO THE RIVER, not across the screen.
       This used to draw a line between the left and right edges of whatever
       the map was showing — which at the zoom this app opens on is a line
       across the state, and not a cross-section of anything. With the
       centreline baked in it can cut across the river properly, at the point
       on the river nearest the middle of the map. It is also the pointerless
       route: two taps on a map is a finger's job. */
    if (haveLine){
      var xs = el('button',{type:'button',text:'Cross-section across the river here'});
      xs.addEventListener('click', function(){
        var c = state.map.getCenter();
        crossSectionAt(river, c.lat, c.lng, 300);
      });
      profRow.appendChild(xs);
    }
    if (state.profile){
      var clr = el('button',{type:'button',text:'Clear the profile'});
      clr.addEventListener('click', clearProfile);
      profRow.appendChild(clr);
    }
  }
  p.appendChild(profRow);

  p.appendChild(el('h2',{class:'sec',text:'Depth at a point'}));
  p.appendChild(el('p',{class:'note',
    text:'Tap anywhere on the map and it asks the published survey how deep it is there, and offers to keep the point as a mark. Where the survey has no reading at that exact spot it gives you the nearest place it did measure and how far away that was.'}));
  var centreRow = el('div',{class:'rowline'});
  var centreBtn = el('button',{type:'button',text:'Read the depth at the map centre'});
  centreBtn.addEventListener('click', function(){
    var c = state.map.getCenter();
    if (tabNames().indexOf('map') !== -1) selectTab('map');
    showDepthAt(c.lat, c.lng);
  });
  centreRow.appendChild(centreBtn);
  p.appendChild(centreRow);

  /* THE APP IS NAMED AFTER THE DEEPEST LINE IN A CHANNEL AND COULD NOT DRAW
     ONE. A point answers "how deep is it here"; a line answers where the
     channel runs, which side of it you are on, and how fast it drops away —
     which is the question somebody standing on a bank actually has. */

  if (state.catalog.rasterError)
    p.appendChild(el('div',{class:'warnbox',
      text:'The multibeam service directory did not answer: ' + state.catalog.rasterError}));
  if (state.catalog.singleError)
    p.appendChild(el('div',{class:'warnbox',
      text:'The single beam service did not answer: ' + state.catalog.singleError}));

  /* --- multibeam raster --- */
  p.appendChild(el('h2',{class:'sec',text:'Multibeam surface'}));
  if (!cat.raster.length && !state.catalog.rasterError){
    p.appendChild(el('p',{class:'note',
      text:'No published multibeam survey for this reach.'}));
  } else if (cat.raster.length){
    var rampRow = el('div',{class:'rowline'});
    var rampBtn = el('button',{type:'button','aria-pressed':state.ramp?'true':'false',
      text:'Depth ramp'});
    rampBtn.addEventListener('click', function(){
      state.ramp = !state.ramp;
      /* Rebuild whatever is on, because the rule is part of the tile URL. */
      Object.keys(state.layers).forEach(function(k){
        if (k.indexOf('r:') !== 0) return;
        var lyr = state.layers[k];
        var base = lyr._baseUrl;
        state.map.removeLayer(lyr);
        var next = new EsriImg(base, { opacity: state.opacity || 0.8,
          ramp: state.ramp, attribution:'Bathymetry: California DWR' });
        next.addTo(state.map); next.setZIndex(300);
        state.layers[k] = next;
      });
      renderLayers();
    });
    rampRow.appendChild(rampBtn);
    rampRow.appendChild(el('span',{class:'note',
      text:'Colours the surface by depth instead of grey. Applies to every surface below.'}));
    p.appendChild(rampRow);
  }
  collapsible(p, cat.raster, 'raster', 'surface', rasterControl);

  /* --- single beam points --- */
  p.appendChild(el('h2',{class:'sec',text:'Single beam soundings'}));
  if (!cat.single.length && !state.catalog.singleError){
    p.appendChild(el('p',{class:'note',
      text:'No published single beam survey for this reach.'}));
  }
  collapsible(p, cat.single, 'single', 'survey', singleControl);

  if (cat.unplaced.length){
    p.appendChild(el('h2',{class:'sec',text:'Could not be placed'}));
    p.appendChild(el('p',{class:'note',
      text:cat.unplaced.length + ' published survey' + (cat.unplaced.length===1?'':'s') +
      ' report an extent in a projection this build does not convert, so they are not assigned to a river rather than assigned to the wrong one. Their names are in the diagnostic report.'}));
  }

  /* --- charts --- */
  p.appendChild(el('h2',{class:'sec',text:'NOAA raster chart'}));
  if (state.chartUsable === false){
    p.appendChild(el('p',{class:'note',
      text:'The chart tile path in this build did not return an image, so the toggle is not offered. The path is recorded in the README as unverified.'}));
  } else {
    var crow = el('div',{class:'layer'});
    var cb = el('button',{type:'button','aria-pressed':state.layers.chart?'true':'false',
      text:'Show chart'});
    cb.addEventListener('click', function(){ toggleChart(cb); });
    crow.appendChild(cb);
    crow.appendChild(el('p',{text:'Chart coverage of these waters ends upstream of about Verona; the limit is drawn on the map when the layer is on. Soundings on a chart are for navigation and this app is not.' +
      (state.chartUsable === null ? ' The tile path has not been confirmed against the live service; the first time you switch it on, it checks.' : '')}));
    p.appendChild(crow);
  }

  p.appendChild(el('h2',{class:'sec',text:'Reading the gaps'}));
  p.appendChild(el('p',{class:'note',
    text:'Dense aquatic vegetation defeats the sounder, so DWR drops those cells. A blank patch beside a tule edge is missing data, not flat bottom. In vegetated water a return may be the top of the weed rather than the bed.'}));
  p.appendChild(el('p',{class:'note',
    text:'Single beam data are points along the boat’s track. The water between two tracks was never measured and is not drawn.'}));

  /* GETTING TO THE WATER. Depth is no use from a road you cannot stop on. */
  var sites = accessSites(river);
  p.appendChild(el('h2',{class:'sec',text:'Getting to the water'}));
  if (!sites.length){
    p.appendChild(el('p',{class:'note',
      text:'CDFW publishes no land of its own within twelve kilometres of the ' +
        river.name + '. That is not the same as there being nowhere to fish from \u2014 it means the state does not own it.'}));
  } else {
    p.appendChild(el('p',{class:'note',
      text:'These are CDFW\u2019s own lands within twelve kilometres of this river \u2014 places the department says the public may go, in its words, with a link to its page where it has one. THEY ARE NOT BOAT RAMPS: no published list of ramps for these rivers could be found, and this app will not invent one. Each pin is the middle of a property rather than a spot on the bank, which is why the distance to the river is given.'}));
    var accRow = el('div',{class:'rowline'});
    var accBtn = el('button',{type:'button',
      'aria-pressed': state.showAccess === false ? 'false' : 'true',
      text:'Show them on the map'});
    accBtn.addEventListener('click', function(){
      state.showAccess = state.showAccess === false;
      drawAccessSites(); updateLegend(); renderLayers();
      announce(state.showAccess === false ? 'Public land hidden.' : 'Public land shown.');
    });
    accRow.appendChild(accBtn);
    p.appendChild(accRow);

    var ul = el('ul',{class:'tight'});
    sites.slice(0, 12).forEach(function(site){
      var li = el('li',{});
      li.appendChild(el('b',{text:site.name}));
      li.appendChild(document.createTextNode(' — ' + site.type + ', ' +
        site.km + ' km from the river. ' + (site.access || '')));
      var go = el('button',{class:'gobtn',type:'button',
        'aria-label':'Show ' + site.name + ' on the map', text:'Map'});
      go.addEventListener('click', function(){
        if (tabNames().indexOf('map') !== -1) selectTab('map');
        state.map.setView([site.lat, site.lon], 13, { animate:!reduceMotion });
        announce('Map centred on ' + site.name + '.');
      });
      li.appendChild(go);
      if (site.link){
        li.appendChild(document.createTextNode(' '));
        li.appendChild(el('a',{href:site.link, rel:'noopener', target:'_blank',
          text:'CDFW page'}));
      }
      ul.appendChild(li);
    });
    p.appendChild(ul);
    if (sites.length > 12)
      p.appendChild(el('p',{class:'note',
        text:'The twelve closest to the river, of ' + sites.length + '. The rest are on the map.'}));
  }

  /* The basemap chooser, last, because it is a preference and this panel is
     about the bottom. */
  appendBasemap(p);
}

/* Ranked lists get long — eighty-one single beam layers touch the Delta.
   The first few are the ones that sit squarely in this reach; the rest
   are behind a button, counted, never hidden. */
var LIST_SHOWN = 8;
function collapsible(p, rows, key, noun, make){
  var open = state.expanded && state.expanded[key];
  var shown = open ? rows : rows.slice(0, LIST_SHOWN);
  shown.forEach(function(row){ p.appendChild(make(row)); });
  if (rows.length > LIST_SHOWN){
    var b = el('button',{type:'button',
      text: open ? 'Show the closest ' + LIST_SHOWN + ' only'
                 : 'Show all ' + rows.length + ' ' + noun + 's in this reach'});
    b.addEventListener('click', function(){
      state.expanded = state.expanded || {};
      state.expanded[key] = !open;
      renderLayers();
    });
    p.appendChild(b);
    if (!open) p.appendChild(el('p',{class:'note',
      text:'Showing the ' + LIST_SHOWN + ' whose extent overlaps this reach most. ' +
           (rows.length - LIST_SHOWN) + ' more touch it.'}));
  }
}

function rasterControl(row){
  var wrap = el('div',{class:'layer'});
  var key = 'r:' + row.name;
  var on = !!state.layers[key];
  /* surveyLabel exists because DWR's names are machine names. The depth
     label used it and this list, where a reader chooses between twenty of
     them, still printed Bathy_NCRO_20230208_SacramentoRiver. The machine
     name stays below, so what is on screen can be matched to the catalogue. */
  /* The machine name is on the control as data as well as under it as text,
     so anything selecting this survey selects it by its identity rather than
     by a label that is allowed to be rewritten for readers. */
  var b = el('button',{type:'button','aria-pressed':on?'true':'false',
    'data-survey': row.name,
    text: surveyLabel(row.name) + (surveyDate(row.name) ? ' · ' + surveyDate(row.name) : '')});
  wrap.appendChild(b);
  var opWrap = el('div',{class:'rowline'});
  var opId = 'op-' + row.name.replace(/\W/g,'');
  opWrap.appendChild(el('label',{for:opId,text:'Opacity'}));
  var op = el('input',{type:'range',id:opId,min:'10',max:'100',
    value:String(Math.round((state.opacity||0.8)*100))});
  op.addEventListener('input', function(){
    var v = Number(op.value)/100;
    state.opacity = v;
    if (state.layers[key]) state.layers[key].setOpacity(v);
  });
  opWrap.appendChild(op);
  wrap.appendChild(opWrap);
  wrap.appendChild(el('p',{class:'rdg-id',text:row.name}));
  b.addEventListener('click', function(){
    if (state.layers[key]){
      state.map.removeLayer(state.layers[key]);
      delete state.layers[key];
      b.setAttribute('aria-pressed','false');
    } else {
      var lyr = new EsriImg(dwr(row.path), {
        opacity: state.opacity || 0.8,
        ramp: !!state.ramp,
        attribution:'Bathymetry: California DWR'
      });
      lyr.addTo(state.map); lyr.setZIndex(300);
      state.layers[key] = lyr;
      b.setAttribute('aria-pressed','true');
    }
  });
  var bits = [];
  if (row.pixel){
    var unit = (row.box && row.box.unit && Math.abs(row.box.unit - 1) > 0.01)
      ? 'ft' : 'm';
    bits.push('cell about ' + fmt(row.pixel[0],2) + ' by ' + fmt(row.pixel[1],2) + ' ' + unit);
  }
  if (row.box && row.box.approx) bits.push('extent in NAD83, placed to within a metre');
  wrap.appendChild(el('p',{text:(row.description || 'No description published.') +
    (bits.length ? ' — ' + bits.join('; ') + '.' : '')}));
  return wrap;
}

function singleControl(row){
  var wrap = el('div',{class:'layer'});
  var on = state.soundingLayerId === row.id;
  var b = el('button',{type:'button','aria-pressed':on?'true':'false',
    'data-survey': row.name,
    text: surveyLabel(row.name) + (surveyDate(row.name) ? ' · ' + surveyDate(row.name) : '')});
  b.addEventListener('click', function(){
    if (state.soundingLayerId === row.id){
      state.soundingActive = false; state.soundingLayerId = null;
      state.soundingLayer.clearLayers();
      state.soundingNote = '';
      renderLayers(); updateLegend();
    } else {
      state.soundingActive = true; state.soundingLayerId = row.id;
      state.soundingLayerDef = row;
      renderLayers();
      refreshSoundings();
    }
  });
  wrap.appendChild(b);
  wrap.appendChild(el('p',{class:'rdg-id',text:row.name}));
  var txt = row.description || 'No description published.';
  if (!row.depthField) txt += ' — no depth attribute could be identified in this layer, so the points draw in one colour.';
  else txt += ' — depth attribute "' + row.depthField + '", as published; the vertical datum is whatever DWR published and is not restated here.';
  wrap.appendChild(el('p',{text:txt}));
  if (on && state.soundingNote) wrap.appendChild(el('p',{class:'err',text:state.soundingNote}));
  return wrap;
}

function refreshSoundings(){
  if (!state.soundingActive || !state.soundingLayerDef) return;
  var def = state.soundingLayerDef;
  if (state.map.getZoom() < 12){
    state.soundingLayer.clearLayers();
    state.soundingNote = 'Zoom in to at least z12 to load soundings. At this scale the request would be the whole survey.';
    renderLayers(); updateLegend();
    return;
  }
  querySoundings(def, state.map.getBounds()).then(function(res){
    drawSoundings(res, def);
  }, function(e){
    state.soundingLayer.clearLayers();
    var msg = String(e && e.message || e);
    /* Some published surveys do not answer a query at all — the service
       times out on them however small the box. That is at DWR's end and
       there is nothing to do about it from here, so say whose it is and
       point at the rest of the list rather than leaving a bare error. */
    state.soundingNote = /timeout|Error performing query|Error handling service/i.test(msg)
      ? 'DWR’s service did not answer for this survey. That is at their end rather than yours — the other surveys in this list are unaffected.'
      : 'Sounding query failed: ' + msg;
    renderLayers(); updateLegend();
  });
}

function drawSoundings(res, def){
  state.soundingLayer.clearLayers();
  var field = res.field;
  var vals = [];
  res.features.forEach(function(f){
    var v = attrNumber(f, field);
    if (isNum(v)) vals.push(v);
  });
  vals.sort(function(a,b){ return a-b; });
  var lo = vals.length ? vals[Math.floor(vals.length*0.02)] : 0;
  var hi = vals.length ? vals[Math.floor(vals.length*0.98)] : 1;
  if (hi - lo < 1e-6) hi = lo + 1;
  state.soundingRange = vals.length ? [lo,hi] : null;

  res.features.forEach(function(f){
    var g = f.geometry;
    if (!g || !isNum(g.x) || !isNum(g.y)) return;
    var v = attrNumber(f, field);
    var col = isNum(v) ? depthColour(v, lo, hi) : '#7BD5D9';
    var m = L.circleMarker([g.y, g.x], {
      radius:3, weight:0, fillColor:col, fillOpacity:.9, interactive:true
    });
    m.bindPopup(labelNode('Sounding',
      [[isNum(v) ? fmt(v,2) : '—', field || 'value']],
      'as published by DWR; the vertical datum is not restated here'), LABEL);
    state.soundingLayer.addLayer(m);
  });
  state.soundingTruncated = res.truncated;
  state.soundingNote = res.truncated
    ? 'Showing ' + commas(res.features.length) + ' soundings — the ' +
      commas(res.cap || FEATURE_CAP) + ' cap truncated this view. Zoom in to see the rest; what is drawn is not all that was surveyed here.'
    : commas(res.features.length) + ' soundings in view.';
  renderLayers(); updateLegend();
}

/* A null attribute must not become a zero depth on the way through. */
function attrNumber(f, field){
  if (!field || !f.attributes) return NaN;
  var raw = f.attributes[field];
  if (raw === null || raw === undefined || raw === '') return NaN;
  var v = Number(raw);
  return isFinite(v) ? v : NaN;
}

/* Shallow reads warm, deep reads cold, whichever direction the published
   values run: an elevation goes down as depth goes up. */
function depthColour(v, lo, hi){
  var t = Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
  return mixHex('#0B3A4A', '#7BD5D9', t);
}

/* THE MAP HAD NO KEY. Gauges, tide stations, marks and your own position are
   four different dots and the only way to find out which was which was to tap
   one — so a reader looking at a screen full of circles could not tell what
   any of them meant, and the two tide-station sizes (the one being read, and
   the rest) looked deliberate without saying why.
   It lists only what is actually drawn right now, so it can never name a
   symbol that is not on the map. */
function swatch(radius, weight, stroke, fill){
  var d = radius * 2;
  return el('i',{class:'sw',
    style:'width:' + d + 'px;height:' + d + 'px;border:' + weight + 'px solid ' +
          stroke + ';background:' + fill});
}
function keyRow(sw, text){
  var r = el('div',{class:'keyrow'});
  r.appendChild(sw);
  r.appendChild(el('span',{text:text}));
  return r;
}
/* Open by default where there is room, a labelled chip where there is not — a
   key nobody finds is the same as no key, and "Key" is a great deal easier to
   find than tapping dots until one explains itself. A stored choice wins over
   both. */
function legendCollapsed(){
  var v = null;
  try { v = Store.s.getItem('thalweg:_shared:legend'); } catch(e){}
  if (v === 'shut') return true;
  if (v === 'open') return false;
  return narrowMQ.matches;
}
function updateLegend(){
  var d = document.getElementById('maplegend');
  if (!d) return;
  d.innerHTML = '';

  var rows = [];
  if (state.gaugeLayer && state.gaugeLayer.getLayers().length)
    rows.push(keyRow(swatch(7, 2, '#0A1214', tempColour(60)),
      'River gauge — fill is water temperature'));
  if (state.tideLayer && state.tideLayer.getLayers().length){
    rows.push(keyRow(swatch(8, 3, '#7BD5D9', '#0D1A19'),
      'Tide station being read here'));
    if (state.tideLayer.getLayers().length > 1)
      rows.push(keyRow(swatch(5, 1, '#3C6E6B', '#0D1A19'),
        'Other tide station — tap to switch'));
  }
  if (state.markLayer && state.markLayer.getLayers().length)
    MARK_TYPES.forEach(function(t){
      var any = (state.marks || []).some(function(m){ return m.type === t.id; });
      if (any) rows.push(keyRow(swatch(6, 2, t.colour, '#0D1A19'), 'Your mark: ' + t.label.toLowerCase()));
    });
  if (state.hereLayer && state.hereLayer.getLayers().length)
    rows.push(keyRow(swatch(7, 3, '#E76F9F', '#0D1A19'),
      'You — the ring is how sure your device is'));
  if (state.profLayer && state.profLayer.getLayers().length){
    var pl = el('i',{class:'sw',
      style:'width:16px;height:0;border-radius:0;border:0;border-top:3px solid #F2A65A'});
    rows.push(keyRow(pl, 'The line the depth below is measured along'));
  }
  if (state.accessLayer && state.accessLayer.getLayers().length)
    rows.push(keyRow(swatch(5, 2, '#9BD98C', '#0D1A19'),
      'Public land — CDFW says you may go'));
  if (state.surveyLayer && state.surveyLayer.getLayers().length){
    var sq = el('i',{class:'sw',
      style:'width:14px;height:10px;border-radius:0;border:1px dashed #7BD5D9;background:rgba(123,213,217,.08)'});
    rows.push(keyRow(sq, 'Surveyed — depth exists only inside these'));
  }

  var showSound = state.soundingActive && state.soundingRange;
  if (!rows.length && !showSound) return;

  /* Collapsible, and it remembers. On a phone the map is small and a key that
     covers a quarter of it is its own defect — but it opens by default,
     because a key nobody finds is the same as no key, which is what this
     was. */
  if (legendCollapsed()){
    var open = el('button',{type:'button',id:'keyopen',text:'Key'});
    open.addEventListener('click', function(){
      try { Store.s.setItem('thalweg:_shared:legend','open'); } catch(e){}
      updateLegend();
      var b = document.querySelector('#maplegend .keyhead button');
      if (b) b.focus();
    });
    d.appendChild(open);
    return;
  }

  var head = el('div',{class:'keyhead'});
  head.appendChild(el('b',{text:'What the dots are'}));
  var shut = el('button',{type:'button','aria-label':'Hide the key',text:'Hide'});
  shut.addEventListener('click', function(){
    try { Store.s.setItem('thalweg:_shared:legend','shut'); } catch(e){}
    updateLegend();
    var b = document.getElementById('keyopen');
    if (b) b.focus();
  });
  head.appendChild(shut);
  d.appendChild(head);
  rows.forEach(function(r){ d.appendChild(r); });

  if (showSound){
    d.appendChild(el('b',{style:'margin-top:.35rem',text:'Sounding value'}));
    d.appendChild(el('div',{style:'height:8px;width:120px;background:linear-gradient(90deg,#0B3A4A,#7BD5D9);border:1px solid #2E7C76'}));
    d.appendChild(el('div',{text:fmt(state.soundingRange[0],1)+'  to  '+fmt(state.soundingRange[1],1)}));
    /* The full sentence lives in the Layers panel; over the map it only has
       to say that what you are looking at is not all of it. */
    if (state.soundingTruncated)
      d.appendChild(el('div',{style:'color:#F2A65A',text:'truncated — zoom in'}));
  }
}

function toggleChart(btn){
  if (state.layers.chart){
    state.map.removeLayer(state.layers.chart);
    delete state.layers.chart;
    if (state.layers.chartLimit){ state.map.removeLayer(state.layers.chartLimit);
      delete state.layers.chartLimit; }
    btn.setAttribute('aria-pressed','false');
    return;
  }
  var lyr = L.tileLayer(NOAA_CHART.url, { maxZoom:17, opacity:.85,
    attribution:NOAA_CHART.attr });
  var sawTile = false;
  lyr.on('tileload', function(){ sawTile = true; state.chartUsable = true; });
  lyr.on('tileerror', function(){
    if (sawTile) return;
    state.chartUsable = false;
    state.map.removeLayer(lyr);
    delete state.layers.chart;
    logNet('NOAA chart tiles', NOAA_CHART.url, false, 'tile error');
    renderLayers();
  });
  lyr.addTo(state.map); lyr.setZIndex(200);
  state.layers.chart = lyr;
  btn.setAttribute('aria-pressed','true');
  state.layers.chartLimit = L.rectangle(
    NOAA_CHART.limitBand,
    { color:'#DA4A85', weight:1, dashArray:'4 3', fill:false }
  ).bindPopup(labelNode('NOAA chart coverage ends about here', null,
      'The position of this limit is unconfirmed.'), LABEL)
   .addTo(state.map);
}

/* =====================================================================
   Marks. Yours, on this device, per river. Never sent anywhere.
   ===================================================================== */
var MARK_TYPES = [
  { id:'hole',   label:'Hole',   colour:'#7BD5D9' },
  { id:'hazard', label:'Hazard', colour:'#DA4A85' },
  { id:'ramp',   label:'Ramp',   colour:'#C9A96A' },
  { id:'fish',   label:'Fish',   colour:'#9BD98C' }
];

function loadMarks(riverId){
  state.marks = sget(riverId,'marks') || [];
  drawMarks();
}
function saveMarks(){
  if (state.riverId) sput(state.riverId,'marks',state.marks);
}
function addMark(lat, lon, extra){
  var type = state.markType || 'hole';
  var m = { id:'m'+Date.now()+Math.floor(Math.random()*1000),
    type:type, lat:lat, lon:lon, at:new Date().toISOString(), note:'' };
  /* A depth read at the moment the mark was kept travels with it, so the
     label can say it later without asking the service again — and says
     WHEN it was surveyed, because a mark outlives the survey it was read
     from. */
  if (extra) for (var k in extra) m[k] = extra[k];
  state.marks.push(m);
  saveMarks(); drawMarks(); renderMarks();
  announce('Mark added at ' + lat.toFixed(5) + ', ' + lon.toFixed(5) +
    (isNum(m.depth) ? ', ' + fmt(Math.abs(m.depth),1) + ' feet' : '') + '.');
}
function drawMarks(){
  if (!state.markLayer) return;
  state.markLayer.clearLayers();
  state.marks.forEach(function(m){
    var def = MARK_TYPES.filter(function(t){ return t.id===m.type; })[0] || MARK_TYPES[0];
    var vals = [[m.lat.toFixed(5) + ', ' + m.lon.toFixed(5), '']];
    if (isNum(m.depth)) vals.unshift([fmt(Math.abs(m.depth),1), 'ft']);
    var sub = (m.note ? m.note + ' · ' : '') +
      'dropped ' + dayLocal(m.at) + ', ' + clockLocal(m.at);
    if (isNum(m.depth))
      sub += ' · depth from ' + (m.depthFrom || 'a published survey') +
        (m.depthDate ? ', surveyed ' + m.depthDate : '') +
        (m.depthAway ? ', measured ' + m.depthAway + ' m away' : '') +
        ', as published';
    L.circleMarker([m.lat,m.lon],{ radius:6, weight:2, color:def.colour,
      fillColor:'#0A1214', fillOpacity:.85 })
      .bindPopup(labelNode(def.label, vals, sub), LABEL)
      .addTo(state.markLayer);
  });
  updateLegend();
}
function renderMarks(){
  var p = $('#panel-marks'); p.innerHTML = '';
  if (!state.riverId){
    /* A mark belongs to a river, so there is nowhere to put a new one here.
       That is no reason to show nothing: the ones already dropped are
       readable, and a refusal with a list under it is a different thing
       from a refusal on its own. */
    p.appendChild(el('p',{class:'note',
      text:'A mark belongs to one river, so pick a river to drop one. Everything already dropped is below.'}));
    var total = 0;
    RIVERS.forEach(function(river){
      var marks = sget(river.id,'marks') || [];
      if (!marks.length) return;
      total += marks.length;
      p.appendChild(el('h2',{class:'sec',text:river.name + ' (' + marks.length + ')'}));
      marks.slice().reverse().forEach(function(m){
        var def = MARK_TYPES.filter(function(t){ return t.id===m.type; })[0] || MARK_TYPES[0];
        var r = el('div',{class:'markrow'});
        r.appendChild(el('span',{class:'swatch',style:'background:'+def.colour}));
        var g = el('span',{class:'grow'});
        g.appendChild(el('span',{text:def.label + ' '}));
        g.appendChild(el('span',{class:'v',text:m.lat.toFixed(5)+', '+m.lon.toFixed(5)}));
        r.appendChild(g);
        var go = el('button',{type:'button',text:'Go',
          'aria-label':'Show ' + river.name + ' and centre on this mark'});
        go.addEventListener('click',function(){
          selectRiver(river.id);
          state.map.setView([m.lat,m.lon], 15);
          selectTab('map');
        });
        r.appendChild(go);
        p.appendChild(r);
      });
    });
    if (!total) p.appendChild(el('p',{class:'note',text:'No marks on any river yet.'}));
    return;
  }
  p.appendChild(el('h2',{class:'sec',text:'Drop a mark'}));
  var row = el('div',{class:'rowline'});
  row.appendChild(el('label',{for:'marktype',text:'Type'}));
  var sel = el('select',{id:'marktype'});
  MARK_TYPES.forEach(function(t){
    var o = el('option',{value:t.id,text:t.label});
    if ((state.markType||'hole') === t.id) o.setAttribute('selected','selected');
    sel.appendChild(o);
  });
  sel.addEventListener('change',function(){ state.markType = sel.value; });
  row.appendChild(sel);
  p.appendChild(row);
  /* Tapping the map is the quick way; this button is the route that does
     not need a pointer at all. */
  var addBtn = el('button',{type:'button',text:'Add at map centre'});
  addBtn.addEventListener('click',function(){
    var c = state.map.getCenter(); addMark(c.lat, c.lng);
  });
  p.appendChild(addBtn);
  p.appendChild(el('p',{class:'note',
    text:'Or tap the map. Pan with the arrow keys when the map has focus.'}));

  p.appendChild(el('h2',{class:'sec',text:'Marks (' + state.marks.length + ')'}));
  if (!state.marks.length)
    p.appendChild(el('p',{class:'note',text:'None yet on this river.'}));
  state.marks.slice().reverse().forEach(function(m){
    var def = MARK_TYPES.filter(function(t){ return t.id===m.type; })[0] || MARK_TYPES[0];
    var r = el('div',{class:'markrow'});
    r.appendChild(el('span',{class:'swatch',style:'background:'+def.colour}));
    var g = el('span',{class:'grow'});
    g.appendChild(el('span',{text:def.label + ' '}));
    /* A mark kept from a depth reading carried the figure into its map
       label and nowhere else, so the list it lives in did not know it. */
    if (isNum(m.depth)){
      var dv = el('span',{class:'v'});
      dv.appendChild(document.createTextNode(fmt(Math.abs(m.depth),1)));
      dv.appendChild(el('small',{text: m.depth <= 0 ? 'ft' : 'ft above datum'}));
      g.appendChild(dv);
      g.appendChild(document.createTextNode(' '));
    }
    g.appendChild(el('span',{class:'v',text:m.lat.toFixed(5)+', '+m.lon.toFixed(5)}));
    if (isNum(m.depth)) g.appendChild(el('div',{class:'rdg-id',
      text:'depth from ' + (m.depthFrom || 'a published survey') +
        (m.depthDate ? ', surveyed ' + m.depthDate : '') +
        (m.depthAway ? ', measured ' + m.depthAway + ' m away' : '') + ', as published'}));
    r.appendChild(g);
    var go = el('button',{type:'button',text:'Go','aria-label':'Centre map on this mark'});
    go.addEventListener('click',function(){ state.map.setView([m.lat,m.lon], 15); });
    r.appendChild(go);
    var del = el('button',{type:'button',text:'Delete','aria-label':'Delete this mark'});
    del.addEventListener('click',function(){
      state.marks = state.marks.filter(function(x){ return x.id !== m.id; });
      saveMarks(); drawMarks(); renderMarks(); announce('Mark deleted.');
    });
    r.appendChild(del);
    p.appendChild(r);
  });

  p.appendChild(el('h2',{class:'sec',text:'Export'}));
  var ta = el('textarea',{readonly:'readonly','aria-label':'GeoJSON of your marks'});
  ta.value = JSON.stringify(marksGeoJSON(), null, 1);
  p.appendChild(ta);
  var erow = el('div',{class:'rowline'});
  var copy = el('button',{type:'button',text:'Copy GeoJSON'});
  copy.addEventListener('click',function(){
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
    announce('GeoJSON copied.');
  });
  erow.appendChild(copy);
  var dl = el('a',{ class:'', download:'thalweg-'+state.riverId+'.geojson',
    href:'data:application/geo+json;charset=utf-8,'+encodeURIComponent(ta.value),
    text:'Download file' });
  erow.appendChild(dl);
  p.appendChild(erow);
}
/* What travels with an exported mark. A mark kept from a depth reading is
   kept FOR the depth, and the export dropped it — the figure, the survey it
   came from and the date it was surveyed all lived on the device and in
   nothing that left it. The keys say their units, because a bare "depth" in
   somebody else's chart plotter is a number with no story. */
function markProps(m){
  var out = { type:m.type, at:m.at, note:m.note, river:state.riverId };
  if (isNum(m.depth)){
    out.depth_ft = Number(m.depth.toFixed(2));
    out.depth_is = m.depth <= 0 ? 'below the survey datum'
                                : 'ABOVE the survey datum — bank, not bottom';
    if (m.depthFrom)  out.depth_survey = m.depthFrom;
    if (m.depthDate)  out.depth_surveyed = m.depthDate;
    if (m.depthAway)  out.depth_measured_m_away = m.depthAway;
    out.depth_note = 'As the survey published it. The vertical datum is not restated. Not for navigation.';
  }
  return out;
}

function marksGeoJSON(){
  return { type:'FeatureCollection',
    features: state.marks.map(function(m){
      return { type:'Feature',
        geometry:{ type:'Point', coordinates:[Number(m.lon.toFixed(6)), Number(m.lat.toFixed(6))] },
        properties: markProps(m) };
    }) };
}

/* =====================================================================
   Brief — season, limits, temperature, sources.
   Anything that could not be read from the regulation is marked as such
   and left unresolved rather than settled by picking the likelier side.
   ===================================================================== */
function renderBrief(){
  var p = $('#panel-brief'); p.innerHTML = '';
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;

  p.appendChild(el('h2',{class:'sec',text:'Bag and possession'}));
  var lim = el('p',{});
  lim.appendChild(el('span',{class:'v',text:String(SEASON_ADOPTION.daily)}));
  lim.appendChild(document.createTextNode(' daily, '));
  lim.appendChild(el('span',{class:'v',text:String(SEASON_ADOPTION.possession)}));
  lim.appendChild(document.createTextNode(' in possession, ' + SEASON_ADOPTION.size + '. '));
  lim.appendChild(flagEl(SEASON_ADOPTION.status));
  p.appendChild(lim);
  p.appendChild(el('p',{class:'note',text:SEASON_ADOPTION.note}));
  p.appendChild(el('p',{class:'note',text:SEASON_ADOPTION.dateNote}));

  rivers.forEach(function(river){
    p.appendChild(el('h2',{class:'sec',text:river.name + ' — season'}));
    if (!river.reaches.length){
      p.appendChild(el('div',{class:'warnbox',
        text:'The reach boundaries and dates for this river were not confirmed against Title 14 section 7.40 when this build was made, so none are shown. Nothing here is a substitute for the printed regulations.'}));
    }
    river.reaches.forEach(function(rc){
      var box = el('div',{class:'rdg'});
      var h = el('div',{class:'rdg-name'});
      h.appendChild(el('span',{text:rc.name}));
      h.appendChild(flagEl(rc.status));
      h.appendChild(el('span',{class:'rdg-id',text:rc.code}));
      box.appendChild(h);
      var d = el('div',{class:'rdg-vals'});
      rc.windows.forEach(function(w){
        d.appendChild(el('span',{class:'v',
          text: dayLocal(w[0] + 'T12:00') + ' to ' + dayLocal(w[1] + 'T12:00')}));
      });
      box.appendChild(d);
      box.appendChild(el('div',{class:'rdg-id',text:openNow(rc)}));
      box.appendChild(el('p',{class:'note',text:rc.bounds}));
      p.appendChild(box);
    });
    river.conflicts.forEach(function(c){
      var box = el('div',{class:'magbox'});
      box.appendChild(el('div',{style:'font-weight:600',
        text:(c.status === 'resolved' ? 'Resolved: ' : 'Unresolved: ') + c.subject}));
      var ul = el('ul',{class:'tight'});
      ul.appendChild(el('li',{text:c.a}));
      ul.appendChild(el('li',{text:c.b}));
      box.appendChild(ul);
      box.appendChild(el('div',{text:c.resolution}));
      p.appendChild(box);
    });
  });

  p.appendChild(el('h2',{class:'sec',text:'Water temperature'}));
  var ul = el('ul',{class:'tight'});
  TEMP_READING.forEach(function(t){ ul.appendChild(el('li',{text:t.text})); });
  p.appendChild(ul);
  p.appendChild(el('p',{class:'note',
    text:'Gauge temperature is the water passing one instrument, not the water where you are standing. A tailwater reads colder than the same river four miles down.'}));

  p.appendChild(el('h2',{class:'sec',text:'Which way the water is going'}));
  p.appendChild(el('p',{class:'note',
    text:'Where a gauge computes mean water velocity, the figure is signed and the sign is the useful part: a negative reading means the water is running upstream, which on tidal water is the tide pushing in. That is a MEASUREMENT of this moment, where the tide table above is a prediction — the two answer the same question from opposite ends, and where they disagree the water is the authority.'}));
  p.appendChild(el('p',{class:'note',
    text:'The sign convention is checked rather than trusted. At every gauge that publishes both, the velocity sign is compared against the discharge sign at the same instant; where they disagree the app says the two instruments disagree instead of choosing one, because that is not a fact about the river.'}));

  p.appendChild(el('h2',{class:'sec',text:'Water clarity'}));
  var uc = el('ul',{class:'tight'});
  [ 'Under 5 FNU — clear.',
    '5 to 25 FNU — lightly coloured.',
    '25 to 100 FNU — stained.',
    'Over 100 FNU — muddy.'
  ].forEach(function(t){ uc.appendChild(el('li',{text:t})); });
  p.appendChild(uc);
  p.appendChild(el('p',{class:'note',
    text:'FNU is Formazin Nephelometric Units — how much light the water scatters, which is how much it is carrying. The four descriptions above are this app’s own plain words for how water at those readings looks. They are not a published standard, and none of them is a statement about fishing: what the light does in the water is a measurement, and what the fish do about it is not something this app knows.'}));
  p.appendChild(el('p',{class:'note',
    text:'Most gauges have no turbidity sensor. On the Sacramento three of six report it and on the Mokelumne two of three; the American has four gauges and none of them, and the state publishes none for the Feather. Where there is no sensor the app says so rather than showing a dash, because a dash would read as water so clear it could not be measured.'}));

  p.appendChild(el('h2',{class:'sec',text:'Where to look next'}));
  SOURCES.forEach(function(s){
    var li = el('p',{class:'note'});
    li.appendChild(el('a',{href:s.url,rel:'noopener noreferrer',target:'_blank',text:s.label}));
    p.appendChild(li);
  });
  p.appendChild(el('div',{class:'magbox',
    text:'Thalweg does not know where fish are being caught, and will not guess. No live catch feed exists for these rivers, so anything claiming one is inventing it.'}));
}

/* A reach can carry more than one window — the upper Sacramento is
   written as two. Open means inside any of them. */
function openNow(rc){
  var now = new Date(), soonest = null, last = null;
  for (var i = 0; i < rc.windows.length; i++){
    var a = new Date(rc.windows[i][0] + 'T00:00'),
        b = new Date(rc.windows[i][1] + 'T23:59');
    if (now >= a && now <= b)
      return 'Open now — ' + Math.ceil((b - now) / 86400000) + ' days left in this window.';
    if (now < a && (soonest === null || a < soonest)) soonest = a;
    if (last === null || b > last) last = b;
  }
  if (soonest) return 'Opens in ' + Math.ceil((soonest - now) / 86400000) + ' days.';
  return 'Closed since ' + dayLocal(rc.windows[rc.windows.length-1][1] + 'T12:00') + '.';
}

/* =====================================================================
   Chrome — tabs, river picker, staleness, announcements
   ===================================================================== */
var live;
function announce(msg){
  if (!live){
    live = el('div',{ 'aria-live':'polite', role:'status',
      style:'position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden' });
    document.body.appendChild(live);
  }
  live.textContent = msg;
}

/* The tabs.
 *
 * Which tabs exist depends on the screen and on what is selected, so they
 * are named rather than indexed: an index into a list that changes length
 * is a bug waiting for a rotation. The map is one of them under the
 * breakpoint, where it cannot be shown beside the rail; above it the map
 * has its own column and the tab is not offered. On All rivers there is no
 * map at all, so there is no tab for it either.
 */
var narrowMQ = window.matchMedia('(max-width:900px)');

function tabNames(){
  var names = ['water','layers','marks','brief'];
  if (narrowMQ.matches && state.riverId) names.splice(1, 0, 'map');
  return names;
}
function tabEl(name){ return document.getElementById('tab-' + name); }
function panelEl(name){ return document.getElementById('panel-' + name); }

function initTabs(){
  ['water','map','layers','marks','brief'].forEach(function(name){
    var tab = tabEl(name);
    tab.addEventListener('click', function(){ selectTab(name); });
    tab.addEventListener('keydown', function(e){
      var names = tabNames(), i = names.indexOf(name);
      var to = e.key === 'ArrowRight' ? i + 1
             : e.key === 'ArrowLeft'  ? i - 1
             : e.key === 'Home'       ? 0
             : e.key === 'End'        ? names.length - 1 : null;
      if (to === null || i === -1) return;
      e.preventDefault();
      to = (to + names.length) % names.length;
      selectTab(names[to]);
      tabEl(names[to]).focus();
    });
  });
  var onWidth = function(){
    /* Rotating a phone into a tablet layout must not leave the map tab
       selected, because there is no longer a tab to be on. */
    if (tabNames().indexOf(state.tab || 'water') === -1) selectTab('water');
    else selectTab(state.tab || 'water');
  };
  if (narrowMQ.addEventListener) narrowMQ.addEventListener('change', onWidth);
  else if (narrowMQ.addListener) narrowMQ.addListener(onWidth);
}

function selectTab(name){
  var names = tabNames();
  if (names.indexOf(name) === -1) name = 'water';
  state.tab = name;
  ['water','map','layers','marks','brief'].forEach(function(n){
    var tab = tabEl(n), panel = panelEl(n);
    var live = names.indexOf(n) !== -1;
    var on = live && n === name;
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
    if (n === 'map'){
      /* The map is a tabpanel only while it is one of the tabs. Above the
         breakpoint it is a column of the layout and carrying the role
         there would describe a panel with no tab to reach it. */
      if (live){
        panel.setAttribute('role','tabpanel');
        panel.setAttribute('aria-labelledby','tab-map');
        panel.hidden = false;
      } else {
        panel.removeAttribute('role');
        panel.removeAttribute('aria-labelledby');
        panel.hidden = false;
      }
    } else {
      panel.hidden = !on;
    }
  });
  /* The class the layout hangs on: the map showing means the rail is only
     its tab strip. */
  document.body.classList.toggle('show-map', name === 'map');
  if (name === 'map' && state.map){
    /* It has been display:none, so it believes the size it last had. */
    setTimeout(mapBecameVisible, 60);
  }
  if (name === 'water')  drawTrendLines();
  if (name === 'layers') renderLayers();
  if (name === 'marks')  renderMarks();
  if (name === 'brief')  renderBrief();
}

function initPicker(){
  var sel = $('#riverpick');
  RIVERS.forEach(function(r){
    sel.appendChild(el('option',{ value:r.id, text:r.short }));
  });
  sel.appendChild(el('option',{ value:'', text:'All rivers' }));
  /* First run opens on All rivers — the four stacked against one
     temperature scale is the comparison this app exists to make, and it
     is the question actually being asked on a Saturday morning. After
     that it opens wherever it was left. */
  var saved = Store.s.getItem('thalweg:_shared:river');
  sel.value = (saved === null ? '' : saved);
  sel.addEventListener('change', function(){ selectRiver(sel.value); });
}

function selectRiver(id){
  state.riverId = id || null;
  try { Store.s.setItem('thalweg:_shared:river', id || ''); } catch(e){}
  $('#riverpick').value = id || '';

  /* Depth layers belong to the reach they were surveyed in. */
  Object.keys(state.layers).forEach(function(k){
    if (k.indexOf('r:') === 0){ state.map.removeLayer(state.layers[k]); delete state.layers[k]; }
  });
  state.soundingActive = false; state.soundingLayerId = null;
  state.soundingLayer.clearLayers();
  updateLegend();

  document.body.classList.toggle('all-rivers', !state.riverId);
  /* Offered only where it goes somewhere. Hidden rather than disabled: a
     control that does nothing still asks to be understood. */
  var home = $('#homebtn');
  if (home) home.hidden = !state.riverId;
  drawSurveyBoxes();
  drawAccessSites();

  var river = state.riverId ? byId(state.riverId) : null;
  if (river){
    mapView([river.center, river.zoom]);
    loadMarks(river.id);
  } else {
    state.markLayer.clearLayers(); state.marks = [];
    var b = RIVERS.reduce(function(acc, r){
      return [Math.min(acc[0],r.bbox[0]), Math.min(acc[1],r.bbox[1]),
              Math.max(acc[2],r.bbox[2]), Math.max(acc[3],r.bbox[3])];
    }, [180,90,-180,-90]);
    mapView(L.latLngBounds([[b[1],b[0]],[b[3],b[2]]]));
  }
  /* The map tab exists only when a river does, so the strip is rebuilt
     rather than left showing a tab that leads nowhere. */
  selectTab(tabNames().indexOf(state.tab || 'water') === -1 ? 'water' : (state.tab || 'water'));
  announce(river ? river.name + ' selected.' : 'All rivers selected.');
  refreshData();
  renderWater(); renderMarks(); renderBrief();
  if (!document.getElementById('panel-layers').hidden) renderLayers();
  drawRibbon();
}

/* Live data is never served stale by the service worker. The page keeps
   the last good payload per river and the header says how old it is, in
   orange, because a number that looks current and is not is the whole
   failure this app has to avoid. */
/* A reading fetched ninety seconds ago is not stale, whatever the request
   after it did. The flag says "the last attempt did not succeed"; the WARNING
   is about how old the number on screen actually is, and conflating the two
   put "network did not answer" in orange over six readings timestamped that
   minute, on a cold open, with every request logged ok. Upstream publishes
   every fifteen minutes, so five is comfortably inside current. */
var FRESH_MS = 5 * 60 * 1000;
function looksOld(g){
  if (!g) return false;
  if (g.failed || g.noData) return true;      /* nothing arrived at all */
  if (!g.stale) return false;
  return !isNum(g.fetchedAt) || (Date.now() - g.fetchedAt) > FRESH_MS;
}

function updateStaleness(){
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;
  var worst = null, anyStale = false;
  rivers.forEach(function(r){
    var g = state.gauges[r.id];
    if (!g || !g.fetchedAt) return;
    if (worst === null || g.fetchedAt < worst) worst = g.fetchedAt;
    if (looksOld(g)) anyStale = true;
  });
  /* IT SAID "seconds old — network did not answer", which is two claims that
     cannot both be true. A response that arrives carrying no readings still
     stamps fetchedAt with the moment it arrived, so the age was the age of the
     ATTEMPT rather than of any reading — and the sentence quoted it next to a
     statement that nothing had answered.
     An age is only worth printing when there is a reading to be that old. */
  var noneAnswered = rivers.every(function(r){
    var g = state.gauges[r.id];
    return !g || g.failed || g.noData;
  });
  var out = '';
  if (worst === null){
    out = 'No readings yet';
  } else if (noneAnswered){
    out = 'No current flow or temperature — nothing answered';
  } else {
    var age = Date.now() - worst;
    if (anyStale || age > 45 * 60 * 1000)
      out = 'Flow and temperature ' + ageText(age) +
            (anyStale ? ' — showing what was stored' : '');
  }
  $('#staleness').textContent = out;
}

/* How often it goes and looks by itself. Named, because the strip that tells a
   reader their readings are old has to be able to say when it will try again —
   a number in one place and a sentence in another is how those two stop
   agreeing. */
var REFRESH_MS = 10 * 60 * 1000;

/* THE STRIP SAID THE READINGS WERE OLD AND NOTHING ELSE. It did not say when it
   had last tried, when it would try next, or how to ask now, so the only
   honest reading of it was "this is broken and there is nothing you can do".
   All three of those were already true facts about the app; none of them was
   on screen. */
function staleBox(payload){
  var box = el('div',{class:'warnbox'});
  box.appendChild(el('p',{style:'margin:0 0 .35rem',
    text:'Stored readings, ' + ageText(Date.now() - payload.fetchedAt) +
         '. The network did not answer, so these are the last that arrived.'}));

  var when = state.lastAttempt
    ? 'Last tried at ' + clockLocal(new Date(state.lastAttempt).toISOString()) + '. '
    : '';
  var next = navigator.onLine
    ? 'It tries again on its own every ten minutes, and each time you come back to the app.'
    : 'Your device says it is offline, so it is not trying. It will start again by itself the moment a connection comes back.';
  box.appendChild(el('p',{class:'note',style:'margin:0 0 .35rem',
    text:when + next + ' There is no waiting period — you can ask it to try now, as often as you like.'}));

  var row = el('div',{class:'rowline'});
  var btn = el('button',{type:'button',id:'retrybtn',text:'Try now'});
  btn.addEventListener('click', function(){
    btn.disabled = true;
    btn.textContent = 'Asking…';
    announce('Asking the gauges again.');
    var was = payload.fetchedAt;
    refreshData();
    /* Say what happened either way. A button that goes quiet leaves a reader
       pressing it again to find out whether it did anything. */
    setTimeout(function(){
      var now = state.gauges[state.riverId] || payload;
      var moved = now.fetchedAt && now.fetchedAt !== was;
      announce(moved ? 'New readings arrived.'
                     : 'Still nothing. The readings on screen are the same ones.');
      if (!moved){ btn.disabled = false; btn.textContent = 'Try again'; }
    }, 6000);
  });
  row.appendChild(btn);
  box.appendChild(row);
  return box;
}

function refreshData(){
  state.lastAttempt = Date.now();
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;
  rivers.forEach(function(river){
    var cached = sget(river.id,'gauges');
    if (cached && !state.gauges[river.id]){
      cached.stale = true; state.gauges[river.id] = cached;
      renderWater(); drawRibbon(); updateStaleness();
    }
    loadGauges(river).then(function(payload){
      state.gauges[river.id] = payload;
      renderWater(); drawRibbon(); updateStaleness(); drawGaugeMarkers(); drawTideMarkers();
      /* The trend goes out after the readings, not beside them: which gauge
         to ask for a week of flow is decided by which gauge answered for
         right now, and on All rivers nothing asks at all — four rivers of
         fifteen-minute history is most of a megabyte for four lines nobody
         opened. */
      /* Loaded whether or not this river is the one on screen: the strip is
         the point, and an alert that only appears once you have already
         picked the river is an alert for people who did not need it. 12.8KB
         against a landing that now costs about a megabyte. */
      if (river.weirs && !state.weirs[river.id]){
        loadWeirs(river).then(function(w){
          state.weirs[river.id] = w;
          updateWeirStrip();
          if (state.riverId === river.id) renderWater();
        });
      }
      if (state.riverId === river.id && !state.trends[river.id]){
        var stored = sget(river.id,'trend');
        if (stored){ stored.stale = true; state.trends[river.id] = stored; renderWater(); }
        loadTrend(river).then(function(tr){
          state.trends[river.id] = tr;
          if (state.riverId === river.id) renderWater();
        });
      }
    });
    if (river.tidal) loadTideFor(river);
  });
  if (state.riverId) loadCatalog().then(function(){
    if (!document.getElementById('panel-layers').hidden) renderLayers();
  });
}

function loadTideFor(river){
  discoverTideStations(river).then(function(found){
    var index = {};
    found.forEach(function(f){ index[f.id] = f; });
    /* A declared station keeps its provenance flag and takes its position
       and name from NOAA's index, so no station coordinate is ever typed
       into this app. */
    var declared = river.tideStations.map(function(s){
      var f = index[s.id] || {};
      return { id:s.id, name:f.name || s.hint, status:s.status,
               lat:isNum(f.lat) ? f.lat : null, lon:isNum(f.lon) ? f.lon : null };
    });
    var seen = {}; declared.forEach(function(s){ seen[s.id] = true; });
    /* A river box over the lower Delta catches most of the bay. Keep the
       declared stations, then the nearest handful, so the picker stays a
       picker. */
    var c = river.center;
    var rest = found.filter(function(f){ return !seen[f.id]; })
      .map(function(f){
        f.d = metresBetween(c[0], c[1], f.lat, f.lon);
        return f;
      })
      .sort(function(a, b){ return a.d - b.d; });
    /* ANYTHING NEW IS NEVER RANKED OUT. A station the button just found is the
       one thing the reader pressed it to see, and there are forty-odd baked
       stations on this river — so on distance alone a new one two bends away
       loses to a shipped one, and pressing the button appears to do nothing.
       New first, then the nearest of what already shipped. */
    var fresh = rest.filter(function(f){ return f.origin === 'new'; });
    var known = rest.filter(function(f){ return f.origin !== 'new'; }).slice(0, 10);
    var stations = declared.concat(fresh, known);
    if (!stations.length){
      state.tides[river.id] = { failed:'no prediction station found for this reach' };
      renderWater(); return;
    }
    var pick = sget(river.id,'tidestation');
    var chosen = stations.filter(function(s){ return s.id === pick; })[0] || stations[0];
    return loadTide(river, chosen.id).then(function(t){
      t.stations = stations;
      state.tides[river.id] = t;
      renderWater();
      drawTideMarkers();
    });
  });
}

/* TIDE STATIONS ON THE MAP.
 *
 * They were never drawn — not the ones the discovery button finds, and not
 * even the declared one the app is reading the tide FROM. So the picker was a
 * list of names with no way to find out where any of them is, and choosing
 * between them meant knowing the estuary by heart. A station is a place; a
 * place belongs on the map.
 *
 * The one in use is drawn differently rather than only labelled, because the
 * question being asked of this layer is "which of these am I reading" and that
 * should be answerable without opening anything.
 */
function drawTideMarkers(){
  if (!state.tideLayer) return;
  state.tideLayer.clearLayers();
  if (!state.riverId) return;
  var river = byId(state.riverId);
  var t = state.tides[river.id];
  if (!t || !t.stations) return;
  t.stations.forEach(function(s){
    if (!isNum(s.lat) || !isNum(s.lon)) return;
    var live = s.id === t.station;
    L.circleMarker([s.lat, s.lon], {
      pane: 'tidepane',
      radius: live ? 8 : 5,
      weight: live ? 3 : 1,
      color: live ? '#7BD5D9' : '#3C6E6B',
      fillColor: '#0D1A19',
      fillOpacity: live ? 1 : .8,
    }).bindPopup(labelNode(
      s.name || s.id,
      /* NO READING ROW. A tide station is a place, not a measurement — the
         numbers live in the tide panel. The first version of this put prose
         in the value slot, which is for a figure and its unit, and rendered
         the name and the description with no space between them. */
      [],
      (live ? 'Reading the tide here. ' : 'Tide station. ') + 'NOAA ' + s.id +
        (river.center
          ? ' · ' + Math.round(metresBetween(river.center[0], river.center[1], s.lat, s.lon) / 1000) +
            ' km from the middle of this reach'
          : '')
    ), LABEL).addTo(state.tideLayer);
  });
  updateLegend();
}

function drawGaugeMarkers(){
  if (!state.gaugeLayer) return;
  state.gaugeLayer.clearLayers();
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;
  rivers.forEach(function(river){
    var payload = state.gauges[river.id];
    if (!payload) return;
    payload.rows.forEach(function(r){
      if (!isNum(r.lat) || !isNum(r.lon)) return;
      var f = isNum(r.tempF) ? r.tempF : null;
      L.circleMarker([r.lat, r.lon], {
        radius:7, weight:2, color:'#0A1214', fillColor:tempColour(f), fillOpacity:.95
      }).bindPopup(labelNode(
        r.name || r.id,
        [[fmt(r.flow,0), 'cfs'], [fmt(r.stage,2), 'ft'],
         [fmt(f,1), 'F', f === null ? null : tempColour(f)]],
        (r.source ? r.source + ' ' : '#') + r.id +
        (r.at ? ' · ' + clockLocal(r.at) + ', ' + dayLocal(r.at) : '') +
        (r.context ? ' · tributary, not this river' : '')
      ), LABEL).addTo(state.gaugeLayer);
    });
  });
  updateLegend();
}

/* =====================================================================
   The weirs.

   Four of them sit on the Sacramento, and when one goes over its crest the
   river stops being one channel: water leaves for a bypass and takes what is
   swimming in it. That is a fact about where the river IS, not a forecast
   about anything, which is why it is here at all.

   The file carries NWPS forecast rows for the days ahead as well as the
   measured record. Only the measured record is read. A forecast of a weir
   overtopping is somebody's model, and this app does not repeat models.
   ===================================================================== */
function parseWeirs(text, list){
  var lines = String(text || '').split('\n');
  if (lines.length < 2) return null;
  var head = lines[0].split(',').map(function(h){ return h.trim(); });
  /* Columns are grouped per weir and named by the source; the crest column
     is found by its own header rather than by counting, so a column added
     upstream shifts nothing here. */
  var col = {};
  list.forEach(function(w){
    head.forEach(function(h, i){
      if (h.indexOf(w.code + ' ') === 0 && /above Crest/i.test(h)) col[w.code] = i;
    });
  });
  for (var r = 1; r < lines.length; r++){
    var cells = lines[r].split(',');
    var when = (cells[0] || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(when)) continue;   /* skips the forecast rows */
    var out = { at:when, over:[], quiet:[], unknown:[] };
    list.forEach(function(w){
      var i = col[w.code];
      var raw = i === undefined ? '' : String(cells[i] || '').trim();
      if (raw === '') { out.quiet.push(w); return; }
      var v = Number(raw);
      if (!isNum(v)) { out.unknown.push(w); return; }
      if (v > 0) out.over.push({ w:w, ft:v }); else out.quiet.push(w);
    });
    return out;
  }
  return null;
}

function loadWeirs(river){
  if (!river.weirs) return Promise.resolve(null);
  return getText(river.weirs.url, 20000).then(function(txt){
    var parsed = parseWeirs(txt, river.weirs.list);
    logNet('SacPAS weirs', river.weirs.url, true,
      parsed ? (parsed.over.length + ' over crest on ' + parsed.at) : 'no measured row found');
    return parsed || { failed:'the file had no measured row in it' };
  }, function(e){
    logNet('SacPAS weirs', river.weirs.url, false, String(e && e.message || e));
    return { failed:String(e && e.message || e) };
  });
}

/* The standing indicator. It says which weir, how far over and which river,
   because "a weir is over" is not actionable and "Tisdale is 1.4 ft over,
   water is leaving the Sacramento for the Sutter Bypass" is. */
function updateWeirStrip(){
  var strip = document.getElementById('weirstrip');
  if (!strip) return;
  var over = [];
  RIVERS.forEach(function(r){
    var w = state.weirs[r.id];
    if (!w || w.failed || !w.over) return;
    w.over.forEach(function(o){ over.push({ river:r, o:o }); });
  });
  if (!over.length){ strip.hidden = true; return; }
  over.sort(function(a,b){ return b.o.ft - a.o.ft; });
  var txt = document.getElementById('weirtext');
  txt.innerHTML = '';
  var first = over[0];
  txt.appendChild(el('b',{text:first.o.w.name + ' is ' + fmt(first.o.ft,1) + ' ft over its crest.'}));
  txt.appendChild(document.createTextNode(' Water is leaving the ' + first.river.short +
    ' for ' + first.o.w.into + ', and fish go with it.' +
    (over.length > 1 ? ' ' + (over.length - 1) +
      (over.length === 2 ? ' other weir is over too.' : ' other weirs are over too.') : '')));
  var go = document.getElementById('weirgo');
  go.onclick = function(){
    if (state.riverId !== first.river.id) selectRiver(first.river.id);
    selectTab('water');
    var h = [].slice.call(document.querySelectorAll('#panel-water .sec'))
      .filter(function(n){ return n.textContent === 'The weirs'; })[0];
    if (h) h.scrollIntoView({ block:'start' });
  };
  strip.hidden = false;
}

function weirSection(river){
  var box = el('div',{});
  var w = state.weirs[river.id];
  if (!w){ box.appendChild(el('p',{class:'note',text:'Asking about the weirs…'})); return box; }
  if (w.failed){
    box.appendChild(el('p',{class:'note',
      text:'No weir reading this time — ' + w.failed + '. That is not the same as none of them being over.'}));
    return box;
  }
  if (w.over.length){
    w.over.forEach(function(o){
      var p = el('p',{class:'warnbox'});
      p.appendChild(el('b',{text:o.w.name + ' is ' + fmt(o.ft,1) + ' ft over its crest.'}));
      p.appendChild(document.createTextNode(' Water is leaving the main river for ' +
        o.w.into + ', and fish go with it.'));
      box.appendChild(p);
    });
  } else {
    box.appendChild(el('p',{class:'note',
      text:'None of the four weirs is over its crest, so the river is in its own channel.'}));
  }
  if (w.unknown.length) box.appendChild(el('p',{class:'note',
    text:'No figure published for ' + w.unknown.map(function(x){ return x.w ? x.w.name : x.name; }).join(' or ') +
      ' in this file, so those are unknown rather than quiet.'}));
  box.appendChild(el('p',{class:'note',
    text:'Measured for ' + w.at + ', from ' + river.weirs.source +
      '. The same file carries a forecast for the days ahead; that is somebody’s model and is not repeated here.'}));
  return box;
}

/* =====================================================================
   The last seven days.

   A reading is a number; a trend is a decision. A river that has dropped
   two thousand cubic feet a second since Tuesday fishes differently from
   one that has just come up by the same amount, and in a single figure
   those two look identical.

   It is fetched for the river on screen only, and only for the gauges the
   figures already come from. NWIS publishes instantaneous values every
   fifteen minutes and will not downsample: a week of one parameter at one
   site is 55KB, and asking every gauge on the Sacramento for both flow and
   temperature is 429KB — measured — for a line three hundred pixels wide
   that cannot show a tenth of it. The daily-values service would be a
   twentieth of that and was tried first: it publishes NOTHING for water
   temperature at any of these sites and nothing for flow at two of them,
   so it cannot answer this question at all.
   ===================================================================== */
var TREND_DAYS = 7;
var TREND_MAX_POINTS = 240;   /* more than a phone-width line can show */

/* One series per site per parameter, oldest first. Same refusals as the
   current-reading parser: the sentinel is a missing reading, not a value. */
function parseUsgsSeries(j){
  var out = {};
  var ts = j && j.value && j.value.timeSeries;
  if (!Array.isArray(ts)) return out;
  ts.forEach(function(t){
    var si = t.sourceInfo || {};
    var code = si.siteCode && si.siteCode[0] && si.siteCode[0].value;
    var pc = t.variable && t.variable.variableCode && t.variable.variableCode[0]
             && t.variable.variableCode[0].value;
    if (!code || !pc) return;
    var vals = t.values && t.values[0] && t.values[0].value;
    if (!Array.isArray(vals) || !vals.length) return;
    var pts = [];
    vals.forEach(function(x){
      var v = Number(x.value);
      if (!isFinite(v) || v <= -999998) return;
      var when = Date.parse(x.dateTime);
      if (!isFinite(when)) return;
      pts.push({ t:when, v: pc === '00010' ? cToF(v) : v });
    });
    if (!pts.length) return;
    pts.sort(function(a,b){ return a.t - b.t; });
    (out[code] || (out[code] = {}))[pc === '00010' ? 'temp' : pc === '00060' ? 'flow' : pc] = pts;
  });
  return out;
}

function usgsTrend(ids){
  var url = USGS + '?format=json&sites=' + ids.join(',') +
            '&parameterCd=00060,00010&period=P' + TREND_DAYS + 'D&siteStatus=all';
  /* Longer than the current-reading request, because this one is a hundred
     kilobytes or more and a phone on a bar of signal is the normal case. */
  return getJSON(url, 45000).then(function(j){
    var parsed = parseUsgsSeries(j);
    logNet('USGS trend', url, true, Object.keys(parsed).length + ' site(s) with history');
    return parsed;
  }, function(e){
    logNet('USGS trend', url, false, String(e && e.message || e));
    throw e;
  });
}

/* CDEC does downsample, and hourly is plenty for a week: 27KB a station
   against 27KB an hour's worth of the fifteen-minute record. */
function cdecTrend(river){
  var list = river.cdecGauges || [];
  if (!list.length) return Promise.resolve({});
  var start = new Date(); start.setDate(start.getDate() - TREND_DAYS);
  var end   = new Date(); end.setDate(end.getDate() + 1);
  function ymdDash(d){
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  var url = cdecUrl(CDEC_PATH + '?Stations=' + list.map(function(g){ return g.id; }).join(',') +
    '&SensorNums=20,25&dur_code=H&Start=' + ymdDash(start) + '&End=' + ymdDash(end));
  return getJSON(url, 45000).then(function(rows){
    var out = {};
    (Array.isArray(rows) ? rows : []).forEach(function(r){
      var id = r && r.stationId;
      if (!id) return;
      var v = Number(r.value);
      if (!isNum(v) || v <= -9998) return;
      var when = cdecDate(r.obsDate || r.date);
      if (!when) return;
      var units = String(r.units || '').toUpperCase();
      var site = out[id] || (out[id] = {});
      /* The same unit check as the current reading. A sensor renumbered or
         re-scaled at the far end produces no line rather than a wrong one. */
      if (r.SENSOR_NUM === 20 && units === 'CFS')
        (site.flow || (site.flow = [])).push({ t:when.getTime(), v:v });
      if (r.SENSOR_NUM === 25 && (units === 'DEG F' || units === 'DEG C'))
        (site.temp || (site.temp = [])).push({ t:when.getTime(),
          v: units === 'DEG C' ? cToF(v) : v });
    });
    Object.keys(out).forEach(function(id){
      Object.keys(out[id]).forEach(function(k){
        out[id][k].sort(function(a,b){ return a.t - b.t; });
      });
    });
    logNet('CDEC trend', url, true, Object.keys(out).length + ' station(s) with history');
    return out;
  }, function(e){
    logNet('CDEC trend', url, false, String(e && e.message || e));
    throw e;
  });
}

/* Which gauges to ask. Flow comes from whichever gauge the card already
   names, so the line and the figure above it cannot disagree; temperature
   from that same gauge if it has a thermometer, and otherwise from the
   first on-river gauge that does — Verona measures the Sacramento's
   discharge and has no thermometer at all, so on that river these are two
   different sites and the panel says which is which. */
function trendSites(river){
  var payload = state.gauges[river.id];
  if (!payload || !payload.rows) return null;
  var flow = downstreamFlow(river);
  var rows = payload.rows.filter(function(r){ return !r.context && isNum(r.tempF); });
  /* Nearest first, along the river's own axis, so the temperature comes
     from near the water the flow figure describes rather than from
     whichever gauge happens to be listed first. */
  if (flow){
    var at = null;
    payload.rows.forEach(function(r){ if (r.id === flow.id) at = axisValue(river, r); });
    if (isNum(at)) rows = rows.slice().sort(function(a,b){
      var da = isNum(axisValue(river,a)) ? Math.abs(axisValue(river,a) - at) : 1e9;
      var db = isNum(axisValue(river,b)) ? Math.abs(axisValue(river,b) - at) : 1e9;
      return da - db;
    });
  }
  /* TWO temperature candidates, not one, and this is why: Verona reports a
     temperature right now and publishes no history for it at all, so the
     obvious rule — ask the gauge the flow figure came from — produced a
     Sacramento with a flow line and the words "no temperature history" on
     the river with the most instrumented reach in the state. Whether a site
     publishes a week of a parameter cannot be known without asking, so ask
     two and draw whichever answers. */
  var temp = rows.slice(0, 2).map(function(r){
    return { id:r.id, name:r.name || r.id, source:r.source };
  });
  if (!flow && !temp.length) return null;
  return {
    flow: flow ? { id:flow.id, name:flow.name, source:flow.source, tidal:flow.tidal } : null,
    temp: temp
  };
}

function loadTrend(river){
  var want = trendSites(river);
  if (!want) return Promise.resolve({ failed:'no gauge to read a trend from yet' });
  var ids = {};
  if (want.flow) ids[want.flow.id] = want.flow.source || 'USGS';
  want.temp.forEach(function(t){ ids[t.id] = t.source || 'USGS'; });
  var usgs = Object.keys(ids).filter(function(k){ return ids[k] !== 'CDEC'; });
  var cdec = Object.keys(ids).filter(function(k){ return ids[k] === 'CDEC'; });

  /* Which request failed matters, and it took a live run to notice why: a
     USGS timeout with no CDEC request beside it left an empty series set and
     every gauge was then reported as publishing NO HISTORY — a confident
     claim about the American River, which publishes a full week, produced by
     a request that never arrived. A refusal and an absence are different
     facts and this app is not allowed to print one as the other. */
  var failed = [];
  var jobs = [
    usgs.length ? usgsTrend(usgs).catch(function(){ failed.push('USGS'); return null; })
                : Promise.resolve({}),
    cdec.length ? cdecTrend(river).catch(function(){ failed.push('CDEC'); return null; })
                : Promise.resolve({})
  ];
  return Promise.all(jobs).then(function(res){
    if (failed.length){
      var cached = sget(river.id,'trend');
      if (cached){ cached.stale = true; return cached; }
      return { failed: failed.join(' and ') + ' did not answer' };
    }
    var series = {};
    [res[0] || {}, res[1] || {}].forEach(function(set){
      Object.keys(set).forEach(function(k){ series[k] = set[k]; });
    });
    var out = { fetchedAt: Date.now(), days: TREND_DAYS,
      flow: null, temp: null, tidal: !!(want.flow && want.flow.tidal) };
    if (want.flow && series[want.flow.id] && series[want.flow.id].flow)
      out.flow = { site:want.flow.id, name:want.flow.name, source:want.flow.source || 'USGS',
                   pts:series[want.flow.id].flow };
    want.temp.some(function(t){
      if (!series[t.id] || !series[t.id].temp) return false;
      out.temp = { site:t.id, name:t.name, source:t.source || 'USGS', pts:series[t.id].temp };
      return true;
    });
    /* A site that answers the current-reading request and publishes no
       history is a real state, not an error: every Mokelumne gauge does
       exactly that. Say which gauge was asked, so it is a fact rather
       than an absence. */
    /* CDEC's date range starts at midnight, so a seven-day request comes
       back with eight days in it and the sentence under the line said
       "over 8 days" beneath a heading that said seven. Clip to the window
       actually claimed. */
    var floor = Date.now() - TREND_DAYS * 24 * 3600 * 1000;
    ['flow','temp'].forEach(function(k){
      if (out[k]) out[k].pts = out[k].pts.filter(function(pt){ return pt.t >= floor; });
      if (out[k] && out[k].pts.length < 2) out[k] = null;
    });
    out.noHistory = [];
    if (want.flow && !out.flow) out.noHistory.push({ what:'flow', name:want.flow.name, id:want.flow.id });
    if (want.temp.length && !out.temp) out.noHistory.push({ what:'temperature',
      name: want.temp.map(function(t){ return t.name; }).join(' or '),
      id: want.temp.map(function(t){ return t.id; }).join(', ') });
    /* Stored trimmed: the drawn line cannot use more points than this and
       a week of fifteen-minute values will not fit a storage quota. */
    var slim = { fetchedAt:out.fetchedAt, days:out.days, tidal:out.tidal, noHistory:out.noHistory,
      flow: out.flow ? { site:out.flow.site, name:out.flow.name, source:out.flow.source,
                         pts:thin(out.flow.pts, TREND_MAX_POINTS) } : null,
      temp: out.temp ? { site:out.temp.site, name:out.temp.name, source:out.temp.source,
                         pts:thin(out.temp.pts, TREND_MAX_POINTS) } : null };
    sput(river.id,'trend', slim);
    return out;
  });
}

/* Keep the ends and the extremes, drop from the middle. A line that loses
   its peak has lost the only part of it anybody was looking for. */
function thin(pts, max){
  if (!pts || pts.length <= max) return pts || [];
  var keep = {}, lo = 0, hi = 0;
  pts.forEach(function(p,i){ if (p.v < pts[lo].v) lo = i; if (p.v > pts[hi].v) hi = i; });
  keep[0] = keep[pts.length-1] = keep[lo] = keep[hi] = true;
  var step = (pts.length - 1) / (max - 1);
  for (var i = 0; i < max; i++) keep[Math.round(i * step)] = true;
  return pts.filter(function(p,i){ return keep[i]; });
}

/* What the line says, in words, because a shape is not a fact and colour
   is never the only thing carrying one here. */
function trendStats(pts, band){
  if (!pts || pts.length < 2) return null;
  var first = pts[0], last = pts[pts.length-1];
  var lo = pts[0], hi = pts[0];
  pts.forEach(function(p){ if (p.v < lo.v) lo = p; if (p.v > hi.v) hi = p; });
  var delta = last.v - first.v;
  var base = Math.abs(first.v) > 1e-6 ? Math.abs(first.v) : null;
  var pct = base ? (delta / base) * 100 : null;
  var dir = Math.abs(delta) < band ? 'steady' : (delta > 0 ? 'up' : 'down');
  var day = null;
  var cutoff = last.t - 24*3600*1000;
  for (var i = pts.length - 1; i >= 0; i--){ if (pts[i].t <= cutoff){ day = pts[i]; break; } }
