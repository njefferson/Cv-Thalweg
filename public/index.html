    var chosen = stations.filter(function(s){ return s.id === pick; })[0] || stations[0];
    return loadTide(river, chosen.id).then(function(t){
      t.stations = stations;
      state.tides[river.id] = t;
      renderWater();
      drawTideMarkers();
    });
  });
}

/* TIDE STATIONS ON THE MAP.
 *
 * They were never drawn — not the ones the discovery button finds, and not
 * even the declared one the app is reading the tide FROM. So the picker was a
 * list of names with no way to find out where any of them is, and choosing
 * between them meant knowing the estuary by heart. A station is a place; a
 * place belongs on the map.
 *
 * The one in use is drawn differently rather than only labelled, because the
 * question being asked of this layer is "which of these am I reading" and that
 * should be answerable without opening anything.
 */
function drawTideMarkers(){
  if (!state.tideLayer) return;
  state.tideLayer.clearLayers();
  if (!state.riverId) return;
  var river = byId(state.riverId);
  var t = state.tides[river.id];
  if (!t || !t.stations) return;
  t.stations.forEach(function(s){
    if (!isNum(s.lat) || !isNum(s.lon)) return;
    var live = s.id === t.station;
    var m = L.circleMarker([s.lat, s.lon], {
      pane: 'tidepane',
      radius: live ? 8 : 5,
      weight: live ? 3 : 1,
      color: live ? '#7BD5D9' : '#3C6E6B',
      fillColor: '#0D1A19',
      fillOpacity: live ? 1 : .8,
    });
    /* THE KEY SAID "tap to switch" AND TAPPING DID NOT SWITCH.
       It opened a label naming the station and nothing else — so the one
       sentence in the app that told a reader the station is a choice was
       describing something the map did not do. Which station the tide is read
       at matters more than it looks: high water at Rio Vista and high water at
       Freeport are hours apart, so a reader on the wrong one is wrong by
       hours. The panel has had a picker and a "nearest to you" button for
       several releases; the map promised the same thing and delivered a
       caption. It does it now. */
    var pop = labelNode(
      s.name || s.id,
      /* NO READING ROW. A tide station is a place, not a measurement — the
         numbers live in the tide panel. The first version of this put prose
         in the value slot, which is for a figure and its unit, and rendered
         the name and the description with no space between them. */
      [],
      (live ? 'Reading the tide here. ' : 'Tide station. ') + 'NOAA ' + s.id +
        (river.center
          ? ' · ' + Math.round(metresBetween(river.center[0], river.center[1], s.lat, s.lon) / 1000) +
            ' km from the middle of this reach'
          : '')
    );
    if (!live){
      var srow = el('div',{class:'rowline'});
      var sbtn = el('button',{type:'button',text:'Read the tide here instead'});
      sbtn.addEventListener('click', function(){
        if (state.map) state.map.closePopup();
        switchTideStation(river, s.id);
        announce('Tide now predicted at ' + (s.name || s.id) + '.');
      });
      srow.appendChild(sbtn);
      pop.appendChild(srow);
      pop.appendChild(el('span',{class:'pop-sub',
        text:'The tide turns at different times along the river — hours apart between the top of this reach and the bottom.'}));
    }
    m.bindPopup(pop, LABEL).addTo(state.tideLayer);
  });
  updateLegend();
}

function drawGaugeMarkers(){
  if (!state.gaugeLayer) return;
  state.gaugeLayer.clearLayers();
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;
  rivers.forEach(function(river){
    var payload = state.gauges[river.id];
    if (!payload) return;
    payload.rows.forEach(function(r){
      if (!isNum(r.lat) || !isNum(r.lon)) return;
      var f = isNum(r.tempF) ? r.tempF : null;
      /* THE RING SAYS WHICH WAY THE WATER IS GOING, the fill still says how
         warm it is. Two facts, two channels, and neither has to give up the
         other — a gauge that measures velocity gets a coloured ring, and one
         that does not keeps the dark ring it always had. A gauge whose
         velocity and discharge disagree is left dark too: the app refuses to
         choose between them everywhere else and must not quietly choose here. */
      var vr2 = velReading(r);
      var ring = (vr2 && !vr2.conflict) ? (vr2.down ? EBB : FLOOD) : '#0A1214';
      L.circleMarker([r.lat, r.lon], {
        radius:7, weight: ring === '#0A1214' ? 2 : 3,
        color:ring, fillColor:tempColour(f), fillOpacity:.95
      }).bindPopup(labelNode(
        r.name || r.id,
        [[fmt(r.flow,0), 'cfs'], [fmt(r.stage,2), 'ft'],
         [fmt(f,1), 'F', f === null ? null : tempColour(f)]],
        (r.source ? r.source + ' ' : '#') + r.id +
        (r.at ? ' · ' + clockLocal(r.at) + ', ' + dayLocal(r.at) : '') +
        (r.context ? ' · tributary, not this river' : '')
      ), LABEL).addTo(state.gaugeLayer);
    });
  });
  updateLegend();
}

/* =====================================================================
   The weirs.

   Four of them sit on the Sacramento, and when one goes over its crest the
   river stops being one channel: water leaves for a bypass and takes what is
   swimming in it. That is a fact about where the river IS, not a forecast
   about anything, which is why it is here at all.

   The file carries NWPS forecast rows for the days ahead as well as the
   measured record. Only the measured record is read. A forecast of a weir
   overtopping is somebody's model, and this app does not repeat models.
   ===================================================================== */
function parseWeirs(text, list){
  var lines = String(text || '').split('\n');
  if (lines.length < 2) return null;
  var head = lines[0].split(',').map(function(h){ return h.trim(); });
  /* Columns are grouped per weir and named by the source; the crest column
     is found by its own header rather than by counting, so a column added
     upstream shifts nothing here. */
  var col = {};
  list.forEach(function(w){
    head.forEach(function(h, i){
      if (h.indexOf(w.code + ' ') === 0 && /above Crest/i.test(h)) col[w.code] = i;
    });
  });
  for (var r = 1; r < lines.length; r++){
    var cells = lines[r].split(',');
    var when = (cells[0] || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(when)) continue;   /* skips the forecast rows */
    var out = { at:when, over:[], quiet:[], unknown:[] };
    list.forEach(function(w){
      var i = col[w.code];
      var raw = i === undefined ? '' : String(cells[i] || '').trim();
      if (raw === '') { out.quiet.push(w); return; }
      var v = Number(raw);
      if (!isNum(v)) { out.unknown.push(w); return; }
      if (v > 0) out.over.push({ w:w, ft:v }); else out.quiet.push(w);
    });
    return out;
  }
  return null;
}

function loadWeirs(river){
  if (!river.weirs) return Promise.resolve(null);
  return getText(river.weirs.url, 20000).then(function(txt){
    var parsed = parseWeirs(txt, river.weirs.list);
    logNet('SacPAS weirs', river.weirs.url, true,
      parsed ? (parsed.over.length + ' over crest on ' + parsed.at) : 'no measured row found');
    return parsed || { failed:'the file had no measured row in it' };
  }, function(e){
    logNet('SacPAS weirs', river.weirs.url, false, String(e && e.message || e));
    return { failed:String(e && e.message || e) };
  });
}

/* The standing indicator. It says which weir, how far over and which river,
   because "a weir is over" is not actionable and "Tisdale is 1.4 ft over,
   water is leaving the Sacramento for the Sutter Bypass" is. */
function updateWeirStrip(){
  var strip = document.getElementById('weirstrip');
  if (!strip) return;
  var over = [];
  RIVERS.forEach(function(r){
    var w = state.weirs[r.id];
    if (!w || w.failed || !w.over) return;
    w.over.forEach(function(o){ over.push({ river:r, o:o }); });
  });
  if (!over.length){ strip.hidden = true; return; }
  over.sort(function(a,b){ return b.o.ft - a.o.ft; });
  var txt = document.getElementById('weirtext');
  txt.innerHTML = '';
  var first = over[0];
  txt.appendChild(el('b',{text:first.o.w.name + ' is ' + fmt(first.o.ft,1) + ' ft over its crest.'}));
  txt.appendChild(document.createTextNode(' Water is leaving the ' + first.river.short +
    ' for ' + first.o.w.into + ', and fish go with it.' +
    (over.length > 1 ? ' ' + (over.length - 1) +
      (over.length === 2 ? ' other weir is over too.' : ' other weirs are over too.') : '')));
  var go = document.getElementById('weirgo');
  go.onclick = function(){
    if (state.riverId !== first.river.id) selectRiver(first.river.id);
    selectTab('water');
    var h = [].slice.call(document.querySelectorAll('#panel-water .sec'))
      .filter(function(n){ return n.textContent === 'The weirs'; })[0];
    if (h) h.scrollIntoView({ block:'start' });
  };
  strip.hidden = false;
}

function weirSection(river){
  var box = el('div',{});
  var w = state.weirs[river.id];
  if (!w){ box.appendChild(el('p',{class:'note',text:'Asking about the weirs…'})); return box; }
  if (w.failed){
    box.appendChild(el('p',{class:'note',
      text:'No weir reading this time — ' + w.failed + '. That is not the same as none of them being over.'}));
    return box;
  }
  if (w.over.length){
    w.over.forEach(function(o){
      var p = el('p',{class:'warnbox'});
      p.appendChild(el('b',{text:o.w.name + ' is ' + fmt(o.ft,1) + ' ft over its crest.'}));
      p.appendChild(document.createTextNode(' Water is leaving the main river for ' +
        o.w.into + ', and fish go with it.'));
      box.appendChild(p);
    });
  } else {
    box.appendChild(el('p',{class:'note',
      text:'None of the ' + countWord((river.weirs && river.weirs.list ? river.weirs.list : []).length) +
        ' weirs is over its crest, so the river is in its own channel.'}));
  }
  if (w.unknown.length) box.appendChild(el('p',{class:'note',
    text:'No figure published for ' + w.unknown.map(function(x){ return x.w ? x.w.name : x.name; }).join(' or ') +
      ' in this file, so those are unknown rather than quiet.'}));
  box.appendChild(el('p',{class:'note',
    text:'Measured for ' + w.at + ', from ' + river.weirs.source +
      '. The same file carries a forecast for the days ahead; that is somebody’s model and is not repeated here.'}));
  return box;
}

/* =====================================================================
   The last seven days.

   A reading is a number; a trend is a decision. A river that has dropped
   two thousand cubic feet a second since Tuesday fishes differently from
   one that has just come up by the same amount, and in a single figure
   those two look identical.

   It is fetched for the river on screen only, and only for the gauges the
   figures already come from. NWIS publishes instantaneous values every
   fifteen minutes and will not downsample: a week of one parameter at one
   site is 55KB, and asking every gauge on the Sacramento for both flow and
   temperature is 429KB — measured — for a line three hundred pixels wide
   that cannot show a tenth of it. The daily-values service would be a
   twentieth of that and was tried first: it publishes NOTHING for water
   temperature at any of these sites and nothing for flow at two of them,
   so it cannot answer this question at all.
   ===================================================================== */
var TREND_DAYS = 7;
var TREND_MAX_POINTS = 240;   /* more than a phone-width line can show */

/* One series per site per parameter, oldest first. Same refusals as the
   current-reading parser: the sentinel is a missing reading, not a value. */
function parseUsgsSeries(j){
  var out = {};
  var ts = j && j.value && j.value.timeSeries;
  if (!Array.isArray(ts)) return out;
  ts.forEach(function(t){
    var si = t.sourceInfo || {};
    var code = si.siteCode && si.siteCode[0] && si.siteCode[0].value;
    var pc = t.variable && t.variable.variableCode && t.variable.variableCode[0]
             && t.variable.variableCode[0].value;
    if (!code || !pc) return;
    var vals = t.values && t.values[0] && t.values[0].value;
    if (!Array.isArray(vals) || !vals.length) return;
    var pts = [];
    vals.forEach(function(x){
      var v = Number(x.value);
      if (!isFinite(v) || v <= -999998) return;
      var when = Date.parse(x.dateTime);
      if (!isFinite(when)) return;
      pts.push({ t:when, v: pc === '00010' ? cToF(v) : v });
    });
    if (!pts.length) return;
    pts.sort(function(a,b){ return a.t - b.t; });
    (out[code] || (out[code] = {}))[pc === '00010' ? 'temp' : pc === '00060' ? 'flow' : pc] = pts;
  });
  return out;
}

/* =====================================================================
   THE TIDE ALONG THE RIVER.

   The app could say the tide turns, and at which station, and it could say
   "running both ways — 3 of 6 gauges read upstream". What it could not do is
   show WHERE along the river the tide is winning, which is the question
   somebody standing on a bank actually has.

   IT IS MEASURED, NOT PREDICTED, AND THAT IS NOT A COMPROMISE. NOAA publishes
   tidal CURRENT predictions — slack water, maximum flood and ebb — for 4,430
   stations, 48 of them in the Delta, and every one of those is in the WESTERN
   Delta: the furthest upstream on this river is Sacramento River Light 14 at
   38.077, below Rio Vista. Above that point nobody publishes which way the
   water will be running, at any time. USGS measures it instead, at six gauges
   on this river, and every one of them is at or below Freeport — the
   instrument network exists in the tidal reach and stops where the tide does.

   So this draws the measurement and never guesses past it. It does not say
   when the tide will next turn: that would be an inference dressed as a
   reading, on water where the real thing is not published. It says when each
   place last turned, which is a fact, and the reader can count forward.
   ===================================================================== */

/* SLACK IS NOT A CROSSING OF ZERO, IT IS A DRIFT THROUGH IT. Counting sign
   changes reported Walnut Grove turning three times between 06:00 and 06:30 —
   that is the velocity hovering at zero through slack water and flickering,
   not the tide turning three times in half an hour. A direction only counts
   as established once the water is moving hard enough to mean it. */
var VEL_SLACK = 0.15;   /* ft/s */

/* A series of readings becomes a list of runs: each one a confirmed direction
   with the time it began. Readings inside the slack band belong to whichever
   run they are between, and start no run of their own. */
function velocityRuns(points){
  var runs = [], dir = null;
  points.forEach(function(pt){
    if (!isNum(pt.v)) return;
    if (Math.abs(pt.v) < VEL_SLACK) return;      /* still in the turn */
    var d = pt.v >= 0 ? 'down' : 'up';
    if (d !== dir){
      dir = d;
      runs.push({ dir:d, from:pt.t, to:pt.t, peak:Math.abs(pt.v) });
    } else {
      var r = runs[runs.length - 1];
      r.to = pt.t;
      if (Math.abs(pt.v) > r.peak) r.peak = Math.abs(pt.v);
    }
  });
  return runs;
}

/* One request, one day, one parameter. Roughly 47 KB for six sites at fifteen
   minutes, which is why it is asked for on a press rather than on every river
   the reader looks at. */
function usgsVelocity(ids){
  var url = USGS + '?format=json&sites=' + ids.join(',') +
            '&parameterCd=72255&period=P1D&siteStatus=all';
  return getJSON(url, 45000).then(function(j){
    var out = {};
    ((j && j.value && j.value.timeSeries) || []).forEach(function(ts){
      var code = ts.sourceInfo.siteCode[0].value;
      var pts = [];
      (((ts.values || [])[0] || {}).value || []).forEach(function(v){
        var n = parseFloat(v.value);
        /* -999999 is the no-reading sentinel and is not a velocity. */
        if (!isNum(n) || n <= -999998) return;
        pts.push({ t: Date.parse(v.dateTime), v: n });
      });
      pts.sort(function(a, b){ return a.t - b.t; });
      if (pts.length) out[code] = pts;
    });
    logNet('USGS velocity', url, true, Object.keys(out).length + ' site(s) with a day of velocity');
    return out;
  }, function(e){
    logNet('USGS velocity', url, false, String(e && e.message || e));
    throw e;
  });
}

/* The gauges that actually measure which way the water is going, ordered
   downstream first — the same order as the ribbon reads left to right. */
function velGauges(river){
  var payload = state.gauges[river.id];
  if (!payload || !payload.rows) return [];
  return payload.rows
    .filter(function(r){
      if (r.context || !isNum(r.vel) || !isNum(axisValue(river, r))) return false;
      /* A GAUGE ARGUING WITH ITSELF IS NOT A DIRECTION. Where the velocity and
         the discharge at one instrument sign differently, the app already
         refuses to choose between them, and drawing an arrow here would be
         this figure asserting what the rest of the app declines to. */
      var vr = velReading(r);
      return !!vr && !vr.conflict;
    })
    .sort(function(a, b){ return axisValue(river, a) - axisValue(river, b); });
}

/* Named separately so they can be SAID rather than silently dropped. */
function velConflicts(river){
  var payload = state.gauges[river.id];
  if (!payload || !payload.rows) return [];
  return payload.rows.filter(function(r){
    if (r.context || !isNum(r.vel)) return false;
    var vr = velReading(r);
    return !!vr && vr.conflict;
  });
}

var FLOOD = '#7BD5D9';   /* the tide pushing in  */
var EBB   = '#9BD98C';   /* the river running out */

/* HOW FAR UP THE TIDE ACTUALLY GOT, MEASURED.

   The ribbon already carries a "tide reaches about here" mark, and it is the
   DECLARED one: the furthest-upstream NOAA station on the river, which is a
   fact about where the instruments are rather than about the water. It does
   not move. The real limit does — how far a flood pushes depends on how much
   water the river is carrying, so it walks up and down the river with the
   season and with every storm, and in a wet week it can be twenty miles below
   where the dashed rule stands.

   This is the other one, and it is measured: of the gauges that publish a day
   of velocity, the furthest upstream that actually ran BACKWARDS in that day.
   Above it, nothing that measures direction saw the tide win.

   IT IS A FLOOR, NOT A LIMIT, AND THE APP MUST SAY SO. The next gauge up may
   have reversed too and simply not be instrumented for it — the network stops
   where it stops. So this is "the tide was measured pushing water back at
   least this far", which is a fact, and never "the tide reaches here", which
   would be this figure asserting the shape of the whole river from six
   instruments. Where the highest gauge on the list is the one that reversed,
   there is no upper bound in the data at all and it says that too.

   Needs the day: the instant reading answers only for this minute, and a
   gauge that is ebbing right now may have flooded four hours ago. */
function maxReversal(river, gs, hist){
  if (!hist) return null;
  var found = null, withDay = 0;
  gs.forEach(function(r, i){
    var pts = hist[r.id] || [];
    if (!pts.length) return;
    withDay++;
    var ran = velocityRuns(pts).filter(function(run){ return run.dir === 'up'; });
    if (!ran.length) return;
    /* gs is sorted downstream first, so a later index is further up. */
    var peak = ran.reduce(function(a, b){ return b.peak > a.peak ? b : a; });
    found = { i:i, row:r, last:ran[ran.length - 1], peak:peak.peak };
  });
  if (!found) return null;
  found.withDay = withDay;
  /* Nothing above it measured direction, so the data has no upper bound. */
  found.topmost = found.i === gs.length - 1;
  /* The lowest gauge above it that has a day and did NOT reverse — the one
     that puts a ceiling on this. */
  found.above = null;
  for (var k = found.i + 1; k < gs.length; k++){
    if ((hist[gs[k].id] || []).length){ found.above = gs[k]; break; }
  }
  return found;
}

function loadVelocityDay(river, gs){
  if (state.velLoading) return;
  state.velLoading = true; state.velFailed = null;
  renderWater();
  usgsVelocity(gs.map(function(r){ return r.id; })).then(function(out){
    state.velHistory = state.velHistory || {};
    state.velHistory[river.id] = out;
    state.velLoading = false; renderWater();
    announce('The last day of velocity is drawn.');
  }, function(e){
    state.velLoading = false;
    state.velFailed = String(e && e.message || e);
    renderWater();
  });
}

function tideAlongRiver(river){
  var box = el('div', {});
  var gs = velGauges(river);
  if (!gs.length){
    box.appendChild(el('p',{class:'note',
      text:'No gauge on the ' + river.name + ' publishes water velocity, so there is nothing measured to say which way it is running. The tide table above is a prediction for one place and stays the only answer here.'}));
    return box;
  }

  /* THE TWO ANSWERS SIDE BY SIDE, WHICH IS THE POINT OF HAVING BOTH.
     The panel above predicts the water LEVEL at one station; this measures
     which way it is RUNNING at every gauge that can tell. They are famously
     out of step on an estuary — the current keeps running upstream for a
     while after high water, and slack is not the turn of the tide — so a
     reader who finds them disagreeing has not found a fault. Saying so is
     cheaper than letting them work out which one is lying. */
  var lvl = tidePhase(river);
  if (lvl)
    box.appendChild(el('p',{class:'note',
      text:'The level at the station above is ' + (lvl.rising ? 'rising' : 'falling') +
        '. That is a prediction of height at one place; what follows is measured direction at each gauge, and the two are not the same thing and need not agree \u2014 on this water the current runs on for a while after the level turns, so a rising level with the water still running out is ordinary rather than a fault.'}));

  var up = gs.filter(function(r){ return r.vel < 0; }).length;
  box.appendChild(el('p',{class:'note',
    text: up === 0
      ? 'Every gauge that measures it is running downstream right now. The tide is not pushing water back up any part of this river that is instrumented.'
      : up === gs.length
        ? 'Every gauge that measures it is running upstream right now — the tide is pushing in along the whole instrumented reach.'
        : 'The tide is pushing in at ' + up + ' of these ' + gs.length +
          ' and the river is winning at the rest. The change happens between them.'}));

  var hist = (state.velHistory || {})[river.id];
  /* Agreed to once, so it is fetched without asking again — and only once per
     visit, because the guard is the fetch already being in flight. */
  if (!hist && !state.velLoading && !state.velFailed && sget(river.id, 'velday'))
    loadVelocityDay(river, gs);
  box.appendChild(tideAlongFigure(river, gs, hist));

  /* HOW FAR UP IT GOT, IN A SENTENCE, and the two things that stop it being
     a claim about the whole river: how many gauges published a day at all,
     and what sits above the one that reversed. A figure with a rule drawn
     across it and no account of what bounds it invites the reader to take it
     for the limit of the tide, which it is not. */
  var mxr = maxReversal(river, gs, hist);
  if (hist){
    if (!mxr){
      box.appendChild(el('p',{class:'note',
        text:'No gauge on this river measured water running upstream at any point in the last day. That is not the same as the tide not reaching them: it means no instrument that publishes direction saw it win, over the day shown.'}));
    } else {
      var far = 'Measured, the tide pushed water back up this river at least as far as ' +
        shortGauge(river, mxr.row, 99) + ' in the last day — ' +
        fmt(mxr.peak, 2) + ' ft/s at its hardest, and it last did so ' +
        agoWords(Date.now() - mxr.last.from) + '.';
      far += mxr.topmost
        ? ' That is the furthest-upstream gauge on this river that publishes a day of direction, so nothing in the data puts a ceiling on it: the tide may well push further and there is no instrument up there to say.'
        : ' The next gauge up that published a day, ' + shortGauge(river, mxr.above, 99) +
          ', did not reverse in that day — so the turn-round point sat somewhere between the two.';
      far += ' This is a floor and not a limit. ' + mxr.withDay + ' of these ' + gs.length +
        ' gauges published a day of readings, and how far a flood pushes moves with how much water the river is carrying — it walks up and down the river with the season and with every storm, which is why the dashed mark on the ribbon above, drawn at the furthest-upstream tide STATION, does not move and this does.';
      box.appendChild(el('p',{class:'note',text:far}));
    }
  }

  /* Dropped from the drawing, not from the account of it. */
  var bad = velConflicts(river);
  if (bad.length)
    box.appendChild(el('p',{class:'note',
      text: (bad.length === 1 ? 'One gauge is' : bad.length + ' gauges are') +
        ' left out of this: ' +
        bad.map(function(r){ return shortGauge(river, r, 99); }).join(', ') +
        '. Its velocity and its discharge disagree about which way that water is going, and two instruments at one place disagreeing is not a fact about the river \u2014 picking the likelier one would be inventing the answer.'}));

  /* The day is 47 KB and this panel is the landing screen, so it is asked for
     rather than fetched for everybody. */
  var row = el('div',{class:'rowline'});
  if (!hist){
    var b = el('button',{type:'button',
      text: state.velLoading ? 'Reading the last day…' : 'Show the last day'});
    b.disabled = !!state.velLoading;
    b.addEventListener('click', function(){
      /* CONSENT IS REMEMBERED, THE DATA IS NOT. Asking again on every visit
         for something already agreed to is the app forgetting a decision the
         reader made; caching the readings themselves would be worse, because
         a day of velocity is only useful while it is today. */
      sput(river.id, 'velday', true);
      loadVelocityDay(river, gs);
    });
    row.appendChild(b);
    box.appendChild(row);
    if (state.velFailed)
      box.appendChild(el('p',{class:'err',
        text:'The velocity history did not answer: ' + state.velFailed + '. Nothing you did — that is the USGS server. The arrows above are this moment and do not need it.'}));
    else
      box.appendChild(el('p',{class:'note',
        text:'About 47 KB, one request, so it is not fetched unless you ask.'}));
  }

  box.appendChild(foldNote('What this is measuring, and what it will not tell you', [
    'The sign of a gauge\u2019s velocity is the useful part: negative means the water is running upstream, which on this water is the tide pushing in. It is a MEASUREMENT of this moment, where the tide table above is a prediction \u2014 and where the two disagree, the water is the authority.',
    'It will not tell you when the tide will next turn. Nobody publishes that for this river: NOAA predicts tidal currents at 4,430 places and the furthest upstream on this water is below Rio Vista, so above that point there is no forecast of which way the water will run. Working one out from these readings would be a guess wearing the clothes of a reading. What is shown is when each place last turned, which is measured, and the interval between turns is a little over six hours.',
    'A gauge that has not turned in the day shown has not turned in the day shown \u2014 it is not a statement that the tide never reaches it. How far up the reversal goes depends on how much water the river is carrying, so it moves with the season and with every storm.'
  ]));
  return box;
}

/* THE FIGURE. One row per gauge, downstream at the top, so reading down the
   page is going up the river. Each row carries an arrow for what the water is
   doing NOW, and — once the day has been asked for — a band of the last
   twenty-four hours beside it, flood and ebb shaded.

   Stacked that way the tidal wave is visible as a diagonal: the turn arrives
   at Rio Vista and reaches Georgiana Slough an hour and three quarters later,
   and the top of the reach never turns at all. That is the distance-and-time
   shape the convention uses for a wave travelling up an estuary, and it is
   the only view here that answers "what is the tide doing to the RIVER"
   rather than "what is it doing at one station". */
function tideAlongFigure(river, gs, hist){
  var narrow = window.matchMedia && window.matchMedia('(max-width:620px)').matches;
  var W = narrow ? 320 : 560;
  /* Wide enough for the longest hint at the size it is drawn — "Below Walnut
     Grove bridge" ran into the arrow column at 132. */
  var rowH = 34, top = 22, labelW = narrow ? 104 : 156, arrowW = 74;
  var bandX = labelW + arrowW + 8;
  var bandW = Math.max(40, W - bandX - 8);
  /* Room at the foot for the key. This figure says two things in colour and
     would otherwise say neither: the same defect as a map whose cyan wash had
     no swatch, in the same app, two releases ago. */
  var keyH = 20;
  var H = top + gs.length * rowH + 26 + keyH;

  /* WIDTH 100% AND AN EXPLICIT HEIGHT ARE A CONTRADICTION, and the browser
     resolves it by letterboxing: the viewBox scales down to fit the width, the
     element keeps the height it was told, and the drawing floats in the middle
     of a few hundred pixels of nothing. With sixteen Delta gauges that was a
     screen of blank above the rows. Give it the viewBox and let the aspect
     ratio set the height, and anchor the drawing to the top-left so any
     rounding leftover is at the bottom rather than split around it. */
  var fig = svg('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%',
    preserveAspectRatio:'xMinYMin meet',
    style:'height:auto; display:block', role:'img',
    'aria-label':'Which way the water is running at each gauge on the ' +
      river.name + ', downstream at the top' +
      (hist ? ', with the last day beside it shaded blue where the tide was pushing upstream and green where the river was running down, and a dashed rule under the highest gauge that ran backwards in that day' : '') + '.',
    'aria-describedby': 'alongdesc-' + river.id });
  var g = svg('g', {});

  /* The clock only exists once there is a day to put under it. */
  var now = Date.now(), dayAgo = now - 24 * 3600 * 1000;
  if (hist){
    g.appendChild(svg('text',{ x:bandX, y:12, fill:'#9FB3B1', 'font-size':'9' }))
      .textContent = '24 hours ago';
    var rt = svg('text',{ x:bandX + bandW, y:12, fill:'#9FB3B1', 'font-size':'9',
      'text-anchor':'end' });
    rt.textContent = 'now';
    g.appendChild(rt);
  }

  /* THE HIGHEST GAUGE THAT ACTUALLY RAN BACKWARDS IN THE DAY. Measured, and
     only available once the day has been asked for — the instant arrows
     answer for this minute and a gauge ebbing now may have flooded at dawn. */
  var mx = maxReversal(river, gs, hist);

  gs.forEach(function(r, i){
    var y = top + i * rowH;

    /* THE MARK GOES BEHIND THE ROW, not beside it: a badge in the margin on a
       320px drawing is another column to find room for, and this has to read
       as "up to HERE" rather than as a note about one gauge. A rule under the
       row is the boundary; the tint above it is the reach the tide was
       measured in. */
    if (mx && i === mx.i){
      g.appendChild(svg('rect',{ x:0, y:top - 8, width:W,
        height:(y + 9) - (top - 8), fill:FLOOD, 'fill-opacity':'.07' }));
      g.appendChild(svg('line',{ x1:0, y1:y + 10, x2:W, y2:y + 10,
        stroke:FLOOD, 'stroke-width':'1.2', 'stroke-dasharray':'4 3' }));
      /* NO CAPTION ON THE ROW. At 9px the sentence is 230px wide, the band
         starts at 186 on a phone, and the row below is 34px down — it would
         cross the day's shading and touch the next gauge's name. The rule and
         the tint are the mark; the words are in the key at the foot, where
         there is room for them, and in the paragraph above the figure. */
    }

    var nm = svg('text',{ x:0, y:y + 4, fill:'#E6F0EF', 'font-size':'10' });
    nm.textContent = shortGauge(river, r, narrow ? 17 : 24);
    g.appendChild(nm);

    /* NOW: an arrow whose direction is the direction and whose length is the
       speed, against a common scale so two rows can be compared. */
    var up = r.vel < 0, sp = Math.abs(r.vel);
    var maxSp = Math.max.apply(null, gs.map(function(x){ return Math.abs(x.vel); })) || 1;
    var len = 14 + (sp / maxSp) * (arrowW - 24);
    var ax = labelW + 6, mid = y;
    var x1 = up ? ax + len : ax, x2 = up ? ax : ax + len;
    g.appendChild(svg('line',{ x1:x1, y1:mid, x2:x2, y2:mid,
      stroke: up ? FLOOD : EBB, 'stroke-width':'3', 'stroke-linecap':'round' }));
    var hx = up ? ax : ax + len, dx = up ? 6 : -6;
    g.appendChild(svg('path',{ d:'M' + hx + ' ' + mid + ' l' + dx + ' -4 l0 8 z',
      fill: up ? FLOOD : EBB }));
    var sl = svg('text',{ x:labelW + 6 + arrowW - 16, y:mid + 12, fill:'#9FB3B1',
      'font-size':'9', 'text-anchor':'end' });
    sl.textContent = fmt(sp, 2) + ' ft/s';
    g.appendChild(sl);

    if (!hist) return;

    /* THE DAY. Each confirmed run shaded; the gaps between runs are the
       turns, drawn as nothing rather than as a guess about the moment. */
    var pts = hist[r.id] || [];
    var bx = function(t){
      return bandX + Math.max(0, Math.min(1, (t - dayAgo) / (now - dayAgo))) * bandW;
    };
    g.appendChild(svg('rect',{ x:bandX, y:y - 7, width:bandW, height:14,
      fill:'#16302e', stroke:'#1F5B57' }));
    if (!pts.length){
      var no = svg('text',{ x:bandX + 5, y:y + 4, fill:'#9FB3B1', 'font-size':'9' });
      /* IT IS THE HISTORY THAT IS MISSING, NOT THE VELOCITY. This gauge has
         an arrow beside it, so saying "no velocity published" here
         contradicts the row it is on. A gauge can report the instant and
         publish no day of it. */
      no.textContent = 'no day of readings published for this gauge';
      g.appendChild(no);
      return;
    }
    var runs = velocityRuns(pts);
    runs.forEach(function(run){
      var x = bx(run.from), w = Math.max(1, bx(run.to) - x);
      g.appendChild(svg('rect',{ x:x, y:y - 7, width:w, height:14,
        fill: run.dir === 'up' ? FLOOD : EBB, 'fill-opacity':'.55' }));
    });
    /* The mark on each turn, which is the thing the eye should follow down
       the rows. The FIRST run has no turn before it inside this window. */
    runs.slice(1).forEach(function(run){
      var x = bx(run.from);
      g.appendChild(svg('line',{ x1:x, y1:y - 9, x2:x, y2:y + 9,
        stroke:'#E6F0EF', 'stroke-width':'1' }));
    });
    var last = runs.length > 1 ? runs[runs.length - 1] : null;
    var tl = svg('text',{ x:bandX + bandW, y:y + 18, fill:'#9FB3B1', 'font-size':'9',
      'text-anchor':'end' });
    tl.textContent = last
      ? 'last turned ' + agoWords(now - last.from)
      : 'has not turned in this day';
    g.appendChild(tl);
  });

  /* THE KEY. Two colours carrying two meanings, said plainly, inside the
     picture that uses them. */
  var ky = top + gs.length * rowH + 14;
  var kx = labelW ? 0 : 0;
  [[FLOOD, 'the tide pushing in — upstream'], [EBB, 'the river running out — downstream']]
    .forEach(function(pair, i){
      var x = kx + i * (narrow ? 0 : 250);
      var yy = ky + (narrow ? i * 13 : 0);
      g.appendChild(svg('rect',{ x:x, y:yy - 7, width:14, height:9,
        fill:pair[0], 'fill-opacity':'.55', stroke:'#1F5B57' }));
      var t2 = svg('text',{ x:x + 19, y:yy, fill:'#9FB3B1', 'font-size':'9' });
      t2.textContent = pair[1];
      g.appendChild(t2);
    });
  /* THE THIRD THING THE PICTURE SAYS IN A MARK, said in words in the same
     place as the other two. A dashed rule and a tint with nothing naming them
     is the defect the first two entries here exist to fix, one release ago. */
  var extraKey = 0;
  if (mx){
    var ry = ky + (narrow ? 2 * 13 : 15);
    g.appendChild(svg('line',{ x1:0, y1:ry - 3, x2:14, y2:ry - 3,
      stroke:FLOOD, 'stroke-width':'1.2', 'stroke-dasharray':'4 3' }));
    var t3 = svg('text',{ x:19, y:ry, fill:'#9FB3B1', 'font-size':'9' });
    t3.textContent = 'the tide pushed back at least this far in the last day';
    g.appendChild(t3);
    extraKey = narrow ? 13 : 15;
  }
  fig.setAttribute('viewBox', '0 0 ' + W + ' ' + (H + (narrow ? 13 : 0) + extraKey));

  fig.appendChild(g);

  /* EVERYTHING ABOVE IS INSIDE A role="img", WHICH PRUNES ITS SUBTREE.
     Every gauge's name, direction, speed and last turn is drawn in there and
     is therefore unreachable — the same trap that made four river-row buttons
     invisible a release ago. So the figure carries a described-by list saying
     the same things in sentences. It is hidden from the eye because the
     picture already shows it, and present for anything that cannot see the
     picture. */
  var wrap2 = el('div', {});
  wrap2.appendChild(fig);
  var desc = el('div', { class:'vh', id:'alongdesc-' + river.id });
  gs.forEach(function(r){
    var up2 = r.vel < 0;
    var line = shortGauge(river, r, 99) + ': running ' +
      (up2 ? 'upstream, the tide pushing in' : 'downstream') +
      ' at ' + fmt(Math.abs(r.vel), 2) + ' feet per second';
    if (hist){
      var pts2 = hist[r.id] || [];
      if (!pts2.length) line += '; no day of readings published for this gauge';
      else {
        var runs2 = velocityRuns(pts2);
        line += runs2.length > 1
          ? '; last turned ' + agoWords(Date.now() - runs2[runs2.length - 1].from)
          : '; has not turned in the last day';
      }
    }
    desc.appendChild(el('p', { text: line + '.' }));
  });
  /* The rule and the tint are drawn inside a role="img" and are therefore
     unreachable. They are the figure's third statement and it says it here. */
  if (mx)
    desc.appendChild(el('p', { text:'The tide was measured pushing water back upstream at least as far as ' +
      shortGauge(river, mx.row, 99) + ' in the last day' +
      (mx.topmost ? ', which is the furthest-upstream gauge here that publishes direction, so nothing above it measures whether the tide goes further' : '') +
      '. This is a floor, not the limit of the tide.' }));
  wrap2.appendChild(desc);
  return wrap2;
}

/* "SACRAMENTO R BL GEORGIANA SLOUGH CA" in a 96px column is a smear, and
   chopping it produced "Walnut grove br a wal…". Every declared gauge already
   carries a hint written by a person — "below Walnut Grove bridge", "Deep
   Water Ship Channel near Freeport" — so the short name is one that exists
   rather than one cut out of the service's. Only a gauge found by the basin
   sweep falls back to trimming, and then the river's own name is the part
   every row shares and so the part to drop. */
function shortGauge(river, r, max){
  var declared = (river.gauges || []).filter(function(g){ return g.id === r.id; })[0];
  var s2 = (declared && declared.hint) || String(r.name || r.id)
    .replace(/^SACRAMENTO R(IVER)?\s+(A|AT|BL|BELOW|AB|ABOVE|NR|NEAR)\s+/i, '')
    .replace(/^MOKELUMNE R(IVER)?\s+(A|AT|BL|BELOW|AB|ABOVE|NR|NEAR)\s+/i, '')
    .replace(/^SACRAMENTO R(IVER)?\s+/i, '')
    .replace(/^MOKELUMNE R(IVER)?\s+/i, '')
    .replace(/\s+CA$/i, '');
  s2 = s2.charAt(0).toUpperCase() + s2.slice(1);
  return s2.length > max ? s2.slice(0, max - 1) + '\u2026' : s2;
}

function agoWords(ms){
  var m = Math.round(ms / 60000);
  if (m < 60) return m + ' min ago';
  var h = Math.floor(m / 60), r = m % 60;
  return h + 'h' + (r ? ' ' + r + 'm' : '') + ' ago';
}

function usgsTrend(ids){
  var url = USGS + '?format=json&sites=' + ids.join(',') +
            '&parameterCd=00060,00010&period=P' + TREND_DAYS + 'D&siteStatus=all';
  /* Longer than the current-reading request, because this one is a hundred
     kilobytes or more and a phone on a bar of signal is the normal case. */
  return getJSON(url, 45000).then(function(j){
    var parsed = parseUsgsSeries(j);
    logNet('USGS trend', url, true, Object.keys(parsed).length + ' site(s) with history');
    return parsed;
  }, function(e){
    logNet('USGS trend', url, false, String(e && e.message || e));
    throw e;
  });
}

/* CDEC does downsample, and hourly is plenty for a week: 27KB a station
   against 27KB an hour's worth of the fifteen-minute record. */
function cdecTrend(river){
  var list = river.cdecGauges || [];
  if (!list.length) return Promise.resolve({});
  var start = new Date(); start.setDate(start.getDate() - TREND_DAYS);
  var end   = new Date(); end.setDate(end.getDate() + 1);
  function ymdDash(d){
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  var url = cdecUrl(CDEC_PATH + '?Stations=' + list.map(function(g){ return g.id; }).join(',') +
    '&SensorNums=20,25&dur_code=H&Start=' + ymdDash(start) + '&End=' + ymdDash(end));
  return getJSON(url, 45000).then(function(rows){
    var out = {};
    (Array.isArray(rows) ? rows : []).forEach(function(r){
      var id = r && r.stationId;
      if (!id) return;
      var v = Number(r.value);
      if (!isNum(v) || v <= -9998) return;
      var when = cdecDate(r.obsDate || r.date);
      if (!when) return;
      var units = String(r.units || '').toUpperCase();
      var site = out[id] || (out[id] = {});
      /* The same unit check as the current reading. A sensor renumbered or
         re-scaled at the far end produces no line rather than a wrong one. */
      if (r.SENSOR_NUM === 20 && units === 'CFS')
        (site.flow || (site.flow = [])).push({ t:when.getTime(), v:v });
      if (r.SENSOR_NUM === 25 && (units === 'DEG F' || units === 'DEG C'))
        (site.temp || (site.temp = [])).push({ t:when.getTime(),
          v: units === 'DEG C' ? cToF(v) : v });
    });
    Object.keys(out).forEach(function(id){
      Object.keys(out[id]).forEach(function(k){
        out[id][k].sort(function(a,b){ return a.t - b.t; });
      });
    });
    logNet('CDEC trend', url, true, Object.keys(out).length + ' station(s) with history');
    return out;
  }, function(e){
    logNet('CDEC trend', url, false, String(e && e.message || e));
    throw e;
  });
}

/* Which gauges to ask. Flow comes from whichever gauge the card already
   names, so the line and the figure above it cannot disagree; temperature
   from that same gauge if it has a thermometer, and otherwise from the
   first on-river gauge that does — Verona measures the Sacramento's
   discharge and has no thermometer at all, so on that river these are two
   different sites and the panel says which is which. */
function trendSites(river){
  var payload = state.gauges[river.id];
  if (!payload || !payload.rows) return null;
  var flow = downstreamFlow(river);
  var rows = payload.rows.filter(function(r){ return !r.context && isNum(r.tempF); });
  /* Nearest first, along the river's own axis, so the temperature comes
     from near the water the flow figure describes rather than from
     whichever gauge happens to be listed first. */
  if (flow){
    var at = null;
    payload.rows.forEach(function(r){ if (r.id === flow.id) at = axisValue(river, r); });
    if (isNum(at)) rows = rows.slice().sort(function(a,b){
      var da = isNum(axisValue(river,a)) ? Math.abs(axisValue(river,a) - at) : 1e9;
      var db = isNum(axisValue(river,b)) ? Math.abs(axisValue(river,b) - at) : 1e9;
      return da - db;
    });
  }
  /* TWO temperature candidates, not one, and this is why: Verona reports a
     temperature right now and publishes no history for it at all, so the
     obvious rule — ask the gauge the flow figure came from — produced a
     Sacramento with a flow line and the words "no temperature history" on
     the river with the most instrumented reach in the state. Whether a site
     publishes a week of a parameter cannot be known without asking, so ask
     two and draw whichever answers. */
  var temp = rows.slice(0, 2).map(function(r){
    return { id:r.id, name:r.name || r.id, source:r.source };
  });
  if (!flow && !temp.length) return null;
  return {
    flow: flow ? { id:flow.id, name:flow.name, source:flow.source, tidal:flow.tidal } : null,
    temp: temp
  };
}

function loadTrend(river){
  var want = trendSites(river);
  if (!want) return Promise.resolve({ failed:'no gauge to read a trend from yet' });
  var ids = {};
  if (want.flow) ids[want.flow.id] = want.flow.source || 'USGS';
  want.temp.forEach(function(t){ ids[t.id] = t.source || 'USGS'; });
  var usgs = Object.keys(ids).filter(function(k){ return ids[k] !== 'CDEC'; });
  var cdec = Object.keys(ids).filter(function(k){ return ids[k] === 'CDEC'; });

  /* Which request failed matters, and it took a live run to notice why: a
     USGS timeout with no CDEC request beside it left an empty series set and
     every gauge was then reported as publishing NO HISTORY — a confident
     claim about the American River, which publishes a full week, produced by
     a request that never arrived. A refusal and an absence are different
     facts and this app is not allowed to print one as the other. */
  var failed = [];
  var jobs = [
    usgs.length ? usgsTrend(usgs).catch(function(){ failed.push('USGS'); return null; })
                : Promise.resolve({}),
    cdec.length ? cdecTrend(river).catch(function(){ failed.push('CDEC'); return null; })
                : Promise.resolve({})
  ];
  return Promise.all(jobs).then(function(res){
    if (failed.length){
      var cached = sget(river.id,'trend');
      if (cached){ cached.stale = true; return cached; }
      return { failed: failed.join(' and ') + ' did not answer' };
    }
    var series = {};
    [res[0] || {}, res[1] || {}].forEach(function(set){
      Object.keys(set).forEach(function(k){ series[k] = set[k]; });
    });
    var out = { fetchedAt: Date.now(), days: TREND_DAYS,
      flow: null, temp: null, tidal: !!(want.flow && want.flow.tidal) };
    if (want.flow && series[want.flow.id] && series[want.flow.id].flow)
      out.flow = { site:want.flow.id, name:want.flow.name, source:want.flow.source || 'USGS',
                   pts:series[want.flow.id].flow };
    want.temp.some(function(t){
      if (!series[t.id] || !series[t.id].temp) return false;
      out.temp = { site:t.id, name:t.name, source:t.source || 'USGS', pts:series[t.id].temp };
      return true;
    });
    /* A site that answers the current-reading request and publishes no
       history is a real state, not an error: every Mokelumne gauge does
       exactly that. Say which gauge was asked, so it is a fact rather
       than an absence. */
    /* CDEC's date range starts at midnight, so a seven-day request comes
       back with eight days in it and the sentence under the line said
       "over 8 days" beneath a heading that said seven. Clip to the window
       actually claimed. */
    var floor = Date.now() - TREND_DAYS * 24 * 3600 * 1000;
    ['flow','temp'].forEach(function(k){
      if (out[k]) out[k].pts = out[k].pts.filter(function(pt){ return pt.t >= floor; });
      if (out[k] && out[k].pts.length < 2) out[k] = null;
    });
    out.noHistory = [];
    if (want.flow && !out.flow) out.noHistory.push({ what:'flow', name:want.flow.name, id:want.flow.id });
    if (want.temp.length && !out.temp) out.noHistory.push({ what:'temperature',
      name: want.temp.map(function(t){ return t.name; }).join(' or '),
      id: want.temp.map(function(t){ return t.id; }).join(', ') });
    /* Stored trimmed: the drawn line cannot use more points than this and
       a week of fifteen-minute values will not fit a storage quota. */
    var slim = { fetchedAt:out.fetchedAt, days:out.days, tidal:out.tidal, noHistory:out.noHistory,
      flow: out.flow ? { site:out.flow.site, name:out.flow.name, source:out.flow.source,
                         pts:thin(out.flow.pts, TREND_MAX_POINTS) } : null,
      temp: out.temp ? { site:out.temp.site, name:out.temp.name, source:out.temp.source,
                         pts:thin(out.temp.pts, TREND_MAX_POINTS) } : null };
    sput(river.id,'trend', slim);
    return out;
  });
}

/* Keep the ends and the extremes, drop from the middle. A line that loses
   its peak has lost the only part of it anybody was looking for. */
function thin(pts, max){
  if (!pts || pts.length <= max) return pts || [];
  var keep = {}, lo = 0, hi = 0;
  pts.forEach(function(p,i){ if (p.v < pts[lo].v) lo = i; if (p.v > pts[hi].v) hi = i; });
  keep[0] = keep[pts.length-1] = keep[lo] = keep[hi] = true;
  var step = (pts.length - 1) / (max - 1);
  for (var i = 0; i < max; i++) keep[Math.round(i * step)] = true;
  return pts.filter(function(p,i){ return keep[i]; });
}

/* What the line says, in words, because a shape is not a fact and colour
   is never the only thing carrying one here. */
function trendStats(pts, band){
  if (!pts || pts.length < 2) return null;
  var first = pts[0], last = pts[pts.length-1];
  var lo = pts[0], hi = pts[0];
  pts.forEach(function(p){ if (p.v < lo.v) lo = p; if (p.v > hi.v) hi = p; });
  var delta = last.v - first.v;
  var base = Math.abs(first.v) > 1e-6 ? Math.abs(first.v) : null;
  var pct = base ? (delta / base) * 100 : null;
  var dir = Math.abs(delta) < band ? 'steady' : (delta > 0 ? 'up' : 'down');
  var day = null;
  var cutoff = last.t - 24*3600*1000;
  for (var i = pts.length - 1; i >= 0; i--){ if (pts[i].t <= cutoff){ day = pts[i]; break; } }
  return { first:first, last:last, lo:lo, hi:hi, delta:delta, pct:pct, dir:dir,
           dayDelta: day ? last.v - day.v : null,
           span: (last.t - first.t) / (24*3600*1000) };
}

/* The line. Drawn at the width it is actually rendered at, for the reason
   the ribbon is: a fixed viewBox squeezed into a phone renders every
   figure at a fraction of its stated size and leaves the difference as
   dead space. */
function svgText(attrs, str){
  var n = svg('text', attrs); n.textContent = str; return n;
}

function sparkline(pts, opts){
  var W = Math.max(opts.width || 320, 220), H = opts.height || 64;
  var padL = 4, padR = 4, padT = 8, padB = 14;
  var host = svg('svg', { viewBox:'0 0 ' + W + ' ' + H, width:W, height:H,
    class:'spark', role:'img', 'aria-label':opts.label || '' });
  if (!pts || pts.length < 2) return host;
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  var lo = pts[0].v, hi = pts[0].v;
  pts.forEach(function(p){ if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; });
  var pad = (hi - lo) || Math.abs(hi) * 0.02 || 1;
  lo -= pad * 0.12; hi += pad * 0.12;
  function X(t){ return padL + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - padL - padR); }
  function Y(v){ return padT + (1 - (v - lo) / ((hi - lo) || 1)) * (H - padT - padB); }

  /* A day grid, so "how fast" has something to be fast against. */
  var dayMs = 24*3600*1000;
  for (var t = t1; t > t0; t -= dayMs)
    host.appendChild(svg('line', { x1:X(t), x2:X(t), y1:padT, y2:H-padB, class:'spark-grid' }));

  var d = pts.map(function(p,i){ return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
  host.appendChild(svg('path', { d:d + ' L' + X(t1).toFixed(1) + ' ' + (H-padB) +
    ' L' + X(t0).toFixed(1) + ' ' + (H-padB) + ' Z', class:'spark-fill',
    fill: opts.stroke || 'currentColor' }));
  host.appendChild(svg('path', { d:d, class:'spark-line',
    'vector-effect':'non-scaling-stroke',
    stroke: opts.stroke || 'currentColor' }));
  var last = pts[pts.length-1];
  host.appendChild(svg('circle', { cx:X(last.t), cy:Y(last.v), r:3, class:'spark-now',
    fill: opts.stroke || 'currentColor' }));
  host.appendChild(svgText({ x:padL, y:H-3, class:'spark-ax' }, opts.days + ' days ago'));
  host.appendChild(svgText({ x:W-padR, y:H-3, class:'spark-ax', 'text-anchor':'end' }, 'now'));
  return host;
}

/* A box the line is drawn INTO after it is on the page, not a line drawn
   at a width guessed beforehand. The ribbon was built the other way and
   rendered every figure at half size inside a viewBox four times the space
   it had; the difference is invisible until it is measured, so the width
   comes from the element itself. */
function sparkHost(pts, opts){
  var host = el('div',{class:'spark-host'});
  host._draw = function(w){
    host.innerHTML = '';
    var o = {}; for (var k in opts) o[k] = opts[k];
    o.width = w;
    host.appendChild(sparkline(pts, o));
  };
  return host;
}

function drawTrendLines(){
  var hosts = document.querySelectorAll('#panel-water .spark-host');
  Array.prototype.forEach.call(hosts, function(h){
    if (h._draw) h._draw(Math.max(h.clientWidth || 300, 220));
  });
}

function trendSection(river){
  var box = el('div',{});
  var tr = state.trends[river.id];
  if (!tr){ box.appendChild(el('p',{class:'note',text:'Loading the last seven days…'})); return box; }
  if (tr.failed){
    box.appendChild(el('p',{class:'note',
      text:'No history this time — ' + tr.failed + '. The readings above are unaffected.'}));
    return box;
  }
  if (tr.stale) box.appendChild(el('div',{class:'warnbox',
    text:'Stored history, ' + ageText(Date.now() - tr.fetchedAt) +
         '. The network did not answer, so this is the last week that arrived.'}));

  if (tr.flow){
    var fs = trendStats(tr.flow.pts, Math.max(Math.abs(tr.flow.pts[0].v) * 0.03, 5));
    var line = el('p',{class:'trend-say'});
    if (tr.tidal){
      line.textContent = 'Flow at ' + tr.flow.name + ' swings with the tide, so the ' +
        'shape below is the tide rather than what the river is carrying. There is no ' +
        'gauge above the tide on this river to ask instead.';
    } else if (fs){
      var word = fs.dir === 'steady' ? 'Steady' : fs.dir === 'up' ? 'Rising' : 'Falling';
      line.textContent = word + ' — ' + commas(fmt(fs.last.v,0)) + ' cfs now, ' +
        (fs.dir === 'steady' ? 'within ' : fs.delta > 0 ? 'up ' : 'down ') +
        commas(fmt(Math.abs(fs.delta),0)) + ' cfs' +
        (fs.pct === null ? '' : ' (' + fmt(Math.abs(fs.pct),0) + '%)') +
        ' over ' + fmt(fs.span,0) + ' days' +
        (fs.dayDelta === null ? '' :
          ', ' + (Math.abs(fs.dayDelta) < 1 ? 'level' :
            (fs.dayDelta > 0 ? 'up ' : 'down ') + commas(fmt(Math.abs(fs.dayDelta),0))) +
          ' in the last day') + '.';
    }
    box.appendChild(el('h3',{class:'trend-h',text:'Flow — ' + tr.flow.name}));
    box.appendChild(line);
    box.appendChild(sparkHost(tr.flow.pts, { days:tr.days, stroke:'var(--cyan)',
      label: 'Flow at ' + tr.flow.name + ' over ' + tr.days + ' days. ' + line.textContent }));
    box.appendChild(el('p',{class:'rdg-id',
      text: (tr.flow.source || 'USGS') + ' ' + tr.flow.site + ' · low ' +
        commas(fmt(trendStats(tr.flow.pts,0).lo.v,0)) + ', high ' +
        commas(fmt(trendStats(tr.flow.pts,0).hi.v,0)) + ' cfs over the week'}));
  }

  if (tr.temp){
    var ts = trendStats(tr.temp.pts, 0.5);
    var tline = el('p',{class:'trend-say'});
    if (ts){
      var tword = ts.dir === 'steady' ? 'Steady' : ts.dir === 'up' ? 'Warming' : 'Cooling';
      tline.textContent = tword + ' — ' + fmt(ts.last.v,1) + 'F now, ' +
        (ts.dir === 'steady' ? 'within ' : ts.delta > 0 ? 'up ' : 'down ') +
        fmt(Math.abs(ts.delta),1) + 'F over ' + fmt(ts.span,0) + ' days' +
        (ts.dayDelta === null ? '' :
          ', ' + (Math.abs(ts.dayDelta) < 0.2 ? 'level' :
            (ts.dayDelta > 0 ? 'up ' : 'down ') + fmt(Math.abs(ts.dayDelta),1)) +
          ' in the last day') + '.';
    }
    box.appendChild(el('h3',{class:'trend-h',text:'Water temperature — ' + tr.temp.name}));
    box.appendChild(tline);
    box.appendChild(sparkHost(tr.temp.pts, { days:tr.days,
      stroke: tempColour(tr.temp.pts[tr.temp.pts.length-1].v),
      label: 'Water temperature at ' + tr.temp.name + ' over ' + tr.days + ' days. ' + tline.textContent }));
    box.appendChild(el('p',{class:'rdg-id',
      text: (tr.temp.source || 'USGS') + ' ' + tr.temp.site + ' · low ' +
        fmt(trendStats(tr.temp.pts,0).lo.v,1) + ', high ' +
        fmt(trendStats(tr.temp.pts,0).hi.v,1) + 'F over the week'}));
  }

  (tr.noHistory || []).forEach(function(n){
    var many = n.id.indexOf(',') !== -1;
    box.appendChild(el('p',{class:'note',
      text:'No ' + n.what + ' history at ' + n.name + ' (' + n.id + '). ' +
        (many ? 'They answer' : 'It answers') + ' for right now and ' +
        (many ? 'publish' : 'publishes') +
        ' nothing back over the week, so there is no line to draw.'}));
  });

  if (!tr.flow && !tr.temp && !(tr.noHistory || []).length)
    box.appendChild(el('p',{class:'note',text:'No history published for this reach.'}));

  box.appendChild(el('p',{class:'note',
    text:'What the line is: every reading the service published over the last ' +
      tr.days + ' days, thinned to fit the width, with the day marks behind it. ' +
      'Nothing here is smoothed, predicted or extended past the last reading.'}));
  return box;
}

/* =====================================================================
   How deep is it HERE.

   The published surveys are already drawn as a coloured surface; reading a
   colour off a ramp is not a depth. This asks the service for the number
   under the point.

   Two requests, in order, because one is not enough. `identify` returns the
   pixel and is exact — but a survey's rectangular extent is mostly land: of
   four hundred points sampled across the Sacramento survey's whole box,
   ONE had a value. A fingertip covers about a hundred metres at the zoom
   people actually use, so a single-pixel question misses the surveyed
   ribbon nearly every time and answers NoData, which reads as "no survey
   here" when it means "not that exact pixel". So a miss falls through to
   `getSamples` over a hundred metres square, and the nearest point with a
   value is reported WITH ITS DISTANCE, which is the honest form of the
   answer: not the depth where you tapped, but the depth of the nearest
   place anybody measured, and how far away that is.
   ===================================================================== */
var DEPTH_SPAN_M = 100;      /* half-width of the fallback search box */
var DEPTH_MAX_SURVEYS = 3;   /* how many overlapping surveys to ask */

function metresBetween(aLat, aLon, bLat, bLon){
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (bLat - aLat) * rad, dLon = (bLon - aLon) * rad;
  var s = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(aLat*rad) * Math.cos(bLat*rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

/* DWR names these services with the survey date in them. It is read rather
   than assumed: a name without one yields no date and the panel says the
   date is unknown instead of inventing one. */
function surveyDate(name){
  var m = /_(\d{4})(\d{2})(\d{2})_/.exec(String(name || ''));
  if (!m) return null;
  return m[1] + '-' + m[2] + '-' + m[3];
}

/* DWR's service names are machine names: Bathy_NCRO_20230208_SacramentoRiver.
   The reader gets the readable part and the machine name stays beside it, so
   what is on screen can still be matched to what is in the catalogue. */
function surveyLabel(name){
  /* Two naming schemes, both machine names: Bathy_NCRO_20230208_River for a
     multibeam service and i06_Bathy_AGENCY_YEAR_Place for a single beam
     layer. Strip the scheme, keep the place, and leave any year in it —
     a reader choosing between a 1933 survey and a 2024 one needs that. */
  var rest = String(name || '')
    .replace(/^i\d+[_\s]*/i, '')
    .replace(/^Bathy[_\s]*/i, '')
    .replace(/^NCRO[_\s]*/i, '')
    .replace(/^\d{8}[_\s]*/, '');
  rest = rest.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2')
             .replace(/\s+/g, ' ').trim();
  return rest || String(name || 'unnamed survey');
}

function boxHas(box, lat, lon){
  return !!box && lat >= box.s && lat <= box.n && lon >= box.w && lon <= box.e;
}

/* Which surveys cover this point, newest first, with whatever is switched
   on put at the front so the number agrees with the colours on screen. */
function surveysAt(lat, lon){
  var cat = state.catalog;
  if (!cat || !cat.raster) return [];
  var hits = cat.raster.filter(function(r){ return boxHas(r.box, lat, lon); });
  hits.forEach(function(r){ r._date = surveyDate(r.name); });
  hits.sort(function(a, b){
    var aOn = state.layers['r:' + a.name] ? 1 : 0, bOn = state.layers['r:' + b.name] ? 1 : 0;
    if (aOn !== bOn) return bOn - aOn;
    return String(b._date || '').localeCompare(String(a._date || ''));
  });
  return hits;
}

function identifyDepth(path, lat, lon){
  var url = dwr(path + '/identify?f=json&returnGeometry=false&geometryType=esriGeometryPoint' +
    '&geometry=' + encodeURIComponent(JSON.stringify({ x:lon, y:lat, spatialReference:{ wkid:4326 } })));
  return getJSON(url, 20000).then(function(j){
    var v = j && j.value;
    if (v === undefined || v === null || v === '' || v === 'NoData') return null;
    var n = Number(v);
    return isNum(n) ? n : null;
  });
}

/* A square of samples, in the coordinate system the app already works in,
   so nothing here has to know how the survey was projected. */
function sampleNearest(path, lat, lon){
  var d = DEPTH_SPAN_M / 111320;                      /* metres to degrees */
  var dx = d / Math.max(Math.cos(lat * Math.PI / 180), 0.2);
  var g = { xmin:lon-dx, ymin:lat-d, xmax:lon+dx, ymax:lat+d, spatialReference:{ wkid:4326 } };
  var url = dwr(path + '/getSamples?f=json&outSR=4326&geometryType=esriGeometryEnvelope' +
    '&sampleCount=100&geometry=' + encodeURIComponent(JSON.stringify(g)));
  return getJSON(url, 20000).then(function(j){
    var best = null;
    (j && j.samples || []).forEach(function(s){
      if (s.value === '' || s.value === 'NoData' || s.value === null || s.value === undefined) return;
      var v = Number(s.value);
      if (!isNum(v) || !s.location) return;
      var sl = Number(s.location.y), so = Number(s.location.x);
      if (!isNum(sl) || !isNum(so)) return;
      var m = metresBetween(lat, lon, sl, so);
      if (!best || m < best.m) best = { v:v, m:m, lat:sl, lon:so };
    });
    return best;
  });
}

/* The answer, in the order a person would want it: the number under the
   point; failing that the nearest measured point and how far; failing that
   which surveys cover here and could not answer; failing that that none
   does. Each of those is a different fact and none of them is a dash. */
function depthAt(lat, lon){
  /* Not knowing and knowing there is nothing are different answers, and the
     first must never be printed as the second: with no catalogue loaded,
     "no survey covers this point" is a claim about California made by an
     app that has not asked. Same shape as a history request that timed out
     being reported as a gauge publishing nothing. */
  if (!state.catalog || !state.catalog.raster || !state.catalog.raster.length)
    return Promise.resolve({ none:'nocatalog', covering:[] });
  var covering = surveysAt(lat, lon);
  if (!covering.length)
    return Promise.resolve({ none:'nowhere', covering:[] });
  var list = covering.slice(0, DEPTH_MAX_SURVEYS);

  function tryIdentify(i){
    if (i >= list.length) return Promise.resolve(null);
    return identifyDepth(list[i].path, lat, lon).then(function(v){
      if (isNum(v)) return { value:v, survey:list[i], exact:true };
      return tryIdentify(i + 1);
    }, function(){ return tryIdentify(i + 1); });
  }

  return tryIdentify(0).then(function(hit){
    if (hit) return hit;
    return sampleNearest(list[0].path, lat, lon).then(function(near){
      if (near) return { value:near.v, survey:list[0], exact:false,
                         away:near.m, lat:near.lat, lon:near.lon };
      return { none:'notmeasured', covering:list };
    }, function(e){
      return { failed:String(e && e.message || e), covering:list };
    });
  });
}

/* =====================================================================
   THE PROFILE — what the bottom does along a line.

   A point tells you the depth where you are standing. A LINE tells you the
   shape, which is the question actually being asked: where the channel is,
   which side of it you are on, and how fast it drops away. The app is named
   after the deepest line in a channel and could not draw one.

   The line is the READER'S, and that is the whole design. A profile down the
   middle of the river needs a published centreline this app does not have, and
   the app's standing rule is that no coordinate is invented here — so rather
   than guess a centreline, or guess which way "across" points, it profiles
   whatever line you draw. Drawn down the channel it is a long profile; drawn
   bank to bank it is a cross-section; and it is the same code either way.

   ONE REQUEST PER SURVEY, not one per sample. The service answers getSamples
   for a polyline with the samples ordered along it — measured against the live
   ImageServer before this was written, because a rendering rule ArcGIS does
   not understand comes back as HTTP 200 and an empty answer rather than an
   error. Eighty samples down three miles of the Sacramento costs one call.
   ===================================================================== */
var PROFILE_SAMPLES = 90;   /* per survey, per line */

function metresAlong(pts){
  var out = [0];
  for (var i = 1; i < pts.length; i++)
    out.push(out[i - 1] + metresBetween(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]));
  return out;
}

/* Every survey whose box the line passes through, so a line crossing two
   surveys gets a band from each rather than silently taking one. */
function surveysAlong(pts){
  var cat = state.catalog;
  if (!cat || !cat.raster) return [];
  var hit = {};
  pts.forEach(function(p){
    surveysAt(p[0], p[1]).forEach(function(r){ hit[r.name] = r; });
  });
  return Object.keys(hit).map(function(k){ return hit[k]; }).slice(0, DEPTH_MAX_SURVEYS);
}

function sampleLine(path, pts){
  var line = { paths:[ pts.map(function(p){ return [p[1], p[0]]; }) ],
               spatialReference:{ wkid:4326 } };
  var url = dwr(path + '/getSamples?f=json&outSR=4326&geometryType=esriGeometryPolyline' +
    '&sampleCount=' + PROFILE_SAMPLES + '&geometry=' + encodeURIComponent(JSON.stringify(line)));
  return getJSON(url, 25000).then(function(j){
    var out = [];
    (j && j.samples || []).forEach(function(sm){
      if (!sm.location) return;
      var lat = Number(sm.location.y), lon = Number(sm.location.x);
      if (!isNum(lat) || !isNum(lon)) return;
      /* NoData is not zero. A survey that did not measure a spot must leave a
         gap in the line, not a reading at the surface. */
      var v = (sm.value === '' || sm.value === null || sm.value === undefined ||
               sm.value === 'NoData') ? null : Number(sm.value);
      out.push({ lat:lat, lon:lon, v:isNum(v) ? v : null });
    });
    return out;
  });
}

/* Distance of a point from the line, and how far along it that lands — so a
   reader's own position can be put at the right place on the picture rather
   than at the end of it. */
function projectOnLine(pts, lat, lon){
  var best = null, run = 0;
  for (var i = 1; i < pts.length; i++){
    var a = pts[i-1], b = pts[i];
    var segLen = metresBetween(a[0], a[1], b[0], b[1]);
    if (segLen < 1){ run += segLen; continue; }
    /* Local flat approximation: fine over a segment, and this is a picture of
       a river reach rather than a survey of one. */
    var kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
    var ax = 0, ay = 0;
    var bx = (b[1] - a[1]) * kx, by = (b[0] - a[0]) * ky;
    var px = (lon  - a[1]) * kx, py = (lat  - a[0]) * ky;
    var t = ((px - ax) * bx + (py - ay) * by) / (bx * bx + by * by);
    t = Math.max(0, Math.min(1, t));
    var dx = px - bx * t, dy = py - by * t;
    var off = Math.sqrt(dx * dx + dy * dy);
    if (!best || off < best.off) best = { off:off, along:run + segLen * t };
    run += segLen;
  }
  return best;
}

function buildProfile(pts){
  var surveys = surveysAlong(pts);
  if (!surveys.length)
    return Promise.resolve({ none:state.catalog && state.catalog.raster ? 'nowhere' : 'nocatalog',
                             pts:pts });
  return Promise.all(surveys.map(function(sv){
    return sampleLine(sv.path, pts).then(function(rows){
      return { survey:sv, rows:rows };
    }, function(e){ return { survey:sv, failed:String(e && e.message || e), rows:[] }; });
  })).then(function(bands){
    /* Distance along the line for every sample, from the sample's OWN
       position rather than from its index — the service is entitled to space
       them how it likes, and an index would draw an even spacing it never
       promised. */
    bands.forEach(function(b){
      b.pts = b.rows.map(function(r){
        var pr = projectOnLine(pts, r.lat, r.lon);
        return { d: pr ? pr.along : 0, v:r.v, lat:r.lat, lon:r.lon };
      }).sort(function(x, y){ return x.d - y.d; });
      var got = b.pts.filter(function(x){ return isNum(x.v); });
      b.measured = got.length;
      b.deepest = got.length ? Math.min.apply(null, got.map(function(x){ return x.v; })) : null;
    });
    var all = [];
    bands.forEach(function(b){ b.pts.forEach(function(x){ if (isNum(x.v)) all.push(x.v); }); });
    return {
      pts: pts,
      length: metresAlong(pts).pop(),
      bands: bands,
      deepest: all.length ? Math.min.apply(null, all) : null,
      measured: all.length
    };
  });
}

/* HAS THE BOTTOM MOVED? — and the two ways to answer it wrongly.

   Sandbars in the Delta move, and where the state has surveyed the same water
   twice there is a measured answer: Grant Line and Fabian Canal in June 2023
   and again in May 2024, Sugar Cut in April 2023 and August 2025. Two
   soundings of one bed, years apart, is the only honest material for saying
   the bed has shifted.

   THE FIRST WRONG ANSWER IS TO SUBTRACT HEIGHTS THAT ARE NOT MEASURED FROM THE
   SAME PLACE. A depth is an elevation against a vertical datum, and these
   services do not all declare one — read from the live catalogue, the 2024
   Grant Line survey declares NAVD88 in feet and the 2023 survey of the same
   canal declares nothing whatever. Their ranges look alike, which is exactly
   the trap: subtracting them would produce a plausible number resting on an
   assumption nobody published. So the comparison only runs when both surveys
   NAME a vertical datum and name the same one, and says why when it will not.

   THE SECOND IS TO CALL IT NAVIGATION. It is not, and this app says so
   everywhere. A difference between two surveys says the bed moved between two
   dates; it says nothing about today, and nothing about whether a boat will
   float. */
function renderBedChange(model){
  var box = document.getElementById('profchange');
  if (!box) return;
  box.innerHTML = '';
  var c = model ? bedChange(model) : null;
  if (!c) return;

  var head = 'The state surveyed this water twice: ' +
    surveyLabel(c.a.name) + ' on ' + c.from + ', and ' +
    surveyLabel(c.b.name) + ' on ' + c.to + '.';

  if (c.refused){
    box.appendChild(foldNote('Both surveys are drawn — why they are not subtracted', [
      head,
      'Both are drawn above, one band each, so you can look at them together. The app will not tell you how much the bed moved, because ' + c.refused + '. A depth is a height measured from something, and subtracting two heights measured from different things — or from something one of them never named — gives a number that looks like an answer and is not one.',
      'This is not a shortcoming of the surveys. It is the app refusing to invent the part nobody published.'
    ]));
    return;
  }
  if (c.thin !== undefined){
    box.appendChild(foldNote('Two surveys here, too little overlap to compare', [
      head,
      'They only measured the same ' + c.thin + ' place' + (c.thin === 1 ? '' : 's') +
        ' along this line, which is too few to say anything about the bed as a whole. Draw a line that crosses more of both.'
    ]));
    return;
  }

  var deeper = c.mean < 0;
  var line = el('p',{class:'note'});
  line.appendChild(el('b',{ text:'The bottom moved ' + fmt(Math.abs(c.mean), 1) +
    ' ft on average, ' + (deeper ? 'deeper' : 'shallower') + ', between ' + c.from + ' and ' + c.to + '.' }));
  box.appendChild(line);
  box.appendChild(el('p',{class:'note',
    text:'Most it moved anywhere along this line: ' + fmt(Math.abs(c.max), 1) + ' ft ' +
      (c.max < 0 ? 'deeper' : 'shallower') + '. Compared at ' + c.n +
      ' places where both surveys measured, both against ' + c.datum + '.'}));
  box.appendChild(foldNote('What this is, and what it is not', [
    head,
    'This is the difference between two measurements of one bed, and nothing else. It is not a forecast, it is not a reading of today, and it is NOT a depth to take a boat through: the newer of these surveys is from ' + c.to + ' and the bed has had every tide since to move again.',
    'It is compared only where both surveys measured, and only because both name ' + c.datum + ' as what their heights are measured from. Where a pair does not agree on that, or one of them says nothing, this app draws both and refuses to subtract them.'
  ]));
}

function bedChange(model){
  var bands = (model && model.bands || []).filter(function(b){
    return b.measured && b.survey && surveyDate(b.survey.name);
  });
  if (bands.length < 2) return null;
  bands.sort(function(a, b){
    return surveyDate(a.survey.name) < surveyDate(b.survey.name) ? -1 : 1; });
  var a = bands[0], b = bands[bands.length - 1];
  if (surveyDate(a.survey.name) === surveyDate(b.survey.name)) return null;

  var out = { a:a.survey, b:b.survey,
              from:surveyDate(a.survey.name), to:surveyDate(b.survey.name) };
  if (!a.survey.vertcs || !b.survey.vertcs){
    out.refused = 'one of these two surveys does not say what its heights are measured from';
    return out;
  }
  if (a.survey.vertcs !== b.survey.vertcs){
    out.refused = 'these two surveys measure their heights from different things (' +
      a.survey.vertcs + ' and ' + b.survey.vertcs + ')';
    return out;
  }
  out.datum = a.survey.vertcs;

  /* Paired by position along the line, and only where BOTH measured — a gap
     in one survey is not a change in the bed. */
  var tol = Math.max(20, (model.length || 0) / 200), diffs = [];
  a.pts.forEach(function(pa){
    if (!isNum(pa.v)) return;
    var best = null;
    b.pts.forEach(function(pb){
      if (!isNum(pb.v)) return;
      var d = Math.abs(pb.d - pa.d);
      if (d <= tol && (!best || d < Math.abs(best.d - pa.d))) best = pb;
    });
    if (best) diffs.push(best.v - pa.v);
  });
  if (diffs.length < 8){ out.thin = diffs.length; return out; }
  var sum = 0, max = 0;
  diffs.forEach(function(d){ sum += d; if (Math.abs(d) > Math.abs(max)) max = d; });
  out.n = diffs.length;
  out.mean = sum / diffs.length;
  out.max = max;
  return out;
}

/* ---- drawing it -------------------------------------------------------
   Depth DOWN is the whole point, so the surface is the top edge and deeper is
   further down — the shape a fisherman already has in their head. The vertical
   scale is never shared with the horizontal one: a mile of river against
   thirty feet of water drawn true to scale is a flat line, and the shape is
   what the picture is for. The axis says so rather than letting the drawing
   imply a slope nobody measured. */
function renderProfile(){
  var m = state.profile;
  var sec = $('#profile'), svg = $('#profsvg'), note = $('#profnote');
  if (!m){ sec.hidden = true; svg.innerHTML = ''; renderBedChange(null); return; }
  sec.hidden = false;
  renderBedChange(m);

  var wrap = $('#profwrap');
  var H = Math.max(90, wrap.clientHeight || 150);
  var base = Math.max(320, wrap.clientWidth || 360);
  var W = Math.round(base * (state.profZoom || 1));
  var padL = 34, padR = 10, padT = 10, padB = 18;
  svg.setAttribute('width', W);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.width = W + 'px';
  svg.innerHTML = '';

  var NS = 'http://www.w3.org/2000/svg';
  function node(t, at){ var n = document.createElementNS(NS, t);
    for (var k in at) if (at[k] !== null && at[k] !== undefined) n.setAttribute(k, at[k]);
    return n; }

  /* CLEARING THE DRAWING DELETED ITS OWN NAME. The <title> is a child of the
     svg, so innerHTML = '' took it with the last render and left a role="img"
     with nothing naming it — invisible on screen and total for anyone reading
     by ear. It is rebuilt with the picture, every time. */
  var ttl = node('title', { id:'profsvgtitle' });
  svg.appendChild(ttl);
  function name(t){ ttl.textContent = t; }

  if (m.none || !isNum(m.deepest)){
    var why = m.none === 'nocatalog'
      ? 'The survey directory has not arrived, so this cannot be answered yet \u2014 which is not the same as there being no survey here.'
      : m.none === 'nowhere'
        ? 'No published survey covers this line. Draw one over water the state has actually measured, and the Depth panel lists which reaches those are.'
        : 'The survey covers this line but measured nothing along it. That is missing data, not flat bottom \u2014 dense weed defeats the sounder and those cells are dropped.';
    note.textContent = why;
    name('No depth along this line. ' + why);
    return;
  }

  /* Deepest at the bottom of the picture, with a little air under it. */
  var maxD = Math.abs(m.deepest) * 1.08 + 1;
  var x = function(d){ return padL + (d / (m.length || 1)) * (W - padL - padR); };
  var y = function(v){ return padT + (Math.abs(v) / maxD) * (H - padT - padB); };

  /* The water itself, so the picture reads as a section through a river and
     not as a graph that happens to go down. */
  svg.appendChild(node('rect', { x:padL, y:padT, width:W - padL - padR,
    height:H - padT - padB, fill:'#0B2430' }));

  /* Depth grid, labelled, because a shape with no numbers is decoration. */
  var step = maxD > 60 ? 20 : maxD > 24 ? 10 : 5;
  for (var d = step; d < maxD; d += step){
    svg.appendChild(node('line', { x1:padL, x2:W - padR, y1:y(d), y2:y(d),
      stroke:'#2E7C76', 'stroke-width':1, opacity:.45 }));
    var lab = node('text', { x:4, y:y(d) + 3, fill:'#9FB3B1', 'font-size':9 });
    lab.textContent = d + 'ft';
    svg.appendChild(lab);
  }

  /* One band per survey. Where two surveys cover the same water they are two
     answers, measured on different days, and the app shows both rather than
     picking one and calling it the bottom. */
  var colours = ['#7BD5D9', '#C9A96A', '#9BD98C'];
  m.bands.forEach(function(b, i){
    var col = colours[i % colours.length];
    /* Runs, split on missing data. A line drawn straight across a gap invents
       a bottom between two places nobody measured. */
    var run = [];
    var runs = [];
    b.pts.forEach(function(pt){
      if (isNum(pt.v)) run.push(pt);
      else if (run.length){ runs.push(run); run = []; }
    });
    if (run.length) runs.push(run);

    runs.forEach(function(r){
      if (r.length === 1){
        svg.appendChild(node('circle', { cx:x(r[0].d), cy:y(r[0].v), r:2, fill:col }));
        return;
      }
      var dd = r.map(function(pt){ return x(pt.d).toFixed(1) + ',' + y(pt.v).toFixed(1); });
      /* The first band gets the filled envelope: surface down to the bottom it
         measured, which is the water you would be fishing through. */
      if (i === 0){
        var area = node('path', { fill:col, opacity:.14,
          d:'M' + x(r[0].d).toFixed(1) + ',' + y(0).toFixed(1) +
            ' L' + dd.join(' L') +
            ' L' + x(r[r.length-1].d).toFixed(1) + ',' + y(0).toFixed(1) + ' Z' });
        svg.appendChild(area);
      }
      svg.appendChild(node('path', { fill:'none', stroke:col,
        'stroke-width': i === 0 ? 2 : 1.4, 'stroke-linejoin':'round',
        'stroke-dasharray': i === 0 ? null : '4 3',
        d:'M' + dd.join(' L') }));
    });
  });

  /* WHERE YOU ARE ON THE LINE. Only when you are actually near it — a marker
