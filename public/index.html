  { v:'2.8.0', date:'2026-09-01', changes:[
      'Every river now gets the whole width of its bar, drawn to its own scale. They were all squeezed onto one distance scale set by the longest, and the longest is the Sacramento \u2014 359 km across, against the American\u2019s 30. So the American was drawn at EIGHT PER CENT of the width with its gauges piled on top of each other, the Feather and the Mokelumne at about a fifth, and the only river you could actually read was the one that needed no help.',
      'And every row says how many kilometres it covers, because that is the whole reason this is allowed. Bars of one width covering different distances is a lie for exactly as long as nothing says what they cover \u2014 so the comparison of length moves out of the drawing, where it was crushing four rivers to flatter one, and into a number that states it exactly. The note under the bars says out loud that the widths are no longer comparable.',
      'What a bar is for is where the gauges sit along THAT river, and a shared scale was destroying it for four rivers out of five.',
  ], broken:[
      'The bars can no longer be compared to each other by eye, on purpose. Read the kilometres on each row instead; that is what the number is there for.',
      'Rows carry a line more than they did, so fewer of them fit on a short screen than before. Where they do not fit the bars scroll, and the sideways view shows all of them at once.',
  ] },
  { v:'2.7.0', date:'2026-09-01', changes:[
      'A button that turns the river bars sideways, where there is no room for them upright. It gives them the LONG side of the screen: on an iPhone 13 the bars go from 22 pixels tall in a 390-wide box to 45 tall in a 667-wide one, with every river on screen at once and nothing to scroll.',
      'It turns the picture, not the phone, and it says so. A web page cannot rotate the screen itself on an iPhone or an iPad \u2014 Safari has no way to do it, and a button that quietly did nothing would be worse than no button. Turning the drawing is the half that works, and it is the better half: a phone held upright has more screen to give than the same phone turned over, because the browser keeps its own bars either way.',
      'The button only appears where it helps \u2014 where the upright bars are squeezed, scrolled, or gone. On a screen with room for all of them at full size it changes nothing, so it is not offered.',
  ], broken:[
      'Pressing a river to open it is on the upright view only. The sideways one is for reading: the invisible buttons that make the bars pressable work out where they are by measuring the screen, and inside a rotated picture that measurement describes the wrong thing.',
      'It is one drawing shown two ways, not two drawings. If the bars are ever wrong in one they will be wrong in both, which is the trade for them never disagreeing with each other.',
  ] },
  { v:'2.6.1', date:'2026-09-01', changes:[
      'The river bars scroll instead of disappearing. On a screen with no room for five of them at a size worth reading, the app used to take the whole comparison away \u2014 which is the thing the front page is for. The bars keep their size now, the band keeps its share of the screen, and the ones past the bottom are reached by scrolling.',
      'That brought them back on the small phones, where they had been gone entirely, and it stopped them taking over an iPad held sideways \u2014 which had been drawing a taller band than the whole screen and leaving the readings nothing.',
      'And the note explaining a missing band now tells you the right thing to do about it. It is bounded by HEIGHT, and turning a phone sideways gives it LESS of that, not more \u2014 so where rotating is the wrong move the note says so, rather than leaving you to try it.',
  ], broken:[
      'A phone held sideways still cannot show five bars. There are about two hundred pixels of height on that screen in total, and the caption underneath takes a quarter of them. Held upright the same phone has room, and the note says so.',
      'Where the bars do fit at a smaller size they are still shrunk to fit rather than scrolled, because the point of stacking them is seeing them at once.',
  ] },
  { v:'2.6.0', date:'2026-09-01', changes:[
      'The tide chart knows when it is dark. Night is shaded behind the curve and the low light at either end of the day a shade lighter, so you can see at a glance whether a turn lands at first light, in the middle of the afternoon, or at two in the morning. First light, sunrise, sunset and last light are written out underneath as well.',
      'And it names the turns that fall in the low light \u2014 which of the next day and a half\u2019s highs and lows land in the hour around dawn or dusk. Fishing the change at first or last light is a convention among anglers; the app is telling you when the two coincide and nothing whatever about what the fish will do.',
      '\u201cFirst light\u201d means civil twilight, the sun six degrees under the horizon, which is about when you can read water without a torch \u2014 not sunrise, which is half an hour later. Both are given because they are half an hour apart and people mean different things by the word.',
      'None of this costs a request. It is arithmetic from the date and where the tide station is, so it works with no signal, for any date, and there is nothing about it that can go stale or fail to answer.',
  ], broken:[
      'The light is computed for the tide station you are reading, not for where you are standing. On this water that is a difference of seconds, not minutes, but it is the station\u2019s dawn rather than yours.',
      'It is a light calculation and not a fishing forecast. Thalweg does not know where or when the fishing will be better and does not guess.',
  ] },
  { v:'2.5.1', date:'2026-09-01', changes:[
      'Home has its river bars back. They had gone from every screen size, and the note underneath blamed your screen for it \u2014 which was wrong. The bars are tappable now, and the invisible buttons that make them tappable sit exactly on top of the bars; the code working out how much room the bars could have was counting those buttons as if they pushed the bars further down the page. Every redraw took the last drawing\u2019s own height away from the next one until there was no room left at all, and once it gave up it could not come back.',
      'The tabs stay where they are when you open the map. Choosing Map used to send the row of tabs to the bottom of the screen \u2014 a whole screen away from the finger that had just pressed it, and behind a map you then had to scroll past to get back. Every other tab leaves them at the top; now so does that one.',
      'Depth no longer says it is loading something when no river is picked. It sat on \u201cReading the DWR service directory\u2026\u201d forever, because that reading only happens once you have chosen a river \u2014 so it was a promise that something was happening when nothing was going to. It says what the panel is for instead, and both it and Marks now offer a button that takes you to the choosing rather than telling you to go and find it.',
      'Nothing on the landing page counts the rivers wrongly any more. It said \u201cfour rivers\u201d in three places while five things were listed under it, and the Home button offered to take you back to all four. The sentences ask the list now, so they cannot fall behind it again.',
  ], broken:[
      'On the shortest phones the bars still cannot be shown on the landing page: five of them at a size you can actually read do not fit above the cards. That is a real limit rather than the fault above, and the app says so and tells you to pick one river to get them back.',
  ] },
  { v:'2.5.0', date:'2026-09-01', changes:[
      'The tide now says how BIG today is, not just which way it is going and when it turns. The swing between high and low is not the same every day \u2014 it grows and shrinks over about a fortnight with the moon, and on this water the difference between the two ends is a couple of feet at the same station. Two days both described as \u201crising, high at four\u201d can be completely different afternoons, and nothing here said which one you had.',
      'It is drawn as well as said: one bar a day for the sixteen days of predictions the app holds, today marked, with the biggest and the smallest day named by date. On the river cards the size only appears at the ends of the cycle, because \u201cthe biggest swing of the fortnight\u201d changes what you do today and \u201csomewhere in the middle\u201d does not.',
      'The figure it uses is the whole span the water covers in a day \u2014 the day\u2019s highest water minus its lowest. This coast has two highs and two lows a day and the pairs are unequal, often by more than a foot, so taking one high minus the next low would report whichever pair the arithmetic landed on and jump about for a reason that is nothing to do with the moon.',
      'The turns are now fetched a fortnight ahead instead of a week, because a week cannot answer a fortnightly question. The hourly curve still comes a week at a time \u2014 it is drawn for the next day and nothing else, and it is the expensive one.',
  ], broken:[
      'It is the swing at one station and nothing else. What the water actually does where you are standing is that plus whatever the river is carrying, and a big swing on a river in flood is not the same afternoon as a big swing on a low one. The app shows the two separately and will not add them together.',
      'Sixteen days of predictions cannot tell you this is the biggest tide of the month or the year, and the app does not say so. It says the fortnight ahead and means exactly that.',
      'A day at the edge of the window holds only part of its turns, which would read as an unusually small tide rather than as a clipped day. Those days are left out rather than drawn short.',
  ] },
  { v:'2.4.0', date:'2026-09-01', changes:[
      'The tide says which way it is MOVING, not just which way it comes in. Everything the app said about the tide was a direction on the map \u2014 the sea is downstream, the flood pushes up, the wash marks how far. None of that told you whether the water in front of you at four in the afternoon is coming up or going down, which is the thing you plan the next two hours around. It says so now, on the tide panel, on each river\u2019s card and on the bar, with how far through the swing it is and how long until the turn.',
      'It is a prediction of the HEIGHT at one station and it says so. The water can still be running upstream while the level falls \u2014 that is ordinary on this river, not a fault \u2014 so the measured direction at each gauge is still shown underneath, and the app says plainly that the two need not agree.',
      'How far up the tide actually got, measured. The dashed mark on the bar is where the furthest tide STATION is, and it never moves. The new mark, on the figure of gauges, is the highest one that really ran backwards in the last day. It is a floor and the app says so: the next gauge up may have reversed too and simply not be measured, and how far a flood pushes moves with how much water the river is carrying.',
      'Striped bass, sturgeon and black bass are in the app. The season being shut is not the same thing as the river being empty, and the rules for what else you may legally do there are a few sections along in the same code. The sturgeon ones are the reason: the white sturgeon season is written against the Carquinez Bridge, the confluence of the Feather and the I-5 bridge, there is a year-round closure from Keswick Dam to the Highway 162 bridge, and the daily and annual limits are both zero \u2014 all of which is worth knowing before you drive out rather than after.',
      'None of those rules is typed into this app, and they cannot go stale without saying so. They are read from the department\u2019s own regulations service, in its words, with the date it was read printed beside them, and re-read every month. Two of the four Delta rules that WERE typed in had already drifted from the regulation in the copying \u2014 one had lost its own pointer to another section and one had been rewritten into a sentence nobody published. Both are now the real text.',
  ], broken:[
      'Whether the tide is rising or falling needs the turn before now as well as the one after it. Stored predictions can begin later than that, in which case the app says it cannot tell you rather than guessing from one end.',
      'How far the tide pushed back can only be shown once you have asked for the last day of velocity, because the arrows on their own answer for this minute and a gauge running out now may have been running in at dawn.',
      'Only the sections of Title 14 that bear on this water are carried. The rest of it is about lakes, counties and coastline this app has never heard of.',
  ] },
  { v:'2.3.0', date:'2026-09-01', changes:[
      'The tide mark on each bar now has an arrow showing which way the water is pushed \u2014 upstream, into the mark. A line across a bar says where something stops without saying which side of it is tidal; the arrow says it.',
      'When one river is showing, the mark also carries the next high and the next low, and what time the prediction itself was read. A prediction with no time on it is a number you have to trust blind, and an offline copy of one can be a day old and look exactly as confident.',
      'The tide captions stopped landing on the row underneath. On the all-rivers view the Delta\u2019s caption was sitting on the Mokelumne\u2019s temperature and the two read as one label. Rows that carry a caption are taller now, so each one contains its own.',
      'The tide-along-the-river figure no longer opens with a screen of blank space above it. It was being told to be one height while its drawing was scaled to another, so the picture floated in the middle of the difference \u2014 worst on the Delta, which has sixteen gauges.',
      'The Delta has its rules. Section 7.40 is a list of NAMED waters with special regulations and the Delta is not on it, so there is no Delta salmon season to show \u2014 the season where you stand is the season of the river you are standing on. What the Delta does have of its own is now here in the regulation\u2019s own words with its section number: what the Delta legally IS, the hook-gap limits, the black bass rules, and bow-and-arrow fishing.',
      'The depth ramp says why nothing happened. It colours the surfaces you have switched on, and with none switched on it changed its own state and nothing else, which is indistinguishable from a dead button.',
  ] },
  { v:'2.2.0', date:'2026-08-31', changes:[
      'The Delta is in the app. It is not a fifth river \u2014 it is where the four arrive \u2014 so it has its own card under them, and what counts as the Delta is the state\u2019s own published Legal Delta Boundary rather than anybody\u2019s idea of where it starts. Ninety-seven named channels come with it, so a tap snaps to the water and a cross-section cuts across whichever channel is nearest.',
      'This matters because most of the depth data was invisible. Of the twenty surveys the state publishes, ELEVEN were of water that belonged to none of the four rivers \u2014 Old River at three cuts, Grant Line, Middle River, Indian Slough \u2014 and the app downloaded every one of them each time it opened and could show you none of them.',
      'And surveys are filed by the water they are on now, not by a box drawn round a river. Nine of the twenty landed in two rivers at once, including two San Joaquin surveys and one of Old River being offered to you as Sacramento depth. Each one now goes to the river whose channels it actually sits on, the Delta gets what no river claims, and two reservoirs that are nobody\u2019s river are given to nobody.',
      'Where the state has surveyed the same water twice, the profile says how much the bottom moved between the two dates \u2014 which is a sandbar, measured, rather than guessed at. It only does this when both surveys say what their heights are measured from AND say the same thing; where one of them is silent, both are still drawn and the app says plainly why it will not subtract them. Two heights measured from different places make a difference that looks like an answer and is not one.',
      'The Delta is not offered a profile down its own course, because it has not got one. Ninety-seven channels meet and part, and choosing one to call the Delta would be this app inventing a route.',
  ], broken:[
      'The Delta has no season here. Title 14\u2019s Delta provisions were not confirmed against the regulation when this build was made, and a season nobody checked is worse than none \u2014 so the app shows none and says so. The printed regulations are the authority.',
      'A change between two surveys is the difference between two dates, and nothing about today. The newest survey of any Delta water in this build is from 2025, and the bed has had every tide since to move again. It is not a depth to take a boat through.',
  ] },
  { v:'2.1.0', date:'2026-08-31', changes:[
      'The depth profile holds the point you let go of. Dragging along the profile is how you find the deep bit \u2014 and the moment you found it and lifted your finger, the mark on the map vanished, so you had learnt that a deep bit exists and nothing about where it was. It stays now, and the panel underneath says which bank it is on and how far off the middle of the channel, names the nearest public land and how far that is, and offers to show you the point, show you both together, keep it as a mark, or let it go.',
      'Left and right are as the river runs, looking downstream \u2014 not left and right of the screen.',
      'The gauge dots on the map now have a coloured ring saying which way the water is going there: cyan for the tide pushing upstream, green for running down. The middle of the dot still shows the temperature, so one pin carries both, and the key says so. A gauge that does not measure direction keeps a dark ring, and so does one whose two instruments disagree.',
      'Once you have asked for the last day of velocity on a river, it stops asking. The agreement is remembered; the readings are not, because a day of velocity is only useful while it is today.',
  ] },
  { v:'2.0.0', date:'2026-08-31', changes:[
      'Version two. Version one could tell you where the deep water is. This one can be USED \u2014 with a finger, one-handed, on a riverbank, which is the only place it was ever going to be read. Nearly everything between the two came from somebody opening it on a phone and finding that the thing they pressed did nothing: pins eleven pixels wide, a map that would not go where it was told, a panel whose controls were buried under four paragraphs, four river bars that looked like a chart and were meant to be pressed. What is still not right is listed below, as it has been in every release.',
      'And the tide stopped being a number for one place. It is a thing that happens ALONG the river now \u2014 you can see it pushing in at the bottom, the river winning at the top, and where the two meet.',
      'There is a new section under the tide: the tide along the river. Until now the app could tell you the tide at ONE station, and one line saying "running both ways" with no hint of where. This shows which way the water is actually running at every gauge on the river that measures it, in river order, downstream at the top \u2014 so you can see the tide pushing in at the bottom, the river winning at the top, and roughly where the two meet.',
      'Press "Show the last day" and each gauge gets a band of the last twenty-four hours beside it, shaded for which way the water was going. Stacked in river order the tide is visible as a diagonal: the turn arrives at Rio Vista and reaches the gauges above it an hour or two later. That is the tide travelling up the river, measured, and it is about 47 KB, so it is only fetched when you ask.',
      'It is measured, not predicted, and that is not a compromise. NOAA forecasts tidal currents at 4,430 places and the furthest upstream on this river is below Rio Vista \u2014 above there, nobody publishes which way the water will be running at any time. So the app tells you when each place LAST turned, which is a real reading, and leaves you to count forward. It will not guess the next one.',
      'A gauge whose velocity and whose flow disagree about which way its water is going is left out of the picture and named underneath, rather than being drawn as though the app had picked a side.',
  ], broken:[
      'How far up the river the tide reverses moves with the season and with every storm, because it depends on how much water the river is carrying. A gauge shown as not having turned has not turned in the day you are looking at — it is not a promise that the tide never reaches it.',
  ] },
  { v:'1.7.0', date:'2026-08-31', changes:[
      'Tapping another tide station on the map now offers to read the tide there, which the key has been saying it would. It said "tap to switch" and tapping only opened a label with the station\u2019s name \u2014 so the one sentence in the app telling you the station is a choice was describing something the map did not do. This matters more than it looks: high water at Rio Vista and high water at Freeport are hours apart, so reading the wrong station puts you out by hours, and the popup now says that too.',
      'The station you are already reading does not offer to switch you to itself.',
  ] },
  { v:'1.6.0', date:'2026-08-31', changes:[
      'Press a river\u2019s bar at the top of the page and it opens that river. The four bars are the most prominent thing on the landing screen and pressing one did nothing \u2014 the ways in were the menu in the header and a card further down. The whole row is the target, not just the bar, so it is a comfortable press with a thumb, and the names are cyan with a \u203a after them so it is clear they do something. The line underneath says so as well.',
      'The gauge dots and the river names still say what they are; the row underneath them is what opens the river.',
  ] },
  { v:'1.5.0', date:'2026-08-31', changes:[
      'The Depth tab does things before it explains them. Every section used to open with two or three paragraphs about what the thing is and where its data comes from, and put the button that does it underneath \u2014 so "Read the depth at the map centre" sat below the bottom of the screen, and if you did not scroll past the wall of text you never found out it was there. The controls are at the top of each section now.',
      'None of that writing has gone. Where the numbers come from, what the state has not measured, why a patch of a survey is blank, and the fact that the public-land pins are not boat ramps \u2014 all still there, one press away behind a heading that says what it holds, instead of four paragraphs in the way. Measured: 1,277 characters of text stood between the top of the panel and the last depth control; now it is 265.',
      'The one sentence that never folds is the one saying those places are NOT boat ramps.',
  ] },
  { v:'1.4.0', date:'2026-08-31', changes:[
      'The four bars at the top are drawn to one distance scale, so their lengths mean something. Every bar used to be stretched to the full width whatever stretch of river it covered \u2014 which said the four rivers are the same length. They are not. The Sacramento now runs long and the others are as short as they actually are, and the line underneath says how long the longest one is.',
      'The tide marking has an end you can see. It was a cyan wash fading away over a bar the colour of the background, so it looked like the bar was simply a gradient, and the caption under it sat pointing at nothing \u2014 worse, where it ran up against the right-hand edge it lined up with the end of the bar and read as labelling the end of the river. There is now a dashed rule standing at the limit, and the words hang off it on a leader so it is clear what they refer to.',
      'The cyan has a key, and always should have. There was one written \u2014 it had been drawn just past the bottom edge of the picture since the day it was added, so nobody has ever seen it. It sits above the temperature scale now and carries the same dashed mark that stands on the bars.',
      'On a phone the caption now says the bars share one distance scale too. It said so only on a wide screen, which left the reader with the least room seeing bars of wildly different lengths and nothing explaining why.',
  ] },
  { v:'1.3.0', date:'2026-08-31', changes:[
      'The circles marking places you may go can be pressed. They were thirteen pixels across \u2014 the size a finger needs is forty-four \u2014 so a press usually missed, and a miss was not nothing: it went to the map underneath and came back with a depth. Pressing "places I can go" returned a depth reading, which is why the circles looked like they did nothing. A press within a finger\u2019s width of any pin now reaches that pin. Tide stations, gauges and your own marks were the same size and are fixed by the same change.',
      'And they no longer look like tide stations. They were a green ring on a dark middle beside a teal ring on a dark middle, at five pixels\u2019 radius, outdoors. Public land is now drawn as a SQUARE and tide stations stay round, so the difference survives sunlight and does not depend on telling two colours apart. The key shows the square too.',
      'Pressing a pin and then "Back to me" now takes you back. It used to arrive and immediately spring back to the pin, because the open label was holding the map to itself. Leaving somewhere closes the label for it.',
      'Going somewhere far away arrives. A long jump was being asked to animate smoothly across the distance, which the map cannot do \u2014 so it simply stayed put, and the button read as broken. Long moves now jump and short ones still glide.',
      'If you ask for the profile down the river and then go somewhere else while it loads, it no longer drags you back when it arrives. Whatever you asked for last is where you stay.',
  ] },
  { v:'1.2.0', date:'2026-08-31', changes:[
      'A tap near the river is read on the river. Fingers are wide and rivers are narrow, so a tap that landed on the bank used to be answered honestly and uselessly \u2014 no survey there, because there is no survey on dry land. A tap within a mile and a half of the river now moves to the nearest point on the water and the app says how far it moved, so you can see it was your tap that was adjusted and not the depth.',
      'A tap that is nowhere near the river is no longer treated as a question about the river. It says so, and offers to take you to the surveyed water rather than sending you a reading from open country.',
  ] },
  { v:'1.1.0', date:'2026-08-30', changes:[
      'When tapping the map does not give you a depth, it now tells you what happened, whether you did anything wrong, and what to do about it. Before, it named the outcome and stopped \u2014 so tapping water the state has never surveyed produced a sentence about weed and no way to tell whether you had made a mistake, whether it would ever work, or where to tap instead. Tapping outside the surveyed reaches now says so plainly and offers to take you to water where it does work.',
      'You can trace the depth profile. Drag a finger along it and a mark moves along the line on the map, showing you where that deep bit actually is, with the depth the survey measured there. Where the survey measured nothing it says so rather than reading a number off the line.',
      'There is a way back. Once the app knows where you are, a Back to me button on the map returns you there from wherever you have wandered to \u2014 and if you have not used Where I am but you have kept marks, it goes to the nearest one and says so. It only appears when there is somewhere to go.',
  ] },
  { v:'1.0.0', date:'2026-08-30', changes:[
      'The map no longer opens on the whole planet. On a phone it lives in a tab, so for most of the app\u2019s life it is hidden and measures nothing \u2014 and asking it to fit a river into nothing gives you the view from orbit. No view is worked out now until the map is actually on screen.',
      'The line the depth is measured along is drawn so you can see it. It was a thin dashed stroke over satellite imagery with sixty pins on top; it is now a bright line with a dark casing, the way a route is drawn on a photograph, and the key says what it is.',
      'Part of each tidal river\u2019s bar is washed in cyan to show how far up the tide reaches, and nothing anywhere said so. The scale under the bars now has a swatch for it.',
      'Version one. Not because it is finished — what is still not right is listed below, as it has been in every release — but because it now does the thing it is named for. It tells you where the deep water is, where the state has actually measured and where it has not, when the tide turns and at which station, what the water is doing at every gauge that reports, and where you are allowed to stand. It works with no signal once it has loaded, and it holds nothing about you.',
      'The tab called Layers is called Depth. That is what is behind it \u2014 where the state has surveyed, the depth at a point, and the profile along a line \u2014 and \u201cLayers\u201d is a mapping word that told you nothing about what you would find. If you have been looking for the depth profiles and not finding them, that is why, and it was the app\u2019s fault rather than yours.',
      'Inside that tab, the profile now comes before the single-point reading, and its heading says the word: Depth along a line \u2014 the profile.',
      'You can now buy a coffee by Venmo as well as PayPal, under the (i). Same coffee, whichever is less trouble.',
  ], broken:[
      'Depth exists only where the state has surveyed — a handful of reaches out of hundreds of kilometres of river. The surveyed water is outlined on the map so you can see what is covered before you go looking for a number that was never measured.',
      'There are no boat ramps in this app. No published list of them for these rivers could be found, and rather than invent one it shows CDFW’s own public land instead, which is a different thing and is labelled as one.',
      'It is not a navigation aid. The depth surveys come from the state, whose own notes say they are not for navigating by, and that restriction travels with them.',
      'Season dates are each reach’s standing open season. The Commission can start a reach later or end it earlier, and the printed regulations are the authority — not this.',
      'A weir going over its crest has not happened while this app has existed, so what you will see if one does has been tested against a made-up file and never against the day.',
      'On the Mokelumne every gauge is tidal, so its flow figure swings with the tide rather than telling you what the river is carrying, and no gauge on it publishes a week of history.',
      'It will not tell you where fish are being caught, and it is not going to. There is no honest source for that, and a made-up one would be worse than nothing.',
  ] },
  { v:'0.14.0', date:'2026-08-30', changes:[
      'There is a way to buy me a coffee, under the (i) button. It is a link and nothing else \u2014 no counter, no total, no thank-you tier, and nothing about the app changes whether you use it or not. There is no version you are missing.',
      'It is only in the (i) panel and it is never going to appear anywhere you are actually reading the water.',
  ] },
  { v:'0.13.0', date:'2026-08-30', changes:[
      'Public land is on the map. These are CDFW\u2019s own lands within twelve kilometres of each river \u2014 places the department says you may go, in its own words, with a link to its page where it has one. Forty-six of them across the four rivers, on the map from the first load with no signal and nothing to download, and listed in Layers under Getting to the water with the closest to the river first.',
      'They are NOT boat ramps, and the app does not call them that. There is no published list of ramps for these rivers that this build could find \u2014 the state\u2019s one public access dataset is coastal beaches, with none on this water \u2014 and rather than invent one, this answers the question the data can actually answer: where you are allowed to be.',
      'Each pin is the middle of a property rather than a spot on the bank, so every one carries how far it is from the river. A wildlife area whose centre is eight kilometres from the water is a different proposition from one on the bank, and a dot on its own cannot tell you which you are looking at.',
  ] },
  { v:'0.12.0', date:'2026-08-30', changes:[
      'The Layers panel leads with depth now. It used to open with three radio buttons for which picture to draw the water on \u2014 a preference \u2014 and two orange warning boxes, so anybody looking for the bottom met all of that first. The basemap chooser is still there, at the end, where a preference belongs.',
      'The strip at the top could say two things that cannot both be true: readings "seconds old" and "network did not answer". A reply that arrives carrying nothing still counts as having arrived, so the app was quoting the age of the attempt rather than of any reading. When nothing has answered it now says so and quotes no age.',
      'The caption on the river bar read "tide to SACRAMENTO, SACRAMENTO RIVER", which parses as nowhere \u2014 that is a station\u2019s name, a place and a river with a comma between them. The mark says how far up the tide is predicted to reach, so that is what it says now, and the station\u2019s name stays in the tide panel where there is room for it.',
  ] },
  { v:'0.11.0', date:'2026-08-30', changes:[
      'You can see where the depth is now. The state has surveyed a handful of reaches out of hundreds of kilometres of river, and the app opened on the whole basin with nothing marking them \u2014 so there was no way to tell surveyed water from water nobody has ever measured. The surveyed reaches are outlined on the map, they are in the map key, and one button in Layers takes you straight to them.',
      'Cross-sections cut across the river, not across the screen. The old one drew a line between the left and right edges of whatever the map was showing, which at the size this app opens on is a line across the state and a cross-section of nothing. It now cuts at right angles to the river\u2019s own course, a few hundred metres bank to bank, at the point on the river nearest the middle of your map.',
      'Every gauge now has a Map button that takes you to it, and the tide station you are reading does too. The app always knew exactly where they were and still left you to find them by panning.',
      'The app opens quicker. The river courses are 39 KB of coordinates that only the depth profile uses, and every reader was waiting for them to load before the map appeared \u2014 including anyone who only wanted the water temperature. They load the first time you profile something instead, and still work with no signal.',
  ] },
  { v:'0.10.0', date:'2026-08-30', changes:[
      'Profile down the river itself. Until now the depth profile could only follow a line you drew, because the app had no line of its own for these rivers and would not invent one. Each river\u2019s course now ships with the app, taken from the USGS national hydrography \u2014 598 km of the Sacramento, and the Feather, American and Mokelumne too \u2014 so one press draws the bottom down the river without you having to guess where the middle is.',
      'It gives you the longest stretch the state has actually surveyed, and says so. Depth only exists where somebody went out and measured it; spreading a profile over six hundred kilometres of unmeasured water would be a picture of almost nothing.',
      'Where a river forks, the app follows the longer channel and leaves the other alone. On the Mokelumne the published data puts both Delta channels under one name, and joining them would have drawn a river running twelve kilometres across dry land.',
  ] },
  { v:'0.9.0', date:'2026-08-30', changes:[
      'Depth along a line. Draw a line on the map and the app reads the published survey the whole way along it, then draws the bottom underneath the map so the shape and the place are on screen together. Drawn down the middle of the river it is a long profile; drawn from one bank to the other it is a cross-section that shows you which side the channel is on. It is the same line either way \u2014 the app does not choose for you, because there is no published centreline for these rivers and it will not invent one.',
      'Where two surveys cover the same water you get both, drawn as separate lines, because they were measured on different days and neither is more the bottom than the other. Where the survey measured nothing the line breaks rather than running straight across \u2014 dense weed defeats the sounder and those cells are dropped, and a line drawn through a gap would be inventing a bed.',
      'If you have used Where I am and you are near the line, it marks where you are on it. If you are not near it, it says how far off you are instead of leaving you to assume.',
      'The profile stretches and scrolls. The vertical scale is deliberately not the horizontal one \u2014 a mile of river against thirty feet of water drawn true to scale is a flat line \u2014 so read the shape and the numbers, and it says so rather than letting you read a slope off it.',
      'The block about checking NOAA for new tide stations was pushing the actual tide off the screen. It is folded shut at the bottom of the tide section now, and its heading says what is inside without being opened.',
      'That block could also be wrong. If you had pressed the check on an older version, its answer was read back under the new question and reported the stations that ship with the app as newly added. An answer now belongs to the build that asked it.',

  { v:'0.8.0', date:'2026-08-30', changes:[
      'The first-run page did not fit on the screen it opened on. Reported from a real phone by somebody seeing the app for the first time \u2014 the panel had no height of its own, so it ran off the bottom.',
      'That page also buried the one thing worth doing before you leave the house. Putting Thalweg on your home screen is now its own box, immediately above the Start button, where somebody scrolling for the button actually passes it \u2014 and the line telling you everything else lives under the (i) is no longer set in small print beside it.',
      'The tide now says what it is. It is predicted at ONE station, not for the whole river, and on this water high tide at the top of a reach and at the bottom are hours apart. The picker is labelled Predicted at rather than Station, and says in plain words that you should pick the one nearest where you will be. If you have used Where I am, it names the nearest station to you and offers it in one press \u2014 or tells you that you are already on it.',
      'Tapping a control on the map \u2014 the Key, or Where I am \u2014 used to also drop a depth reading on the map underneath it. That only happened with a finger, never with a mouse, so it had gone unseen on every desktop check.',

  { v:'0.7.0', date:'2026-08-30', changes:[
      'The map has a key now. Gauges, tide stations, your own marks and your own position are four different dots, and the only way to find out which was which was to tap one \u2014 and the two sizes of tide station looked deliberate without ever saying why. The key lists only what is actually on the map at that moment, so it can never name something that is not there. On a phone it starts as a small Key button, because the map is small; on anything wider it is open.',
      'The key never blocks the map. You can tap a pin that is sitting underneath it, which the first version of it stopped you doing.',

  { v:'0.6.0', date:'2026-08-30', changes:[
      'There is a Home button now. It takes you back to the four-river page the app opens on, at the top, in one press. You could always get there through the River menu, but a menu you have to open and then find the right line in is not the same as a way back.',
      'When your readings have gone old, the message now tells you what you can do about it. It says when the app last tried, that it tries again by itself every ten minutes and every time you come back to it, and that there is no waiting period stopping you. And there is a Try now button, which tells you whether anything new arrived or whether you are looking at the same readings.',

      'Every tide station on these rivers now comes with the app \u2014 sixty-one of them, on the map the moment you open it, with no signal needed and nothing to wait for. They used to show up only if you went looking, cost you a large download when you did, and were gone again the next time you opened the app.',

      'First release. It opens on all four rivers, each with a card saying whether it is open, what the water temperature means, how much water is coming down and when the tide next turns \u2014 the go-or-not answer before you drive anywhere. Tap one for its own map, tide and depth.',
      'Thalweg does not rank the four. Reading a thermometer against a threshold is one thing; telling you where the fishing will be better is a forecast it has no basis for.',

      'Water clarity, where a gauge measures it: turbidity in FNU beside the flow and the temperature, described in plain words \u2014 clear, lightly coloured, stained, muddy. Most gauges have no sensor for it. On the Sacramento three of six report it and on the Mokelumne two of three; the American has four gauges and none, and the state publishes none for the Feather. Where there is no sensor the app says so rather than showing a dash, because a dash would read as water too clear to measure.',

/* Which device this is, so the install instructions lead with the one that
   applies. iPadOS Safari calls itself macOS, so the touch count is what
   separates an iPad from a Mac. */
function platformGuess(){
  var ua = navigator.userAgent || '', touch = (navigator.maxTouchPoints || 0) > 1;
  if (/iPhone|iPod/.test(ua)) return 'iphone';
  if (/iPad/.test(ua) || (touch && /Macintosh/.test(ua))) return 'ipad';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}
var INSTALL = [
  { id:'iphone',  label:'iPhone, in Safari',
    how:'Tap the Share button at the bottom, scroll down, then Add to Home Screen.' },
  { id:'ipad',    label:'iPad, in Safari',
    how:'Tap the Share button at the top right, then Add to Home Screen.' },
  { id:'android', label:'Android, in Chrome',
    how:'Tap the three-dot menu, then Install app, or Add to home screen.' },
  { id:'desktop', label:'On a computer, in Chrome or Edge',
    how:'Click the install icon at the right-hand end of the address bar.' }
];
function installList(){
  var here = platformGuess();
  var ul = el('ul',{class:'tight'});
  INSTALL.slice().sort(function(a,b){
    return (a.id === here ? -1 : 0) - (b.id === here ? -1 : 0);
  }).forEach(function(p){
    var li = el('li',{});
    li.appendChild(el('b',{ text:p.label + (p.id === here ? ' — this device. ' : '. ') }));
    li.appendChild(document.createTextNode(p.how));
    ul.appendChild(li);
  });
  return ul;
}

/* Somewhere to send a problem, with the build already in it. */
var REPO = 'https://github.com/njefferson/Cv-Thalweg';
function reportUrl(){
  var body = 'What I expected:\n\nWhat happened instead:\n\n' +
    'Which river and which panel:\n\n' +
    '--- paste the diagnostic report here (the button next to this link copies it) ---\n';
  return REPO + '/issues/new?title=' +
    encodeURIComponent('Thalweg ' + VERSION + ': ') +
    '&body=' + encodeURIComponent(body);
}

function renderAbout(){
  var b = $('#aboutbody'); b.innerHTML = '';
  function h(t){ b.appendChild(el('h3',{text:t})); }
  function para(t){ b.appendChild(el('p',{text:t})); }

  /* The build, first, because the commonest reason to open this panel is
     that something looked wrong and somebody needs to know which Thalweg
     you were looking at. */
  var build = el('p',{class:'note'});
  build.appendChild(el('b',{text:'Version ' + VERSION}));
  build.appendChild(document.createTextNode(' · '));
  build.appendChild(el('span',{id:'aboutbuild',text:'checking which build…'}));
  b.appendChild(build);
  buildLine().then(function(txt){
    var n = document.getElementById('aboutbuild');
    if (n) n.textContent = txt;
  });

  h('What Thalweg is');
  para('Three numbers for ' + riverCountPhrase() + ', in one place: how deep the water is, when the tide turns, and how much water is coming down. ' + initialCap(riverNamesPhrase()) + ', plus ' + networkNamesPhrase() + ' they run into.');
  para('It opens on all ' + countWord(riverCount()) + ' at once because that is usually the real question — not what the ' + otherRiverExample() + ' is doing, but which of the ' + countWord(riverCount()) + ' is worth the drive. The stacked bars put every gauge where it sits on its river, downstream on the left, coloured by water temperature on one scale so the rivers can be compared at a glance. Pick a single river for its tide, its depth and your own marks.');

  var againRow = el('div',{class:'rowline'});
  var again = el('button',{type:'button',text:'Show the first-visit page again'});
  again.addEventListener('click', function(){ $('#about').close(); showWelcome(); });
  againRow.appendChild(again);
  b.appendChild(againRow);

  h('What it will not do');
  para('It will not tell you where fish are being caught. There is no live catch feed for these rivers, so there is nothing honest to show, and a made-up one would be worse than nothing. No bite forecast, no spot predictor, and none is coming.');
  para('It is not a navigation aid. The depth surveys come from the state, whose own notes say they are not for navigating by, and that restriction travels with them.');
  para('It does not want an account, cannot be logged in to, and carries no analytics, no tracking and no third-party code of any kind. Your marks live on your device and are sent nowhere.');
  para('Where I am, on the map, is the same, with one honest caveat. The button asks your browser, your browser asks you once, and the answer is drawn and then forgotten: it is not saved between visits, and your coordinate is not sent to this app\u2019s servers, to the depth service, or to anyone else. The caveat is that moving the map to you makes it load map tiles for that area, so whoever serves the basemap can tell roughly where you are looking \u2014 to about the size of a tile, a couple of kilometres at that zoom. That is the same thing that happens if you scroll there by hand, and it is a property of every map you have ever used; it is written here because it is true, not because it is unusual. The one thing that sends your exact coordinate anywhere is asking how deep it is at a point, and that only happens when you tap the map yourself.');

  h('Put it on your home screen');
  para('Worth doing. Installed, it opens full screen with no browser chrome, and it keeps working with no signal — which on most of this water is the normal condition rather than the exception. Everything it had already loaded stays: the map you looked at, the depth you switched on, the tide for the week ahead, and all your marks.');
  b.appendChild(installList());
  para('Flow and water temperature are the exception: those need a signal, and when they are old the top of the screen says so in orange rather than letting a stale number sit there looking current.');

  h('What changed');
  RELEASES.forEach(function(r){
    b.appendChild(el('p',{style:'font-weight:600;margin-bottom:.2rem',
      text:'Version ' + r.v + ' — ' + r.date}));
    var u1 = el('ul',{class:'tight'});
    r.changes.forEach(function(c){ u1.appendChild(el('li',{text:c})); });
    b.appendChild(u1);
    if (r.broken && r.broken.length){
      b.appendChild(el('p',{class:'note',style:'margin-bottom:.2rem',
        text:'What is still not right in ' + r.v + ':'}));
      var u2 = el('ul',{class:'tight'});
      r.broken.forEach(function(c){ u2.appendChild(el('li',{text:c})); });
      b.appendChild(u2);
    }
  });

  h('Something looks wrong');
  para('Two taps. Copy the diagnostic, then open a report and paste it in. The diagnostic is plain text you can read before you send it: it says which build you have, what kind of device, which of the services answered and which did not, and how old the readings are. It contains nothing you typed and none of your marks — only how many you have.');
  var btn = el('button',{type:'button',text:'Copy diagnostic report'});
  var ta = el('textarea',{readonly:'readonly','aria-label':'Diagnostic report'});
  btn.addEventListener('click', function(){
    diagnostic().then(function(txt){
      ta.value = txt; ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
      btn.textContent = 'Copied';
      setTimeout(function(){ btn.textContent = 'Copy diagnostic report'; }, 2500);
      announce('Diagnostic report copied.');
    });
  });
  var row = el('div',{class:'rowline'});
  row.appendChild(btn);
  row.appendChild(el('a',{ href:reportUrl(), target:'_blank', rel:'noopener noreferrer',
    text:'Open a report' }));
  b.appendChild(row);
  diagnostic().then(function(t){ ta.value = t; });
  b.appendChild(ta);

  h('Where the numbers come from');
  para('Nothing here is measured by this app. It redraws what public services publish, and says which one each number came from.');
  var u3 = el('ul',{class:'tight'});
  [ ['River flow, height and temperature — the US Geological Survey',
     'https://waterdata.usgs.gov/ca/nwis/current/?type=flow'],
    ['The Feather River’s gauges — California DWR, through CDEC, because USGS publishes nothing current for that river',
     'https://cdec.water.ca.gov/'],
    ['Tide predictions — NOAA, to the MLLW datum',
     'https://tidesandcurrents.noaa.gov/'],
    ['Depth surveys — California DWR',
     'https://data.cnra.ca.gov/dataset/i06-singlebeam-bathymetry'],
    ['Season and limits — CDFW, Title 14 section 7.40',
     'https://wildlife.ca.gov/Regulations/Freshwater-Sport-Fishing'],
    ['Public land, and where you can launch — CDFW, from the service behind its own Fishing Guide',
     'https://wildlife.ca.gov/Fishing/Guide']
  ].forEach(function(s){
    var li = el('li',{});
    li.appendChild(el('a',{href:s[1],rel:'noopener noreferrer',target:'_blank',text:s[0]}));
    u3.appendChild(li);
  });
  b.appendChild(u3);
  para('Each of those sets its own terms and is the authority on its own data. Where a reading is missing you get a dash, never a zero.');

  h('Reading depth honestly');
  para('Weed beats a depth sounder. Where the growth is thick the survey boat gets no return from the bottom, and those patches are dropped — so a blank space beside a tule edge is water nobody measured, not flat ground. In weedy water a reading may be the top of the weed rather than the bed.');
  para('The single beam surveys are lines, not sheets: dots along the track the boat drove. Between two tracks nothing was measured, and nothing is drawn. And every survey is a photograph of one day — sand moves.');
  para('Where a reach has no published survey at all, the Depth panel says so in words instead of offering you a switch that turns nothing on.');

  h('Getting around it without a pointer');
  para('Every control takes the keyboard, with a visible focus ring, and the panels are a proper tab list you can walk with the arrow keys. The map pans with the arrow keys and zooms with plus and minus once it has focus. Two things that look like they need a finger do not: Add at map centre in the Marks panel drops a mark, and Read the depth at the map centre in the Depth panel asks the survey the same question a tap on the map asks. Where I am sits on the map itself and is a real button, so it takes a thumb and the keyboard equally; it is 44px through on both axes, which the map\u2019s own zoom controls are not.');
  para('Colour is never the only thing carrying a fact: every temperature dot has its figure beside it and every provenance flag is a word. Reduced motion is honoured. If anything here is unusable for you that is a fault worth reporting, and the button above is how.');

  h('Where this came from');

  var hubRow = el('div',{class:'rowline'});

    rel:'noopener noreferrer', target:'_blank', text:'The rest of the apps'}));
  hubRow.appendChild(el('a',{href:'https://noahjefferson.pages.dev/accessibility',
    rel:'noopener noreferrer', target:'_blank', text:'Accessibility statement'}));

  /* A TIP JAR, AND NOTHING THAT NAGS. It lives here, in the panel somebody
     opens when they want to know about the app, and nowhere on the working
     surface — a prompt for money has no business competing with reading the
     water on a riverbank. No counter, no total, no thank-you tier, nothing

  h('If it was useful');

  var tipRow = el('div',{class:'rowline'});

}

/* Which build is live, for the panel and for a screenshot. */
function buildLine(){
  return fetch('version', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.commit) return 'build not identified on this host';
      return 'build ' + j.commit.slice(0,7) + (j.branch ? ' (' + j.branch + ')' : '');
    })
    .catch(function(){ return 'build unknown — offline'; });
}

/* Doctrine §7f: a text report that carries what the browser string hides.
   iPadOS Safari reports itself as macOS, so maxTouchPoints is what tells
   an iPad from a Mac. */
function diagnostic(){
  var lines = [];
  function L(k,v){ lines.push(k + ': ' + v); }
  L('Thalweg', VERSION);
  L('When', new Date().toISOString());
  L('User agent', navigator.userAgent);
  L('maxTouchPoints', navigator.maxTouchPoints);
  L('Platform hint', (navigator.maxTouchPoints > 1 &&
      /Macintosh/.test(navigator.userAgent)) ? 'touch device reporting as macOS (an iPad)' : 'as reported');
  L('Viewport', window.innerWidth + 'x' + window.innerHeight +
      ' at dpr ' + (window.devicePixelRatio || 1));
  L('Display mode', window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
      ? 'standalone (installed)' : 'browser tab');
  L('Storage backend', Store.kind);
  L('Ribbon', document.getElementById('ribbonwrap').hidden
      ? 'hidden — not enough height for ' + (state.riverId ? 1 : RIVERS.length) + ' row(s)'
      : 'shown, row height ' + (RIB ? RIB.rowH : '?') + 'px');
  L('Reduced motion', reduceMotion ? 'yes' : 'no');
  L('Online', navigator.onLine ? 'yes' : 'no');
  L('BATHY_PROXY', BATHY_PROXY || '(empty — talking to DWR directly)');
  L('River', state.riverId || 'All');
  L('Depth ramp', state.ramp ? 'on' : 'off');
  L('NOAA chart probe', state.chartUsable === null ? 'not run' : String(state.chartUsable));
  if (state.catalog){
    L('Catalog age', ageText(Date.now() - state.catalog.at));
    L('Multibeam services', state.catalog.raster.length +
      (state.catalog.rasterError ? ' (error: ' + state.catalog.rasterError + ')' : ''));
    L('Single beam layers', state.catalog.single.length +
      (state.catalog.singleError ? ' (error: ' + state.catalog.singleError + ')' : ''));
    var un = state.catalog.raster.concat(state.catalog.single)
      .filter(function(r){ return r.box && r.box.unknownWkid; });
    if (un.length) L('Unplaced (projection not converted)',
      un.map(function(r){ return (r.name || r.title) + ' [wkid ' + r.box.unknownWkid + ']'; }).join('; '));
  } else L('Catalog', 'not loaded');
  RIVERS.forEach(function(r){
    var g = state.gauges[r.id];
    L('Gauges ' + r.id, g ? (g.rows.length + ' rows, ' +
      (g.fetchedAt ? ageText(Date.now() - g.fetchedAt) : 'never') +
      (g.stale ? ', STALE' : '')) : 'not loaded');
  });
  L('Marks on this river', String(state.marks.length) + ' (positions not included)');
  lines.push('');
  lines.push('Service worker:');
  var swPart = Promise.resolve('  not supported');
  if ('serviceWorker' in navigator){
    swPart = navigator.serviceWorker.getRegistration().then(function(reg){
      if (!reg) return '  none registered';
      return '  active=' + (reg.active ? reg.active.state : 'none') +
             ' waiting=' + (reg.waiting ? 'yes' : 'no') +
             ' installing=' + (reg.installing ? 'yes' : 'no');
    }).catch(function(e){ return '  query failed: ' + e; });
  }
  var cachePart = Promise.resolve('  caches API unavailable');
  if (window.caches && caches.keys){
    cachePart = caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){
        return caches.open(k).then(function(c){ return c.keys(); })
          .then(function(rs){ return '  ' + k + ': ' + rs.length + ' entries'; });
      })).then(function(rows){ return rows.join('\n') || '  none'; });
    }).catch(function(e){ return '  cache read failed: ' + e; });
  }
  /* Which build is actually live. The page cannot know this on its own —
     there is no build step to stamp a commit into a static file — so it
     asks the deployment, and says plainly when there is nothing to ask. */
  var buildPart = fetch('version', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j) return '  no /version endpoint on this host';
      return '  commit ' + (j.commit || 'unknown') +
             (j.branch ? ' on ' + j.branch : '') +
             (j.commit ? '' : ' — ' + j.source);
    })
    .catch(function(){ return '  /version did not answer'; });

  return Promise.all([swPart, cachePart, buildPart]).then(function(r){
    lines.push(r[0]);
    lines.push('');
    lines.push('Caches:');
    lines.push(r[1]);
    lines.push('');
    lines.push('Deployed build:');
    lines.push(r[2]);
    lines.push('');
    lines.push('Last network attempts (newest last):');
    state.net.slice(-25).forEach(function(n){
      lines.push('  ' + (n.ok ? 'ok  ' : 'FAIL') + ' ' + n.label +
                 (n.detail ? ' — ' + n.detail : ''));
    });
    return lines.join('\n');
  });
}

/* =====================================================================
   First run. The orientation survives whatever you press to begin: it is
   moved into the About panel, not copied there, so there is one copy of
   these words in the app.
   ===================================================================== */
/* The way out is wired at start-up, before there is any content for it to
   depend on, and it is one handler on the dialog rather than one per button,
   so Close, Start and the Escape key cannot drift into meaning different
   things. A dismiss that depends on the panel's own content is a trap the
   moment that content fails. */
function initWelcome(){
  var dlg = $('#welcome');
  if (!dlg.showModal) return;
  dlg.addEventListener('close', function(){
    try { Store.s.setItem('thalweg:_shared:welcomed', VERSION); } catch(e){}
    /* Closing a dialog returns focus to whatever opened it, and nothing
       opened this one — so focus fell to BODY and a reader on a keyboard or
       a screen reader was left with no position in the app at all. */
    var tab = document.querySelector('[role=tab][aria-selected=true]');
    if (tab) tab.focus();
  });
  $('#welcomeclose').addEventListener('click', function(){ dlg.close(); });
}

function maybeWelcome(){
  var seen = Store.s.getItem('thalweg:_shared:welcomed');
  if (seen === VERSION || !$('#welcome').showModal) return;
  showWelcome();
}

/* Also reachable from the (i) afterwards, which is what makes the panel
   testable more than once per device: dismissing it is remembered, so
   without a way back the only way to see it again is to clear storage. */
function showWelcome(){
  var dlg = $('#welcome');
  var b = $('#welcomebody'); b.innerHTML = '';
  function para(t, cls){ b.appendChild(el('p', cls ? {class:cls, text:t} : {text:t})); }
  function head(t){ b.appendChild(el('h3',{text:t})); }

  para('Three numbers for ' + riverCountPhrase() + ', in one place: how deep the water is, when the tide turns, and how much water is coming down. ' + initialCap(riverNamesPhrase()) + ', and ' + networkNamesPhrase() + ' they run into.');

  head('What you are looking at');
  para('It opens on all ' + riverCountPhrase() + ' at once, because that is usually the real question — not what the ' + otherRiverExample() + ' is doing, but which of the ' + countWord(riverCount()) + ' is worth the drive. Each bar is one river with its gauges where they sit along it, downstream on the left, and every dot is coloured by water temperature on the same scale, so the ' + countWord(riverCount()) + ' can be read against each other.');
  para('Pick a single river from the top and you get its tide, its published depth surveys, and somewhere to drop your own marks. On a phone the map is a tab of its own beside Water, Layers, Marks and Brief, so the readings keep the screen until you ask for it.');

  head('Worth knowing before you rely on it');
  var u = el('ul',{class:'tight'});
  [ 'It works with no signal once it has loaded, which on most of this water is the normal condition. Tide predictions are fetched a week ahead so they stay good in your pocket.',
    'Flow and temperature are the exception — those need a signal, and when they go stale the top of the screen says so in orange rather than letting an old number sit there looking current.',
    'No account, no sign-up, no tracking, no third-party code. Your marks stay on this device.',
    'Depth is only where the state has actually surveyed. Where nothing has been surveyed it says so, rather than showing you an empty switch.'
  ].forEach(function(t){ u.appendChild(el('li',{text:t})); });
  b.appendChild(u);

  b.appendChild(el('div',{class:'magbox',
    text:'It does not know where fish are being caught and will not guess — no live catch feed exists for these rivers. It is not a navigation aid: the depth surveys come from the state, whose own notes say they are not for navigating by.'}));

  para('Every number here comes from USGS, NOAA, DWR or CDFW and is labelled with which one, and where a figure is missing this app says why rather than showing you a zero. It is still young: check what you see against something you trust before you rely on it, and what is still not right is listed under the (i).', 'note');

  /* THE INSTALL OFFER SAT IN THE MIDDLE, and a first-time reader scrolling for
     the button went straight past it — reported by somebody meeting the app on
     a phone, who saw a wall of text and a Start button and nothing else. It is
     the last thing before Start now, which is where a scroller actually lands,
     and it is a box rather than a paragraph in a run of paragraphs. */
  var installed = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if (!installed){
    var inst = el('div',{class:'installbox'});
    inst.appendChild(el('h3',{style:'margin-top:0',text:'Put it on your home screen'}));
    inst.appendChild(el('p',{text:'Worth doing before you go. It opens full screen with no browser chrome, and everything it has already loaded keeps working with no signal — which on most of this water is the normal condition rather than the exception.'}));
    inst.appendChild(installList());
    b.appendChild(inst);
  }

  var row = el('div',{class:'rowline'});
  var ok = el('button',{type:'button',text:'Start'});
  ok.addEventListener('click', function(){ dlg.close(); });
  row.appendChild(ok);
  b.appendChild(row);
  /* Not a tiny note beside the button. The one sentence telling a reader where
     everything they just scrolled past has GONE was set in the small print,
     next to the thing they were already reaching for. */
  b.appendChild(el('p',{style:'margin:.5rem 0 0',
    text:'All of this — the install steps, where each number comes from, and what changed since last time — stays under the (i) button in the top corner.'}));

  dlg.showModal();
  /* Left to itself the dialog hands focus to the first thing it can find,
     which is the Start button at the very end of the body — so it opened
     scrolled past everything it exists to say, showing a button and no
     reason for it, with nothing to suggest there was anything above.
     Focus the title instead: the reader starts at the top, and the next
     Tab is the Close beside it. */
  b.scrollTop = 0;
  $('#welcometitle').focus();
}

/* =====================================================================
   Updates. The new version waits; it never takes over under the open
   page. An app that caches itself cannot notice it has gone stale, so
   the noticing has to be built on purpose.
   ===================================================================== */
function initSW(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if (reg.waiting) offerUpdate(reg);
    reg.addEventListener('updatefound', function(){
      var w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', function(){
        if (w.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(reg);
      });
    });
    /* Ask once on load and again when the app is brought back up. */
    setTimeout(function(){ reg.update().catch(function(){}); }, 8000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) reg.update().catch(function(){});
    });
  }).catch(function(e){ logNet('service worker', 'sw.js', false, String(e)); });

  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloading) return;
    reloading = true;
    window.location.reload();
  });
}

function offerUpdate(reg){
  var strip = $('#updatestrip');
  strip.hidden = false;
  $('#updatetext').textContent =
    'A new version of Thalweg is ready. It is waiting — nothing has changed under you.';
  $('#updatebtn').onclick = function(){
    try { Store.s.setItem('thalweg:_shared:justUpdated', '1'); } catch(e){}
    if (reg.waiting) reg.waiting.postMessage({ type:'SKIP_WAITING' });
    $('#updatetext').textContent = 'Loading…';
  };
  $('#updatedismiss').onclick = function(){ strip.hidden = true; };
  announce('A new version of Thalweg is waiting.');
}

/* The page that shows the strip is the old build and has never heard of
   the release it is offering. The only moment anything in the app knows
   what changed is after the reload, so that is when it says so. */
function maybeWhatChanged(){
  if (Store.s.getItem('thalweg:_shared:justUpdated') !== '1') return;
  try { Store.s.removeItem('thalweg:_shared:justUpdated'); } catch(e){}
  showWhatsNew();
}

/* THE READER PRESSED UPDATE AND IS OWED AN ANSWER TO ONE QUESTION. This used
   to open the whole About panel at its top, which is "What Thalweg is" — so
   the one thing they had just asked for was several screens down, under
   everything they already knew. */
function showWhatsNew(){
  var r = RELEASES.filter(function(x){ return x.v === VERSION; })[0];
  var body = $('#newbody');
  body.textContent = '';
  $('#newtitle').textContent = 'What changed in ' + VERSION;

  if (!r){
    /* A version with no note is a defect, not a blank panel. notes-check
       refuses it before it can ship, and this is what a reader sees if one
       ever gets past that. */
    body.appendChild(el('p',{ text:'This version arrived without its notes, which is a fault in the app rather than in your copy. Everything else works.' }));
  } else {
    var u = el('ul',{class:'tight'});
    r.changes.forEach(function(c){ u.appendChild(el('li',{text:c})); });
    body.appendChild(u);
    /* THE LIMITS BELONG TO THE APP, NOT TO A RELEASE. Requiring every version
       to restate them makes the notes repetitive and the honest ones get
       skimmed; letting a version without its own list show nothing means a
       reader updating to a small release is told the app has no limits. So
       the standing list is the most recent one declared, shown whether or not
       this version added to it. */
    var standing = r.broken && r.broken.length ? r.broken : null;
    if (!standing)
      for (var q = 0; q < RELEASES.length && !standing; q++)
        if (RELEASES[q].broken && RELEASES[q].broken.length) standing = RELEASES[q].broken;
    if (standing){
      body.appendChild(el('p',{class:'note',style:'margin-bottom:.2rem',
        text:'Still not right, and worth knowing before you rely on it:'}));
      var u2 = el('ul',{class:'tight'});
      standing.forEach(function(c){ u2.appendChild(el('li',{text:c})); });
      body.appendChild(u2);
    }
  }

  var row = el('div',{class:'rowline'});
  var older = el('button',{type:'button',id:'newolder',text:'Earlier versions, and everything else about Thalweg'});
  older.addEventListener('click', function(){
    $('#whatsnew').close();
    renderAbout();
    var d = $('#about');
    if (d.showModal) d.showModal(); else d.setAttribute('open','open');
    $('#aboutbody').scrollTop = 0;
    $('#abouttitle').focus();
  });
  row.appendChild(older);
  body.appendChild(row);

  var dlg = $('#whatsnew');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','open');
  body.scrollTop = 0;
  $('#newtitle').focus();
  announce('Updated to ' + VERSION + '. ' +
    (r ? r.changes.length + ' change(s) in this version.' : ''));
}

/* =====================================================================
   Boot
   ===================================================================== */
function boot(){
  initPicker();
  initTabs();
  initMap();

  initWelcome();
  $('#aboutbtn').addEventListener('click', function(){
    renderAbout();
    var d = $('#about');
    if (d.showModal) d.showModal(); else d.setAttribute('open','open');
    $('#aboutbody').scrollTop = 0;
    $('#abouttitle').focus();
  });
  $('#aboutclose').addEventListener('click', function(){ $('#about').close(); });
  $('#newclose').addEventListener('click', function(){ $('#whatsnew').close(); });

  $('#profclear').addEventListener('click', clearProfile);
  $('#profin').addEventListener('click', function(){
    state.profZoom = Math.min(8, (state.profZoom || 1) * 1.6); renderProfile(); });
  $('#profout').addEventListener('click', function(){
    state.profZoom = Math.max(1, (state.profZoom || 1) / 1.6); renderProfile(); });

  /* Home. Back to the four-river landing this app opens on, on the Water tab,
     scrolled to the top — all three, because arriving at the landing halfway
     down a panel is not arriving at the landing. */
  /* THE LABEL SAYS WHAT IS THERE. It offered to take a reader "back to all
     four rivers" while five things were listed under it. */
  (function(){
    var hb = $('#homebtn'), label = 'Home \u2014 back to all ' + riversPhrase();
    hb.title = label; hb.setAttribute('aria-label', label);
  })();
  (function(){
    var d = $('#sideways'), c = $('#swclose');
    if (c) c.addEventListener('click', function(){ d.close(); });
    if (d) d.addEventListener('close', function(){
      announce('Back to the upright view.');
      /* THE BUTTON, NOT THE ROW IT SITS IN. A div is not focusable, so
         focusing it silently does nothing and the reader is returned to the
         top of the document — which is the same "focus lands on BODY" defect
         the first-run panel was fixed for. */
      /* A FALLBACK, NOT AN OVERRIDE. A modal returns focus to whatever held it
         when it opened, and that is the right answer: press the button, come
         back to the button. Trying to set it here instead raced the platform
         and lost — focus ended up on whichever tab had been clicked earlier in
         the session, which is worse than doing nothing.
         What the platform cannot handle is having nowhere to go, when the
         element that had focus was rebuilt while this was open. Then focus
         lands on BODY, which is the "somewhere real" defect the first-run
         panel was fixed for. So: only then, and only if there is still a
         button to take it. */
      setTimeout(function(){
        var row = document.getElementById('swopen');
        if (!row || row.hidden) return;
        /* Left alone when the platform got it right — press the button, come
           back to the button, and this changes nothing. It is wrong whenever
           the readings refresh while this is open: the panel is rebuilt, the
           element the modal was going to restore to is detached, and focus
           lands wherever was touched before that — measured landing on the
           Depth tab, three controls away from where the reader was. */
        if (row.contains(document.activeElement)) return;
        var b = row.querySelector('button');
        if (b) b.focus();
      }, 0);
    });
    /* A rotation that survives the screen changing under it. */
    var band = document.getElementById('ribbonwrap');
    if (band) band.addEventListener('scroll', markRibbonScrollEnd, { passive: true });
    var swTimer = null;
    window.addEventListener('resize', function(){
      if (!d || !d.open) return;
      clearTimeout(swTimer);
      swTimer = setTimeout(drawSideways, 180);
    });
  })();
  $('#homebtn').addEventListener('click', function(){
    selectRiver('');
    selectTab('water');
    var panel = $('#panel-water');
    if (panel) panel.scrollTop = 0;
    /* THE BUTTON ASKED THE LIST AND THE ANNOUNCEMENT DID NOT. `#homebtn`'s
       label is built from riversPhrase(); this sentence, which is the only
       version of it a screen-reader user ever gets, was typed. One file, two
       answers, and the stale one was the one nobody looking at the screen
       could see. Found by tools/copy-count.mjs on the run that added it. */
    announce('Back to all ' + riversPhrase() + '.');
  });

  var initial = Store.s.getItem('thalweg:_shared:river');
  selectRiver(initial === null ? '' : initial);
  selectTab('water');

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      drawRibbon();
      drawTrendLines();
      if (state.map) mapBecameVisible();
    }, 180);
  });

  window.addEventListener('online',  function(){ refreshData(); announce('Back online.'); });
  /* Coming back to the app is the moment a reader most expects it to have
     looked. It only asked on a ten-minute timer, so an app left open in a
     pocket for an hour and reopened showed the strip and then sat there. */
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && navigator.onLine) refreshData();
  });
  window.addEventListener('offline', function(){ updateStaleness(); announce('Offline. Stored readings only.'); });
  setInterval(function(){ if (navigator.onLine) refreshData(); }, REFRESH_MS);
  setInterval(updateStaleness, 60 * 1000);

  var chip0 = document.getElementById('verchip');
  if (chip0) chip0.textContent = 'v' + VERSION;
  buildLine().then(function(txt){
    var chip = document.getElementById('verchip');
    if (!chip) return;
    var m = /build ([0-9a-f]{7})/.exec(txt);
    if (m) chip.textContent = 'v' + VERSION + ' · ' + m[1];
    chip.title = 'Thalweg ' + VERSION + ' · ' + txt;
  });

  initSW();
  maybeWhatChanged();
  maybeWelcome();
}

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
