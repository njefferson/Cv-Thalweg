 * bake, or something the button has turned up since. */
function discoverTideStations(river){
  var known = {};
  bakedStations(river).forEach(function(s){ known[s.id] = s; });
  var extra = sget(river.id, 'tidestations');
  var bakedAt = (typeof TIDE_STATIONS_META === 'object' && TIDE_STATIONS_META && TIDE_STATIONS_META.fetchedAt) || '';
  if (extra && extra.against !== bakedAt) extra = null;   /* another build's answer */
  if (extra && extra.list) extra.list.forEach(function(s){
    /* Found by the button, which means NOAA added it after this build. */
    if (isNum(s.lat) && isNum(s.lon)) known[s.id] = {
      id:String(s.id), name:s.name, lat:s.lat, lon:s.lon,
      status:PROV.FOUND, origin:'new' };
  });

  var wanted = (river.tideStations || []).map(function(s){ return s.id; });
  Object.keys(known).forEach(function(id){ wanted.push(id); });
  var seen = {};
  wanted = wanted.filter(function(id){ if (seen[id]) return false; seen[id] = true; return true; });

  var ask = wanted.filter(function(id){ return !known[id]; });
  return Promise.all(ask.map(stationMeta)).then(function(rows){
    rows.forEach(function(r){
      if (isNum(r.lat) && isNum(r.lon)) known[r.id] = { id:r.id, name:r.name,
        lat:r.lat, lon:r.lon, status:PROV.FOUND };
    });
    return wanted.map(function(id){ return known[id]; })
                 .filter(function(r){ return r && isNum(r.lat) && isNum(r.lon); });
  });
}

/* Two megabytes, on purpose, because somebody asked to see what else is out
   there. Once per device: the reduced result is kept and the declared
   stations then come from it without asking again. */
function nearbyTideStations(river){
  return getJSON(COOPS_MD, 30000).then(function(j){
    logNet('CO-OPS station index', COOPS_MD, true, 'asked for on purpose');
    var b = river.bbox, list = [];
    (j.stations || []).forEach(function(s){
      var lat = Number(s.lat), lon = Number(s.lng);
      if (!isFinite(lat) || !isFinite(lon)) return;
      if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) return;
      list.push({ id:String(s.id), name:s.name, lat:lat, lon:lon, status:PROV.FOUND });
    });
    /* ONLY WHAT IS NEW. The stations in this river's box already ship with the
       app — tools/fetch-stations.mjs asked NOAA once and baked them in — so
       there is nothing here to download twice. What this answers is the one
       question the baked file cannot: has NOAA added a station since the build.
       Usually the answer is none, and saying none is the useful answer. */
    var already = {};
    bakedStations(river).forEach(function(s){ already[s.id] = true; });
    (river.tideStations || []).forEach(function(s){ already[s.id] = true; });
    var fresh = list.filter(function(s){ return !already[s.id]; });
    var c = river.center;
    fresh.sort(function(x, y){
      return metresBetween(c[0], c[1], x.lat, x.lon) -
             metresBetween(c[0], c[1], y.lat, y.lon);
    });
    fresh = fresh.slice(0, 12);
    /* STAMPED WITH THE BAKE IT WAS MEASURED AGAINST. "Added since this build"
       is only meaningful relative to a particular baked file, and a stored
       answer that outlives its build is not stale, it is wrong — it was read
       back after the bake shipped and reported forty-four stations as new when
       forty-four is the number that ship with the app. */
    sput(river.id, 'tidestations', { at:Date.now(), list:fresh, inBox:list.length,
      against:(typeof TIDE_STATIONS_META === 'object' && TIDE_STATIONS_META && TIDE_STATIONS_META.fetchedAt) || '' });
    return fresh;
  }, function(e){
    logNet('CO-OPS station index', COOPS_MD, false, String(e && e.message || e));
    throw e;
  });
}

/* =====================================================================
   DWR bathymetry.
   Two different data types, and the difference is the product. A
   multibeam raster is a continuous surface and draws as tiles. Single
   beam soundings are discrete points along the boat's track and are not
   a surface; drawing them as one would invent bottom between the lines.
   ===================================================================== */
var DWR_DIRECT = 'https://gis.water.ca.gov';
var IMG_FOLDER = '/arcgisimg/rest/services/Bathymetry';
var SBM_SERVICE = '/arcgis/rest/services/Elevation/i06_Singlebeam_Bathymetry/MapServer';

function dwr(path){ return (BATHY_PROXY || DWR_DIRECT) + path; }

/* The depth ramp.
 *
 * This rule was run against the live ImageServer before it was written
 * down, which is the only way to know: a rendering rule ArcGIS does not
 * understand does NOT come back as an error. It comes back as HTTP 200,
 * content-type image/png, and a hundred-odd bytes of empty picture. So
 * there is no probe that can tell a working rule from a broken one by
 * watching for a failure — the failure looks exactly like clear water.
 *
 * Two things were measured and both are load-bearing. An explicit
 * ColorRamp object is silently ignored, so the ramp has to be named.
 * "Elevation #2" over a percent-clip stretch with dynamic range
 * adjustment is the one that picks the thalweg out from the flats either
 * side of it, which is the line this app is named after.
 */
var RAMP = encodeURIComponent(JSON.stringify({
  rasterFunction:'Colormap',
  rasterFunctionArguments:{
    ColorrampName:'Elevation #2',
    Raster:{ rasterFunction:'Stretch',
      rasterFunctionArguments:{ StretchType:6, MinPercent:0.5, MaxPercent:0.5,
        DRA:true, UseGamma:false } }
  }
}));

var EsriImg = L.TileLayer.extend({
  options:{ opacity:0.8, maxZoom:19, ramp:false },
  getTileUrl:function(coords){
    var b  = this._tileCoordsToBounds(coords);
    var sw = L.CRS.EPSG3857.project(b.getSouthWest());
    var ne = L.CRS.EPSG3857.project(b.getNorthEast());
    var u = this._baseUrl + '/exportImage?bbox=' + [sw.x,sw.y,ne.x,ne.y].join(',')
          + '&bboxSR=3857&imageSR=3857&size=256,256&format=png32'
          + '&transparent=true&f=image';
    if(this.options.ramp) u += '&renderingRule=' + RAMP;
    return u;
  },
  initialize:function(baseUrl,opts){
    this._baseUrl = baseUrl;
    L.TileLayer.prototype.initialize.call(this,'',opts);
  }
});

/* --- extents -------------------------------------------------------- */
/* ArcGIS reports each service's extent in that service's own projection,
   and DWR's bathymetry is published in State Plane California — usually
   as a WKT string with no EPSG code at all, occasionally as wkid 2226 or
   2227. Every one of the twenty multibeam services is Lambert Conformal
   Conic; every one of the eighty-one single beam layers is Web Mercator.
   So both are converted here rather than guessed at: an extent placed in
   the wrong projection puts a survey in the wrong river, which is the
   class of mistake this whole app is arranged to refuse. */
function extentToLatLng(ext){
  if (!ext || !isNum(ext.xmin) || !isNum(ext.ymin) ||
      !isNum(ext.xmax) || !isNum(ext.ymax)) return null;
  var sr = ext.spatialReference || {};
  var wkid = sr.latestWkid || sr.wkid;
  if (wkid === 4326 || wkid === 4269){
    /* NAD83 and WGS84 differ by about a metre here. That is far inside the
       tolerance of "does this survey touch this river". */
    return { w:ext.xmin, s:ext.ymin, e:ext.xmax, n:ext.ymax,
             approx: wkid === 4269, wkid:wkid };
  }
  if (wkid === 3857 || wkid === 102100 || wkid === 900913){
    var a = invMercator(ext.xmin, ext.ymin), b = invMercator(ext.xmax, ext.ymax);
    return { w:a.lon, s:a.lat, e:b.lon, n:b.lat, approx:false, wkid:wkid };
  }
  var lcc = sr.wkt ? parseWkt(sr.wkt) : STATE_PLANE[wkid];
  if (lcc && lcc.projection === 'Lambert_Conformal_Conic' && isNum(lcc.lon0)){
    var c = lccInverse(lcc, ext.xmin, ext.ymin),
        d = lccInverse(lcc, ext.xmax, ext.ymax);
    return { w:c.lon, s:c.lat, e:d.lon, n:d.lat, approx:false,
             wkid: wkid || (lcc.name || 'WKT'), unit:lcc.toMetre };
  }
  return { unknownWkid: wkid === undefined ? (sr.wkt ? 'WKT this build cannot read' : 'absent') : wkid };
}
function invMercator(x, y){
  var R = 6378137;
  return { lon: x / R * 180 / Math.PI,
           lat: (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI };
}

/* The two State Plane zones DWR publishes without a WKT. */
var STATE_PLANE = {
  2226:{ name:'CA State Plane II (US ft)', projection:'Lambert_Conformal_Conic',
    a:6378137, invf:298.257222101, fe:6561666.667, fn:1640416.667, lon0:-122,
    lat1:38.3333333333333, lat2:39.8333333333333, lat0:37.6666666666667,
    toMetre:0.3048006096012192 },
  2227:{ name:'CA State Plane III (US ft)', projection:'Lambert_Conformal_Conic',
    a:6378137, invf:298.257222101, fe:6561666.667, fn:1640416.667, lon0:-120.5,
    lat1:37.0666666666667, lat2:38.4333333333333, lat0:36.5,
    toMetre:0.3048006096012192 }
};

/* Esri WKT carries every parameter the inverse needs, so it is read
   rather than matched to an EPSG code. */
function parseWkt(wkt){
  function num(k){
    var m = wkt.match(new RegExp('PARAMETER\\["' + k + '",(-?[\\d.eE+]+)\\]', 'i'));
    return m ? Number(m[1]) : null;
  }
  var sph = wkt.match(/SPHEROID\["[^"]*",([\d.]+),([\d.]+)\]/);
  var proj = wkt.match(/PROJECTION\["([^"]+)"\]/);
  var name = wkt.match(/PROJCS\["([^"]+)"/);
  /* The horizontal unit is the LAST UNIT inside PROJCS. A WKT that also
     carries a VERTCS ends with the VERTICAL unit, and reading that one
     runs a survey measured in feet through a metre conversion — which put
     two Delta surveys in the Trinity Alps before it was noticed. */
  var horiz = wkt.split(/,\s*VERTCS\[/)[0];
  var units = horiz.match(/UNIT\["[^"]+",[\d.]+\]/g) || [];
  var last = units.length ? units[units.length - 1].match(/,([\d.]+)\]$/) : null;
  return {
    name: name ? name[1] : null,
    projection: proj ? proj[1] : null,
    a: sph ? Number(sph[1]) : 6378137,
    invf: sph ? Number(sph[2]) : 298.257222101,
    fe:num('False_Easting'), fn:num('False_Northing'),
    lon0:num('Central_Meridian'), lat1:num('Standard_Parallel_1'),
    lat2:num('Standard_Parallel_2'), lat0:num('Latitude_Of_Origin'),
    toMetre: last ? Number(last[1]) : 1
  };
}

/* Snyder's inverse for the two-standard-parallel case. */
function lccInverse(p, x, y){
  var D = Math.PI / 180, f = 1 / p.invf, e = Math.sqrt(2 * f - f * f), a = p.a;
  var X = (x - p.fe) * p.toMetre, Y = (y - p.fn) * p.toMetre;
  function m(phi){ return Math.cos(phi) / Math.sqrt(1 - e * e * Math.pow(Math.sin(phi), 2)); }
  function t(phi){
    return Math.tan(Math.PI / 4 - phi / 2) /
           Math.pow((1 - e * Math.sin(phi)) / (1 + e * Math.sin(phi)), e / 2);
  }
  var p1 = p.lat1 * D, p2 = p.lat2 * D, p0 = p.lat0 * D;
  var n = Math.abs(p1 - p2) < 1e-12 ? Math.sin(p1)
        : (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t(p1)) - Math.log(t(p2)));
  var F = m(p1) / (n * Math.pow(t(p1), n));
  var rho0 = a * F * Math.pow(t(p0), n);
  var rho = (n < 0 ? -1 : 1) * Math.sqrt(X * X + Math.pow(rho0 - Y, 2));
  var tp = Math.pow(rho / (a * F), 1 / n);
  var lon = Math.atan2(X, rho0 - Y) / n + p.lon0 * D;
  var phi = Math.PI / 2 - 2 * Math.atan(tp);
  for (var i = 0; i < 12; i++){
    var es = e * Math.sin(phi);
    phi = Math.PI / 2 - 2 * Math.atan(tp * Math.pow((1 - es) / (1 + es), e / 2));
  }
  return { lat: phi / D, lon: lon / D };
}
function boxesIntersect(a, b){
  return !(a.e < b[0] || a.w > b[2] || a.n < b[1] || a.s > b[3]);
}

/* --- enumeration ---------------------------------------------------- */
/* The layer list is never typed into this file. It is read from the REST
   directory, each layer's own extent decides which rivers it belongs to,
   and a layer whose extent cannot be placed is listed separately rather
   than assigned to a river on a hunch. */
function pool(items, n, fn){
  var out = new Array(items.length), i = 0;
  function next(){
    if (i >= items.length) return Promise.resolve();
    var k = i++;
    return Promise.resolve(fn(items[k], k)).then(function(v){ out[k] = v; }, function(){ out[k] = null; })
      .then(next);
  }
  var runners = [];
  for (var r = 0; r < Math.min(n, items.length); r++) runners.push(next());
  return Promise.all(runners).then(function(){ return out; });
}

function loadCatalog(force){
  if (state.catalog && !force) return Promise.resolve(state.catalog);
  var cached = sget('_shared', 'catalog');
  if (cached && !force && (Date.now() - cached.at) < 7 * 24 * 3600 * 1000){
    state.catalog = cached; return Promise.resolve(cached);
  }
  var folderUrl = dwr(IMG_FOLDER + '?f=json');
  var sbmUrl    = dwr(SBM_SERVICE + '/layers?f=json');

  var raster = getJSON(folderUrl, 25000).then(function(j){
    logNet('DWR bathymetry folder', folderUrl, true,
           ((j.services||[]).length) + ' services');
    var svcs = (j.services || []).filter(function(s){ return s.type === 'ImageServer'; });
    return pool(svcs, 5, function(s){
      var u = dwr('/arcgisimg/rest/services/' + s.name + '/ImageServer?f=json');
      return getJSON(u, 20000).then(function(m){
        return {
          kind:'raster',
          name:s.name.replace(/^Bathymetry\//, ''),
          path:'/arcgisimg/rest/services/' + s.name + '/ImageServer',
          title: String(m.name || s.name).replace(/^Bathymetry\//, ''),
          description: plainText(m.description || m.serviceDescription).slice(0, 400),
          pixel: (m.pixelSizeX && m.pixelSizeY) ? [m.pixelSizeX, m.pixelSizeY] : null,
          box: extentToLatLng(m.extent)
        };
      });
    }).then(function(rows){ return rows.filter(Boolean); });
  }).catch(function(e){
    logNet('DWR bathymetry folder', folderUrl, false, String(e && e.message || e));
    if (BATHY_PROXY && BATHY_PROXY.charAt(0) === '/') state.proxyMissing = true;
    return { error: String(e && e.message || e) };
  });

  var single = getJSON(sbmUrl, 25000).then(function(j){
    logNet('DWR singlebeam layers', sbmUrl, true, ((j.layers||[]).length) + ' layers');
    return (j.layers || []).filter(function(l){
      return l.type !== 'Group Layer';
    }).map(function(l){
      return {
        kind:'single',
        id:l.id,
        name:l.name,
        title:l.name,
        description: plainText(l.description).slice(0, 400),
        depthField: pickDepthField(l.fields),
        maxRecords: isNum(l.maxRecordCount) ? l.maxRecordCount : null,
        fields:(l.fields || []).map(function(f){ return f.name; }),
        box: extentToLatLng(l.extent)
      };
    });
  }).catch(function(e){
    logNet('DWR singlebeam layers', sbmUrl, false, String(e && e.message || e));
    return { error: String(e && e.message || e) };
  });

  return Promise.all([raster, single]).then(function(r){
    var cat = { at:Date.now(),
                raster: Array.isArray(r[0]) ? r[0] : [],
                rasterError: Array.isArray(r[0]) ? null : r[0].error,
                single: Array.isArray(r[1]) ? r[1] : [],
                singleError: Array.isArray(r[1]) ? null : r[1].error };
    state.catalog = cat;
    /* The moment the app knows where the surveys are, the map should say so. */
    drawSurveyBoxes();
  drawAccessSites();
    sput('_shared', 'catalog', cat);
    return cat;
  });
}

/* The depth attribute is whatever the layer calls it, so it is read from
   the layer's own field list rather than assumed. If nothing looks like a
   depth the points still draw, in one colour, saying why. */
/* ArcGIS publishes descriptions as HTML fragments. They go into the page
   as text, so the markup has to come off first or the reader gets a
   paragraph of DIV tags. */
function plainText(html){
  if (!html) return '';
  var d = document.createElement('div');
  d.innerHTML = String(html);
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}

function pickDepthField(fields){
  if (!Array.isArray(fields)) return null;
  var numeric = fields.filter(function(f){
    return /Double|Single|Integer|Float/i.test(f.type || '') &&
           !/^(OBJECTID|FID|Shape)/i.test(f.name || '');
  });
  var order = [/^z$/i, /elev/i, /depth/i, /bed/i, /bottom/i, /sounding/i, /_z$/i];
  for (var i = 0; i < order.length; i++){
    for (var k = 0; k < numeric.length; k++)
      if (order[i].test(numeric[k].name)) return numeric[k].name;
  }
  return null;
}

/* Layers whose extent places them inside this river's box. */
/* Overlap area, so a survey that sits squarely in this reach comes before
   one that clips its corner. Both are honestly "in the box"; only one is
   what you were looking for. */
function overlapArea(box, b){
  var w = Math.min(box.e, b[2]) - Math.max(box.w, b[0]);
  var h = Math.min(box.n, b[3]) - Math.max(box.s, b[1]);
  return (w > 0 && h > 0) ? w * h : 0;
}
function catalogFor(cat, river){
  function rank(rows){
    return rows.filter(function(row){
        return row.box && !row.box.unknownWkid && boxesIntersect(row.box, river.bbox);
      })
      .map(function(row){
        row.overlap = overlapArea(row.box, river.bbox);
        return row;
      })
      .sort(function(a, b){ return b.overlap - a.overlap; });
  }
  function unplaced(row){ return row.box && row.box.unknownWkid; }
  return {
    raster: rank(cat.raster),
    single: rank(cat.single),
    unplaced: cat.raster.filter(unplaced).concat(cat.single.filter(unplaced))
  };
}

/* --- single beam query ---------------------------------------------- */
/* Queried by the current map bounds and hard capped. The whole layer is
   never requested: these are point clouds, and one of them at full extent
   would be tens of megabytes onto a phone on a levee road. */
function querySoundings(layer, bounds){
  var b = bounds;
  var cap = Math.min(FEATURE_CAP, layer.maxRecords || FEATURE_CAP);
  var env = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
  var url = dwr(SBM_SERVICE + '/' + layer.id + '/query' +
    '?f=json&where=1%3D1' +
    '&geometry=' + encodeURIComponent(env) +
    '&geometryType=esriGeometryEnvelope&inSR=4326' +
    '&spatialRel=esriSpatialRelIntersects' +
    '&outFields=' + encodeURIComponent(layer.depthField || '*') +
    '&returnGeometry=true&outSR=4326' +
    '&resultRecordCount=' + cap);
  return getJSON(url, 30000).then(function(j){
    if (j.error) throw new Error(j.error.message || 'service error');
    var feats = j.features || [];
    logNet('DWR soundings', url, true, feats.length + ' features');
    return {
      features: feats,
      truncated: !!j.exceededTransferLimit || feats.length >= cap,
      cap: cap,
      field: layer.depthField
    };
  }, function(e){
    logNet('DWR soundings', url, false, String(e && e.message || e));
    throw e;
  });
}

/* =====================================================================
   The ribbon.
   Gauges at their true position along the river's axis, downstream on the
   left, each dot coloured by water temperature, with the tidal reach
   drawn as a fade rather than a line because that is what it is. On the
   All view the four rivers stack against one temperature scale, which is
   the comparison this app exists to make.
   ===================================================================== */
var SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined)
    n.setAttribute(k, attrs[k]);
  return n;
}
function axisValue(river, row){
  return river.axis === 'lon' ? row.lon : row.lat;
}

/* The upstream end of tidal influence is not a fixed point and this app
   will not draw it as one. What it draws instead is a fact: the furthest
   upstream place NOAA publishes a tide prediction for this river. That is
   a real limit with a real name, and it comes from the station index
   rather than from anybody's memory of where the tide stops. */
function tidalEdge(river){
  var t = state.tides[river.id];
  if (!t || !t.stations || !t.stations.length) return null;
  /* Declared stations only. The discovered ones come from a bounding box
     over the lower Delta, which catches most of the bay: taking the
     furthest upstream of THOSE had the Mokelumne's tide reaching Stockton,
     which is on the San Joaquin. A declared station was checked against
     the river it is on; a box hit was not. */
  var declared = {};
  (river.tideStations || []).forEach(function(s){ declared[s.id] = true; });
  var best = null;
  t.stations.forEach(function(st){
    if (!declared[st.id]) return;
    var v = river.axis === 'lon' ? st.lon : st.lat;
    if (!isNum(v)) return;
    if (best === null || v > best.v) best = { v:v, name:st.name || st.id };
  });
  return best;
}

/* On a phone the ribbon is drawn tighter. Four stacked rivers at the
   desktop pitch is half a 667px screen, and the comparison is the point of
   the view — but not at the price of the readings underneath it. */
var RIB = { rowH:52, top:24, foot:30, dot:6, fig:11, name:11, note:9, narrow:false };
/* The ribbon has a height budget now, and it did not before.
   Width was fixed once and height never was: four rows at 44px plus its
   chrome is 218px of SVG and 263px of band whatever screen it is on, which
   on an iPhone 13's real 664px viewport left the readings 237px, on an
   iPhone SE 125px, and with the software keyboard up TWENTY-TWO — the same
   failure that was found and fixed at 34px, back again because the fix was
   measured against 390x844. That is a phone's SCREEN; the page gets 664.
   So rows shrink to fit a share of the viewport, and below a floor where a
   dot and its figure no longer fit, the ribbon is not drawn at all: a floor
   that exceeds the space available is just the next fixed size that fails. */
function ribbonMetrics(W, rowCount, budget){
  var n = W < 620;
  var m = n ? { rowH:44, top:18, foot:24, dot:5, fig:10, name:10, note:8, narrow:true }
            : { rowH:52, top:24, foot:30, dot:6, fig:11, name:11, note:9, narrow:false };
  if (isNum(budget) && rowCount > 0){
    var avail = budget - m.top - m.foot;
    var fit = Math.floor(avail / rowCount);
    if (fit < m.rowH) m.rowH = fit;
  }
  m.tooTight = m.rowH < 22;
  RIB = m;
}

function ribbonRow(g, river, rows, x0, x1, y, showName){
  var edge = river.tidal ? tidalEdge(river) : null;
  rows = rows.filter(function(r){ return !r.context; });
  var pts = rows.filter(function(r){ return isNum(axisValue(river, r)); });
  var vals = pts.map(function(r){ return axisValue(river, r); });
  var lo, hi;
  if (vals.length){
    lo = Math.min.apply(null, vals); hi = Math.max.apply(null, vals);
  } else { lo = 0; hi = 1; }
  if (edge){ lo = Math.min(lo, edge.v); hi = Math.max(hi, edge.v); }
  if (hi - lo < 1e-6){ lo -= 0.05; hi += 0.05; }
  var pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  var sx = function(v){ return x0 + (v - lo) / (hi - lo) * (x1 - x0); };

  /* the channel */
  g.appendChild(svg('rect', { x:x0, y:y-5, width:(x1-x0), height:10,
    fill:'#16302e', stroke:'#1F5B57' }));

  /* tidal reach, fading out where the influence is said to stop */
  if (edge){
    var gid = 'tidegrad-' + river.id;
    var defs = svg('defs', {});
    var lg = svg('linearGradient', { id:gid, x1:'0', x2:'1', y1:'0', y2:'0' });
    lg.appendChild(svg('stop', { offset:'0',   'stop-color':'#7BD5D9', 'stop-opacity':'.55' }));
    lg.appendChild(svg('stop', { offset:'.55', 'stop-color':'#7BD5D9', 'stop-opacity':'.28' }));
    lg.appendChild(svg('stop', { offset:'1',   'stop-color':'#7BD5D9', 'stop-opacity':'0' }));
    defs.appendChild(lg); g.appendChild(defs);
    var tx = sx(edge.v);
    var left = Math.min(x0, tx), right = Math.max(x0, tx);
    g.appendChild(svg('rect', { x:left, y:y-5, width:Math.max(0, right-left),
      height:10, fill:'url(#' + gid + ')' }));
    /* Below the lower band of figures, not through it, and never past the
       edge of the drawing — a caption clipped mid-word says less than no
       caption, and the right-hand end of the ribbon is upstream. */
    /* IT READ "tide to SACRAMENTO, SACRAMENTO RIVER". The station's own name is
       a place and a river with a comma between them, so bolting it onto "tide
       to" produced a caption that parses as nowhere. What this mark actually
       says is how far up the river the tide is predicted to reach, and the
       station's name belongs in the tide panel where there is room to say
       whose it is. */
    var text = RIB.narrow ? 'tide reaches about here'
                          : 'tide is predicted about this far up';
    var half = text.length * RIB.note * 0.29;
    var anchor = 'middle', lx = tx;
    if (tx + half > x1){ anchor = 'end'; lx = x1; }
    else if (tx - half < x0){ anchor = 'start'; lx = x0; }
    var lab = svg('text', { x:lx, y:y + RIB.dot + (RIB.narrow ? 25 : 31),
      fill:'#9FB3B1', 'font-size':String(RIB.note), 'text-anchor':anchor });
    lab.textContent = text;
    g.appendChild(lab);
  }

  if (showName){
    var rn = svg('text', { x:6, y:y+4, fill:'#E6F0EF', 'font-size':String(RIB.name),
      'font-weight':'600' });
    rn.textContent = river.short;
    g.appendChild(rn);
  }

  /* Gauges bunch up — three of them sit within a few miles on the lower
     river — so the figures stagger rather than print on top of each
     other. Sorted first so "the one before me" means the one to my left. */
  pts.sort(function(a, b){ return axisValue(river, a) - axisValue(river, b); });
  /* Two bands, above the channel and below it, each remembering where it
     last printed. A figure that fits in neither is not printed at all —
     stacked digits are less use than none, and the reading is on the dot. */
  var lastAt = { hi:-1e9, lo:-1e9 }, gap = RIB.fig * 2.4;
  pts.forEach(function(r){
    var f = isNum(r.tempF) ? r.tempF : null;
    var x = sx(axisValue(river, r));
    var band = (x - lastAt.hi >= gap) ? 'hi'
             : ((x - lastAt.lo >= gap) ? 'lo' : null);
    var high = band === 'hi';
    var c = svg('circle', { cx:x, cy:y, r:RIB.dot, fill:tempColour(f),
      stroke:'#0A1214', 'stroke-width':'1.5' });
    var ttl = svg('title');
    ttl.textContent = (r.name || r.id) + (f === null ? ' — no temperature'
      : ' — ' + fmt(f,1) + 'F');
    c.appendChild(ttl);
    g.appendChild(c);
    if (band){
      lastAt[band] = x;
      var t = svg('text', { x:x, y: high ? y - (RIB.dot + 5) : y + (RIB.dot + 13),
        fill:'#E6F0EF', 'font-size':String(RIB.fig),
        'text-anchor':'middle', 'font-family':'Georgia,serif', 'font-style':'italic' });
      t.textContent = f === null ? '—' : fmt(f,0);
      g.appendChild(t);
    }
  });
  return pts.length;
}

function tempScale(g, x, y, w){
  var id = 'tempscale';
  var defs = svg('defs', {});
  var lg = svg('linearGradient', { id:id, x1:'0', x2:'1', y1:'0', y2:'0' });
  TEMP_STOPS.forEach(function(s){
    lg.appendChild(svg('stop', {
      offset: ((s[0]-TEMP_MIN)/(TEMP_MAX-TEMP_MIN)*100) + '%', 'stop-color':s[1] }));
  });
  defs.appendChild(lg); g.appendChild(defs);
  g.appendChild(svg('rect', { x:x, y:y, width:w, height:8, fill:'url(#'+id+')',
    stroke:'#1F5B57' }));
  [[TEMP_MIN, x, 'start'], [TEMP_MAX, x+w, 'end']].forEach(function(p){
    var t = svg('text', { x:p[1], y:y+19, fill:'#9FB3B1', 'font-size':'9',
      'text-anchor':p[2] });
    t.textContent = p[0] + 'F';
    g.appendChild(t);
  });

  /* THE OTHER THING THIS DRAWING ENCODES, WHICH HAD NO KEY AT ALL. Part of
     each tidal river's bar is washed in cyan, fading out where the tide's
     influence is said to stop — and a reader looking at four bars, three of
     them tinted differently, had nothing anywhere telling them why. A colour
     that means something needs saying as much as the temperature ramp does. */
  var ty = y + 26, tw = Math.min(w, 54);
  var tid = 'tidekey';
  var tg = svg('linearGradient', { id:tid, x1:'0', x2:'1', y1:'0', y2:'0' });
  tg.appendChild(svg('stop', { offset:'0',  'stop-color':'#7BD5D9', 'stop-opacity':'.55' }));
  tg.appendChild(svg('stop', { offset:'1',  'stop-color':'#7BD5D9', 'stop-opacity':'0' }));
  defs.appendChild(tg);
  g.appendChild(svg('rect', { x:x, y:ty, width:tw, height:8,
    fill:'url(#'+tid+')', stroke:'#1F5B57' }));
  var tl = svg('text', { x:x + tw + 6, y:ty + 7, fill:'#9FB3B1', 'font-size':'9' });
  tl.textContent = 'tidal — the tide reaches this far up';
  g.appendChild(tl);
}

function drawRibbon(again){
  var host = $('#ribbon');
  /* Keep the title and desc; they are the accessible name of the figure. */
  Array.prototype.slice.call(host.childNodes).forEach(function(n){
    if (n.nodeName !== 'title' && n.nodeName !== 'desc') host.removeChild(n);
  });

  /* Draw at the width the ribbon is actually rendered at, so the scale is
     1 and an 11px figure is 11 pixels. A fixed 1000-unit viewBox squeezed
     into a phone made the figures unreadable and left the difference as
     dead space above and below them. */
  /* Under the breakpoint the ribbon fits the screen rather than scrolling:
     the right-hand end is upstream, and a view you have to drag sideways to
     finish reading is one nobody finishes reading. */
  var narrow = window.matchMedia && window.matchMedia('(max-width:900px)').matches;
  var W = narrow ? Math.max(host.clientWidth || 360, 300)
                 : Math.max(host.clientWidth || 1000, 520);
  var list = state.riverId ? [byId(state.riverId)] : RIVERS;
  /* Under the breakpoint the ribbon and the readings share one screen, so
     the ribbon takes a share of it rather than whatever it wants. Above it
     they are side by side and there is nothing to take it from.
     The budget is for the BAND, not the drawing: the legend, the note and
     the padding are two thirds of the height on a short screen, and a
     budget that only bounds the SVG bounds the wrong thing. */
  var wrapEl = document.getElementById('ribbonwrap');
  var budget = null;
  if (narrow){
    var cs = window.getComputedStyle(wrapEl);
    var extra = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    Array.prototype.forEach.call(wrapEl.children, function(c){
      if (c !== host) extra += c.getBoundingClientRect().height;
    });
    budget = Math.round((window.innerHeight || 800) * 0.32) - extra
             - (again && isNum(again) ? again : 0);
  }
  ribbonMetrics(W, list.length, budget);
  var wrap = document.getElementById('ribbonwrap');
  wrap.hidden = !!RIB.tooTight;
  if (RIB.tooTight) return;
  wrap.hidden = false;
  var rowH = RIB.rowH, top = RIB.top;
  var H = top + list.length * rowH + RIB.foot;
  host.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  host.setAttribute('height', H);
  host.setAttribute('width', W);
  var g = svg('g', {});
  var plotted = 0, missing = 0;

  list.forEach(function(river, i){
    var payload = state.gauges[river.id];
    var rows = (payload && payload.rows) || [];
    var onRiver = rows.filter(function(r){ return !r.context; });
    var n = ribbonRow(g, river, rows, list.length > 1 ? (RIB.narrow ? 74 : 96) : 30,
                      W - 20, top + i * rowH, list.length > 1);
    plotted += n;
    missing += onRiver.length - n;
  });
  /* Bottom left on a phone, bottom right where there is room. Off the
     right-hand edge it was simply invisible, and it is the key to every
     colour above it. */
  tempScale(g, RIB.narrow ? 6 : W - 190, H - (RIB.narrow ? 20 : 26),
            RIB.narrow ? 104 : 170);
  host.appendChild(g);

  var note = RIB.narrow
    ? 'Downstream left. ' + plotted + ' gauge' + (plotted === 1 ? '' : 's') + ' plotted'
    : 'Downstream on the left; ' +
      (state.riverId ? byId(state.riverId).axisLabel
                     : 'each river on its own axis, one temperature scale') + '. ' +
      plotted + ' gauge' + (plotted === 1 ? '' : 's') + ' plotted';
  if (missing) note += RIB.narrow ? ', ' + missing + ' not' : ', ' + missing + ' not plotted (no position or no data)';
  $('#ribbonnote').textContent = note + '.';

  /* And then check. The legend and the note are measured at the size they
     had BEFORE this draw, so the first pass can still overshoot; one
     corrective pass with the measured overshoot subtracted converges,
     and a guard stops it becoming a loop. Raising a number until it looks
     better is not debugging — reading what the browser actually did is. */
  if (narrow && !again){
    var over = Math.round(wrapEl.getBoundingClientRect().height) -
               Math.round((window.innerHeight || 800) * 0.32);
    if (over > 2) drawRibbon(over);
  }
  $('#ribbondesc').textContent = note + '. Readings are listed in the Water panel.';
}

function byId(id){
  for (var i = 0; i < RIVERS.length; i++) if (RIVERS[i].id === id) return RIVERS[i];
  return null;
}

/* =====================================================================
   Map
   ===================================================================== */
var BASEMAPS = [
  { id:'imagery', label:'Esri imagery',
    url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr:'Imagery: Esri, Maxar, Earthstar Geographics' },
  { id:'topo', label:'Esri topo',
    url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    attr:'Topography: Esri' },
  { id:'dark', label:'CARTO dark',
    url:'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    attr:'&copy; OpenStreetMap contributors, &copy; CARTO' }
];
var NOAA_CHART = {
  url:'https://tileservice.charts.noaa.gov/tiles/50000_1/{z}/{x}/{y}.png',
  attr:'Charts: NOAA Office of Coast Survey',
  /* Chart coverage of these waters ends upstream of about Verona. Drawn as
     a band rather than a line because the exact end was not confirmed. */
  limitBand: [[38.74,-121.75],[38.82,-121.45]],
  limitStatus: PROV.UNCONFIRMED
};

var reduceMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Every label on the map is a popup rather than a tooltip.
 *
 * A tooltip is drawn beside its marker and left there. It is not panned
 * into view and it is not flipped, so a marker near an edge — which on a
 * phone, where the map is half a screen tall, is most of them — puts its
 * label partly or wholly outside the map frame, where the container's
 * overflow cuts it off. Tapping a pin then appears to do nothing at all.
 *
 * A popup pans the map until the whole label fits. The padding keeps it
 * clear of the zoom control at the top left and the legend and
 * attribution along the bottom. keepInView holds it there if the map is
 * moved underneath it afterwards.
 */
var LABEL = {
  autoPan: true,
  autoPanPaddingTopLeft: L.point(52, 20),
  autoPanPaddingBottomRight: L.point(20, 46),
  keepInView: true,
  closeButton: true,
  autoClose: true,
  className: 'thw-label'
};

function labelNode(name, values, sub){
  var box = el('div', {});
  box.appendChild(el('span', { class:'pop-name', text:name }));
  if (values && values.length){
    var row = el('div', { class:'pop-vals' });
    values.forEach(function(v){
      var span = el('span', { class:'v' });
      span.appendChild(document.createTextNode(v[0]));
      span.appendChild(el('small', { text:v[1] }));
      if (v[2]) span.style.color = v[2];
      row.appendChild(span);
    });
    box.appendChild(row);
  }
  if (sub) box.appendChild(el('span', { class:'pop-sub', text:sub }));
  return box;
}

/* A VIEW COMPUTED AGAINST A ZERO-SIZE MAP IS THE WHOLE WORLD.
 *
 * On a phone the map lives in a tab, so for most of the app's life its
 * container is display:none and measures 0 by 0. Ask Leaflet to fit bounds in
 * that state and it does exactly what it is told — it finds the zoom at which
 * those bounds fit into nothing, which is zoom 0, and the reader who opens the
 * Map tab is looking at the Pacific from orbit. Reported from a real phone,
 * and reproducible: on All rivers the map genuinely sits at zoom 0.
 *
 * So no view is ever computed while the container has no size. It is held, and
 * applied the moment the map is real. Everything that moves the map goes
 * through here.
 */
function mapView(to, opts){
  if (!state.map) return;
  var sz = state.map.getSize();
  if (!sz.x || !sz.y){ state.pendingView = { to:to, opts:opts }; return; }
  state.pendingView = null;
  if (to && typeof to.getNorth === 'function') state.map.fitBounds(to, opts);
  else state.map.setView(to[0], to[1], opts);
}

/* Called whenever the map becomes visible or changes size. */
function mapBecameVisible(){
  if (!state.map) return;
  state.map.invalidateSize();
  var p = state.pendingView;
  if (p){ state.pendingView = null; mapView(p.to, p.opts); }
  drawMarks();
}

function initMap(){
  var m = L.map('map', {
    zoomControl: true,
    fadeAnimation: !reduceMotion,
    zoomAnimation: !reduceMotion,
    markerZoomAnimation: !reduceMotion,
    keyboard: true,
    attributionControl: true
  });
  state.map = m;

  /* A MAP MUST HAVE A VIEW BEFORE ANYTHING ELSE TOUCHES IT. Leaflet throws
     "Set map center and zoom first" the moment something asks for a centre or
     bounds, and holding the real view until the container has a size left
     exactly that gap. This opening view is derived rather than invented: the
     middle of the four declared rivers, at the most zoomed-out of their own
     declared zooms. It is replaced the instant the map is on screen. */
  var u = RIVERS.reduce(function(acc, r){
    return [Math.min(acc[0],r.bbox[0]), Math.min(acc[1],r.bbox[1]),
            Math.max(acc[2],r.bbox[2]), Math.max(acc[3],r.bbox[3])];
  }, [180,90,-180,-90]);
  m.setView([(u[1]+u[3])/2, (u[0]+u[2])/2],
            Math.min.apply(null, RIVERS.map(function(r){ return r.zoom; })));

  setBasemap(sget('_shared','basemap') || 'imagery');

  /* A PANE, NOT AN ADD ORDER. A tide station sits on top of the gauge at the
     same place — Rio Vista has both — and whichever is drawn last swallows the
     tap. Adding the layer group first is not enough: every vector shares one
     pane, and this layer is REDRAWN whenever the tide changes, so its paths
     land after the gauges' again on the next refresh. A pane with its own
     z-index is the only version of this that stays true.
     A station is context and a gauge is a reading, so the reading wins the tap. */
  m.createPane('tidepane');
  m.getPane('tidepane').style.zIndex = 380;   /* overlayPane is 400 */
  state.tideLayer = L.layerGroup().addTo(m);

  /* Where you are. Its own pane, between the stations and the readings: a
     station is context and you are more specific than that, but a gauge is a
     measurement and the rule above says the reading wins the tap. The accuracy
     ring is drawn non-interactive as well, so a fix good to two kilometres
     cannot cover half the reach and swallow every pin under it. */
  /* Under everything: the survey footprints are context for the readings, not
     a thing to tap, and they must never take a press meant for a pin. */
  m.createPane('surveypane');
  m.getPane('surveypane').style.zIndex = 370;
  state.surveyLayer = L.layerGroup().addTo(m);

  /* Above the survey outlines and below the tide stations: a place you can
     stand is worth tapping, and a reading still wins over it. */
  m.createPane('accesspane');
  m.getPane('accesspane').style.zIndex = 375;
  state.accessLayer = L.layerGroup().addTo(m);

  m.createPane('herepane');
  m.getPane('herepane').style.zIndex = 385;
  state.hereLayer = L.layerGroup().addTo(m);
  /* The profile line shares that pane: it is the reader's own drawing, like
     their position, and it must not take a tap from a gauge either. */
  state.profLayer = L.layerGroup().addTo(m);

  state.gaugeLayer = L.layerGroup().addTo(m);
  state.markLayer = L.layerGroup().addTo(m);
  state.soundingLayer = L.layerGroup().addTo(m);

  /* A tap used to drop a mark, silently, so exploring the map littered it.
     It reads the depth now and OFFERS to keep the point, which is the same
     one-tap route to a mark with the decision moved to the reader. Add at
     map centre in the Marks panel is still the pointerless way. */
  /* A CONTROL SITS ON THE MAP, SO A PRESS ON IT IS A PRESS ON THE MAP.
     disableClickPropagation holds for a mouse and does NOT hold for a finger —
     on a touch device the map's click is synthesised from the touch sequence
     and arrives anyway — so tapping the key's Hide button, or the locate
     button, dropped a depth query underneath it. Every desktop check passed;
     it took the phone geometry to see it.
     THE MARK IS TAKEN IN THE CAPTURE PHASE, and that is the whole trick. A
     control's own handler often rebuilds its contents — the key does, on the
     press that hides it — which DETACHES the element that was clicked, so by
     the time the map's handler runs, asking the target for its ancestors
     returns nothing and the press looks like it landed on open map. Capture
     runs before any of that, while the DOM is still the one the finger
     touched.
     One listener, at the map, so it cannot be forgotten when the next control
     is added. */
  m.getContainer().addEventListener('click', function(ev){
    var t = ev.target;
    ev.__onControl = !!(t && t.closest && t.closest('.leaflet-control'));
  }, true);

  m.on('click', function(e){
    if (e.originalEvent && e.originalEvent.__onControl) return;
    /* While a line is being drawn the map is answering a different question,
       and a depth popup opening over the second tap would be the app talking
       across the reader. */
    if (state.profArm) return profilePoint(e.latlng.lat, e.latlng.lng);
    showDepthAt(e.latlng.lat, e.latlng.lng);
  });
  m.on('moveend', function(){
    if (state.soundingActive) refreshSoundings();
  });

  var legend = L.control({ position:'topright' });
  legend.onAdd = function(){
    var d = L.DomUtil.create('div', 'legend');
    d.id = 'maplegend';
    d.setAttribute('aria-live','polite');
    /* THE SAME DEFECT THE LOCATE CONTROL HAD, and it arrived the moment this
       stopped being a passive swatch and grew a Hide button: a control sits ON
       the map, so a press on it is also a press on the map, and a press on the
       map asks the survey how deep it is there. Every interactive control
       added to this map needs this line — the tests caught it here by seeing a
       depth popup open over a legend button. */
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  legend.addTo(m);
  hereControl(m);
  return m;
}

/* =====================================================================
   Where I am.

   THE POSITION NEVER LEAVES THE DEVICE. It is not stored between visits, it
   is not sent to the bathymetry proxy, and it is not sent to anyone else:
   the browser answers, the app draws a dot, and that is the whole path. The
   depth query is the one thing in this app that would send a coordinate
   anywhere, and it stays where it was — behind a tap you make yourself.
   ===================================================================== */
function hereControl(m){
  var ctl = L.control({ position:'bottomright' });
  ctl.onAdd = function(){
    var d = L.DomUtil.create('div', 'herectl');
    var b = el('button', { type:'button', id:'herebtn', text:'Where I am' });
    b.addEventListener('click', locateMe);
    d.appendChild(b);
    /* A control sits ON the map, so a press on it is also a press on the map
       — and a press on the map asks the survey how deep it is there. Without
       this, the button would drop a depth reading at whatever is underneath
       it every time it was used. */
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  ctl.addTo(m);
}

function hereButton(label, busy){
  var b = document.getElementById('herebtn');
  if (!b) return;
  b.textContent = label;
  b.disabled = !!busy;
}

function locateMe(){
  /* Every one of these is a different thing to say. A single "could not get
     your location" would be true in all four cases and useful in none. */
  if (!navigator.geolocation){
    hereButton('Where I am');
    announce('This browser has no location service, so the app cannot ask where you are.');
    return;
  }
  if (!window.isSecureContext){
    hereButton('Where I am');
    announce('Locating needs a secure connection. This page was not loaded over https, so the browser will not answer.');
    return;
  }
  hereButton('Finding you…', true);
  announce('Asking your device where you are.');
  navigator.geolocation.getCurrentPosition(function(pos){
    state.here = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      /* Metres, 95% confidence. The browser is allowed to omit it, and some
         hand back zero, which is not a claim of perfect precision — it is the
         same absence spelt differently. Both become null here, because
         "good to about 0 m" would be the most confident lie in the app. */
      acc: (isNum(pos.coords.accuracy) && pos.coords.accuracy > 0) ? pos.coords.accuracy : null,
      at: Date.now()
    };
    hereButton('Where I am');
    drawHere(true);
  }, function(err){
    hereButton('Where I am');
    var code = err && err.code;
    announce(
      code === 1 ? 'Your browser refused: location is switched off for this site. It can be turned back on in the browser\u2019s settings for this page.' :
      code === 2 ? 'Your device could not get a fix. Indoors, or under a canopy, this is common \u2014 it is the device that failed, not the app.' :
      code === 3 ? 'No fix within twenty seconds. Trying again in the open usually works.' :
      'The browser would not say where you are: ' + (err && err.message || 'no reason given') + '.');
    logNet('geolocation', 'device', false, 'code ' + code);
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}

/* Nearest thing worth naming. A distance to the middle of a reach is a number
   about a bounding box; a distance to a gauge is a distance to somewhere that
   exists and has a name on the map. Falls back to the reach only when nothing
   with a position has loaded yet. */
function nearestNamed(lat, lon){
  var best = null;
  Object.keys(state.gauges || {}).forEach(function(rid){
    var payload = state.gauges[rid];
    if (!payload) return;
    (payload.rows || []).forEach(function(r){
      if (!isNum(r.lat) || !isNum(r.lon)) return;
      var d = metresBetween(lat, lon, r.lat, r.lon);
      if (!best || d < best.d) best = { d:d, name:r.name || r.id, river:rid };
    });
  });
  if (best) return best;
  RIVERS.forEach(function(r){
    if (!r.center) return;
    var d = metresBetween(lat, lon, r.center[0], r.center[1]);
    if (!best || d < best.d) best = { d:d, name:'the middle of the ' + r.name, river:r.id };
  });
  return best;
}

function kmText(metres){
  if (!isFinite(metres)) return 'an unknown distance';
  if (metres < 950) return Math.round(metres / 10) * 10 + ' m';
  return (metres / 1000).toFixed(metres < 9500 ? 1 : 0) + ' km';
}

function drawHere(recentre){
  if (!state.hereLayer) return;
  state.hereLayer.clearLayers();
  var h = state.here;
  if (!h) return;

  /* THE RING IS NOT DECORATION. A browser that is 2 km sure of itself and one
     that is 8 m sure both hand back a single pair of numbers, and drawing both
     as the same dot claims a precision the second one has and the first does
     not. The ring is that number, to scale, which is the same rule this app
     applies to a depth it did not measure at the point you asked about. */
  var ring = null;
  /* Non-positive accuracy is not precision, it is an absence. The guard lives
     here as well as where the fix is stored, because this function is the one
     that makes the claim and it must be honest about whatever it is handed. */
  var acc = (isNum(h.acc) && h.acc > 0) ? h.acc : null;
  if (acc !== null){
    ring = L.circle([h.lat, h.lon], {
      pane:'herepane', radius:acc, interactive:false,
      color:'#DA4A85', weight:1, opacity:.7,
      fillColor:'#DA4A85', fillOpacity:.10
    }).addTo(state.hereLayer);
  }

  var near = nearestNamed(h.lat, h.lon);
  var sub = 'Your device\u2019s own position, taken at ' +
    new Date(h.at).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) + '. ' +
    (acc !== null ? 'Good to about ' + kmText(acc) + '. ' : 'Your browser did not say how accurate it is. ') +
    'It is not saved, and your coordinate is not sent anywhere.';

  L.circleMarker([h.lat, h.lon], {
    pane:'herepane', radius:7, weight:3,
    color:'#E76F9F', fillColor:'#0D1A19', fillOpacity:1
  }).bindPopup(labelNode('Where you are',
    near ? [[kmText(near.d).split(' ')[0], kmText(near.d).split(' ')[1] + ' to ' + near.name]] : [],
    sub), LABEL).addTo(state.hereLayer);

  if (recentre){
    if (tabNames().indexOf('map') !== -1) selectTab('map');
    if (ring) state.map.fitBounds(ring.getBounds(), { maxZoom:15, animate:!reduceMotion });
    else state.map.setView([h.lat, h.lon], 14, { animate:!reduceMotion });
  }

  /* SAY WHERE YOU ARE RELATIVE TO THE THING ON SCREEN. Centring the map on a
     reader two hundred kilometres away is exactly what they asked for and
     leaves them looking at a rectangle with none of this app's river in it,
     with nothing saying why. */
  updateLegend();
  /* THE TIDE PANEL IS BUILT WHEN THE PANEL RENDERS, so a position found
     afterwards did not reach it: a reader pressed Where I am and the tide
     section went on saying nothing about which station was nearest them,
     until some unrelated thing happened to redraw it. Anything that knows
     where the reader is has to tell the panels that use it. */
  if (state.riverId) renderWater();

  var msg = 'You are on the map' +
    (acc !== null ? ', to about ' + kmText(acc) : '') +
    (near ? '. Nearest is ' + near.name + ', ' + kmText(near.d) + ' away' : '') + '.';
  if (near && near.d > 200000)
    msg += ' That is far enough that none of this river is in view at this zoom.';
  announce(msg);
}

function setBasemap(id){
  var def = BASEMAPS.filter(function(b){ return b.id === id; })[0] || BASEMAPS[0];
  if (state.layers.base) state.map.removeLayer(state.layers.base);
  var lyr = L.tileLayer(def.url, {
    maxZoom: 19, attribution: def.attr,
    crossOrigin: true
  });
  /* A basemap that answers with nothing leaves a black rectangle and no
     explanation. If the first tiles do not arrive, the Layers panel says
     which host did not answer rather than leaving you to guess. */
  var got = false;
  state.basemapError = null;
  lyr.on('tileload', function(){ got = true; });
  lyr.on('tileerror', function(){
    if (got || state.basemapId !== def.id) return;
    state.basemapError = def.label + ' did not return tiles. Its host may be unreachable from this network.';
    logNet('basemap ' + def.id, def.url, false, 'tile error');
    if (!document.getElementById('panel-layers').hidden) renderLayers();
  });
  lyr.addTo(state.map);
  lyr.setZIndex(0);
  state.layers.base = lyr;
  state.basemapId = def.id;
  sput('_shared','basemap', def.id);
}

/* =====================================================================
   Water panel — tide where the water is tidal, gauge readings always.
   A river that is not tidal shows no tide section at all rather than an
   empty chart: an empty chart reads as "no tide today".
   ===================================================================== */
/* --- the All view: one card per river ------------------------------- */

/* How much water is coming down: the most downstream gauge that is ABOVE
   the tide.
 *
 * The furthest downstream gauge is the obvious choice and it is wrong on a
 * tidal river. Instantaneous flow at Rio Vista was reading minus eighty-five
 * thousand cubic feet a second while this was being written — a true
 * measurement of a flooding tide pushing the river backwards, and no
 * description at all of what the Sacramento is carrying. The gauge to ask is
 * the lowest one the tide does not reach, which on the Sacramento is Verona.
 *
 * Where every gauge on a river is tidal — the Mokelumne, all three of them —
 * there is no such gauge, and the honest answer is to say so rather than
 * print a tidal swing as discharge.
 */
function downstreamFlow(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var edge = river.tidal ? tidalEdge(river) : null;
  var best = null, bestTidal = null;
  payload.rows.forEach(function(r){
    if (r.context || !isNum(r.flow)) return;
    var v = axisValue(river, r);
    if (!isNum(v)) return;
    var underTide = edge ? (v <= edge.v) : false;
    if (underTide){
      if (bestTidal === null || v < bestTidal.v)
        bestTidal = { v:v, flow:r.flow, name:r.name || r.id, id:r.id,
                      source:r.source, tidal:true };
    } else if (best === null || v < best.v){
      best = { v:v, flow:r.flow, name:r.name || r.id, id:r.id,
               source:r.source, tidal:false };
    }
  });
  return best || bestTidal;
}

/* Clarity across the gauges that have a turbidity sensor. Most do not: the
   American has four gauges and none of them, and CDEC publishes none for the
   Feather. A river with no sensor is a river nobody is measuring, which is a
   different fact from clear water and is said as such. */
function meanTurb(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var t = payload.rows.filter(function(r){ return !r.context && isNum(r.turb); })
                      .map(function(r){ return r.turb; });
  if (!t.length) return null;
  return { f: t.reduce(function(a,b){ return a+b; },0) / t.length, n: t.length };
}

/* Mean of the gauges that have a thermometer, and how many that was. One
   river's worth of water is not one temperature, and saying which gauges
   it came from is the difference between a figure and a guess. */
function meanTemp(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var t = payload.rows.filter(function(r){ return !r.context && isNum(r.tempF); })
                      .map(function(r){ return r.tempF; });
  if (!t.length) return null;
  return { f: t.reduce(function(a,b){ return a+b; },0) / t.length, n: t.length };
}

/* The next turn, from the predictions already fetched. */
function nextTurn(river){
  var t = state.tides[river.id];
  if (!t || !t.hilo || !t.hilo.length) return null;
  var now = Date.now();
  for (var i = 0; i < t.hilo.length; i++){
    var when = new Date(t.hilo[i].t.replace(' ','T'));
    if (when.getTime() > now)
      return { type: t.hilo[i].type === 'H' ? 'high' : 'low',
               at: when, v: t.hilo[i].v };
  }
  return null;
}

/* How many of this river's reaches are open today. */
function seasonState(river){
  if (!river.reaches.length) return { text:'season not confirmed', tone:'unknown' };
  var open = 0;
  river.reaches.forEach(function(rc){
    var now = new Date();
    for (var i = 0; i < rc.windows.length; i++){
      if (now >= new Date(rc.windows[i][0] + 'T00:00') &&
          now <= new Date(rc.windows[i][1] + 'T23:59')) { open++; return; }
    }
  });
  if (open === 0) return { text:'closed', tone:'shut' };
  if (open === river.reaches.length)
    return { text:'open · ' + open + (open === 1 ? ' reach' : ' reaches'), tone:'open' };
  return { text:open + ' of ' + river.reaches.length + ' reaches open', tone:'part' };
}

function riverCard(river){
  var season = seasonState(river);
  var temp = meanTemp(river);
  var flow = downstreamFlow(river);
  var turn = river.tidal ? nextTurn(river) : null;
  var payload = state.gauges[river.id];

  var card = el('button',{ type:'button', class:'rivercard' });
  var top = el('div',{class:'rc-top'});
  top.appendChild(el('span',{class:'rc-name',text:river.name}));
  var chip = el('span',{class:'rc-season',text:season.text});
  chip.style.color = season.tone === 'open' ? '#9BD98C'
                   : season.tone === 'shut' ? '#E76F9F'
                   : season.tone === 'part' ? '#C9A96A' : '#9FB3B1';
  top.appendChild(chip);
  card.appendChild(top);

  /* The Feather's gauges are CDEC's and CDEC is the slowest of the four
     services. When it does not answer, this card read "no thermometer
     reporting / no flow reading" — which describes a river with no
     instruments on it, not a request that failed. Say which it is. */
  var mute = payload ? payload.rows.filter(function(r){
    return !r.context && r.declared && r.error; }).length : 0;

  var t = el('div',{class:'rc-temp'});
  var deg = el('span',{class:'rc-deg', text: temp ? fmt(temp.f,0) + 'F' : '—'});
  if (temp) deg.style.color = tempColour(temp.f);
  t.appendChild(deg);
  t.appendChild(el('span',{class:'rc-read',
    text: temp ? (tempReading(temp.f) || '')
        : !payload ? 'still asking'
        : mute ? 'gauges did not answer' : 'no thermometer reporting'}));
  card.appendChild(t);
  if (temp) card.appendChild(el('div',{class:'rc-line',
    text:'mean of ' + temp.n + (temp.n === 1 ? ' gauge' : ' gauges')}));

  /* The tide line below this one is a PREDICTION. This is a measurement of
     what the water is doing at this moment, which on a tidal reach is a
     different and better answer to the same question. */
  if (river.tidal && payload){
    var moving = payload.rows.filter(function(r){ return !r.context && isNum(r.vel); });
    if (moving.length){
      var down = moving.filter(function(r){ return r.vel >= 0; }).length;
      var up   = moving.length - down;
      var fastest = moving.slice().sort(function(a,b){
        return Math.abs(b.vel) - Math.abs(a.vel); })[0];
      var line = el('div',{class:'rc-line'});
      line.appendChild(el('b',{text: up === 0 ? 'running downstream'
        : down === 0 ? 'running upstream' : 'running both ways'}));
      line.appendChild(document.createTextNode(
        up === 0 || down === 0
          ? ' at up to ' + fmt(Math.abs(fastest.vel),2) + ' ft/s, measured now'
          : ' — ' + up + ' of ' + moving.length + ' gauges read upstream, measured now'));
      card.appendChild(line);
    }
  }

  var turb = meanTurb(river);
  if (turb) card.appendChild(el('div',{class:'rc-line',
    text: turbReading(turb.f) + ' — ' + fmt(turb.f,1) + ' FNU across ' +
      turb.n + (turb.n === 1 ? ' gauge' : ' gauges')}));
  else if (payload && !mute) card.appendChild(el('div',{class:'rc-line note',
    text:'no turbidity sensor on this river'}));

  var fl = el('div',{class:'rc-line'});
  if (flow && flow.tidal){
    /* Nothing above the tide on this river, so the number swings with it. */
    fl.appendChild(el('b',{text:commas(fmt(flow.flow,0))}));
    fl.appendChild(document.createTextNode(' cfs at ' + flow.name +
      ' — tidal flow, not what the river is carrying'));
  } else if (flow){
    fl.appendChild(el('b',{text:commas(fmt(flow.flow,0))}));
    fl.appendChild(document.createTextNode(' cfs at ' + flow.name));
  } else if (payload && payload.rows.length){
    fl.appendChild(document.createTextNode(mute
      ? mute + (mute === 1 ? ' gauge on this river did' : ' gauges on this river did') +
        ' not answer, so there is no flow figure — not that the river has none'
      : 'no flow reading'));
  } else {
    fl.appendChild(document.createTextNode('still asking…'));
  }
  card.appendChild(fl);

  if (river.tidal){
    var td = el('div',{class:'rc-line'});
    if (turn){
      td.appendChild(document.createTextNode('next ' + turn.type + ' '));
      td.appendChild(el('b',{text:clockLocal(turn.at.toISOString())}));
      td.appendChild(document.createTextNode(' · ' + fmt(turn.v,1) + ' ft'));
    } else {
      td.appendChild(document.createTextNode('tidal — no prediction loaded'));
    }
    card.appendChild(td);
  }

  card.setAttribute('aria-label', river.name + '. ' + season.text + '. ' +
    (temp ? fmt(temp.f,0) + ' degrees, ' + (tempReading(temp.f) || '') + ' ' : '') +
    (flow ? commas(fmt(flow.flow,0)) + ' cubic feet per second at ' + flow.name +
       (flow.tidal ? ', tidal flow rather than river discharge' : '') + '. ' : '') +
    (turn ? 'Next ' + turn.type + ' at ' + clockLocal(turn.at.toISOString()) + '. ' : '') +
    'Show this river.');
  card.addEventListener('click', function(){
    selectRiver(river.id);
    selectTab('water');
  });
  return card;
}

function renderWater(){
  var p = $('#panel-water'); p.innerHTML = '';

  if (!state.riverId){
    p.appendChild(el('h2',{class:'sec',text:'Which river'}));
    /* A container so the four can sit side by side on a wide screen. On a
       phone it is a plain block and the cards stack exactly as before. */
    var grid = el('div',{class:'rivergrid'});
    RIVERS.forEach(function(river){ grid.appendChild(riverCard(river)); });
    p.appendChild(grid);
    /* This read RIVERS[0] and said "these" about all four, so one river's
       bad minute captioned three rivers of live readings. */
    var old = RIVERS.filter(function(r){ return looksOld(state.gauges[r.id]); });
    if (old.length) p.appendChild(el('div',{class:'warnbox',
      text: (old.length === RIVERS.length
              ? 'These are stored readings — the network did not answer.'
              : 'Stored readings for ' + old.map(function(r){ return r.short; }).join(' and ') +
                ' — those did not answer. The rest are current.') +
            ' Ages are in the header.'}));
    p.appendChild(el('p',{class:'note',
      text:'Four rivers, one temperature scale, in a fixed order. Thalweg does not rank them: reading a thermometer against a threshold is one thing, and telling you where the fishing will be better is a forecast it has no basis for.'}));
    p.appendChild(el('p',{class:'note',
      text:'Tap a river for its tide, its gauges one by one, its published depth surveys and your own marks.'}));
    /* Dropping a view silently is the thing this app is not allowed to do.
       Four ribbon rows at a legible size do not fit above the cards on a
       short screen, and the cards carry more of the answer, so the ribbon
       goes — and says it went, at the bottom, where saying it costs nothing
       above the fold. */
    if (document.getElementById('ribbonwrap').hidden)
      p.appendChild(el('p',{class:'note',
        text:'The river ribbon is not shown: four rows of it will not fit above these cards on a screen this short. Pick a single river and it comes back for that one.'}));
    return;
  }

  var rivers = [byId(state.riverId)];

  rivers.forEach(function(river){
    if (rivers.length > 1) p.appendChild(el('h2',{class:'sec',text:river.name}));

    if (river.tidal){
      if (rivers.length === 1) p.appendChild(el('h2',{class:'sec',text:'Tide'}));
      p.appendChild(tideSection(river));
    }

    if (rivers.length === 1) p.appendChild(el('h2',{class:'sec',text:'Gauges'}));
    var payload = state.gauges[river.id];
    if (!payload){
      p.appendChild(el('p',{class:'note',text:'Loading…'}));
    } else if (payload.failed){
      p.appendChild(el('div',{class:'warnbox',
        text:'No reading reached this device and nothing was stored earlier. Flow, stage and temperature are unknown, not zero.'}));
    } else {
      if (payload.noData) p.appendChild(el('div',{class:'warnbox',
        text:'Nothing answered this time. Every row below is what the request came back with, not a reading.'}));
      if (looksOld(payload) && !payload.noData) p.appendChild(staleBox(payload));
      var onRiver = payload.rows.filter(function(r){ return !r.context; });
      var tribs   = payload.rows.filter(function(r){ return r.context; });
      if (!onRiver.length && river.noLiveGauges)
        p.appendChild(el('div',{class:'warnbox', text:river.noLiveGauges}));
      if (onRiver.length && river.gaugeSourceNote)
        p.appendChild(el('p',{class:'note', text:river.gaugeSourceNote}));
      onRiver.forEach(function(r){ p.appendChild(gaugeRow(r)); });
      if (!onRiver.length && !river.noLiveGauges)
        p.appendChild(el('p',{class:'note',text:'No gauge answered for this reach.'}));
      if (tribs.length){
        p.appendChild(el('h2',{class:'sec',text:'Tributaries, not this river'}));
        tribs.forEach(function(r){ p.appendChild(gaugeRow(r)); });
      }
      if (river.discover && !state.swept[river.id] && !sget(river.id,'found')){
        var swRow = el('div',{class:'rowline'});
        var swBtn = el('button',{type:'button',text:'Look for gauges this app has not named'});
        swBtn.addEventListener('click', function(){
          swBtn.disabled = true;
          swBtn.textContent = 'Sweeping the basin — about nine seconds…';
          state.swept[river.id] = true;
          loadGauges(river).then(function(payload){
            state.gauges[river.id] = payload;
            renderWater(); drawRibbon(); drawGaugeMarkers(); drawTideMarkers(); updateStaleness();
            announce('Sweep finished.');
          }, function(){
            swBtn.disabled = false;
            swBtn.textContent = 'Look for gauges this app has not named';
          });
        });
        swRow.appendChild(swBtn);
        p.appendChild(swRow);
        p.appendChild(el('p',{class:'note',
          text:'The gauges above are the ones this app names and has checked. USGS will also answer a sweep of the whole basin for anything else reporting — 234KB and about nine seconds, which is why it is a button. Asked once, what it finds is kept.'}));
      }

      if (river.weirs){
        p.appendChild(el('h2',{class:'sec',text:'The weirs'}));
        p.appendChild(weirSection(river));
      }

      p.appendChild(el('h2',{class:'sec',text:'The last seven days'}));
      p.appendChild(trendSection(river));
      drawTrendLines();

      var temps = onRiver.map(function(r){
        return isNum(r.tempF) ? r.tempF : null;
      }).filter(function(v){ return v !== null; });
      if (temps.length){
        var avg = temps.reduce(function(a,b){ return a+b; },0)/temps.length;
        var read = tempReading(avg);
        if (read){
          var box = el('p',{class:'note'});
          box.appendChild(el('span',{class:'swatch',style:'background:'+tempColour(avg)}));
          box.appendChild(document.createTextNode(' ' + read +
            ' (mean of ' + temps.length + ' gauge' + (temps.length===1?'':'s') +
            ', ' + fmt(avg,1) + 'F)'));
          p.appendChild(box);
        }
      }
    }
  });
}

function gaugeRow(r){
  var wrap = el('div',{class:'rdg'});
  var name = el('div',{class:'rdg-name'});
  /* The name shown is the one the API returned. A wrong identifier cannot
     look like a plausible reading from somewhere else. */
  name.appendChild(el('span',{ text: r.name || (r.hint ? '(' + r.hint + ')' : 'unknown site') }));
  name.appendChild(flagEl(r.status));
  name.appendChild(el('span',{class:'rdg-id',
    text:(r.source ? r.source + ' ' : '#') + r.id}));
  /* EVERY GAUGE HAS A POSITION AND THERE WAS NO WAY TO GO TO IT. The app knew
     exactly where each one was and left a reader to find it by panning a map
     that opens on the whole basin. */
  if (isNum(r.lat) && isNum(r.lon)){
    var go = el('button',{class:'gobtn',type:'button',
      title:'Show ' + (r.name || r.id) + ' on the map',
      'aria-label':'Show ' + (r.name || r.id) + ' on the map'});
    go.textContent = 'Map';
    go.addEventListener('click', function(){
      if (tabNames().indexOf('map') !== -1) selectTab('map');
      state.map.setView([r.lat, r.lon], 14, { animate:!reduceMotion });
      announce('Map centred on ' + (r.name || r.id) + '.');
    });
    name.appendChild(go);
  }
  wrap.appendChild(name);

  if (r.error){
    wrap.appendChild(el('div',{class:'err',
      text: r.error + '. Nothing is shown for this site because nothing is known.'}));
    return wrap;
  }
  var vals = el('div',{class:'rdg-vals'});
  function v(value, dp, unit){
    var s = el('span',{class:'v'});
    s.appendChild(document.createTextNode(fmt(value, dp)));
    s.appendChild(el('small',{text:unit}));
    return s;
  }
  vals.appendChild(v(r.flow, 0, 'cfs'));
  vals.appendChild(v(r.stage, 2, 'ft'));
  var f = isNum(r.tempF) ? r.tempF : null;
  var tv = v(f, 1, 'F');
  if (f !== null) tv.style.color = tempColour(f);
  vals.appendChild(tv);
  /* Only where there is a sensor. A dash in this column would say the water
     is unmeasurably clear rather than that nobody is measuring it, so the
     column is absent instead. */
  if (isNum(r.turb)) vals.appendChild(v(r.turb, 1, 'FNU'));
  if (isNum(r.vel))  vals.appendChild(v(Math.abs(r.vel), 2, 'ft/s'));
  wrap.appendChild(vals);
  if (isNum(r.turb)) wrap.appendChild(el('div',{class:'rdg-id',
    text: turbReading(r.turb) + ' — turbidity, how much the water is carrying'}));
  var vr = velReading(r);
  if (vr) wrap.appendChild(el('div',{class: vr.conflict ? 'err' : 'rdg-id',
    text: vr.text + (vr.conflict ? '' : ' — measured, not predicted')}));
  if (r.at) wrap.appendChild(el('div',{class:'rdg-id',
    text: 'reading ' + clockLocal(r.at) + ', ' + dayLocal(r.at)}));
  return wrap;
}


function discoverBox(river){
  var d = el('details',{class:'foldbox'});
  var sum = el('summary',{});
  var seen = sget(river.id,'tidestations');
  /* A STORED RESULT BELONGS TO THE BUILD THAT ASKED. Before the stations were
     baked in, this button stored every station in the river's bounding box —
     and after the bake shipped, that old list was read back under the new
     question and reported as "NOAA had added 44 since this version was built".
     Forty-four is the number of stations that SHIP with it. A stored answer
     whose meaning changed is not a stale answer, it is a wrong one, so it is
     stamped with the bake it was measured against and ignored otherwise. */
  var bakedAt = (typeof TIDE_STATIONS_META === 'object' && TIDE_STATIONS_META && TIDE_STATIONS_META.fetchedAt) || '';
  var valid = seen && seen.against === bakedAt ? seen : null;

  sum.appendChild(el('b',{text:'Stations NOAA has added since this build'}));
  sum.appendChild(el('span',{class:'note',
    text: valid
      ? (valid.list && valid.list.length
          ? ' \u2014 ' + valid.list.length + ' found'
          : ' \u2014 none, last time it was asked')
      : ' \u2014 not asked yet'}));
  d.appendChild(sum);

  var body = el('div',{class:'foldbody'});
  body.appendChild(el('p',{class:'note',style:'margin-top:0',
    text:'The stations on this river already ship with the app and are on the map \u2014 NOAA was asked once, when this version was built, so you never pay for it. This asks the one thing that file cannot answer: whether NOAA has ADDED any since. It costs a two-megabyte download, because NOAA publishes its list as one file and will not filter it, which is why it is a button rather than something that happens to you. Usually the answer is none.'}));

  var said = el('p',{class:'note'});
  function saidText(res){
    if (!res) return 'Not asked on this build yet.';
    var t = 'Last checked ' + clockLocal(new Date(res.at).toISOString()) + ', ' +
            dayLocal(new Date(res.at).toISOString()) + '. ';
    return t + ((res.list && res.list.length)
      ? 'NOAA had added ' + res.list.length + ' station(s) since this version was built: ' +
        res.list.map(function(x){ return x.name || x.id; }).join(', ') +
        '. They are in the list above and they stay there \u2014 you do not need to do this again.'
      : 'NOAA had added none since this version was built. That is the usual answer, and it is kept, so there is no need to check again unless you want to.');
  }
  said.textContent = saidText(valid);

  var row = el('div',{class:'rowline'});
  var btn = el('button',{type:'button',
    text: valid ? 'Check NOAA again' : 'Check NOAA for stations added since this build'});
  btn.addEventListener('click', function(){
    btn.disabled = true;
    btn.textContent = 'Asking NOAA \u2014 this one is a big file\u2026';
    nearbyTideStations(river).then(function(added){
      loadTideFor(river);
      said.textContent = saidText(sget(river.id,'tidestations'));
      announce(added && added.length
        ? added.length + ' station(s) NOAA has added since this build are now in the list, and they stay there.'
        : 'NOAA has not added any stations on this river since this build. That answer is kept.');
      btn.disabled = false;
      btn.textContent = 'Check NOAA again';
    }, function(e){
      btn.disabled = false;
      btn.textContent = 'Try NOAA again';
      said.textContent = 'NOAA did not answer: ' + (e && e.message || e) +
        ' Nothing changed, and the stations already in the list are unaffected.';
      announce('NOAA did not answer.');
    });
  });
  row.appendChild(btn);
  body.appendChild(row);
  body.appendChild(said);
  d.appendChild(body);
  return d;
}

function tideSection(river){
  var box = el('div',{});
  var t = state.tides[river.id];
  if (!t){ box.appendChild(el('p',{class:'note',text:'Loading tide…'})); return box; }
  if (t.failed){
    box.appendChild(el('div',{class:'warnbox',
      text:'No tide prediction available: ' + t.failed}));
    return box;
  }
  if (t.stations && t.stations.length > 1){
    /* THE TIDE IS PREDICTED AT ONE PLACE AND THE PICKER JUST SAID "Station".
       A reader who has not been told assumes a tide is a property of the
       river; on this water it is not. High water at Rio Vista and high water
       at Freeport are hours apart, so a chart read against the wrong station
       is wrong by more than it looks — and nothing on the screen said which
       station it was for, or that it was a choice worth making. */
    box.appendChild(el('p',{class:'note',style:'margin-top:0',
      text:'These are predictions for one place on the river, not for the river. The tide turns at different times along it \u2014 hours apart between the top of this reach and the bottom \u2014 so pick the station nearest where you will actually be.'}));

    var row = el('div',{class:'rowline'});
    var lab = el('label',{for:'tidestation-'+river.id,text:'Predicted at'});
    var sel = el('select',{id:'tidestation-'+river.id});
    t.stations.forEach(function(s){
      var o = el('option',{value:s.id,text:(s.name||s.id)+' — '+s.id});
      if (s.id === t.station) o.setAttribute('selected','selected');
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){ switchTideStation(river, sel.value); });
    row.appendChild(lab); row.appendChild(sel);
    box.appendChild(row);

    /* AND IF THE APP KNOWS WHERE YOU ARE, IT CAN JUST ANSWER. Where I am
       already put a position on the map; the nearest station to it is the one
       question the picker leaves a reader to solve by knowing the estuary. */
    if (state.here){
      var withPos = t.stations.filter(function(s){ return isNum(s.lat) && isNum(s.lon); });
      if (withPos.length){
        var near = withPos.slice().sort(function(a2, b2){
          return metresBetween(state.here.lat, state.here.lon, a2.lat, a2.lon) -
                 metresBetween(state.here.lat, state.here.lon, b2.lat, b2.lon);
        })[0];
        var away = metresBetween(state.here.lat, state.here.lon, near.lat, near.lon);
        if (near.id === t.station){
          box.appendChild(el('p',{class:'note',
            text:'This is the nearest station to where you are, ' + kmText(away) + ' off.'}));
        } else {
          var nrow = el('div',{class:'rowline'});
          var nbtn = el('button',{type:'button',
            text:'Use ' + (near.name || near.id) + ', ' + kmText(away) + ' from you'});
          nbtn.addEventListener('click', function(){
            switchTideStation(river, near.id);
            announce('Tide now predicted at ' + (near.name || near.id) + '.');
          });
          nrow.appendChild(nbtn);
          box.appendChild(nrow);
        }
      }
    }
  }
  /* Asking NOAA what else is out there costs two megabytes, so it is a
     button rather than something that happens to you. Once pressed, the
     result is kept and the question is not asked again. */
  var st = (t.stations||[]).filter(function(s){ return s.id === t.station; })[0];
  if (st && isNum(st.lat) && isNum(st.lon)){
    var srow = el('div',{class:'rowline'});
    var sgo = el('button',{type:'button',text:'Show this station on the map'});
    sgo.addEventListener('click', function(){
      if (tabNames().indexOf('map') !== -1) selectTab('map');
      state.map.setView([st.lat, st.lon], 13, { animate:!reduceMotion });
      announce('Map centred on ' + (st.name || st.id) + '.');
    });
    srow.appendChild(sgo);
    box.appendChild(srow);
  }
  var head = el('p',{class:'note'});
  head.appendChild(document.createTextNode(
    (st ? st.name + ' — ' : '') + 'station ' + t.station + ', MLLW. '));
  head.appendChild(flagEl(st ? st.status : PROV.VERIFIED));
  box.appendChild(head);

  if (t.hourlyUnavailable){
    box.appendChild(el('p',{class:'note',
      text:'This station publishes highs and lows only, not an hourly curve. The times below are the turns; the water between them is not published and is not drawn.'}));
  } else {
    box.appendChild(tideChart(t));
  }
  if (t.offline) box.appendChild(el('p',{class:'note',
    text:'Predictions from store. A prediction is arithmetic about the future, so it is still good; the flow and temperature above are not.'}));

  var now = Date.now(), shown = 0;
  (t.hilo||[]).forEach(function(h){
    var when = new Date(h.t.replace(' ','T'));
    if (when.getTime() < now - 3600000 || shown >= 6) return;
    shown++;
    var r = el('div',{class:'hilo'});
    r.appendChild(el('span',{text:(h.type==='H'?'High':'Low')+' · '+dayLocal(h.t.replace(' ','T'))}));
    var b = el('b',{text:clockLocal(h.t.replace(' ','T'))+'  '+fmt(h.v,1)+' ft'});
    r.appendChild(b);
    box.appendChild(r);
  });
  if (!shown) box.appendChild(el('p',{class:'note',
    text:'No high or low water in the stored window. Reconnect to extend it.'}));
  /* IT WAS PUSHING THE TIDE OFF THE SCREEN. This block explains a button most
     readers will never press, and it sat BETWEEN the station picker and the
     tide itself — so a newcomer opening the tide met four sentences about
     NOAA's file sizes before a single high or low. It is last now, and shut.
     Collapsed, not deleted: what it says is true and somebody will want it. */
  if (river.tideDiscover) box.appendChild(discoverBox(river));

  return box;
}

function tideChart(t){
  var W = 320, H = 110, pad = 16;
  var now = Date.now();
  var pts = (t.hourly||[]).map(function(p){
    return { x:new Date(p.t.replace(' ','T')).getTime(), y:p.v };
  }).filter(function(p){
    return p.x >= now - 6*3600000 && p.x <= now + 24*3600000 && isFinite(p.y);
  });
  var s = svg('svg',{ id:'tidechart', viewBox:'0 0 '+W+' '+H, role:'img' });
  var ttl = svg('title'); ttl.textContent =
    'Predicted tide height, six hours back and twenty-four hours forward, MLLW.';
  s.appendChild(ttl);
  if (pts.length < 2){
    var e = svg('text',{x:W/2,y:H/2,fill:'#9FB3B1','font-size':'11','text-anchor':'middle'});
    e.textContent = 'No prediction in this window.';
    s.appendChild(e); return s;
  }
  var xs = pts.map(function(p){ return p.x; }), ys = pts.map(function(p){ return p.y; });
  var x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);
  var y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  if (y1 - y0 < 0.5){ y0 -= 0.25; y1 += 0.25; }
  var sx = function(v){ return pad + (v-x0)/(x1-x0)*(W-2*pad); };
  var sy = function(v){ return H-pad - (v-y0)/(y1-y0)*(H-2*pad); };
  var d = pts.map(function(p,i){ return (i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1); }).join(' ');
  s.appendChild(svg('path',{ d:d, fill:'none', stroke:'#7BD5D9', 'stroke-width':'2' }));
  s.appendChild(svg('path',{ d:d+' L'+sx(x1)+' '+(H-pad)+' L'+sx(x0)+' '+(H-pad)+' Z',
    fill:'#7BD5D9', opacity:'.13', stroke:'none' }));
  if (now >= x0 && now <= x1){
    s.appendChild(svg('line',{ x1:sx(now), x2:sx(now), y1:pad-6, y2:H-pad,
      stroke:'#DA4A85','stroke-width':'1.5' }));
    var nl = svg('text',{ x:sx(now), y:pad-8, fill:'#E76F9F','font-size':'9','text-anchor':'middle' });
