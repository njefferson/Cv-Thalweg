    var b = river.bbox, list = [];
    (j.stations || []).forEach(function(s){
      var lat = Number(s.lat), lon = Number(s.lng);
      if (!isFinite(lat) || !isFinite(lon)) return;
      if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) return;
      list.push({ id:String(s.id), name:s.name, lat:lat, lon:lon, status:PROV.FOUND });
    });
    /* ONLY WHAT IS NEW. The stations in this river's box already ship with the
       app — tools/fetch-stations.mjs asked NOAA once and baked them in — so
       there is nothing here to download twice. What this answers is the one
       question the baked file cannot: has NOAA added a station since the build.
       Usually the answer is none, and saying none is the useful answer. */
    var already = {};
    bakedStations(river).forEach(function(s){ already[s.id] = true; });
    (river.tideStations || []).forEach(function(s){ already[s.id] = true; });
    var fresh = list.filter(function(s){ return !already[s.id]; });
    var c = river.center;
    fresh.sort(function(x, y){
      return metresBetween(c[0], c[1], x.lat, x.lon) -
             metresBetween(c[0], c[1], y.lat, y.lon);
    });
    fresh = fresh.slice(0, 12);
    /* STAMPED WITH THE BAKE IT WAS MEASURED AGAINST. "Added since this build"
       is only meaningful relative to a particular baked file, and a stored
       answer that outlives its build is not stale, it is wrong — it was read
       back after the bake shipped and reported forty-four stations as new when
       forty-four is the number that ship with the app. */
    sput(river.id, 'tidestations', { at:Date.now(), list:fresh, inBox:list.length,
      against:(typeof TIDE_STATIONS_META === 'object' && TIDE_STATIONS_META && TIDE_STATIONS_META.fetchedAt) || '' });
    return fresh;
  }, function(e){
    logNet('CO-OPS station index', COOPS_MD, false, String(e && e.message || e));
    throw e;
  });
}

/* =====================================================================
   DWR bathymetry.
   Two different data types, and the difference is the product. A
   multibeam raster is a continuous surface and draws as tiles. Single
   beam soundings are discrete points along the boat's track and are not
   a surface; drawing them as one would invent bottom between the lines.
   ===================================================================== */
var DWR_DIRECT = 'https://gis.water.ca.gov';
var IMG_FOLDER = '/arcgisimg/rest/services/Bathymetry';
var SBM_SERVICE = '/arcgis/rest/services/Elevation/i06_Singlebeam_Bathymetry/MapServer';

function dwr(path){ return (BATHY_PROXY || DWR_DIRECT) + path; }

/* The depth ramp.
 *
 * This rule was run against the live ImageServer before it was written
 * down, which is the only way to know: a rendering rule ArcGIS does not
 * understand does NOT come back as an error. It comes back as HTTP 200,
 * content-type image/png, and a hundred-odd bytes of empty picture. So
 * there is no probe that can tell a working rule from a broken one by
 * watching for a failure — the failure looks exactly like clear water.
 *
 * Two things were measured and both are load-bearing. An explicit
 * ColorRamp object is silently ignored, so the ramp has to be named.
 * "Elevation #2" over a percent-clip stretch with dynamic range
 * adjustment is the one that picks the thalweg out from the flats either
 * side of it, which is the line this app is named after.
 */
var RAMP = encodeURIComponent(JSON.stringify({
  rasterFunction:'Colormap',
  rasterFunctionArguments:{
    ColorrampName:'Elevation #2',
    Raster:{ rasterFunction:'Stretch',
      rasterFunctionArguments:{ StretchType:6, MinPercent:0.5, MaxPercent:0.5,
        DRA:true, UseGamma:false } }
  }
}));

var EsriImg = L.TileLayer.extend({
  options:{ opacity:0.8, maxZoom:19, ramp:false },
  getTileUrl:function(coords){
    var b  = this._tileCoordsToBounds(coords);
    var sw = L.CRS.EPSG3857.project(b.getSouthWest());
    var ne = L.CRS.EPSG3857.project(b.getNorthEast());
    var u = this._baseUrl + '/exportImage?bbox=' + [sw.x,sw.y,ne.x,ne.y].join(',')
          + '&bboxSR=3857&imageSR=3857&size=256,256&format=png32'
          + '&transparent=true&f=image';
    if(this.options.ramp) u += '&renderingRule=' + RAMP;
    return u;
  },
  initialize:function(baseUrl,opts){
    this._baseUrl = baseUrl;
    L.TileLayer.prototype.initialize.call(this,'',opts);
  }
});

/* --- extents -------------------------------------------------------- */
/* ArcGIS reports each service's extent in that service's own projection,
   and DWR's bathymetry is published in State Plane California — usually
   as a WKT string with no EPSG code at all, occasionally as wkid 2226 or
   2227. Every one of the twenty multibeam services is Lambert Conformal
   Conic; every one of the eighty-one single beam layers is Web Mercator.
   So both are converted here rather than guessed at: an extent placed in
   the wrong projection puts a survey in the wrong river, which is the
   class of mistake this whole app is arranged to refuse. */
/* The vertical coordinate system named in a WKT, or null when it names none.
   A missing VERTCS is not a datum of zero; it is silence. */
function vertcsOf(sr){
  var w = (sr && sr.wkt) || '';
  var m = w.match(/VERTCS\["([^"]+)"/);
  return m ? m[1] : null;
}

function extentToLatLng(ext){
  if (!ext || !isNum(ext.xmin) || !isNum(ext.ymin) ||
      !isNum(ext.xmax) || !isNum(ext.ymax)) return null;
  var sr = ext.spatialReference || {};
  var wkid = sr.latestWkid || sr.wkid;
  if (wkid === 4326 || wkid === 4269){
    /* NAD83 and WGS84 differ by about a metre here. That is far inside the
       tolerance of "does this survey touch this river". */
    return { w:ext.xmin, s:ext.ymin, e:ext.xmax, n:ext.ymax,
             approx: wkid === 4269, wkid:wkid };
  }
  if (wkid === 3857 || wkid === 102100 || wkid === 900913){
    var a = invMercator(ext.xmin, ext.ymin), b = invMercator(ext.xmax, ext.ymax);
    return { w:a.lon, s:a.lat, e:b.lon, n:b.lat, approx:false, wkid:wkid };
  }
  var lcc = sr.wkt ? parseWkt(sr.wkt) : STATE_PLANE[wkid];
  if (lcc && lcc.projection === 'Lambert_Conformal_Conic' && isNum(lcc.lon0)){
    var c = lccInverse(lcc, ext.xmin, ext.ymin),
        d = lccInverse(lcc, ext.xmax, ext.ymax);
    return { w:c.lon, s:c.lat, e:d.lon, n:d.lat, approx:false,
             wkid: wkid || (lcc.name || 'WKT'), unit:lcc.toMetre };
  }
  return { unknownWkid: wkid === undefined ? (sr.wkt ? 'WKT this build cannot read' : 'absent') : wkid };
}
function invMercator(x, y){
  var R = 6378137;
  return { lon: x / R * 180 / Math.PI,
           lat: (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI };
}

/* The two State Plane zones DWR publishes without a WKT. */
var STATE_PLANE = {
  2226:{ name:'CA State Plane II (US ft)', projection:'Lambert_Conformal_Conic',
    a:6378137, invf:298.257222101, fe:6561666.667, fn:1640416.667, lon0:-122,
    lat1:38.3333333333333, lat2:39.8333333333333, lat0:37.6666666666667,
    toMetre:0.3048006096012192 },
  2227:{ name:'CA State Plane III (US ft)', projection:'Lambert_Conformal_Conic',
    a:6378137, invf:298.257222101, fe:6561666.667, fn:1640416.667, lon0:-120.5,
    lat1:37.0666666666667, lat2:38.4333333333333, lat0:36.5,
    toMetre:0.3048006096012192 }
};

/* Esri WKT carries every parameter the inverse needs, so it is read
   rather than matched to an EPSG code. */
function parseWkt(wkt){
  function num(k){
    var m = wkt.match(new RegExp('PARAMETER\\["' + k + '",(-?[\\d.eE+]+)\\]', 'i'));
    return m ? Number(m[1]) : null;
  }
  var sph = wkt.match(/SPHEROID\["[^"]*",([\d.]+),([\d.]+)\]/);
  var proj = wkt.match(/PROJECTION\["([^"]+)"\]/);
  var name = wkt.match(/PROJCS\["([^"]+)"/);
  /* The horizontal unit is the LAST UNIT inside PROJCS. A WKT that also
     carries a VERTCS ends with the VERTICAL unit, and reading that one
     runs a survey measured in feet through a metre conversion — which put
     two Delta surveys in the Trinity Alps before it was noticed. */
  var horiz = wkt.split(/,\s*VERTCS\[/)[0];
  var units = horiz.match(/UNIT\["[^"]+",[\d.]+\]/g) || [];
  var last = units.length ? units[units.length - 1].match(/,([\d.]+)\]$/) : null;
  return {
    name: name ? name[1] : null,
    projection: proj ? proj[1] : null,
    a: sph ? Number(sph[1]) : 6378137,
    invf: sph ? Number(sph[2]) : 298.257222101,
    fe:num('False_Easting'), fn:num('False_Northing'),
    lon0:num('Central_Meridian'), lat1:num('Standard_Parallel_1'),
    lat2:num('Standard_Parallel_2'), lat0:num('Latitude_Of_Origin'),
    toMetre: last ? Number(last[1]) : 1
  };
}

/* Snyder's inverse for the two-standard-parallel case. */
function lccInverse(p, x, y){
  var D = Math.PI / 180, f = 1 / p.invf, e = Math.sqrt(2 * f - f * f), a = p.a;
  var X = (x - p.fe) * p.toMetre, Y = (y - p.fn) * p.toMetre;
  function m(phi){ return Math.cos(phi) / Math.sqrt(1 - e * e * Math.pow(Math.sin(phi), 2)); }
  function t(phi){
    return Math.tan(Math.PI / 4 - phi / 2) /
           Math.pow((1 - e * Math.sin(phi)) / (1 + e * Math.sin(phi)), e / 2);
  }
  var p1 = p.lat1 * D, p2 = p.lat2 * D, p0 = p.lat0 * D;
  var n = Math.abs(p1 - p2) < 1e-12 ? Math.sin(p1)
        : (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t(p1)) - Math.log(t(p2)));
  var F = m(p1) / (n * Math.pow(t(p1), n));
  var rho0 = a * F * Math.pow(t(p0), n);
  var rho = (n < 0 ? -1 : 1) * Math.sqrt(X * X + Math.pow(rho0 - Y, 2));
  var tp = Math.pow(rho / (a * F), 1 / n);
  var lon = Math.atan2(X, rho0 - Y) / n + p.lon0 * D;
  var phi = Math.PI / 2 - 2 * Math.atan(tp);
  for (var i = 0; i < 12; i++){
    var es = e * Math.sin(phi);
    phi = Math.PI / 2 - 2 * Math.atan(tp * Math.pow((1 - es) / (1 + es), e / 2));
  }
  return { lat: phi / D, lon: lon / D };
}
function boxesIntersect(a, b){
  return !(a.e < b[0] || a.w > b[2] || a.n < b[1] || a.s > b[3]);
}

/* --- enumeration ---------------------------------------------------- */
/* The layer list is never typed into this file. It is read from the REST
   directory, each layer's own extent decides which rivers it belongs to,
   and a layer whose extent cannot be placed is listed separately rather
   than assigned to a river on a hunch. */
function pool(items, n, fn){
  var out = new Array(items.length), i = 0;
  function next(){
    if (i >= items.length) return Promise.resolve();
    var k = i++;
    return Promise.resolve(fn(items[k], k)).then(function(v){ out[k] = v; }, function(){ out[k] = null; })
      .then(next);
  }
  var runners = [];
  for (var r = 0; r < Math.min(n, items.length); r++) runners.push(next());
  return Promise.all(runners).then(function(){ return out; });
}

function loadCatalog(force){
  if (state.catalog && !force) return Promise.resolve(state.catalog);
  var cached = sget('_shared', 'catalog');
  if (cached && !force && (Date.now() - cached.at) < 7 * 24 * 3600 * 1000){
    state.catalog = cached; return Promise.resolve(cached);
  }
  var folderUrl = dwr(IMG_FOLDER + '?f=json');
  var sbmUrl    = dwr(SBM_SERVICE + '/layers?f=json');

  var raster = getJSON(folderUrl, 25000).then(function(j){
    logNet('DWR bathymetry folder', folderUrl, true,
           ((j.services||[]).length) + ' services');
    var svcs = (j.services || []).filter(function(s){ return s.type === 'ImageServer'; });
    return pool(svcs, 5, function(s){
      var u = dwr('/arcgisimg/rest/services/' + s.name + '/ImageServer?f=json');
      return getJSON(u, 20000).then(function(m){
        return {
          kind:'raster',
          name:s.name.replace(/^Bathymetry\//, ''),
          path:'/arcgisimg/rest/services/' + s.name + '/ImageServer',
          title: String(m.name || s.name).replace(/^Bathymetry\//, ''),
          description: plainText(m.description || m.serviceDescription).slice(0, 400),
          pixel: (m.pixelSizeX && m.pixelSizeY) ? [m.pixelSizeX, m.pixelSizeY] : null,
          /* WHAT THE HEIGHTS ARE MEASURED FROM, if the service says. Two
             surveys of one place can only be subtracted from each other when
             they share a vertical datum, and they do not all declare one:
             measured on 2026-08-31, Grant Line 2024 declares
             NAVD88_height_(ftUS) and Grant Line 2023 declares nothing at all.
             Kept here so the app can refuse the comparison out loud instead of
             printing a difference that assumes an answer nobody gave. */
          vertcs: vertcsOf(m.spatialReference),
          box: extentToLatLng(m.extent)
        };
      });
    }).then(function(rows){ return rows.filter(Boolean); });
  }).catch(function(e){
    logNet('DWR bathymetry folder', folderUrl, false, String(e && e.message || e));
    if (BATHY_PROXY && BATHY_PROXY.charAt(0) === '/') state.proxyMissing = true;
    return { error: String(e && e.message || e) };
  });

  var single = getJSON(sbmUrl, 25000).then(function(j){
    logNet('DWR singlebeam layers', sbmUrl, true, ((j.layers||[]).length) + ' layers');
    return (j.layers || []).filter(function(l){
      return l.type !== 'Group Layer';
    }).map(function(l){
      return {
        kind:'single',
        id:l.id,
        name:l.name,
        title:l.name,
        description: plainText(l.description).slice(0, 400),
        depthField: pickDepthField(l.fields),
        maxRecords: isNum(l.maxRecordCount) ? l.maxRecordCount : null,
        fields:(l.fields || []).map(function(f){ return f.name; }),
        box: extentToLatLng(l.extent)
      };
    });
  }).catch(function(e){
    logNet('DWR singlebeam layers', sbmUrl, false, String(e && e.message || e));
    return { error: String(e && e.message || e) };
  });

  return Promise.all([raster, single]).then(function(r){
    var cat = { at:Date.now(),
                raster: Array.isArray(r[0]) ? r[0] : [],
                rasterError: Array.isArray(r[0]) ? null : r[0].error,
                single: Array.isArray(r[1]) ? r[1] : [],
                singleError: Array.isArray(r[1]) ? null : r[1].error };
    state.catalog = cat;
    /* The moment the app knows where the surveys are, the map should say so. */
    drawSurveyBoxes();
  drawAccessSites();
  drawRamps();
    sput('_shared', 'catalog', cat);
    return cat;
  });
}

/* The depth attribute is whatever the layer calls it, so it is read from
   the layer's own field list rather than assumed. If nothing looks like a
   depth the points still draw, in one colour, saying why. */
/* ArcGIS publishes descriptions as HTML fragments. They go into the page
   as text, so the markup has to come off first or the reader gets a
   paragraph of DIV tags. */
function plainText(html){
  if (!html) return '';
  var d = document.createElement('div');
  d.innerHTML = String(html);
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}

function pickDepthField(fields){
  if (!Array.isArray(fields)) return null;
  var numeric = fields.filter(function(f){
    return /Double|Single|Integer|Float/i.test(f.type || '') &&
           !/^(OBJECTID|FID|Shape)/i.test(f.name || '');
  });
  var order = [/^z$/i, /elev/i, /depth/i, /bed/i, /bottom/i, /sounding/i, /_z$/i];
  for (var i = 0; i < order.length; i++){
    for (var k = 0; k < numeric.length; k++)
      if (order[i].test(numeric[k].name)) return numeric[k].name;
  }
  return null;
}

/* Layers whose extent places them inside this river's box. */
/* Overlap area, so a survey that sits squarely in this reach comes before
   one that clips its corner. Both are honestly "in the box"; only one is
   what you were looking for. */
function overlapArea(box, b){
  var w = Math.min(box.e, b[2]) - Math.max(box.w, b[0]);
  var h = Math.min(box.n, b[3]) - Math.max(box.s, b[1]);
  return (w > 0 && h > 0) ? w * h : 0;
}
function catalogFor(cat, river){
  function rank(rows){
    return rows.filter(function(row){
        return row.box && !row.box.unknownWkid && boxesIntersect(row.box, river.bbox);
      })
      .map(function(row){
        row.overlap = overlapArea(row.box, river.bbox);
        return row;
      })
      .sort(function(a, b){ return b.overlap - a.overlap; });
  }
  function unplaced(row){ return row.box && row.box.unknownWkid; }
  return {
    raster: rank(cat.raster),
    single: rank(cat.single),
    unplaced: cat.raster.filter(unplaced).concat(cat.single.filter(unplaced))
  };
}

/* --- single beam query ---------------------------------------------- */
/* Queried by the current map bounds and hard capped. The whole layer is
   never requested: these are point clouds, and one of them at full extent
   would be tens of megabytes onto a phone on a levee road. */
function querySoundings(layer, bounds){
  var b = bounds;
  var cap = Math.min(FEATURE_CAP, layer.maxRecords || FEATURE_CAP);
  var env = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
  var url = dwr(SBM_SERVICE + '/' + layer.id + '/query' +
    '?f=json&where=1%3D1' +
    '&geometry=' + encodeURIComponent(env) +
    '&geometryType=esriGeometryEnvelope&inSR=4326' +
    '&spatialRel=esriSpatialRelIntersects' +
    '&outFields=' + encodeURIComponent(layer.depthField || '*') +
    '&returnGeometry=true&outSR=4326' +
    '&resultRecordCount=' + cap);
  return getJSON(url, 30000).then(function(j){
    if (j.error) throw new Error(j.error.message || 'service error');
    var feats = j.features || [];
    logNet('DWR soundings', url, true, feats.length + ' features');
    return {
      features: feats,
      truncated: !!j.exceededTransferLimit || feats.length >= cap,
      cap: cap,
      field: layer.depthField
    };
  }, function(e){
    logNet('DWR soundings', url, false, String(e && e.message || e));
    throw e;
  });
}

/* =====================================================================
   The ribbon.
   Gauges at their true position along the river's axis, downstream on the
   left, each dot coloured by water temperature, with the tidal reach
   drawn as a fade rather than a line because that is what it is. On the
   All view the four rivers stack against one temperature scale, which is
   the comparison this app exists to make.
   ===================================================================== */
var SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined)
    n.setAttribute(k, attrs[k]);
  return n;
}
function axisValue(river, row){
  return river.axis === 'lon' ? row.lon : row.lat;
}

/* The upstream end of tidal influence is not a fixed point and this app
   will not draw it as one. What it draws instead is a fact: the furthest
   upstream place NOAA publishes a tide prediction for this river. That is
   a real limit with a real name, and it comes from the station index
   rather than from anybody's memory of where the tide stops. */
function tidalEdge(river){
  var t = state.tides[river.id];
  if (!t || !t.stations || !t.stations.length) return null;
  /* Declared stations only. The discovered ones come from a bounding box
     over the lower Delta, which catches most of the bay: taking the
     furthest upstream of THOSE had the Mokelumne's tide reaching Stockton,
     which is on the San Joaquin. A declared station was checked against
     the river it is on; a box hit was not. */
  var declared = {};
  (river.tideStations || []).forEach(function(s){ declared[s.id] = true; });
  var best = null;
  t.stations.forEach(function(st){
    if (!declared[st.id]) return;
    var v = river.axis === 'lon' ? st.lon : st.lat;
    if (!isNum(v)) return;
    if (best === null || v > best.v) best = { v:v, name:st.name || st.id };
  });
  return best;
}

/* On a phone the ribbon is drawn tighter. Four stacked rivers at the
   desktop pitch is half a 667px screen, and the comparison is the point of
   the view — but not at the price of the readings underneath it. */
var RIB = { rowH:52, top:24, foot:30, dot:6, fig:11, name:11, note:9, narrow:false };
/* The ribbon has a height budget now, and it did not before.
   Width was fixed once and height never was: four rows at 44px plus its
   chrome is 218px of SVG and 263px of band whatever screen it is on, which
   on an iPhone 13's real 664px viewport left the readings 237px, on an
   iPhone SE 125px, and with the software keyboard up TWENTY-TWO — the same
   failure that was found and fixed at 34px, back again because the fix was
   measured against 390x844. That is a phone's SCREEN; the page gets 664.
   So rows shrink to fit a share of the viewport, and below a floor where a
   dot and its figure no longer fit, the ribbon is not drawn at all: a floor
   that exceeds the space available is just the next fixed size that fails. */
function ribbonMetrics(W, rowCount, budget, tidal){
  var n = W < 620;
  var m = n ? { rowH:44, top:18, foot:24, dot:5, fig:10, name:10, note:8, narrow:true }
            : { rowH:52, top:24, foot:30, dot:6, fig:11, name:11, note:9, narrow:false };
  /* The tide key sits above the temperature ramp, so the foot has to hold
     both. Reserved only when a tidal river is actually drawn — the ribbon
     showing the Feather alone has no wash on it and owes no room for one. */
  if (tidal) m.foot += 16;
  /* A ROW HAS TO CONTAIN ITS OWN CAPTION. The tide caption hangs below the
     lower band of figures, which put it in the NEXT river's upper band — the
     Delta's "tide reaches about here" landed on the Mokelumne's temperature,
     and the two read as one label. Rows carrying a caption get the height it
     needs rather than borrowing it from the row underneath. */
  if (tidal && rowCount > 1) m.rowH += 14;
  /* AND THE LENGTH SITS UNDER THE NAME, on the multi-river view where the
     names are drawn at all. A line added to a row without room made for it is
     how the Delta's caption came to sit on the Mokelumne's temperature. */
  if (rowCount > 1) m.rowH += 10;
  /* SHRINK TO FIT, AND WHEN IT WILL NOT FIT, SCROLL RATHER THAN VANISH.

     A row has a floor below which a dot and its figure are not legible, and
     five rows at that floor need more height than a phone held sideways has
     in total — a landscape iPhone gives this band about 75px to work with.
     The old answer was to drop the whole thing, which is how the comparison
     the landing page exists for disappeared the moment somebody turned their
     phone. Squeezing below the floor is not available either: an illegible
     row is not a smaller row, it is a different defect.

     So the third option. Rows keep their legible height, the band keeps its
     share of the screen, and what does not fit is reached by scrolling. The
     overflow is VERTICAL because the rows stack — turning the band sideways
     would mean laying the rivers out along the axis their bars already use,
     which is the one thing a stacked comparison must not do. */
  m.natural = m.rowH;
  m.scrolls = false;
  /* THE FLOOR IS WHAT THE ROW HAS TO HOLD, and the row grew. 22 was set for a
     dot and its figure; a multi-river row now also carries the river's name
     and, under it, how many kilometres its bar covers. Left at 22 the length
     would print into the top of the next river's bar — which is exactly how
     the Delta's tide caption came to sit on the Mokelumne's temperature, and
     the lesson from that one was that a line added to a row needs the row to
     be told about it. */
  m.floor = rowCount > 1 ? 32 : 22;
  if (isNum(budget) && rowCount > 0){
    var avail = budget - m.top - m.foot;
    var fit = Math.floor(avail / rowCount);
    if (fit < m.rowH){
      if (fit >= m.floor) m.rowH = fit;     /* still legible: shrink to fit */
      else m.scrolls = true;                /* below the floor: keep the size */
    }
  }
  /* THE ONLY REMAINING REASON TO DROP IT is a band too short to show a whole
     row, where "scrollable" would be a sliver of a bar and a scrollbar.

     The test is the BAND against one row, not the band minus the top and the
     foot: when the drawing scrolls, its margins and its key scroll with it and
     do not have to be on screen at once. Requiring them to fit is what took
     the ribbon off an iPad held sideways, which has room for a row and a half
     and every reason to be given it. A phone held sideways has seventeen
     pixels after the caption underneath has taken its share, and that is a
     sliver — so it keeps the drop, and the note under it says so. */
  m.budget = isNum(budget) ? budget : null;
  m.tooTight = m.scrolls && isNum(budget) && budget < (m.rowH + 8);
  RIB = m;
}

/* HOW MUCH RIVER A BAR COVERS, IN METRES.

   Every bar used to be stretched to the same width whatever distance it
   spanned, which is the one thing four stacked bars must not do: the reason
   they are stacked is to be compared, and equal-length bars say the four
   rivers are the same length. They are not. This measures the span each bar
   actually draws so they can share one scale.

   Computed ONCE and handed to the drawing, rather than worked out again
   there — a width and a position derived separately from the same numbers
   are two chances to disagree. */
function ribbonSpan(river, rows){
  var edge = river.tidal ? tidalEdge(river) : null;
  var pts = (rows || []).filter(function(r){
    return !r.context && isNum(axisValue(river, r));
  });
  var vals = pts.map(function(r){ return axisValue(river, r); });
  if (edge) vals.push(edge.v);
  var lo, hi;
  if (vals.length){ lo = Math.min.apply(null, vals); hi = Math.max.apply(null, vals); }
  else { lo = 0; hi = 1; }
  if (hi - lo < 1e-6){ lo -= 0.05; hi += 0.05; }
  var pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  var metres = river.axis === 'lon'
    ? metresBetween(river.center[0], lo, river.center[0], hi)
    : metresBetween(lo, river.center[1], hi, river.center[1]);
  return { lo:lo, hi:hi, metres:metres, edge:edge, plotted:pts.length };
}

/* THE ONLY FLOOR IS THE ONE THAT KEEPS A BAR DRAWABLE.
   A minimum wide enough to look tidy is a minimum that overstates the length
   of every short river, which is the defect this scale was introduced to fix.
   So it is set to about what one dot needs and nothing more: a river whose
   gauges are all in one place gets a stub, and a stub is the truth about it.
   With the real gauge networks on these four rivers it does not bind. */
var RIB_MIN_BAR = 28;

function ribbonRow(g, river, rows, x0, x1, y, showName, span, W, list1){
  var edge = span.edge;

  rows = rows.filter(function(r){ return !r.context; });
  var pts = rows.filter(function(r){ return isNum(axisValue(river, r)); });
  var lo = span.lo, hi = span.hi;
  var sx = function(v){ return x0 + (v - lo) / (hi - lo) * (x1 - x0); };

  /* the channel */
  g.appendChild(svg('rect', { x:x0, y:y-5, width:(x1-x0), height:10,
    fill:'#16302e', stroke:'#1F5B57', 'pointer-events':'none' }));

  /* THE TIDAL REACH IS A REGION WITH AN END, AND IT HAS TO LOOK LIKE ONE.

     It used to be a cyan wash fading to nothing, over a channel whose own
     fill is nearly the page's background — so it read as a soft gradient
     that decorated the bar rather than as a marked stretch of river, and
     nothing said where it stopped. The caption underneath was worse than
     unhelpful: it sat under the fade with no mark to point at, so it named
     nothing, and where it ran up against the right-hand edge it was anchored
     to the end of the bar, where it read as labelling the end of the RIVER.

     So: a flat wash at one opacity, so it is plainly a filled region; a
     short fade only in the last stretch, because the limit is approximate
     and a hard edge would claim a precision nobody has; and a dashed rule
     standing at the limit with the label hung off it. The rule is the mark
     the caption was always missing. */
  if (edge){
    var gid = 'tidegrad-' + river.id;
    var defs = svg('defs', {});
    var lg = svg('linearGradient', { id:gid, x1:'0', x2:'1', y1:'0', y2:'0' });
    lg.appendChild(svg('stop', { offset:'0',   'stop-color':'#7BD5D9', 'stop-opacity':'.62' }));
    lg.appendChild(svg('stop', { offset:'.8', 'stop-color':'#7BD5D9', 'stop-opacity':'.58' }));
    lg.appendChild(svg('stop', { offset:'1',   'stop-color':'#7BD5D9', 'stop-opacity':'.2' }));
    defs.appendChild(lg); g.appendChild(defs);
    var tx = sx(edge.v);
    var left = Math.min(x0, tx), right = Math.max(x0, tx);
    g.appendChild(svg('rect', { x:left, y:y-5, width:Math.max(0, right-left),
      height:10, fill:'url(#' + gid + ')', 'pointer-events':'none' }));

    /* The mark itself: a dashed rule through the channel and a little past
       it, so it is visible against both the wash and the bare bar. */
    var tickTop = y - 9, tickBot = y + 9;
    g.appendChild(svg('line', { x1:tx, x2:tx, y1:tickTop, y2:tickBot,
      stroke:'#7BD5D9', 'stroke-width':'1.5', 'stroke-dasharray':'3 2',
      'stroke-linecap':'round', 'pointer-events':'none' }));

    /* AND WHICH WAY IT COMES FROM. A rule across the bar marks a limit and
       says nothing about which side of it is tidal — the wash says that, but
       the wash is a tint and the reader has to already know it means the sea.
       Downstream is on the left and the sea is at that end, so the tide runs
       UPSTREAM into the mark: the arrow points the way the water is pushed,
       and stops where the pushing stops. */
    var ah = Math.min(9, Math.max(4, (tx - x0) / 6));
    if (tx - x0 > 12){
      g.appendChild(svg('path', {
        d:'M' + (tx - ah - 3) + ' ' + (y - 4) + ' L' + (tx - 3) + ' ' + y +
          ' L' + (tx - ah - 3) + ' ' + (y + 4) + ' Z',
        fill:'#7BD5D9', 'pointer-events':'none' }));
    }

    /* THE LABEL HANGS OFF THE MARK, and the leader is what makes that true
       even when the words have to shuffle sideways to stay on the drawing.
       Anchoring the text to the end of the bar without a leader is how it
       came to look like a label for the end of the bar. */
    /* AND WHEN. The mark says how far the tide gets; these say when it next
       turns, both ways, and when the prediction was read — because a
       prediction with no time on it is a number the reader has to trust
       blind. Times only: the date is today unless it says otherwise, and a
       full timestamp on a 9px line is unreadable. */
    /* THE TIMES GO WHERE THERE IS ROOM FOR THEM. On the all-rivers view a row
       is 66px and already carries figures above, figures below and a caption;
       two more lines of text is what made the Delta's caption collide with the
       Mokelumne's reading. On a single river there is one row and the whole
       drawing beneath it. */
    var hl = (list1 === 1) ? nextHighLow(river) : null;
    var when = '';
    if (hl){
      var bits = [];
      if (hl.high) bits.push('high ' + clockLocal(hl.high.at));
      if (hl.low)  bits.push('low ' + clockLocal(hl.low.at));
      when = bits.join(' \u00b7 ');
    }
    /* AND WHICH WAY IT IS MOVING RIGHT NOW. Two times with no direction on
       them make the reader compare them against a clock to work out whether
       the water is coming up — arithmetic the app has already done. The word
       goes first because it is the answer and the times are the detail. */
    var rph = (list1 === 1) ? tidePhase(river) : null;
    var text = RIB.narrow ? 'tide to here' : 'tide reaches about here';
    var ly = y + RIB.dot + (RIB.narrow ? 25 : 31);
    var half = text.length * RIB.note * 0.29;
    var anchor = 'middle', lx = tx;
    if (tx + half > x1){ anchor = 'end'; lx = Math.min(x1, tx + half); }
    if (lx - (anchor === 'end' ? 2 * half : half) < x0){ anchor = 'start'; lx = x0; }
    /* The horizontal run stops clear of the words. Level with them it read as
       an underscore stuck to the front of the caption. */
    g.appendChild(svg('path', {
      d:'M' + tx + ' ' + tickBot + ' V' + (ly - RIB.note - 3) +
        (Math.abs(lx - tx) > 1 ? ' H' + lx : ''),
      fill:'none', stroke:'#4E7C7A', 'stroke-width':'1', 'pointer-events':'none' }));
    var lab = svg('text', { x:lx, y:ly, 'pointer-events':'none',
      fill:'#9FB3B1', 'font-size':String(RIB.note), 'text-anchor':anchor });
    lab.textContent = text;
    g.appendChild(lab);
    if (when){
      var w2 = svg('text', { x:lx, y:ly + RIB.note + 2, 'pointer-events':'none',
        fill: rph ? (rph.rising ? '#7BD5D9' : '#9BD98C') : '#7BD5D9',
        'font-size':String(RIB.note), 'text-anchor':anchor });
      w2.textContent = (rph ? (rph.rising ? '\u2191 rising \u00b7 ' : '\u2193 falling \u00b7 ') : '') + when;
      g.appendChild(w2);
      var tt = state.tides[river.id];
      if (tt && tt.at && !RIB.narrow){
        var w3 = svg('text', { x:lx, y:ly + (RIB.note + 2) * 2, 'pointer-events':'none',
          fill:'#6E8785', 'font-size':String(RIB.note), 'text-anchor':anchor });
        w3.textContent = 'predicted ' + clockLocal(tt.at);
        g.appendChild(w3);
      }
    }
  }

  if (showName){
    /* CYAN, LIKE EVERY OTHER THING IN THIS APP YOU CAN PRESS, and with a
       chevron after it. A row that opens a river and looks exactly like a
       label is a row nobody presses. */
    var rn = svg('text', { x:6, y:y+4, fill:'#7BD5D9', 'font-size':String(RIB.name),
      'font-weight':'600', 'pointer-events':'none' });
    rn.textContent = river.short + ' \u203a';
    g.appendChild(rn);
  }

  /* HOW LONG THIS BAR ACTUALLY IS.

     Bars of equal width covering different distances is the exact defect the
     shared scale was introduced to fix, and it was a real one — the only thing
     that made it a lie was that nothing said what each bar covered. It says so
     now, on the row, in kilometres. The number is the comparison; the bar is
     the layout of the gauges along this river.

     Under the name rather than at the end of the bar: the end of the bar is
     where the tide mark and its caption already are, and this is a property of
     the row, not of its right-hand edge. */
  if (showName && span && isNum(span.metres) && span.metres > 0){
    var kmTxt = svg('text', { x:6, y:y + 4 + RIB.name + 2, fill:'#6E8785',
      'font-size':String(Math.max(8, RIB.note)), 'pointer-events':'none' });
    kmTxt.textContent = (span.metres >= 10000
      ? Math.round(span.metres / 1000)
      : (span.metres / 1000).toFixed(1)) + ' km';
    g.appendChild(kmTxt);
  }

  /* Gauges bunch up — three of them sit within a few miles on the lower
     river — so the figures stagger rather than print on top of each
     other. Sorted first so "the one before me" means the one to my left. */
  pts.sort(function(a, b){ return axisValue(river, a) - axisValue(river, b); });
  /* Two bands, above the channel and below it, each remembering where it
     last printed. A figure that fits in neither is not printed at all —
     stacked digits are less use than none, and the reading is on the dot. */
  var lastAt = { hi:-1e9, lo:-1e9 }, gap = RIB.fig * 2.4;
  pts.forEach(function(r){
    var f = isNum(r.tempF) ? r.tempF : null;
    var x = sx(axisValue(river, r));
    var band = (x - lastAt.hi >= gap) ? 'hi'
             : ((x - lastAt.lo >= gap) ? 'lo' : null);
    var high = band === 'hi';
    var c = svg('circle', { cx:x, cy:y, r:RIB.dot, fill:tempColour(f),
      stroke:'#0A1214', 'stroke-width':'1.5' });
    var ttl = svg('title');
    ttl.textContent = (r.name || r.id) + (f === null ? ' — no temperature'
      : ' — ' + fmt(f,1) + 'F');
    c.appendChild(ttl);
    /* The dot keeps its pointer events so the tooltip still works, so it has
       to carry the same action or it would be a hole in the row. */
    g.appendChild(c);
    if (band){
      lastAt[band] = x;
      var t = svg('text', { x:x, y: high ? y - (RIB.dot + 5) : y + (RIB.dot + 13),
        fill:'#E6F0EF', 'font-size':String(RIB.fig), 'pointer-events':'none',
        'text-anchor':'middle', 'font-family':'Georgia,serif', 'font-style':'italic' });
      t.textContent = f === null ? '—' : fmt(f,0);
      g.appendChild(t);
    }
  });
  return pts.length;
}

function tempScale(g, x, y, w, tidal){
  var id = 'tempscale';
  var defs = svg('defs', {});
  var lg = svg('linearGradient', { id:id, x1:'0', x2:'1', y1:'0', y2:'0' });
  TEMP_STOPS.forEach(function(s){
    lg.appendChild(svg('stop', {
      offset: ((s[0]-TEMP_MIN)/(TEMP_MAX-TEMP_MIN)*100) + '%', 'stop-color':s[1] }));
  });
  defs.appendChild(lg); g.appendChild(defs);
  g.appendChild(svg('rect', { x:x, y:y, width:w, height:8, fill:'url(#'+id+')',
    stroke:'#1F5B57' }));
  [[TEMP_MIN, x, 'start'], [TEMP_MAX, x+w, 'end']].forEach(function(p){
    var t = svg('text', { x:p[1], y:y+19, fill:'#9FB3B1', 'font-size':'9',
      'text-anchor':p[2] });
    t.textContent = p[0] + 'F';
    g.appendChild(t);
  });

  /* THE OTHER THING THIS DRAWING ENCODES, AND ITS KEY WAS NEVER ON SCREEN.
     Part of each tidal river's bar is washed in cyan and a reader had nothing
     to look that up in — so it read as decoration, or as the bar simply being
     a gradient. There WAS a swatch for it. It was drawn 26px below a ramp
     that already sits 26px above the bottom edge, which put it exactly on the
     boundary of the viewBox, outside the drawing, on every screen since it
     was written. **A key that is clipped is a key that does not exist**, and
     it is worse than none, because its presence in the source answers "have
     we explained this" for everybody afterwards.
     It is drawn ABOVE the ramp now, inside the box, and it carries the same
     dashed rule the bar does so the two are recognisably the same mark. */
  if (!tidal) return;
  var ty = y - 14, tw = Math.min(w, 54);
  var tid = 'tidekey';
  var tg = svg('linearGradient', { id:tid, x1:'0', x2:'1', y1:'0', y2:'0' });
  tg.appendChild(svg('stop', { offset:'0',   'stop-color':'#7BD5D9', 'stop-opacity':'.62' }));
  tg.appendChild(svg('stop', { offset:'.8', 'stop-color':'#7BD5D9', 'stop-opacity':'.58' }));
  tg.appendChild(svg('stop', { offset:'1',   'stop-color':'#7BD5D9', 'stop-opacity':'.2' }));
  defs.appendChild(tg);
  g.appendChild(svg('rect', { x:x, y:ty, width:tw, height:8,
    fill:'url(#'+tid+')', stroke:'#1F5B57' }));
  g.appendChild(svg('line', { x1:x + tw, x2:x + tw, y1:ty - 3, y2:ty + 11,
    stroke:'#7BD5D9', 'stroke-width':'1.5', 'stroke-dasharray':'3 2',
    'stroke-linecap':'round' }));
  /* The same arrow the bars carry, or the key is describing a different mark. */
  g.appendChild(svg('path', {
    d:'M' + (x + tw - 10) + ' ' + (ty + 1) + ' L' + (x + tw - 3) + ' ' + (ty + 4) +
      ' L' + (x + tw - 10) + ' ' + (ty + 7) + ' Z', fill:'#7BD5D9' }));
  /* SHORT ENOUGH TO FIT INSIDE THE RAMP'S OWN WIDTH. The first wording ran
     past the right-hand edge and came out as "to the dashed m", which is the
     same defect as the clipped swatch one line up — the drawing does not
     scroll, so anything wider than it is simply lost. The dashed rule on the
     swatch is the same mark that stands on the bars, so it does the pointing
     and the words do not have to. */
  var tl = svg('text', { x:x + tw + 8, y:ty + 7, fill:'#9FB3B1', 'font-size':'9' });
  /* The arrow on the swatch says which way; the words do not have to, and
     the ones that tried ran off the right-hand edge — which the bounding-box
     check caught, being exactly what it is for. */
  tl.textContent = 'tidal reach';
  g.appendChild(tl);
}

/* PRESSING A RIVER OPENS IT.

   Four rivers across the top of the landing page, the most prominent thing on
   the screen, and pressing one did nothing — the ways in were a select menu in
   the header and a card further down. A row plainly ABOUT a river that does
   nothing when pressed is the pin-too-small defect wearing a different coat:
   the reader tries it, nothing happens, and they file the whole strip under
   decoration.

   These are HTML buttons positioned over the drawing, not shapes inside it.
   The first version put a focusable rect in the SVG and it was wrong for a
   reason worth writing down: the drawing is `role="img"` with a written
   description, and a role="img" PRUNES ITS SUBTREE from the accessibility
   tree. A control inside it is unreachable to a screen reader no matter how
   correctly it is marked up — present, correct, and invisible, which is this
   project's most familiar shape of defect.

   The row is 52px on a desktop and 44 on a phone. On a very short screen the
   ribbon shrinks its rows and these shrink with them, which is deliberate
   rather than overlooked: the cards under "Which river" are the full-sized
   route and are always there. */
function riverHits(list, host, x0, top, rowH){
  var wrap = document.getElementById('ribbonwrap');
  var old = document.getElementById('riverhits');
  if (old) old.parentNode.removeChild(old);
  /* Nothing to choose between when the ribbon is showing one river. */
  if (!wrap || list.length < 2) return;

  /* AN SVG ELEMENT HAS NO offsetTop. `offsetTop` and `offsetLeft` are
     HTMLElement properties; on an SVG they are undefined, so the first version
     set the overlay's position to the string "undefinedpx", the browser
     discarded it, and four full-width buttons came to rest three hundred
     pixels down the page on top of the map. Three of the four still opened a
     river when driven by their own bounding box, which is why this had to be
     measured rather than looked at. Rectangles, then. */
  var hr = host.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  /* An absolutely positioned child is placed against the padding box of its
     containing block, and it scrolls with the content, so the offset wanted is
     a content-space one. */
  var offTop  = hr.top  - wr.top  - wrap.clientTop  + wrap.scrollTop;
  var offLeft = hr.left - wr.left - wrap.clientLeft + wrap.scrollLeft;
  /* The drawing is authored at 1:1, but CSS gives it width:100% and a
     min-width, so a container narrower than that renders it at another size.
     Take the scale off the rendered box rather than assuming it. */
  var drawnH = parseFloat(host.getAttribute('height')) || hr.height;
  var scale = hr.height / drawnH;

  var box = document.createElement('div');
  box.id = 'riverhits';
  box.style.top = offTop + 'px';
  box.style.left = offLeft + 'px';
  box.style.width = hr.width + 'px';
  box.style.height = hr.height + 'px';

  list.forEach(function(river, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'riverhit';
    b.style.top = Math.round((top + i * rowH - rowH / 2) * scale) + 'px';
    b.style.height = Math.round(rowH * scale) + 'px';
    /* The name is drawn in the picture, which the reader can see and a screen
       reader cannot, so the button carries its own. */
    b.appendChild(el('span', { class:'vh', text:'Open the ' + river.name }));
    b.addEventListener('click', function(){
      var sel = document.getElementById('riverpick');
      if (sel) sel.value = river.id;
      selectRiver(river.id);
      announce('Opened the ' + river.name + '.');
    });
    box.appendChild(b);
  });
  wrap.appendChild(box);
}

/* ONE DRAWING, TWO HOSTS.

   The sideways view needs the same bars at a different size, and the one thing
   it must not be is a second copy of this function — a second formulation of
   one picture is how the two come to disagree about which river is which, and
   this session has already written that lesson twice. So `opts.host` swaps the
   canvas and everything that belongs to the BAND rather than to the drawing —
   the height budget, the note underneath, the row-press overlay, the
   corrective pass — is skipped for it.

   The overlay is skipped rather than ported on purpose: it positions itself by
   comparing bounding rectangles, and inside a rotated container those describe
   the screen rather than the picture. Hit-testing through a transform is a
   trap, and the sideways view is for reading; pressing a river is what the
   normal band is for, and it is one press away. */
function drawRibbon(again, opts){
  opts = opts || {};
  var sideways = !!opts.host;
  var host = opts.host || $('#ribbon');
  /* Keep the title and desc; they are the accessible name of the figure. */
  Array.prototype.slice.call(host.childNodes).forEach(function(n){
    if (n.nodeName !== 'title' && n.nodeName !== 'desc') host.removeChild(n);
  });

  /* Draw at the width the ribbon is actually rendered at, so the scale is
     1 and an 11px figure is 11 pixels. A fixed 1000-unit viewBox squeezed
     into a phone made the figures unreadable and left the difference as
     dead space above and below them. */
  /* Under the breakpoint the ribbon fits the screen rather than scrolling:
     the right-hand end is upstream, and a view you have to drag sideways to
     finish reading is one nobody finishes reading. */
  var narrow = window.matchMedia && window.matchMedia('(max-width:900px)').matches;
  /* MEASURE THE REAL BOX, NOT A HIDDEN ONE. Everything below is arithmetic on
     what this band actually occupies, and a hidden wrapper reports zero for
     all of it: clientWidth falls to the 360 fallback, the note measures 0, and
     the draw that follows is computed from numbers describing nothing. That is
     the state this function is MOST often entered in, because the previous
     draw is what hid it. Unhiding first costs nothing — no paint happens
     between here and the end of this function — and it is the difference
     between measuring the page and measuring its absence. */
  var wasHidden = document.getElementById('ribbonwrap').hidden;
  if (!sideways && wasHidden) document.getElementById('ribbonwrap').hidden = false;
  var W = sideways ? opts.W
        : narrow ? Math.max(host.clientWidth || 360, 300)
                 : Math.max(host.clientWidth || 1000, 520);
  var list = state.riverId ? [byId(state.riverId)] : RIVERS;
  /* Under the breakpoint the ribbon and the readings share one screen, so
     the ribbon takes a share of it rather than whatever it wants. Above it
     they are side by side and there is nothing to take it from.
     The budget is for the BAND, not the drawing: the legend, the note and
     the padding are two thirds of the height on a short screen, and a
     budget that only bounds the SVG bounds the wrong thing. */
  var wrapEl = document.getElementById('ribbonwrap');
  var budget = null;
  /* THE BUDGET IS ABOUT HEIGHT AND WAS KEYED ON WIDTH.

     `narrow` means "the map is not beside the rail", which is a fact about
     width — and it was standing in for "the ribbon and the readings share one
     screen", which is a fact about HEIGHT. A phone held sideways is 932px
     wide and 267px tall: wide enough to escape the budget entirely, and short
     enough that the band then drew 300px of ribbon into a 267px viewport and
     left the readings nothing at all. Measured, not reasoned about.

     So a short viewport gets the budget whatever its width. 620px is about
     where a laptop window stops being able to give a third of itself away
     without the readings under it disappearing. */
  var shortView = (window.innerHeight || 800) < 620;
  /* The sideways view is told the box it has and shrinks into it the same way
     the upright band does — the floor still applies, so it scrolls rather than
     going illegible if even this is not enough. */
  if (sideways && isNum(opts.budget)) budget = opts.budget;
  else if (!sideways && (narrow || shortView)){
    var cs = window.getComputedStyle(wrapEl);
    var extra = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    Array.prototype.forEach.call(wrapEl.children, function(c){
      if (c === host) return;
      /* AN ABSOLUTELY POSITIONED CHILD TAKES NO SPACE IN FLOW, and counting
         one as furniture is how this budget ate itself.

         The tappable river rows are HTML buttons laid over the drawing inside
         this same wrapper — `#riverhits`, position:absolute, exactly as tall
         as the ribbon it covers. It was being added to `extra` as though it
         pushed the ribbon down the page. It does not: it IS the ribbon,
         drawn over itself. So every redraw subtracted the previous draw's own
         height from the space available for the next one, and on a 390x664
         phone the budget reached MINUS 26 before a single row was measured.

         Then it latched. Below the floor the draw returns early — before the
         line that removes the stale overlay — so the overlay stayed, the
         budget stayed negative, and the ribbon could never come back. Home
         had no ribbon at all, on every geometry, and the note underneath
         explained it as five rows not fitting on a short screen.

         Height is not the test; participation in flow is. */
      var st = window.getComputedStyle(c);
      if (st.position === 'absolute' || st.position === 'fixed') return;
      /* MARGINS ARE PART OF WHAT A THING TAKES UP, and a bounding rect does
         not include them. The note under the ribbon is a <p> carrying the
         browser's default vertical margins — twenty-two pixels the budget
         could not see, so every draw believed it had twenty-two more than it
         did and the band came out over its share of the screen. Margins can
         collapse between siblings, so summing both sides can over-count by a
         few pixels; that errs toward a smaller ribbon, which is the safe
         direction, and the corrective pass re-measures either way. */
      extra += c.getBoundingClientRect().height +
               (parseFloat(st.marginTop) || 0) + (parseFloat(st.marginBottom) || 0);
    });
    /* `again` is the retry marker as well as the overshoot. Any value at all
       means "this is a corrective pass, do not start another one"; only a
       positive one subtracts. The redraw that restores a good first pass
       passes 0, which is a retry that takes nothing away — and without that
       distinction it re-entered the branch below and recursed. */
    budget = Math.round((window.innerHeight || 800) * 0.32) - extra
             - (isNum(again) && again > 0 ? again : 0);
  }
  /* ONE SCALE FOR ALL FOUR, measured before anything is drawn. Every bar used
     to be stretched to the same width whatever distance it covered, which is
     the one thing four stacked bars must not do: the reason they are stacked
     is to be compared, and equal bars say the four rivers are equal lengths.
     Measured first because the foot depends on whether any of them is tidal. */
  var spans = list.map(function(river){
    return ribbonSpan(river, ((state.gauges[river.id] || {}).rows) || []);
  });
  var maxM = 0, anyTidal = false;
  spans.forEach(function(sp){
    if (!sp) return;
    if (sp.metres > maxM) maxM = sp.metres;
    if (sp.edge) anyTidal = true;
  });
  ribbonMetrics(W, list.length, budget, anyTidal);
  var wrap = document.getElementById('ribbonwrap');

  /* A COMPROMISED COMPARISON IS NOT A COMPARISON.

     The stacked band exists for one thing the river cards cannot do: the water
     temperature ALONG each river, on one scale, all of them at once. Reading
     that needs them together and at a size worth reading — so a band scrolled
     to two rows at a time defeats the only job it has, and so does one squeezed
     until the dots touch. A glance at something illegible is not a glance.

     So on the landing view it is all of them or none of them. Where they do
     not fit, the band gives way to an offer that says what is behind it and
     opens the sideways view, where the same picture gets the long side of the
     screen at full row height. The readings get their third of the screen back
     in the meantime.

     KEYED ON WHETHER IT FITS, NOT ON WHETHER THIS IS A PHONE. A tall phone in
     portrait may hold five rows honestly and a short one will not, and the
     app already measures which. Reaching for a device rule here is what put
     the height budget on a width test earlier today. */
  var replaced = !sideways && list.length > 1 && (RIB.scrolls || RIB.tooTight);
  if (!sideways) wrap.hidden = !!RIB.tooTight || replaced;
  if (!sideways && (RIB.tooTight || replaced)){
    /* AND THE OVERLAY GOES WITH IT. Returning here without clearing it leaves
       buttons for rows that are no longer drawn — invisible inside a hidden
       wrapper, and, before the fix above, the very thing that kept the budget
       negative on every subsequent draw. A view that drops itself has to drop
       its controls too. */
    var stale = document.getElementById('riverhits');
    if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
    /* AND IT SAYS SO. A view that vanishes without a word is
       indistinguishable from one that failed to load. */
    syncRibbonDropNote();
    syncSidewaysOffer();
    return;
  }
  if (!sideways){ wrap.hidden = false; syncRibbonDropNote(); syncSidewaysOffer(); }
  var rowH = RIB.rowH, top = RIB.top;
  var H = top + list.length * rowH + RIB.foot;
  host.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  host.setAttribute('height', H);
  host.setAttribute('width', W);

  /* AND THE BAND EITHER FITS OR SCROLLS. Capped at its share of the screen
     with the drawing at full height inside it, so every river is present and
     the ones past the fold are reached rather than lost. `contain` stops a
     flick that runs off the end of this band from carrying on into the page,
     which is the trap nested scrolling always sets on touch. */
  if (!sideways && RIB.scrolls && isNum(RIB.budget)){
    wrap.style.maxHeight = Math.max(0, RIB.budget) + 'px';
    wrap.style.overflowY = 'auto';
    wrap.style.overscrollBehavior = 'contain';
    wrap.setAttribute('aria-label',
      'River ribbon, ' + list.length + ' rivers, scrollable');
    /* AND IT HAS TO LOOK SCROLLABLE, not merely be announced as one. The
       aria-label above told everything except the eye. */
    wrap.classList.add('scrolls');
    markRibbonScrollEnd();
  } else if (!sideways){
    wrap.style.maxHeight = '';
    wrap.style.overflowY = '';
    wrap.style.overscrollBehavior = '';
    wrap.setAttribute('aria-label', 'River ribbon');
    wrap.classList.remove('scrolls', 'atend');
  }
  var g = svg('g', {});
  var plotted = 0, missing = 0;

  /* Room for the longest river name at the weight it is drawn in. At 74 the
     bold "Sacramento" ended a few pixels INSIDE the left cap of its own bar. */
  var x0 = list.length > 1 ? (RIB.narrow ? 86 : 96) : 30;
  var full = (W - 20) - x0;

  list.forEach(function(river, i){
    var payload = state.gauges[river.id];
    var rows = (payload && payload.rows) || [];
    var onRiver = rows.filter(function(r){ return !r.context; });
    var sp = spans[i];
    /* EVERY BAR GETS THE WHOLE WIDTH, AND EVERY BAR SAYS HOW LONG IT IS.

       These were drawn to ONE distance scale, which was itself a fix: before
       that they were all stretched to the same width whatever they covered,
       and four equal bars said four equal rivers. The shared scale told the
       truth and cost too much for it. Measured off the baked centrelines, the
       Sacramento is 359 km across its axis and the American is 30 — so the
       American came out at EIGHT PER CENT of the longest bar, a stub with its
       gauges piled on top of each other, and the Feather and the Mokelumne at
       about a fifth. The one river that fits is the one nobody needed help
       reading.

       The thing that made equal bars a lie was that nothing said what they
       covered. So each bar is given the full width AND its own length in
       kilometres, printed on the row: the comparison of length moves from the
       drawing, where it was crushing four rivers to flatter one, into a number
       that states it exactly. What the bar is for is where the gauges sit
       along THIS river, and that is the thing a shared scale was destroying. */
    var x1 = x0 + full;
    var n = ribbonRow(g, river, rows, x0, x1, top + i * rowH, list.length > 1, sp, W, list.length);
    plotted += n;
    missing += onRiver.length - n;
  });
  /* Bottom left on a phone, bottom right where there is room. Off the
     right-hand edge it was simply invisible, and it is the key to every
     colour above it. */
  tempScale(g, RIB.narrow ? 6 : W - 190, H - (RIB.narrow ? 20 : 26),
            RIB.narrow ? 104 : 170, anyTidal);
  host.appendChild(g);
  if (!sideways) riverHits(list, host, x0, top, rowH);
  if (sideways) return;

  /* THE SHORT NOTE HAS TO CARRY THE SCALE TOO. Bars of visibly different
     lengths with nothing saying why is the same defect as the wash with no
     key: the phone reader is the one who most needs telling, and was the one
     told least. */
  /* AND IT SAYS THE ROWS CAN BE PRESSED. A control nobody knows about is the
     same as no control, and a row that opens a river looks like a chart. */
  var tapHint = state.riverId ? '' : (RIB.narrow ? 'Tap a river to open it. '
                                                 : 'Press a river to open it. ');
  /* THE NOTE HAS TO SAY THE SCALES DIFFER, and it is the whole reason giving
     each bar its own is allowed. Bars of one width covering different
     distances is a lie exactly as long as nothing says what they cover — so
     the length is on every row, and this says out loud that the widths are no
     longer comparable. Saying it is not a footnote on the change; it IS the
     change. */
  var note = RIB.narrow
    ? tapHint + 'Downstream left' +
      (state.riverId ? '' : '; each river to its own scale, length on each row') +
      '. ' + plotted + ' gauge' + (plotted === 1 ? '' : 's') + ' plotted'
    : tapHint + 'Downstream on the left; ' +
      (state.riverId ? byId(state.riverId).axisLabel
                     : 'each river drawn to its OWN scale so its gauges can be read — ' +
                       'the bars are not comparable lengths, and each row says how many ' +
                       'kilometres it covers — with one temperature scale across them all') + '. ' +
      plotted + ' gauge' + (plotted === 1 ? '' : 's') + ' plotted';
  if (missing) note += RIB.narrow ? ', ' + missing + ' not' : ', ' + missing + ' not plotted (no position or no data)';
  /* AND IT SAYS THERE IS MORE BELOW, with the count, because a fade is a hint
     and a number is an instruction. How many are out of sight is worked out
     from the band's own box rather than assumed: the drawing knows its row
     height and the wrapper knows how much of it is showing. */
  note += '.';
  if (RIB.scrolls && isNum(RIB.budget) && rowH > 0){
    var shown = Math.max(1, Math.floor((RIB.budget - RIB.top) / rowH));
    var below = Math.max(0, list.length - shown);
    if (below > 0)
      note += ' ' + (RIB.narrow ? 'Scroll for ' + below + ' more.'
                                : 'Scroll the band for the other ' + below + '.');
  }
  $('#ribbonnote').textContent = note;

  /* And then check. The legend and the note are measured at the size they
     had BEFORE this draw, so the first pass can still overshoot; one
     corrective pass with the measured overshoot subtracted converges,
     and a guard stops it becoming a loop. Raising a number until it looks
     better is not debugging — reading what the browser actually did is. */
  if (narrow && again === undefined){
    var over = Math.round(wrapEl.getBoundingClientRect().height) -
               Math.round((window.innerHeight || 800) * 0.32);
    if (over > 2){
      /* THE RETRY RE-MEASURES; IT DOES NOT COMPENSATE.

         `extra` is the furniture around the drawing, and it is measured at the
         TOP of this function — which means it is the PREVIOUS draw's note,
         not the one about to be written. The note is a sentence whose length
         depends on how many gauges plotted, so its line count changes between
         a cold open and a loaded one: measured at three lines, redrawn at two,
         and the budget was 22px wrong in a direction nobody had accounted for.

         The old retry subtracted the whole measured overshoot from the budget.
         That is a correction for a number that is already about to be
         re-measured, so it took the error off twice: with five rows it landed
         under the legibility floor and the band was dropped entirely. Passing
         0 re-runs the arithmetic against furniture that is now correct, which
         is all that was ever needed — and lands inside the budget rather than
         18px over it.

         The guard stays as a backstop. A corrective pass may shrink this view
         and may not delete it: overshooting a guideline is a smaller failure
         than dropping the comparison the landing page exists to show. */
      var keep = RIB, keptBox = host.getAttribute('viewBox');
      drawRibbon(0);
      if (RIB.tooTight && !keep.tooTight){
        RIB = keep;
        if (keptBox) host.setAttribute('viewBox', keptBox);
        drawRibbon(-1);
      }
    }
  }
  /* THE RIBBON IS A role="img" AND ITS SUBTREE IS PRUNED, so the rising or
     falling drawn on the bar reaches nobody who cannot see it. It goes in the
     description in words, for the one river a description can speak for. */
  var descTide = '';
  if (state.riverId){
    var rv = byId(state.riverId);
    if (rv && rv.tidal){
      var pd = tidePhase(rv);
      if (pd) descTide = ' The tide is ' + (pd.rising ? 'rising' : 'falling') +
        ', ' + (pd.rising ? 'high' : 'low') + ' water in ' +
        Math.max(0, pd.minutes) + ' minutes at the station being read.';
    }
  }
  $('#ribbondesc').textContent = note + '.' + descTide + ' Readings are listed in the Water panel.';
}

function byId(id){
  for (var i = 0; i < RIVERS.length; i++) if (RIVERS[i].id === id) return RIVERS[i];
  return null;
}

/* =====================================================================
   Map
   ===================================================================== */
var BASEMAPS = [
  { id:'imagery', label:'Esri imagery',
    url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr:'Imagery: Esri, Maxar, Earthstar Geographics' },
  { id:'topo', label:'Esri topo',
    url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    attr:'Topography: Esri' },
  { id:'dark', label:'CARTO dark',
    url:'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    attr:'&copy; OpenStreetMap contributors, &copy; CARTO' }
];
var NOAA_CHART = {
  url:'https://tileservice.charts.noaa.gov/tiles/50000_1/{z}/{x}/{y}.png',
  attr:'Charts: NOAA Office of Coast Survey',
  /* Chart coverage of these waters ends upstream of about Verona. Drawn as
     a band rather than a line because the exact end was not confirmed. */
  limitBand: [[38.74,-121.75],[38.82,-121.45]],
  limitStatus: PROV.UNCONFIRMED
};

var reduceMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Every label on the map is a popup rather than a tooltip.
 *
 * A tooltip is drawn beside its marker and left there. It is not panned
 * into view and it is not flipped, so a marker near an edge — which on a
 * phone, where the map is half a screen tall, is most of them — puts its
 * label partly or wholly outside the map frame, where the container's
 * overflow cuts it off. Tapping a pin then appears to do nothing at all.
 *
 * A popup pans the map until the whole label fits. The padding keeps it
 * clear of the zoom control at the top left and the legend and
 * attribution along the bottom. keepInView holds it there if the map is
 * moved underneath it afterwards.
 */
var LABEL = {
  autoPan: true,
  autoPanPaddingTopLeft: L.point(52, 20),
  autoPanPaddingBottomRight: L.point(20, 46),
  keepInView: true,
  closeButton: true,
  autoClose: true,
  className: 'thw-label'
};

function labelNode(name, values, sub){
  var box = el('div', {});
  box.appendChild(el('span', { class:'pop-name', text:name }));
  if (values && values.length){
    var row = el('div', { class:'pop-vals' });
    values.forEach(function(v){
      var span = el('span', { class:'v' });
      span.appendChild(document.createTextNode(v[0]));
      span.appendChild(el('small', { text:v[1] }));
      if (v[2]) span.style.color = v[2];
      row.appendChild(span);
    });
    box.appendChild(row);
  }
  if (sub) box.appendChild(el('span', { class:'pop-sub', text:sub }));
  return box;
}

/* A VIEW COMPUTED AGAINST A ZERO-SIZE MAP IS THE WHOLE WORLD.
 *
 * On a phone the map lives in a tab, so for most of the app's life its
 * container is display:none and measures 0 by 0. Ask Leaflet to fit bounds in
 * that state and it does exactly what it is told — it finds the zoom at which
 * those bounds fit into nothing, which is zoom 0, and the reader who opens the
 * Map tab is looking at the Pacific from orbit. Reported from a real phone,
 * and reproducible: on All rivers the map genuinely sits at zoom 0.
 *
 * So no view is ever computed while the container has no size. It is held, and
 * applied the moment the map is real. Everything that moves the map goes
 * through here.
 */
/* WHERE THE MAP IS LOOKING BELONGS TO THE READER, AND THE LAST WORD IS THEIRS.
   Pressing "Profile down the river itself" starts a fetch. On a slow signal
   that fetch lands seconds later, and when it did it fitted the map to the
   whole surveyed run — over the top of wherever the reader had gone in the
   meantime. Press it, then press "Back to me", and the map arrived at you and
   was then dragged away again to a stretch of river fifty miles off, with
   nothing on screen explaining why.

   A CLAIM, NOT A CLOCK. A time window would have to guess how slow the signal
   is. This counts instead: every view the reader asks for takes the next
   number, and a background task that captured an older one has been overruled
   and says nothing. */
function claimView(){
  state.viewClaim = (state.viewClaim || 0) + 1;
  return state.viewClaim;
}

/* AN ANIMATION IS FOR A MOVE THE EYE CAN FOLLOW, AND NOTHING ELSE.

   Leaflet refuses to animate a pan longer than the window — its own source
   says Chrome loses the tiles and puts the map in the wrong place — but that
   guard is switched off by asking for `animate: true`, which is exactly what
   every call here did. So "Back to me", pressed after panning off to look at a
   surveyed reach, asked for a smooth pan of some hundreds of thousands of
   pixels in a quarter of a second. The map did not arrive. It did not fail
   either: it sat where it was, having been told to go, and the button read as
   dead.

   A move that starts off screen is a JUMP, and it always was — a
   quarter-second smear across fifty miles shows the reader nothing they could
   have followed. Animation is kept for the small moves it was meant for. */
function viewIsNear(to){
  var b = state.map.getBounds();
  if (to && typeof to.getNorth === 'function') return b.contains(to);
  return b.contains(L.latLng(to[0]));
}

function mapView(to, opts, claim){
  if (!state.map) return;
  if (claim == null) claim = claimView();
  else if (claim !== state.viewClaim) return;   /* the reader has moved on */
  var sz = state.map.getSize();
  if (!sz.x || !sz.y){ state.pendingView = { to:to, opts:opts }; return; }
  state.pendingView = null;
  /* AN OPEN POPUP TETHERS THE MAP TO WHERE IT IS ANCHORED. Leaflet re-pans to
     keep a popup in view whenever the view resets, so pressing a pin and then
     "Back to me" arrived at you and was hauled straight back to the pin — the
     button looked broken, and the reason was a label two hundred miles away
     insisting on staying visible. A popup describes the place you are leaving,
     so leaving closes it. */
  state.map.closePopup();
  if (opts && opts.animate && !viewIsNear(to)){
    opts = Object.keys(opts).reduce(function(o, k){ o[k] = opts[k]; return o; }, {});
    opts.animate = false;
  }
  if (to && typeof to.getNorth === 'function') state.map.fitBounds(to, opts);
  else state.map.setView(to[0], to[1], opts);
}

/* Called whenever the map becomes visible or changes size. */
function mapBecameVisible(){
  if (!state.map) return;
  state.map.invalidateSize();
  var p = state.pendingView;
  if (p){ state.pendingView = null; mapView(p.to, p.opts); }
  drawMarks();
}

function initMap(){
  var m = L.map('map', {
    zoomControl: true,
    fadeAnimation: !reduceMotion,
    zoomAnimation: !reduceMotion,
    markerZoomAnimation: !reduceMotion,
    keyboard: true,
    attributionControl: true
  });
  state.map = m;

  /* A MAP MUST HAVE A VIEW BEFORE ANYTHING ELSE TOUCHES IT. Leaflet throws
     "Set map center and zoom first" the moment something asks for a centre or
     bounds, and holding the real view until the container has a size left
     exactly that gap. This opening view is derived rather than invented: the
     middle of the four declared rivers, at the most zoomed-out of their own
     declared zooms. It is replaced the instant the map is on screen. */
  var u = RIVERS.reduce(function(acc, r){
    return [Math.min(acc[0],r.bbox[0]), Math.min(acc[1],r.bbox[1]),
            Math.max(acc[2],r.bbox[2]), Math.max(acc[3],r.bbox[3])];
  }, [180,90,-180,-90]);
  m.setView([(u[1]+u[3])/2, (u[0]+u[2])/2],
            Math.min.apply(null, RIVERS.map(function(r){ return r.zoom; })));

  setBasemap(sget('_shared','basemap') || 'imagery');

  /* A PANE, NOT AN ADD ORDER. A tide station sits on top of the gauge at the
     same place — Rio Vista has both — and whichever is drawn last swallows the
     tap. Adding the layer group first is not enough: every vector shares one
     pane, and this layer is REDRAWN whenever the tide changes, so its paths
     land after the gauges' again on the next refresh. A pane with its own
     z-index is the only version of this that stays true.
     A station is context and a gauge is a reading, so the reading wins the tap. */
  m.createPane('tidepane');
  m.getPane('tidepane').style.zIndex = 380;   /* overlayPane is 400 */
  state.tideLayer = L.layerGroup().addTo(m);

  /* Where you are. Its own pane, between the stations and the readings: a
     station is context and you are more specific than that, but a gauge is a
     measurement and the rule above says the reading wins the tap. The accuracy
     ring is drawn non-interactive as well, so a fix good to two kilometres
     cannot cover half the reach and swallow every pin under it. */
  /* Under everything: the survey footprints are context for the readings, not
     a thing to tap, and they must never take a press meant for a pin. */
  m.createPane('surveypane');
  m.getPane('surveypane').style.zIndex = 370;
  state.surveyLayer = L.layerGroup().addTo(m);

  /* Above the survey outlines and below the tide stations: a place you can
     stand is worth tapping, and a reading still wins over it. */
  m.createPane('accesspane');
  m.getPane('accesspane').style.zIndex = 375;
  m.createPane('ramppane');
  m.getPane('ramppane').style.zIndex = 376;
  state.accessLayer = L.layerGroup().addTo(m);
  state.rampLayer = L.layerGroup().addTo(m);

  m.createPane('herepane');
  m.getPane('herepane').style.zIndex = 385;
  state.hereLayer = L.layerGroup().addTo(m);
  /* The profile line shares that pane: it is the reader's own drawing, like
     their position, and it must not take a tap from a gauge either. */
  state.profLayer = L.layerGroup().addTo(m);
  state.traceLayer = L.layerGroup().addTo(m);

  state.gaugeLayer = L.layerGroup().addTo(m);
  state.markLayer = L.layerGroup().addTo(m);
  state.soundingLayer = L.layerGroup().addTo(m);

  /* A tap used to drop a mark, silently, so exploring the map littered it.
     It reads the depth now and OFFERS to keep the point, which is the same
     one-tap route to a mark with the decision moved to the reader. Add at
     map centre in the Marks panel is still the pointerless way. */
  /* A CONTROL SITS ON THE MAP, SO A PRESS ON IT IS A PRESS ON THE MAP.
     disableClickPropagation holds for a mouse and does NOT hold for a finger —
     on a touch device the map's click is synthesised from the touch sequence
     and arrives anyway — so tapping the key's Hide button, or the locate
     button, dropped a depth query underneath it. Every desktop check passed;
     it took the phone geometry to see it.
     THE MARK IS TAKEN IN THE CAPTURE PHASE, and that is the whole trick. A
     control's own handler often rebuilds its contents — the key does, on the
     press that hides it — which DETACHES the element that was clicked, so by
     the time the map's handler runs, asking the target for its ancestors
     returns nothing and the press looks like it landed on open map. Capture
     runs before any of that, while the DOM is still the one the finger
     touched.
     One listener, at the map, so it cannot be forgotten when the next control
     is added. */
  m.getContainer().addEventListener('click', function(ev){
    var t = ev.target;
    ev.__onControl = !!(t && t.closest && t.closest('.leaflet-control'));
  }, true);

  m.on('click', function(e){
    if (e.originalEvent && e.originalEvent.__onControl) return;
    /* While a line is being drawn the map is answering a different question,
       and a depth popup opening over the second tap would be the app talking
       across the reader. */
    if (state.profArm) return profilePoint(e.latlng.lat, e.latlng.lng);
    /* A NEAR MISS ON A PIN IS A PRESS ON THAT PIN, NOT A QUESTION ABOUT THE
       WATER UNDER IT. This handler only runs when Leaflet found no layer to
       give the tap to — which is to say, only when the finger missed. */
    var pin = nearestPin(e.latlng);
    if (pin) return pin.openPopup();
    showDepthAt(e.latlng.lat, e.latlng.lng);
  });
  m.on('moveend', function(){
    if (state.soundingActive) refreshSoundings();
  });

  var legend = L.control({ position:'topright' });
  legend.onAdd = function(){
    var d = L.DomUtil.create('div', 'legend');
    d.id = 'maplegend';
    d.setAttribute('aria-live','polite');
    /* THE SAME DEFECT THE LOCATE CONTROL HAD, and it arrived the moment this
       stopped being a passive swatch and grew a Hide button: a control sits ON
       the map, so a press on it is also a press on the map, and a press on the
       map asks the survey how deep it is there. Every interactive control
       added to this map needs this line — the tests caught it here by seeing a
       depth popup open over a legend button. */
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  legend.addTo(m);
  hereControl(m);
  return m;
}

/* =====================================================================
   Where I am.

   THE POSITION NEVER LEAVES THE DEVICE. It is not stored between visits, it
   is not sent to the bathymetry proxy, and it is not sent to anyone else:
   the browser answers, the app draws a dot, and that is the whole path. The
   depth query is the one thing in this app that would send a coordinate
   anywhere, and it stays where it was — behind a tap you make yourself.
   ===================================================================== */
function hereControl(m){
  var ctl = L.control({ position:'bottomright' });
  ctl.onAdd = function(){
    var d = L.DomUtil.create('div', 'herectl');
    var b = el('button', { type:'button', id:'herebtn', text:'Where I am' });
    b.addEventListener('click', locateMe);
    d.appendChild(b);

    /* GETTING BACK. Reading a profile, checking a gauge upstream, looking at
       the mouth — every one of those moves the map away from where you were
       standing, and there was no way back except doing it again. This returns
       to your own position if the app has one, and otherwise to the nearest
       mark you kept, and it says which of the two it did rather than just
       moving the map. It is only offered when there is somewhere to go. */
    var back = el('button', { type:'button', id:'backbtn', hidden:'hidden',
      text:'Back to me' });
    back.addEventListener('click', goBackToMine);
    d.appendChild(back);
    /* A control sits ON the map, so a press on it is also a press on the map
       — and a press on the map asks the survey how deep it is there. Without
       this, the button would drop a depth reading at whatever is underneath
       it every time it was used. */
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  ctl.addTo(m);
}

function hereButton(label, busy){
  var b = document.getElementById('herebtn');
  if (!b) return;
  b.textContent = label;
  b.disabled = !!busy;
}

function locateMe(){
  /* Every one of these is a different thing to say. A single "could not get
     your location" would be true in all four cases and useful in none. */
  if (!navigator.geolocation){
    hereButton('Where I am');
    announce('This browser has no location service, so the app cannot ask where you are.');
    return;
  }
  if (!window.isSecureContext){
    hereButton('Where I am');
    announce('Locating needs a secure connection. This page was not loaded over https, so the browser will not answer.');
    return;
  }
  hereButton('Finding you…', true);
  announce('Asking your device where you are.');
  navigator.geolocation.getCurrentPosition(function(pos){
    state.here = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      /* Metres, 95% confidence. The browser is allowed to omit it, and some
         hand back zero, which is not a claim of perfect precision — it is the
         same absence spelt differently. Both become null here, because
         "good to about 0 m" would be the most confident lie in the app. */
      acc: (isNum(pos.coords.accuracy) && pos.coords.accuracy > 0) ? pos.coords.accuracy : null,
      at: Date.now()
    };
    hereButton('Where I am');
    drawHere(true);
  }, function(err){
    hereButton('Where I am');
    var code = err && err.code;
    announce(
      code === 1 ? 'Your browser refused: location is switched off for this site. It can be turned back on in the browser\u2019s settings for this page.' :
      code === 2 ? 'Your device could not get a fix. Indoors, or under a canopy, this is common \u2014 it is the device that failed, not the app.' :
      code === 3 ? 'No fix within twenty seconds. Trying again in the open usually works.' :
      'The browser would not say where you are: ' + (err && err.message || 'no reason given') + '.');
    logNet('geolocation', 'device', false, 'code ' + code);
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}

/* WHERE YOU WERE, WHICHEVER OF THE TWO IT IS. Your own position if the app has
   one — that is what "back to me" means to somebody standing on a bank — and
   otherwise the mark you kept nearest to what is on screen, because a reader
   who has never pressed Where I am still has somewhere they meant to be. */
function backTarget(){
  if (state.here) return { at:[state.here.lat, state.here.lon], what:'where you are', zoom:15 };
  var marks = state.marks || [];
  if (!marks.length) return null;
  var c = state.map.getCenter();
  var best = null;
  marks.forEach(function(m){
    if (!isNum(m.lat) || !isNum(m.lon)) return;
    var d = metresBetween(c.lat, c.lng, m.lat, m.lon);
    if (!best || d < best.d) best = { d:d, m:m };
  });
  if (!best) return null;
  var def = MARK_TYPES.filter(function(t){ return t.id === best.m.type; })[0];
  return { at:[best.m.lat, best.m.lon], zoom:15,
           what:'your ' + ((def && def.label.toLowerCase()) || 'mark') +
                (best.m.note ? ' — ' + best.m.note : '') };
}

function updateBackButton(){
  var b = document.getElementById('backbtn');
  if (!b) return;
  var t = backTarget();
  b.hidden = !t;
  if (t) b.textContent = state.here ? 'Back to me' : 'Back to my mark';
}

function goBackToMine(){
  var t = backTarget();
