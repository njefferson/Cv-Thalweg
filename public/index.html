 * overflow cuts it off. Tapping a pin then appears to do nothing at all.
 *
 * A popup pans the map until the whole label fits. The padding keeps it
 * clear of the zoom control at the top left and the legend and
 * attribution along the bottom. keepInView holds it there if the map is
 * moved underneath it afterwards.
 */
var LABEL = {
  autoPan: true,
  autoPanPaddingTopLeft: L.point(52, 20),
  autoPanPaddingBottomRight: L.point(20, 46),
  keepInView: true,
  closeButton: true,
  autoClose: true,
  className: 'thw-label'
};

function labelNode(name, values, sub){
  var box = el('div', {});
  box.appendChild(el('span', { class:'pop-name', text:name }));
  if (values && values.length){
    var row = el('div', { class:'pop-vals' });
    values.forEach(function(v){
      var span = el('span', { class:'v' });
      span.appendChild(document.createTextNode(v[0]));
      span.appendChild(el('small', { text:v[1] }));
      if (v[2]) span.style.color = v[2];
      row.appendChild(span);
    });
    box.appendChild(row);
  }
  if (sub) box.appendChild(el('span', { class:'pop-sub', text:sub }));
  return box;
}

function initMap(){
  var m = L.map('map', {
    zoomControl: true,
    fadeAnimation: !reduceMotion,
    zoomAnimation: !reduceMotion,
    markerZoomAnimation: !reduceMotion,
    keyboard: true,
    attributionControl: true
  });
  state.map = m;
  setBasemap(sget('_shared','basemap') || 'imagery');

  state.markLayer = L.layerGroup().addTo(m);
  state.gaugeLayer = L.layerGroup().addTo(m);
  state.soundingLayer = L.layerGroup().addTo(m);

  /* A tap used to drop a mark, silently, so exploring the map littered it.
     It reads the depth now and OFFERS to keep the point, which is the same
     one-tap route to a mark with the decision moved to the reader. Add at
     map centre in the Marks panel is still the pointerless way. */
  m.on('click', function(e){
    showDepthAt(e.latlng.lat, e.latlng.lng);
  });
  m.on('moveend', function(){
    if (state.soundingActive) refreshSoundings();
  });

  var legend = L.control({ position:'bottomleft' });
  legend.onAdd = function(){
    var d = L.DomUtil.create('div', 'legend');
    d.id = 'maplegend';
    d.setAttribute('aria-live','polite');
    return d;
  };
  legend.addTo(m);
  return m;
}

function setBasemap(id){
  var def = BASEMAPS.filter(function(b){ return b.id === id; })[0] || BASEMAPS[0];
  if (state.layers.base) state.map.removeLayer(state.layers.base);
  var lyr = L.tileLayer(def.url, {
    maxZoom: 19, attribution: def.attr,
    crossOrigin: true
  });
  /* A basemap that answers with nothing leaves a black rectangle and no
     explanation. If the first tiles do not arrive, the Layers panel says
     which host did not answer rather than leaving you to guess. */
  var got = false;
  state.basemapError = null;
  lyr.on('tileload', function(){ got = true; });
  lyr.on('tileerror', function(){
    if (got || state.basemapId !== def.id) return;
    state.basemapError = def.label + ' did not return tiles. Its host may be unreachable from this network.';
    logNet('basemap ' + def.id, def.url, false, 'tile error');
    if (!document.getElementById('panel-layers').hidden) renderLayers();
  });
  lyr.addTo(state.map);
  lyr.setZIndex(0);
  state.layers.base = lyr;
  state.basemapId = def.id;
  sput('_shared','basemap', def.id);
}

/* =====================================================================
   Water panel — tide where the water is tidal, gauge readings always.
   A river that is not tidal shows no tide section at all rather than an
   empty chart: an empty chart reads as "no tide today".
   ===================================================================== */
/* --- the All view: one card per river ------------------------------- */

/* How much water is coming down: the most downstream gauge that is ABOVE
   the tide.
 *
 * The furthest downstream gauge is the obvious choice and it is wrong on a
 * tidal river. Instantaneous flow at Rio Vista was reading minus eighty-five
 * thousand cubic feet a second while this was being written — a true
 * measurement of a flooding tide pushing the river backwards, and no
 * description at all of what the Sacramento is carrying. The gauge to ask is
 * the lowest one the tide does not reach, which on the Sacramento is Verona.
 *
 * Where every gauge on a river is tidal — the Mokelumne, all three of them —
 * there is no such gauge, and the honest answer is to say so rather than
 * print a tidal swing as discharge.
 */
function downstreamFlow(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var edge = river.tidal ? tidalEdge(river) : null;
  var best = null, bestTidal = null;
  payload.rows.forEach(function(r){
    if (r.context || !isNum(r.flow)) return;
    var v = axisValue(river, r);
    if (!isNum(v)) return;
    var underTide = edge ? (v <= edge.v) : false;
    if (underTide){
      if (bestTidal === null || v < bestTidal.v)
        bestTidal = { v:v, flow:r.flow, name:r.name || r.id, id:r.id,
                      source:r.source, tidal:true };
    } else if (best === null || v < best.v){
      best = { v:v, flow:r.flow, name:r.name || r.id, id:r.id,
               source:r.source, tidal:false };
    }
  });
  return best || bestTidal;
}

/* Clarity across the gauges that have a turbidity sensor. Most do not: the
   American has four gauges and none of them, and CDEC publishes none for the
   Feather. A river with no sensor is a river nobody is measuring, which is a
   different fact from clear water and is said as such. */
function meanTurb(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var t = payload.rows.filter(function(r){ return !r.context && isNum(r.turb); })
                      .map(function(r){ return r.turb; });
  if (!t.length) return null;
  return { f: t.reduce(function(a,b){ return a+b; },0) / t.length, n: t.length };
}

/* Mean of the gauges that have a thermometer, and how many that was. One
   river's worth of water is not one temperature, and saying which gauges
   it came from is the difference between a figure and a guess. */
function meanTemp(river){
  var payload = state.gauges[river.id];
  if (!payload) return null;
  var t = payload.rows.filter(function(r){ return !r.context && isNum(r.tempF); })
                      .map(function(r){ return r.tempF; });
  if (!t.length) return null;
  return { f: t.reduce(function(a,b){ return a+b; },0) / t.length, n: t.length };
}

/* The next turn, from the predictions already fetched. */
function nextTurn(river){
  var t = state.tides[river.id];
  if (!t || !t.hilo || !t.hilo.length) return null;
  var now = Date.now();
  for (var i = 0; i < t.hilo.length; i++){
    var when = new Date(t.hilo[i].t.replace(' ','T'));
    if (when.getTime() > now)
      return { type: t.hilo[i].type === 'H' ? 'high' : 'low',
               at: when, v: t.hilo[i].v };
  }
  return null;
}

/* How many of this river's reaches are open today. */
function seasonState(river){
  if (!river.reaches.length) return { text:'season not confirmed', tone:'unknown' };
  var open = 0;
  river.reaches.forEach(function(rc){
    var now = new Date();
    for (var i = 0; i < rc.windows.length; i++){
      if (now >= new Date(rc.windows[i][0] + 'T00:00') &&
          now <= new Date(rc.windows[i][1] + 'T23:59')) { open++; return; }
    }
  });
  if (open === 0) return { text:'closed', tone:'shut' };
  if (open === river.reaches.length)
    return { text:'open · ' + open + (open === 1 ? ' reach' : ' reaches'), tone:'open' };
  return { text:open + ' of ' + river.reaches.length + ' reaches open', tone:'part' };
}

function riverCard(river){
  var season = seasonState(river);
  var temp = meanTemp(river);
  var flow = downstreamFlow(river);
  var turn = river.tidal ? nextTurn(river) : null;
  var payload = state.gauges[river.id];

  var card = el('button',{ type:'button', class:'rivercard' });
  var top = el('div',{class:'rc-top'});
  top.appendChild(el('span',{class:'rc-name',text:river.name}));
  var chip = el('span',{class:'rc-season',text:season.text});
  chip.style.color = season.tone === 'open' ? '#9BD98C'
                   : season.tone === 'shut' ? '#E76F9F'
                   : season.tone === 'part' ? '#C9A96A' : '#9FB3B1';
  top.appendChild(chip);
  card.appendChild(top);

  /* The Feather's gauges are CDEC's and CDEC is the slowest of the four
     services. When it does not answer, this card read "no thermometer
     reporting / no flow reading" — which describes a river with no
     instruments on it, not a request that failed. Say which it is. */
  var mute = payload ? payload.rows.filter(function(r){
    return !r.context && r.declared && r.error; }).length : 0;

  var t = el('div',{class:'rc-temp'});
  var deg = el('span',{class:'rc-deg', text: temp ? fmt(temp.f,0) + 'F' : '—'});
  if (temp) deg.style.color = tempColour(temp.f);
  t.appendChild(deg);
  t.appendChild(el('span',{class:'rc-read',
    text: temp ? (tempReading(temp.f) || '')
        : !payload ? 'still asking'
        : mute ? 'gauges did not answer' : 'no thermometer reporting'}));
  card.appendChild(t);
  if (temp) card.appendChild(el('div',{class:'rc-line',
    text:'mean of ' + temp.n + (temp.n === 1 ? ' gauge' : ' gauges')}));

  /* The tide line below this one is a PREDICTION. This is a measurement of
     what the water is doing at this moment, which on a tidal reach is a
     different and better answer to the same question. */
  if (river.tidal && payload){
    var moving = payload.rows.filter(function(r){ return !r.context && isNum(r.vel); });
    if (moving.length){
      var down = moving.filter(function(r){ return r.vel >= 0; }).length;
      var up   = moving.length - down;
      var fastest = moving.slice().sort(function(a,b){
        return Math.abs(b.vel) - Math.abs(a.vel); })[0];
      var line = el('div',{class:'rc-line'});
      line.appendChild(el('b',{text: up === 0 ? 'running downstream'
        : down === 0 ? 'running upstream' : 'running both ways'}));
      line.appendChild(document.createTextNode(
        up === 0 || down === 0
          ? ' at up to ' + fmt(Math.abs(fastest.vel),2) + ' ft/s, measured now'
          : ' — ' + up + ' of ' + moving.length + ' gauges read upstream, measured now'));
      card.appendChild(line);
    }
  }

  var turb = meanTurb(river);
  if (turb) card.appendChild(el('div',{class:'rc-line',
    text: turbReading(turb.f) + ' — ' + fmt(turb.f,1) + ' FNU across ' +
      turb.n + (turb.n === 1 ? ' gauge' : ' gauges')}));
  else if (payload && !mute) card.appendChild(el('div',{class:'rc-line note',
    text:'no turbidity sensor on this river'}));

  var fl = el('div',{class:'rc-line'});
  if (flow && flow.tidal){
    /* Nothing above the tide on this river, so the number swings with it. */
    fl.appendChild(el('b',{text:commas(fmt(flow.flow,0))}));
    fl.appendChild(document.createTextNode(' cfs at ' + flow.name +
      ' — tidal flow, not what the river is carrying'));
  } else if (flow){
    fl.appendChild(el('b',{text:commas(fmt(flow.flow,0))}));
    fl.appendChild(document.createTextNode(' cfs at ' + flow.name));
  } else if (payload && payload.rows.length){
    fl.appendChild(document.createTextNode(mute
      ? mute + (mute === 1 ? ' gauge on this river did' : ' gauges on this river did') +
        ' not answer, so there is no flow figure — not that the river has none'
      : 'no flow reading'));
  } else {
    fl.appendChild(document.createTextNode('still asking…'));
  }
  card.appendChild(fl);

  if (river.tidal){
    var td = el('div',{class:'rc-line'});
    if (turn){
      td.appendChild(document.createTextNode('next ' + turn.type + ' '));
      td.appendChild(el('b',{text:clockLocal(turn.at.toISOString())}));
      td.appendChild(document.createTextNode(' · ' + fmt(turn.v,1) + ' ft'));
    } else {
      td.appendChild(document.createTextNode('tidal — no prediction loaded'));
    }
    card.appendChild(td);
  }

  card.setAttribute('aria-label', river.name + '. ' + season.text + '. ' +
    (temp ? fmt(temp.f,0) + ' degrees, ' + (tempReading(temp.f) || '') + ' ' : '') +
    (flow ? commas(fmt(flow.flow,0)) + ' cubic feet per second at ' + flow.name +
       (flow.tidal ? ', tidal flow rather than river discharge' : '') + '. ' : '') +
    (turn ? 'Next ' + turn.type + ' at ' + clockLocal(turn.at.toISOString()) + '. ' : '') +
    'Show this river.');
  card.addEventListener('click', function(){
    selectRiver(river.id);
    selectTab('water');
  });
  return card;
}

function renderWater(){
  var p = $('#panel-water'); p.innerHTML = '';

  if (!state.riverId){
    p.appendChild(el('h2',{class:'sec',text:'Which river'}));
    RIVERS.forEach(function(river){ p.appendChild(riverCard(river)); });
    /* This read RIVERS[0] and said "these" about all four, so one river's
       bad minute captioned three rivers of live readings. */
    var old = RIVERS.filter(function(r){ return looksOld(state.gauges[r.id]); });
    if (old.length) p.appendChild(el('div',{class:'warnbox',
      text: (old.length === RIVERS.length
              ? 'These are stored readings — the network did not answer.'
              : 'Stored readings for ' + old.map(function(r){ return r.short; }).join(' and ') +
                ' — those did not answer. The rest are current.') +
            ' Ages are in the header.'}));
    p.appendChild(el('p',{class:'note',
      text:'Four rivers, one temperature scale, in a fixed order. Thalweg does not rank them: reading a thermometer against a threshold is one thing, and telling you where the fishing will be better is a forecast it has no basis for.'}));
    p.appendChild(el('p',{class:'note',
      text:'Tap a river for its tide, its gauges one by one, its published depth surveys and your own marks.'}));
    /* Dropping a view silently is the thing this app is not allowed to do.
       Four ribbon rows at a legible size do not fit above the cards on a
       short screen, and the cards carry more of the answer, so the ribbon
       goes — and says it went, at the bottom, where saying it costs nothing
       above the fold. */
    if (document.getElementById('ribbonwrap').hidden)
      p.appendChild(el('p',{class:'note',
        text:'The river ribbon is not shown: four rows of it will not fit above these cards on a screen this short. Pick a single river and it comes back for that one.'}));
    return;
  }

  var rivers = [byId(state.riverId)];

  rivers.forEach(function(river){
    if (rivers.length > 1) p.appendChild(el('h2',{class:'sec',text:river.name}));

    if (river.tidal){
      if (rivers.length === 1) p.appendChild(el('h2',{class:'sec',text:'Tide'}));
      p.appendChild(tideSection(river));
    }

    if (rivers.length === 1) p.appendChild(el('h2',{class:'sec',text:'Gauges'}));
    var payload = state.gauges[river.id];
    if (!payload){
      p.appendChild(el('p',{class:'note',text:'Loading…'}));
    } else if (payload.failed){
      p.appendChild(el('div',{class:'warnbox',
        text:'No reading reached this device and nothing was stored earlier. Flow, stage and temperature are unknown, not zero.'}));
    } else {
      if (payload.noData) p.appendChild(el('div',{class:'warnbox',
        text:'Nothing answered this time. Every row below is what the request came back with, not a reading.'}));
      if (looksOld(payload) && !payload.noData) p.appendChild(el('div',{class:'warnbox',
        text:'Stored readings, ' + ageText(Date.now() - payload.fetchedAt) +
             '. The network did not answer, so these are the last that arrived.'}));
      var onRiver = payload.rows.filter(function(r){ return !r.context; });
      var tribs   = payload.rows.filter(function(r){ return r.context; });
      if (!onRiver.length && river.noLiveGauges)
        p.appendChild(el('div',{class:'warnbox', text:river.noLiveGauges}));
      if (onRiver.length && river.gaugeSourceNote)
        p.appendChild(el('p',{class:'note', text:river.gaugeSourceNote}));
      onRiver.forEach(function(r){ p.appendChild(gaugeRow(r)); });
      if (!onRiver.length && !river.noLiveGauges)
        p.appendChild(el('p',{class:'note',text:'No gauge answered for this reach.'}));
      if (tribs.length){
        p.appendChild(el('h2',{class:'sec',text:'Tributaries, not this river'}));
        tribs.forEach(function(r){ p.appendChild(gaugeRow(r)); });
      }
      if (river.weirs){
        p.appendChild(el('h2',{class:'sec',text:'The weirs'}));
        p.appendChild(weirSection(river));
      }

      p.appendChild(el('h2',{class:'sec',text:'The last seven days'}));
      p.appendChild(trendSection(river));
      drawTrendLines();

      var temps = onRiver.map(function(r){
        return isNum(r.tempF) ? r.tempF : null;
      }).filter(function(v){ return v !== null; });
      if (temps.length){
        var avg = temps.reduce(function(a,b){ return a+b; },0)/temps.length;
        var read = tempReading(avg);
        if (read){
          var box = el('p',{class:'note'});
          box.appendChild(el('span',{class:'swatch',style:'background:'+tempColour(avg)}));
          box.appendChild(document.createTextNode(' ' + read +
            ' (mean of ' + temps.length + ' gauge' + (temps.length===1?'':'s') +
            ', ' + fmt(avg,1) + 'F)'));
          p.appendChild(box);
        }
      }
    }
  });
}

function gaugeRow(r){
  var wrap = el('div',{class:'rdg'});
  var name = el('div',{class:'rdg-name'});
  /* The name shown is the one the API returned. A wrong identifier cannot
     look like a plausible reading from somewhere else. */
  name.appendChild(el('span',{ text: r.name || (r.hint ? '(' + r.hint + ')' : 'unknown site') }));
  name.appendChild(flagEl(r.status));
  name.appendChild(el('span',{class:'rdg-id',
    text:(r.source ? r.source + ' ' : '#') + r.id}));
  wrap.appendChild(name);

  if (r.error){
    wrap.appendChild(el('div',{class:'err',
      text: r.error + '. Nothing is shown for this site because nothing is known.'}));
    return wrap;
  }
  var vals = el('div',{class:'rdg-vals'});
  function v(value, dp, unit){
    var s = el('span',{class:'v'});
    s.appendChild(document.createTextNode(fmt(value, dp)));
    s.appendChild(el('small',{text:unit}));
    return s;
  }
  vals.appendChild(v(r.flow, 0, 'cfs'));
  vals.appendChild(v(r.stage, 2, 'ft'));
  var f = isNum(r.tempF) ? r.tempF : null;
  var tv = v(f, 1, 'F');
  if (f !== null) tv.style.color = tempColour(f);
  vals.appendChild(tv);
  /* Only where there is a sensor. A dash in this column would say the water
     is unmeasurably clear rather than that nobody is measuring it, so the
     column is absent instead. */
  if (isNum(r.turb)) vals.appendChild(v(r.turb, 1, 'FNU'));
  if (isNum(r.vel))  vals.appendChild(v(Math.abs(r.vel), 2, 'ft/s'));
  wrap.appendChild(vals);
  if (isNum(r.turb)) wrap.appendChild(el('div',{class:'rdg-id',
    text: turbReading(r.turb) + ' — turbidity, how much the water is carrying'}));
  var vr = velReading(r);
  if (vr) wrap.appendChild(el('div',{class: vr.conflict ? 'err' : 'rdg-id',
    text: vr.text + (vr.conflict ? '' : ' — measured, not predicted')}));
  if (r.at) wrap.appendChild(el('div',{class:'rdg-id',
    text: 'reading ' + clockLocal(r.at) + ', ' + dayLocal(r.at)}));
  return wrap;
}

function tideSection(river){
  var box = el('div',{});
  var t = state.tides[river.id];
  if (!t){ box.appendChild(el('p',{class:'note',text:'Loading tide…'})); return box; }
  if (t.failed){
    box.appendChild(el('div',{class:'warnbox',
      text:'No tide prediction available: ' + t.failed}));
    return box;
  }
  if (t.stations && t.stations.length > 1){
    var row = el('div',{class:'rowline'});
    var lab = el('label',{for:'tidestation-'+river.id,text:'Station'});
    var sel = el('select',{id:'tidestation-'+river.id});
    t.stations.forEach(function(s){
      var o = el('option',{value:s.id,text:(s.name||s.id)+' — '+s.id});
      if (s.id === t.station) o.setAttribute('selected','selected');
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){ switchTideStation(river, sel.value); });
    row.appendChild(lab); row.appendChild(sel);
    box.appendChild(row);
  }
  /* Asking NOAA what else is out there costs two megabytes, so it is a
     button rather than something that happens to you. Once pressed, the
     result is kept and the question is not asked again. */
  if (river.tideDiscover && !sget(river.id,'tidestations')){
    var moreRow = el('div',{class:'rowline'});
    var moreBtn = el('button',{type:'button',text:'Look for other stations near here'});
    moreBtn.addEventListener('click', function(){
      moreBtn.disabled = true;
      moreBtn.textContent = 'Asking NOAA — this one is a big file…';
      nearbyTideStations(river).then(function(){
        loadTideFor(river);
        announce('Nearby prediction stations loaded.');
      }, function(e){
        moreBtn.disabled = false;
        moreBtn.textContent = 'Look for other stations near here';
        announce('NOAA did not answer: ' + (e && e.message || e));
      });
    });
    moreRow.appendChild(moreBtn);
    moreRow.appendChild(el('span',{class:'note',
      text:'NOAA publishes its station list as one two-megabyte file and will not filter it, so this is asked for on purpose rather than on every visit. It is kept afterwards.'}));
    box.appendChild(moreRow);
  }

  var st = (t.stations||[]).filter(function(s){ return s.id === t.station; })[0];
  var head = el('p',{class:'note'});
  head.appendChild(document.createTextNode(
    (st ? st.name + ' — ' : '') + 'station ' + t.station + ', MLLW. '));
  head.appendChild(flagEl(st ? st.status : PROV.VERIFIED));
  box.appendChild(head);

  if (t.hourlyUnavailable){
    box.appendChild(el('p',{class:'note',
      text:'This station publishes highs and lows only, not an hourly curve. The times below are the turns; the water between them is not published and is not drawn.'}));
  } else {
    box.appendChild(tideChart(t));
  }
  if (t.offline) box.appendChild(el('p',{class:'note',
    text:'Predictions from store. A prediction is arithmetic about the future, so it is still good; the flow and temperature above are not.'}));

  var now = Date.now(), shown = 0;
  (t.hilo||[]).forEach(function(h){
    var when = new Date(h.t.replace(' ','T'));
    if (when.getTime() < now - 3600000 || shown >= 6) return;
    shown++;
    var r = el('div',{class:'hilo'});
    r.appendChild(el('span',{text:(h.type==='H'?'High':'Low')+' · '+dayLocal(h.t.replace(' ','T'))}));
    var b = el('b',{text:clockLocal(h.t.replace(' ','T'))+'  '+fmt(h.v,1)+' ft'});
    r.appendChild(b);
    box.appendChild(r);
  });
  if (!shown) box.appendChild(el('p',{class:'note',
    text:'No high or low water in the stored window. Reconnect to extend it.'}));
  return box;
}

function tideChart(t){
  var W = 320, H = 110, pad = 16;
  var now = Date.now();
  var pts = (t.hourly||[]).map(function(p){
    return { x:new Date(p.t.replace(' ','T')).getTime(), y:p.v };
  }).filter(function(p){
    return p.x >= now - 6*3600000 && p.x <= now + 24*3600000 && isFinite(p.y);
  });
  var s = svg('svg',{ id:'tidechart', viewBox:'0 0 '+W+' '+H, role:'img' });
  var ttl = svg('title'); ttl.textContent =
    'Predicted tide height, six hours back and twenty-four hours forward, MLLW.';
  s.appendChild(ttl);
  if (pts.length < 2){
    var e = svg('text',{x:W/2,y:H/2,fill:'#9FB3B1','font-size':'11','text-anchor':'middle'});
    e.textContent = 'No prediction in this window.';
    s.appendChild(e); return s;
  }
  var xs = pts.map(function(p){ return p.x; }), ys = pts.map(function(p){ return p.y; });
  var x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);
  var y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  if (y1 - y0 < 0.5){ y0 -= 0.25; y1 += 0.25; }
  var sx = function(v){ return pad + (v-x0)/(x1-x0)*(W-2*pad); };
  var sy = function(v){ return H-pad - (v-y0)/(y1-y0)*(H-2*pad); };
  var d = pts.map(function(p,i){ return (i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1); }).join(' ');
  s.appendChild(svg('path',{ d:d, fill:'none', stroke:'#7BD5D9', 'stroke-width':'2' }));
  s.appendChild(svg('path',{ d:d+' L'+sx(x1)+' '+(H-pad)+' L'+sx(x0)+' '+(H-pad)+' Z',
    fill:'#7BD5D9', opacity:'.13', stroke:'none' }));
  if (now >= x0 && now <= x1){
    s.appendChild(svg('line',{ x1:sx(now), x2:sx(now), y1:pad-6, y2:H-pad,
      stroke:'#DA4A85','stroke-width':'1.5' }));
    var nl = svg('text',{ x:sx(now), y:pad-8, fill:'#E76F9F','font-size':'9','text-anchor':'middle' });
    nl.textContent = 'now'; s.appendChild(nl);
  }
  [[y1,pad+2],[y0,H-pad-2]].forEach(function(p){
    var t2 = svg('text',{x:2,y:p[1],fill:'#9FB3B1','font-size':'9'});
    t2.textContent = fmt(p[0],1); s.appendChild(t2);
  });
  return s;
}

function switchTideStation(river, id){
  var stations = (state.tides[river.id] || {}).stations || [];
  sput(river.id,'tidestation',id);
  loadTide(river, id).then(function(t){
    if (t) t.stations = stations;
    state.tides[river.id] = t;
    renderWater();
  });
}

/* =====================================================================
   Layers panel.
   Coverage is uneven and the honest thing is to say where it stops. A
   reach with no published survey says so in words; it does not get an
   empty toggle that turns nothing on.
   ===================================================================== */
function renderLayers(){
  var p = $('#panel-layers'); p.innerHTML = '';

  p.appendChild(el('h2',{class:'sec',text:'Basemap'}));
  BASEMAPS.forEach(function(b){
    var row = el('div',{class:'rowline'});
    var id = 'base-'+b.id;
    var r = el('input',{type:'radio',name:'basemap',id:id,value:b.id});
    if (state.basemapId === b.id) r.checked = true;
    r.addEventListener('change', function(){ if (r.checked) setBasemap(b.id); });
    row.appendChild(r);
    row.appendChild(el('label',{for:id,text:b.label,class:'grow'}));
    p.appendChild(row);
  });

  if (state.basemapError)
    p.appendChild(el('div',{class:'warnbox', text:state.basemapError}));

  if (!BATHY_PROXY){
    p.appendChild(el('div',{class:'warnbox',
      text:'BATHY_PROXY is empty, so bathymetry requests go straight to gis.water.ca.gov. That is California’s public GIS infrastructure, not a tile API. Fine on a laptop; not fine in public.'}));
  } else if (state.proxyMissing){
    p.appendChild(el('div',{class:'warnbox',
      text:'The bathymetry proxy at ' + BATHY_PROXY + ' did not answer, so no depth is available. If this is a static deploy, the site was published without its functions directory.'}));
  }

  p.appendChild(el('h2',{class:'sec',text:'Bathymetry'}));

  if (!state.catalog){
    p.appendChild(el('p',{class:'note',text:'Reading the DWR service directory…'}));
    return;
  }
  var river = state.riverId ? byId(state.riverId) : null;
  if (!river){
    p.appendChild(el('p',{class:'note',
      text:'Depth belongs to a reach, so it comes with a river. Pick one above and the map opens with it — All rivers is for choosing between them, not for reading bottom.'}));
    return;
  }
  var cat = catalogFor(state.catalog, river);

  /* Reading a colour off a ramp is not a depth. Tapping the map asks the
     survey for the number, and this is the same question without a pointer:
     §4 wants the route named for the hand that takes it, and a finger on a
     map and a keyboard on a button are two hands, not one. */
  p.appendChild(el('h2',{class:'sec',text:'Depth at a point'}));
  p.appendChild(el('p',{class:'note',
    text:'Tap anywhere on the map and it asks the published survey how deep it is there, and offers to keep the point as a mark. Where the survey has no reading at that exact spot it gives you the nearest place it did measure and how far away that was.'}));
  var centreRow = el('div',{class:'rowline'});
  var centreBtn = el('button',{type:'button',text:'Read the depth at the map centre'});
  centreBtn.addEventListener('click', function(){
    var c = state.map.getCenter();
    if (tabNames().indexOf('map') !== -1) selectTab('map');
    showDepthAt(c.lat, c.lng);
  });
  centreRow.appendChild(centreBtn);
  p.appendChild(centreRow);

  if (state.catalog.rasterError)
    p.appendChild(el('div',{class:'warnbox',
      text:'The multibeam service directory did not answer: ' + state.catalog.rasterError}));
  if (state.catalog.singleError)
    p.appendChild(el('div',{class:'warnbox',
      text:'The single beam service did not answer: ' + state.catalog.singleError}));

  /* --- multibeam raster --- */
  p.appendChild(el('h2',{class:'sec',text:'Multibeam surface'}));
  if (!cat.raster.length && !state.catalog.rasterError){
    p.appendChild(el('p',{class:'note',
      text:'No published multibeam survey for this reach.'}));
  } else if (cat.raster.length){
    var rampRow = el('div',{class:'rowline'});
    var rampBtn = el('button',{type:'button','aria-pressed':state.ramp?'true':'false',
      text:'Depth ramp'});
    rampBtn.addEventListener('click', function(){
      state.ramp = !state.ramp;
      /* Rebuild whatever is on, because the rule is part of the tile URL. */
      Object.keys(state.layers).forEach(function(k){
        if (k.indexOf('r:') !== 0) return;
        var lyr = state.layers[k];
        var base = lyr._baseUrl;
        state.map.removeLayer(lyr);
        var next = new EsriImg(base, { opacity: state.opacity || 0.8,
          ramp: state.ramp, attribution:'Bathymetry: California DWR' });
        next.addTo(state.map); next.setZIndex(300);
        state.layers[k] = next;
      });
      renderLayers();
    });
    rampRow.appendChild(rampBtn);
    rampRow.appendChild(el('span',{class:'note',
      text:'Colours the surface by depth instead of grey. Applies to every surface below.'}));
    p.appendChild(rampRow);
  }
  collapsible(p, cat.raster, 'raster', 'surface', rasterControl);

  /* --- single beam points --- */
  p.appendChild(el('h2',{class:'sec',text:'Single beam soundings'}));
  if (!cat.single.length && !state.catalog.singleError){
    p.appendChild(el('p',{class:'note',
      text:'No published single beam survey for this reach.'}));
  }
  collapsible(p, cat.single, 'single', 'survey', singleControl);

  if (cat.unplaced.length){
    p.appendChild(el('h2',{class:'sec',text:'Could not be placed'}));
    p.appendChild(el('p',{class:'note',
      text:cat.unplaced.length + ' published survey' + (cat.unplaced.length===1?'':'s') +
      ' report an extent in a projection this build does not convert, so they are not assigned to a river rather than assigned to the wrong one. Their names are in the diagnostic report.'}));
  }

  /* --- charts --- */
  p.appendChild(el('h2',{class:'sec',text:'NOAA raster chart'}));
  if (state.chartUsable === false){
    p.appendChild(el('p',{class:'note',
      text:'The chart tile path in this build did not return an image, so the toggle is not offered. The path is recorded in the README as unverified.'}));
  } else {
    var crow = el('div',{class:'layer'});
    var cb = el('button',{type:'button','aria-pressed':state.layers.chart?'true':'false',
      text:'Show chart'});
    cb.addEventListener('click', function(){ toggleChart(cb); });
    crow.appendChild(cb);
    crow.appendChild(el('p',{text:'Chart coverage of these waters ends upstream of about Verona; the limit is drawn on the map when the layer is on. Soundings on a chart are for navigation and this app is not.' +
      (state.chartUsable === null ? ' The tile path has not been confirmed against the live service; the first time you switch it on, it checks.' : '')}));
    p.appendChild(crow);
  }

  p.appendChild(el('h2',{class:'sec',text:'Reading the gaps'}));
  p.appendChild(el('p',{class:'note',
    text:'Dense aquatic vegetation defeats the sounder, so DWR drops those cells. A blank patch beside a tule edge is missing data, not flat bottom. In vegetated water a return may be the top of the weed rather than the bed.'}));
  p.appendChild(el('p',{class:'note',
    text:'Single beam data are points along the boat’s track. The water between two tracks was never measured and is not drawn.'}));
}

/* Ranked lists get long — eighty-one single beam layers touch the Delta.
   The first few are the ones that sit squarely in this reach; the rest
   are behind a button, counted, never hidden. */
var LIST_SHOWN = 8;
function collapsible(p, rows, key, noun, make){
  var open = state.expanded && state.expanded[key];
  var shown = open ? rows : rows.slice(0, LIST_SHOWN);
  shown.forEach(function(row){ p.appendChild(make(row)); });
  if (rows.length > LIST_SHOWN){
    var b = el('button',{type:'button',
      text: open ? 'Show the closest ' + LIST_SHOWN + ' only'
                 : 'Show all ' + rows.length + ' ' + noun + 's in this reach'});
    b.addEventListener('click', function(){
      state.expanded = state.expanded || {};
      state.expanded[key] = !open;
      renderLayers();
    });
    p.appendChild(b);
    if (!open) p.appendChild(el('p',{class:'note',
      text:'Showing the ' + LIST_SHOWN + ' whose extent overlaps this reach most. ' +
           (rows.length - LIST_SHOWN) + ' more touch it.'}));
  }
}

function rasterControl(row){
  var wrap = el('div',{class:'layer'});
  var key = 'r:' + row.name;
  var on = !!state.layers[key];
  /* surveyLabel exists because DWR's names are machine names. The depth
     label used it and this list, where a reader chooses between twenty of
     them, still printed Bathy_NCRO_20230208_SacramentoRiver. The machine
     name stays below, so what is on screen can be matched to the catalogue. */
  /* The machine name is on the control as data as well as under it as text,
     so anything selecting this survey selects it by its identity rather than
     by a label that is allowed to be rewritten for readers. */
  var b = el('button',{type:'button','aria-pressed':on?'true':'false',
    'data-survey': row.name,
    text: surveyLabel(row.name) + (surveyDate(row.name) ? ' · ' + surveyDate(row.name) : '')});
  wrap.appendChild(b);
  var opWrap = el('div',{class:'rowline'});
  var opId = 'op-' + row.name.replace(/\W/g,'');
  opWrap.appendChild(el('label',{for:opId,text:'Opacity'}));
  var op = el('input',{type:'range',id:opId,min:'10',max:'100',
    value:String(Math.round((state.opacity||0.8)*100))});
  op.addEventListener('input', function(){
    var v = Number(op.value)/100;
    state.opacity = v;
    if (state.layers[key]) state.layers[key].setOpacity(v);
  });
  opWrap.appendChild(op);
  wrap.appendChild(opWrap);
  wrap.appendChild(el('p',{class:'rdg-id',text:row.name}));
  b.addEventListener('click', function(){
    if (state.layers[key]){
      state.map.removeLayer(state.layers[key]);
      delete state.layers[key];
      b.setAttribute('aria-pressed','false');
    } else {
      var lyr = new EsriImg(dwr(row.path), {
        opacity: state.opacity || 0.8,
        ramp: !!state.ramp,
        attribution:'Bathymetry: California DWR'
      });
      lyr.addTo(state.map); lyr.setZIndex(300);
      state.layers[key] = lyr;
      b.setAttribute('aria-pressed','true');
    }
  });
  var bits = [];
  if (row.pixel){
    var unit = (row.box && row.box.unit && Math.abs(row.box.unit - 1) > 0.01)
      ? 'ft' : 'm';
    bits.push('cell about ' + fmt(row.pixel[0],2) + ' by ' + fmt(row.pixel[1],2) + ' ' + unit);
  }
  if (row.box && row.box.approx) bits.push('extent in NAD83, placed to within a metre');
  wrap.appendChild(el('p',{text:(row.description || 'No description published.') +
    (bits.length ? ' — ' + bits.join('; ') + '.' : '')}));
  return wrap;
}

function singleControl(row){
  var wrap = el('div',{class:'layer'});
  var on = state.soundingLayerId === row.id;
  var b = el('button',{type:'button','aria-pressed':on?'true':'false',
    'data-survey': row.name,
    text: surveyLabel(row.name) + (surveyDate(row.name) ? ' · ' + surveyDate(row.name) : '')});
  b.addEventListener('click', function(){
    if (state.soundingLayerId === row.id){
      state.soundingActive = false; state.soundingLayerId = null;
      state.soundingLayer.clearLayers();
      state.soundingNote = '';
      renderLayers(); updateLegend();
    } else {
      state.soundingActive = true; state.soundingLayerId = row.id;
      state.soundingLayerDef = row;
      renderLayers();
      refreshSoundings();
    }
  });
  wrap.appendChild(b);
  wrap.appendChild(el('p',{class:'rdg-id',text:row.name}));
  var txt = row.description || 'No description published.';
  if (!row.depthField) txt += ' — no depth attribute could be identified in this layer, so the points draw in one colour.';
  else txt += ' — depth attribute "' + row.depthField + '", as published; the vertical datum is whatever DWR published and is not restated here.';
  wrap.appendChild(el('p',{text:txt}));
  if (on && state.soundingNote) wrap.appendChild(el('p',{class:'err',text:state.soundingNote}));
  return wrap;
}

function refreshSoundings(){
  if (!state.soundingActive || !state.soundingLayerDef) return;
  var def = state.soundingLayerDef;
  if (state.map.getZoom() < 12){
    state.soundingLayer.clearLayers();
    state.soundingNote = 'Zoom in to at least z12 to load soundings. At this scale the request would be the whole survey.';
    renderLayers(); updateLegend();
    return;
  }
  querySoundings(def, state.map.getBounds()).then(function(res){
    drawSoundings(res, def);
  }, function(e){
    state.soundingLayer.clearLayers();
    var msg = String(e && e.message || e);
    /* Some published surveys do not answer a query at all — the service
       times out on them however small the box. That is at DWR's end and
       there is nothing to do about it from here, so say whose it is and
       point at the rest of the list rather than leaving a bare error. */
    state.soundingNote = /timeout|Error performing query|Error handling service/i.test(msg)
      ? 'DWR’s service did not answer for this survey. That is at their end rather than yours — the other surveys in this list are unaffected.'
      : 'Sounding query failed: ' + msg;
    renderLayers(); updateLegend();
  });
}

function drawSoundings(res, def){
  state.soundingLayer.clearLayers();
  var field = res.field;
  var vals = [];
  res.features.forEach(function(f){
    var v = attrNumber(f, field);
    if (isNum(v)) vals.push(v);
  });
  vals.sort(function(a,b){ return a-b; });
  var lo = vals.length ? vals[Math.floor(vals.length*0.02)] : 0;
  var hi = vals.length ? vals[Math.floor(vals.length*0.98)] : 1;
  if (hi - lo < 1e-6) hi = lo + 1;
  state.soundingRange = vals.length ? [lo,hi] : null;

  res.features.forEach(function(f){
    var g = f.geometry;
    if (!g || !isNum(g.x) || !isNum(g.y)) return;
    var v = attrNumber(f, field);
    var col = isNum(v) ? depthColour(v, lo, hi) : '#7BD5D9';
    var m = L.circleMarker([g.y, g.x], {
      radius:3, weight:0, fillColor:col, fillOpacity:.9, interactive:true
    });
    m.bindPopup(labelNode('Sounding',
      [[isNum(v) ? fmt(v,2) : '—', field || 'value']],
      'as published by DWR; the vertical datum is not restated here'), LABEL);
    state.soundingLayer.addLayer(m);
  });
  state.soundingTruncated = res.truncated;
  state.soundingNote = res.truncated
    ? 'Showing ' + commas(res.features.length) + ' soundings — the ' +
      commas(res.cap || FEATURE_CAP) + ' cap truncated this view. Zoom in to see the rest; what is drawn is not all that was surveyed here.'
    : commas(res.features.length) + ' soundings in view.';
  renderLayers(); updateLegend();
}

/* A null attribute must not become a zero depth on the way through. */
function attrNumber(f, field){
  if (!field || !f.attributes) return NaN;
  var raw = f.attributes[field];
  if (raw === null || raw === undefined || raw === '') return NaN;
  var v = Number(raw);
  return isFinite(v) ? v : NaN;
}

/* Shallow reads warm, deep reads cold, whichever direction the published
   values run: an elevation goes down as depth goes up. */
function depthColour(v, lo, hi){
  var t = Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
  return mixHex('#0B3A4A', '#7BD5D9', t);
}

function updateLegend(){
  var d = document.getElementById('maplegend');
  if (!d) return;
  if (!state.soundingActive || !state.soundingRange){ d.innerHTML = ''; return; }
  d.innerHTML = '';
  d.appendChild(el('b',{text:'Sounding value'}));
  var bar = el('div',{style:'height:8px;width:120px;background:linear-gradient(90deg,#0B3A4A,#7BD5D9);border:1px solid #2E7C76'});
  d.appendChild(bar);
  d.appendChild(el('div',{text:fmt(state.soundingRange[0],1)+'  to  '+fmt(state.soundingRange[1],1)}));
  /* The full sentence lives in the Layers panel; over the map it only has
     to say that what you are looking at is not all of it. */
  if (state.soundingTruncated)
    d.appendChild(el('div',{style:'color:#F2A65A',text:'truncated — zoom in'}));
}

function toggleChart(btn){
  if (state.layers.chart){
    state.map.removeLayer(state.layers.chart);
    delete state.layers.chart;
    if (state.layers.chartLimit){ state.map.removeLayer(state.layers.chartLimit);
      delete state.layers.chartLimit; }
    btn.setAttribute('aria-pressed','false');
    return;
  }
  var lyr = L.tileLayer(NOAA_CHART.url, { maxZoom:17, opacity:.85,
    attribution:NOAA_CHART.attr });
  var sawTile = false;
  lyr.on('tileload', function(){ sawTile = true; state.chartUsable = true; });
  lyr.on('tileerror', function(){
    if (sawTile) return;
    state.chartUsable = false;
    state.map.removeLayer(lyr);
    delete state.layers.chart;
    logNet('NOAA chart tiles', NOAA_CHART.url, false, 'tile error');
    renderLayers();
  });
  lyr.addTo(state.map); lyr.setZIndex(200);
  state.layers.chart = lyr;
  btn.setAttribute('aria-pressed','true');
  state.layers.chartLimit = L.rectangle(
    NOAA_CHART.limitBand,
    { color:'#DA4A85', weight:1, dashArray:'4 3', fill:false }
  ).bindPopup(labelNode('NOAA chart coverage ends about here', null,
      'The position of this limit is unconfirmed.'), LABEL)
   .addTo(state.map);
}

/* =====================================================================
   Marks. Yours, on this device, per river. Never sent anywhere.
   ===================================================================== */
var MARK_TYPES = [
  { id:'hole',   label:'Hole',   colour:'#7BD5D9' },
  { id:'hazard', label:'Hazard', colour:'#DA4A85' },
  { id:'ramp',   label:'Ramp',   colour:'#C9A96A' },
  { id:'fish',   label:'Fish',   colour:'#9BD98C' }
];

function loadMarks(riverId){
  state.marks = sget(riverId,'marks') || [];
  drawMarks();
}
function saveMarks(){
  if (state.riverId) sput(state.riverId,'marks',state.marks);
}
function addMark(lat, lon, extra){
  var type = state.markType || 'hole';
  var m = { id:'m'+Date.now()+Math.floor(Math.random()*1000),
    type:type, lat:lat, lon:lon, at:new Date().toISOString(), note:'' };
  /* A depth read at the moment the mark was kept travels with it, so the
     label can say it later without asking the service again — and says
     WHEN it was surveyed, because a mark outlives the survey it was read
     from. */
  if (extra) for (var k in extra) m[k] = extra[k];
  state.marks.push(m);
  saveMarks(); drawMarks(); renderMarks();
  announce('Mark added at ' + lat.toFixed(5) + ', ' + lon.toFixed(5) +
    (isNum(m.depth) ? ', ' + fmt(Math.abs(m.depth),1) + ' feet' : '') + '.');
}
function drawMarks(){
  if (!state.markLayer) return;
  state.markLayer.clearLayers();
  state.marks.forEach(function(m){
    var def = MARK_TYPES.filter(function(t){ return t.id===m.type; })[0] || MARK_TYPES[0];
    var vals = [[m.lat.toFixed(5) + ', ' + m.lon.toFixed(5), '']];
    if (isNum(m.depth)) vals.unshift([fmt(Math.abs(m.depth),1), 'ft']);
    var sub = (m.note ? m.note + ' · ' : '') +
      'dropped ' + dayLocal(m.at) + ', ' + clockLocal(m.at);
    if (isNum(m.depth))
      sub += ' · depth from ' + (m.depthFrom || 'a published survey') +
        (m.depthDate ? ', surveyed ' + m.depthDate : '') +
        (m.depthAway ? ', measured ' + m.depthAway + ' m away' : '') +
        ', as published';
    L.circleMarker([m.lat,m.lon],{ radius:6, weight:2, color:def.colour,
      fillColor:'#0A1214', fillOpacity:.85 })
      .bindPopup(labelNode(def.label, vals, sub), LABEL)
      .addTo(state.markLayer);
  });
}
function renderMarks(){
  var p = $('#panel-marks'); p.innerHTML = '';
  if (!state.riverId){
    /* A mark belongs to a river, so there is nowhere to put a new one here.
       That is no reason to show nothing: the ones already dropped are
       readable, and a refusal with a list under it is a different thing
       from a refusal on its own. */
    p.appendChild(el('p',{class:'note',
      text:'A mark belongs to one river, so pick a river to drop one. Everything already dropped is below.'}));
    var total = 0;
    RIVERS.forEach(function(river){
      var marks = sget(river.id,'marks') || [];
      if (!marks.length) return;
      total += marks.length;
      p.appendChild(el('h2',{class:'sec',text:river.name + ' (' + marks.length + ')'}));
      marks.slice().reverse().forEach(function(m){
        var def = MARK_TYPES.filter(function(t){ return t.id===m.type; })[0] || MARK_TYPES[0];
        var r = el('div',{class:'markrow'});
        r.appendChild(el('span',{class:'swatch',style:'background:'+def.colour}));
        var g = el('span',{class:'grow'});
        g.appendChild(el('span',{text:def.label + ' '}));
        g.appendChild(el('span',{class:'v',text:m.lat.toFixed(5)+', '+m.lon.toFixed(5)}));
        r.appendChild(g);
        var go = el('button',{type:'button',text:'Go',
          'aria-label':'Show ' + river.name + ' and centre on this mark'});
        go.addEventListener('click',function(){
          selectRiver(river.id);
          state.map.setView([m.lat,m.lon], 15);
          selectTab('map');
        });
        r.appendChild(go);
        p.appendChild(r);
      });
    });
    if (!total) p.appendChild(el('p',{class:'note',text:'No marks on any river yet.'}));
    return;
  }
  p.appendChild(el('h2',{class:'sec',text:'Drop a mark'}));
  var row = el('div',{class:'rowline'});
  row.appendChild(el('label',{for:'marktype',text:'Type'}));
  var sel = el('select',{id:'marktype'});
  MARK_TYPES.forEach(function(t){
    var o = el('option',{value:t.id,text:t.label});
    if ((state.markType||'hole') === t.id) o.setAttribute('selected','selected');
    sel.appendChild(o);
  });
  sel.addEventListener('change',function(){ state.markType = sel.value; });
  row.appendChild(sel);
  p.appendChild(row);
  /* Tapping the map is the quick way; this button is the route that does
     not need a pointer at all. */
  var addBtn = el('button',{type:'button',text:'Add at map centre'});
  addBtn.addEventListener('click',function(){
    var c = state.map.getCenter(); addMark(c.lat, c.lng);
  });
  p.appendChild(addBtn);
  p.appendChild(el('p',{class:'note',
    text:'Or tap the map. Pan with the arrow keys when the map has focus.'}));

  p.appendChild(el('h2',{class:'sec',text:'Marks (' + state.marks.length + ')'}));
  if (!state.marks.length)
    p.appendChild(el('p',{class:'note',text:'None yet on this river.'}));
  state.marks.slice().reverse().forEach(function(m){
    var def = MARK_TYPES.filter(function(t){ return t.id===m.type; })[0] || MARK_TYPES[0];
    var r = el('div',{class:'markrow'});
    r.appendChild(el('span',{class:'swatch',style:'background:'+def.colour}));
    var g = el('span',{class:'grow'});
    g.appendChild(el('span',{text:def.label + ' '}));
    /* A mark kept from a depth reading carried the figure into its map
       label and nowhere else, so the list it lives in did not know it. */
    if (isNum(m.depth)){
      var dv = el('span',{class:'v'});
      dv.appendChild(document.createTextNode(fmt(Math.abs(m.depth),1)));
      dv.appendChild(el('small',{text: m.depth <= 0 ? 'ft' : 'ft above datum'}));
      g.appendChild(dv);
      g.appendChild(document.createTextNode(' '));
    }
    g.appendChild(el('span',{class:'v',text:m.lat.toFixed(5)+', '+m.lon.toFixed(5)}));
    if (isNum(m.depth)) g.appendChild(el('div',{class:'rdg-id',
      text:'depth from ' + (m.depthFrom || 'a published survey') +
        (m.depthDate ? ', surveyed ' + m.depthDate : '') +
        (m.depthAway ? ', measured ' + m.depthAway + ' m away' : '') + ', as published'}));
    r.appendChild(g);
    var go = el('button',{type:'button',text:'Go','aria-label':'Centre map on this mark'});
    go.addEventListener('click',function(){ state.map.setView([m.lat,m.lon], 15); });
    r.appendChild(go);
    var del = el('button',{type:'button',text:'Delete','aria-label':'Delete this mark'});
    del.addEventListener('click',function(){
      state.marks = state.marks.filter(function(x){ return x.id !== m.id; });
      saveMarks(); drawMarks(); renderMarks(); announce('Mark deleted.');
    });
    r.appendChild(del);
    p.appendChild(r);
  });

  p.appendChild(el('h2',{class:'sec',text:'Export'}));
  var ta = el('textarea',{readonly:'readonly','aria-label':'GeoJSON of your marks'});
  ta.value = JSON.stringify(marksGeoJSON(), null, 1);
  p.appendChild(ta);
  var erow = el('div',{class:'rowline'});
  var copy = el('button',{type:'button',text:'Copy GeoJSON'});
  copy.addEventListener('click',function(){
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
    announce('GeoJSON copied.');
  });
  erow.appendChild(copy);
  var dl = el('a',{ class:'', download:'thalweg-'+state.riverId+'.geojson',
    href:'data:application/geo+json;charset=utf-8,'+encodeURIComponent(ta.value),
    text:'Download file' });
  erow.appendChild(dl);
  p.appendChild(erow);
}
/* What travels with an exported mark. A mark kept from a depth reading is
   kept FOR the depth, and the export dropped it — the figure, the survey it
   came from and the date it was surveyed all lived on the device and in
   nothing that left it. The keys say their units, because a bare "depth" in
   somebody else's chart plotter is a number with no story. */
function markProps(m){
  var out = { type:m.type, at:m.at, note:m.note, river:state.riverId };
  if (isNum(m.depth)){
    out.depth_ft = Number(m.depth.toFixed(2));
    out.depth_is = m.depth <= 0 ? 'below the survey datum'
                                : 'ABOVE the survey datum — bank, not bottom';
    if (m.depthFrom)  out.depth_survey = m.depthFrom;
    if (m.depthDate)  out.depth_surveyed = m.depthDate;
    if (m.depthAway)  out.depth_measured_m_away = m.depthAway;
    out.depth_note = 'As the survey published it. The vertical datum is not restated. Not for navigation.';
  }
  return out;
}

function marksGeoJSON(){
  return { type:'FeatureCollection',
    features: state.marks.map(function(m){
      return { type:'Feature',
        geometry:{ type:'Point', coordinates:[Number(m.lon.toFixed(6)), Number(m.lat.toFixed(6))] },
        properties: markProps(m) };
    }) };
}

/* =====================================================================
   Brief — season, limits, temperature, sources.
   Anything that could not be read from the regulation is marked as such
   and left unresolved rather than settled by picking the likelier side.
   ===================================================================== */
function renderBrief(){

    }

      });

      ul.appendChild(el('li',{text:c.b}));
      box.appendChild(ul);

  p.appendChild(el('h2',{class:'sec',text:'Which way the water is going'}));

    text:'Where a gauge computes mean water velocity, the figure is signed and the sign is the useful part: a negative reading means the water is running upstream, which on tidal water is the tide pushing in. That is a MEASUREMENT of this moment, where the tide table above is a prediction — the two answer the same question from opposite ends, and where they disagree the water is the authority.'}));
  p.appendChild(el('p',{class:'note',
    text:'The sign convention is checked rather than trusted. At every gauge that publishes both, the velocity sign is compared against the discharge sign at the same instant; where they disagree the app says the two instruments disagree instead of choosing one, because that is not a fact about the river.'}));

  p.appendChild(el('h2',{class:'sec',text:'Water clarity'}));
