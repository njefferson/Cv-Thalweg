/* A reach can carry more than one window — the upper Sacramento is
   written as two. Open means inside any of them. */
function openNow(rc){
  var now = new Date(), soonest = null, last = null;
  for (var i = 0; i < rc.windows.length; i++){
    var a = new Date(rc.windows[i][0] + 'T00:00'),
        b = new Date(rc.windows[i][1] + 'T23:59');
    if (now >= a && now <= b)
      return 'Open now — ' + Math.ceil((b - now) / 86400000) + ' days left in this window.';
    if (now < a && (soonest === null || a < soonest)) soonest = a;
    if (last === null || b > last) last = b;
  }
  if (soonest) return 'Opens in ' + Math.ceil((soonest - now) / 86400000) + ' days.';
  return 'Closed since ' + dayLocal(rc.windows[rc.windows.length-1][1] + 'T12:00') + '.';
}

/* =====================================================================
   Chrome — tabs, river picker, staleness, announcements
   ===================================================================== */
var live;
function announce(msg){
  if (!live){
    live = el('div',{ 'aria-live':'polite', role:'status',
      style:'position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden' });
    document.body.appendChild(live);
  }
  live.textContent = msg;
}

/* The tabs.
 *
 * Which tabs exist depends on the screen and on what is selected, so they
 * are named rather than indexed: an index into a list that changes length
 * is a bug waiting for a rotation. The map is one of them under the
 * breakpoint, where it cannot be shown beside the rail; above it the map
 * has its own column and the tab is not offered. On All rivers there is no
 * map at all, so there is no tab for it either.
 */
var narrowMQ = window.matchMedia('(max-width:900px)');

function tabNames(){
  var names = ['water','layers','marks','brief'];
  if (narrowMQ.matches && state.riverId) names.splice(1, 0, 'map');
  return names;
}
function tabEl(name){ return document.getElementById('tab-' + name); }
function panelEl(name){ return document.getElementById('panel-' + name); }

function initTabs(){
  ['water','map','layers','marks','brief'].forEach(function(name){
    var tab = tabEl(name);
    tab.addEventListener('click', function(){ selectTab(name); });
    tab.addEventListener('keydown', function(e){
      var names = tabNames(), i = names.indexOf(name);
      var to = e.key === 'ArrowRight' ? i + 1
             : e.key === 'ArrowLeft'  ? i - 1
             : e.key === 'Home'       ? 0
             : e.key === 'End'        ? names.length - 1 : null;
      if (to === null || i === -1) return;
      e.preventDefault();
      to = (to + names.length) % names.length;
      selectTab(names[to]);
      tabEl(names[to]).focus();
    });
  });
  var onWidth = function(){
    /* Rotating a phone into a tablet layout must not leave the map tab
       selected, because there is no longer a tab to be on. */
    if (tabNames().indexOf(state.tab || 'water') === -1) selectTab('water');
    else selectTab(state.tab || 'water');
  };
  if (narrowMQ.addEventListener) narrowMQ.addEventListener('change', onWidth);
  else if (narrowMQ.addListener) narrowMQ.addListener(onWidth);
}

function selectTab(name){
  var names = tabNames();
  if (names.indexOf(name) === -1) name = 'water';
  state.tab = name;
  ['water','map','layers','marks','brief'].forEach(function(n){
    var tab = tabEl(n), panel = panelEl(n);
    var live = names.indexOf(n) !== -1;
    var on = live && n === name;
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
    if (n === 'map'){
      /* The map is a tabpanel only while it is one of the tabs. Above the
         breakpoint it is a column of the layout and carrying the role
         there would describe a panel with no tab to reach it. */
      if (live){
        panel.setAttribute('role','tabpanel');
        panel.setAttribute('aria-labelledby','tab-map');
        panel.hidden = false;
      } else {
        panel.removeAttribute('role');
        panel.removeAttribute('aria-labelledby');
        panel.hidden = false;
      }
    } else {
      panel.hidden = !on;
    }
  });
  /* The class the layout hangs on: the map showing means the rail is only
     its tab strip. */
  document.body.classList.toggle('show-map', name === 'map');
  if (name === 'map' && state.map){
    /* It has been display:none, so it believes the size it last had. */
    setTimeout(function(){ state.map.invalidateSize(); drawMarks(); }, 60);
  }
  if (name === 'water')  drawTrendLines();
  if (name === 'layers') renderLayers();
  if (name === 'marks')  renderMarks();
  if (name === 'brief')  renderBrief();
}

function initPicker(){
  var sel = $('#riverpick');
  RIVERS.forEach(function(r){
    sel.appendChild(el('option',{ value:r.id, text:r.short }));
  });
  sel.appendChild(el('option',{ value:'', text:'All rivers' }));
  /* First run opens on All rivers — the four stacked against one
     temperature scale is the comparison this app exists to make, and it
     is the question actually being asked on a Saturday morning. After
     that it opens wherever it was left. */
  var saved = Store.s.getItem('thalweg:_shared:river');
  sel.value = (saved === null ? '' : saved);
  sel.addEventListener('change', function(){ selectRiver(sel.value); });
}

function selectRiver(id){
  state.riverId = id || null;
  try { Store.s.setItem('thalweg:_shared:river', id || ''); } catch(e){}
  $('#riverpick').value = id || '';

  /* Depth layers belong to the reach they were surveyed in. */
  Object.keys(state.layers).forEach(function(k){
    if (k.indexOf('r:') === 0){ state.map.removeLayer(state.layers[k]); delete state.layers[k]; }
  });
  state.soundingActive = false; state.soundingLayerId = null;
  state.soundingLayer.clearLayers();
  updateLegend();

  document.body.classList.toggle('all-rivers', !state.riverId);

  var river = state.riverId ? byId(state.riverId) : null;
  if (river){
    state.map.setView(river.center, river.zoom);
    /* The map has been display:none while All was showing. */
    setTimeout(function(){ if (state.map) state.map.invalidateSize(); }, 60);
    loadMarks(river.id);
  } else {
    state.markLayer.clearLayers(); state.marks = [];
    var b = RIVERS.reduce(function(acc, r){
      return [Math.min(acc[0],r.bbox[0]), Math.min(acc[1],r.bbox[1]),
              Math.max(acc[2],r.bbox[2]), Math.max(acc[3],r.bbox[3])];
    }, [180,90,-180,-90]);
    state.map.fitBounds([[b[1],b[0]],[b[3],b[2]]]);
  }
  /* The map tab exists only when a river does, so the strip is rebuilt
     rather than left showing a tab that leads nowhere. */
  selectTab(tabNames().indexOf(state.tab || 'water') === -1 ? 'water' : (state.tab || 'water'));
  announce(river ? river.name + ' selected.' : 'All rivers selected.');
  refreshData();
  renderWater(); renderMarks(); renderBrief();
  if (!document.getElementById('panel-layers').hidden) renderLayers();
  drawRibbon();
}

/* Live data is never served stale by the service worker. The page keeps
   the last good payload per river and the header says how old it is, in
   orange, because a number that looks current and is not is the whole
   failure this app has to avoid. */
/* A reading fetched ninety seconds ago is not stale, whatever the request
   after it did. The flag says "the last attempt did not succeed"; the WARNING
   is about how old the number on screen actually is, and conflating the two
   put "network did not answer" in orange over six readings timestamped that
   minute, on a cold open, with every request logged ok. Upstream publishes
   every fifteen minutes, so five is comfortably inside current. */
var FRESH_MS = 5 * 60 * 1000;
function looksOld(g){
  if (!g) return false;
  if (g.failed || g.noData) return true;      /* nothing arrived at all */
  if (!g.stale) return false;
  return !isNum(g.fetchedAt) || (Date.now() - g.fetchedAt) > FRESH_MS;
}

function updateStaleness(){
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;
  var worst = null, anyStale = false;
  rivers.forEach(function(r){
    var g = state.gauges[r.id];
    if (!g || !g.fetchedAt) return;
    if (worst === null || g.fetchedAt < worst) worst = g.fetchedAt;
    if (looksOld(g)) anyStale = true;
  });
  var out = '';
  if (worst === null){
    out = 'No readings yet';
  } else {
    var age = Date.now() - worst;
    if (anyStale || age > 45 * 60 * 1000)
      out = 'Flow and temperature ' + ageText(age) +
            (anyStale ? ' — network did not answer' : '');
  }
  $('#staleness').textContent = out;
}

function refreshData(){
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;
  rivers.forEach(function(river){
    var cached = sget(river.id,'gauges');
    if (cached && !state.gauges[river.id]){
      cached.stale = true; state.gauges[river.id] = cached;
      renderWater(); drawRibbon(); updateStaleness();
    }
    loadGauges(river).then(function(payload){
      state.gauges[river.id] = payload;
      renderWater(); drawRibbon(); updateStaleness(); drawGaugeMarkers();
      /* The trend goes out after the readings, not beside them: which gauge
         to ask for a week of flow is decided by which gauge answered for
         right now, and on All rivers nothing asks at all — four rivers of
         fifteen-minute history is most of a megabyte for four lines nobody
         opened. */
      /* Loaded whether or not this river is the one on screen: the strip is
         the point, and an alert that only appears once you have already
         picked the river is an alert for people who did not need it. 12.8KB
         against a landing that now costs about a megabyte. */
      if (river.weirs && !state.weirs[river.id]){
        loadWeirs(river).then(function(w){
          state.weirs[river.id] = w;
          updateWeirStrip();
          if (state.riverId === river.id) renderWater();
        });
      }
      if (state.riverId === river.id && !state.trends[river.id]){
        var stored = sget(river.id,'trend');
        if (stored){ stored.stale = true; state.trends[river.id] = stored; renderWater(); }
        loadTrend(river).then(function(tr){
          state.trends[river.id] = tr;
          if (state.riverId === river.id) renderWater();
        });
      }
    });
    if (river.tidal) loadTideFor(river);
  });
  if (state.riverId) loadCatalog().then(function(){
    if (!document.getElementById('panel-layers').hidden) renderLayers();
  });
}

function loadTideFor(river){
  discoverTideStations(river).then(function(found){
    var index = {};
    found.forEach(function(f){ index[f.id] = f; });
    /* A declared station keeps its provenance flag and takes its position
       and name from NOAA's index, so no station coordinate is ever typed
       into this app. */
    var declared = river.tideStations.map(function(s){
      var f = index[s.id] || {};
      return { id:s.id, name:f.name || s.hint, status:s.status,
               lat:isNum(f.lat) ? f.lat : null, lon:isNum(f.lon) ? f.lon : null };
    });
    var seen = {}; declared.forEach(function(s){ seen[s.id] = true; });
    /* A river box over the lower Delta catches most of the bay. Keep the
       declared stations, then the nearest handful, so the picker stays a
       picker. */
    var c = river.center;
    var near = found.filter(function(f){ return !seen[f.id]; })
      .map(function(f){
        f.d = Math.pow(f.lat - c[0], 2) + Math.pow(f.lon - c[1], 2);
        return f;
      })
      .sort(function(a, b){ return a.d - b.d; })
      .slice(0, 10);
    var stations = declared.concat(near);
    if (!stations.length){
      state.tides[river.id] = { failed:'no prediction station found for this reach' };
      renderWater(); return;
    }
    var pick = sget(river.id,'tidestation');
    var chosen = stations.filter(function(s){ return s.id === pick; })[0] || stations[0];
    return loadTide(river, chosen.id).then(function(t){
      t.stations = stations;
      state.tides[river.id] = t;
      renderWater();
    });
  });
}

function drawGaugeMarkers(){
  if (!state.gaugeLayer) return;
  state.gaugeLayer.clearLayers();
  var rivers = state.riverId ? [byId(state.riverId)] : RIVERS;
  rivers.forEach(function(river){
    var payload = state.gauges[river.id];
    if (!payload) return;
    payload.rows.forEach(function(r){
      if (!isNum(r.lat) || !isNum(r.lon)) return;
      var f = isNum(r.tempF) ? r.tempF : null;
      L.circleMarker([r.lat, r.lon], {
        radius:7, weight:2, color:'#0A1214', fillColor:tempColour(f), fillOpacity:.95
      }).bindPopup(labelNode(
        r.name || r.id,
        [[fmt(r.flow,0), 'cfs'], [fmt(r.stage,2), 'ft'],
         [fmt(f,1), 'F', f === null ? null : tempColour(f)]],
        (r.source ? r.source + ' ' : '#') + r.id +
        (r.at ? ' · ' + clockLocal(r.at) + ', ' + dayLocal(r.at) : '') +
        (r.context ? ' · tributary, not this river' : '')
      ), LABEL).addTo(state.gaugeLayer);
    });
  });
}

/* =====================================================================
   The weirs.

   Four of them sit on the Sacramento, and when one goes over its crest the
   river stops being one channel: water leaves for a bypass and takes what is
   swimming in it. That is a fact about where the river IS, not a forecast
   about anything, which is why it is here at all.

   The file carries NWPS forecast rows for the days ahead as well as the
   measured record. Only the measured record is read. A forecast of a weir
   overtopping is somebody's model, and this app does not repeat models.
   ===================================================================== */
function parseWeirs(text, list){
  var lines = String(text || '').split('\n');
  if (lines.length < 2) return null;
  var head = lines[0].split(',').map(function(h){ return h.trim(); });
  /* Columns are grouped per weir and named by the source; the crest column
     is found by its own header rather than by counting, so a column added
     upstream shifts nothing here. */
  var col = {};
  list.forEach(function(w){
    head.forEach(function(h, i){
      if (h.indexOf(w.code + ' ') === 0 && /above Crest/i.test(h)) col[w.code] = i;
    });
  });
  for (var r = 1; r < lines.length; r++){
    var cells = lines[r].split(',');
    var when = (cells[0] || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(when)) continue;   /* skips the forecast rows */
    var out = { at:when, over:[], quiet:[], unknown:[] };
    list.forEach(function(w){
      var i = col[w.code];
      var raw = i === undefined ? '' : String(cells[i] || '').trim();
      if (raw === '') { out.quiet.push(w); return; }
      var v = Number(raw);
      if (!isNum(v)) { out.unknown.push(w); return; }
      if (v > 0) out.over.push({ w:w, ft:v }); else out.quiet.push(w);
    });
    return out;
  }
  return null;
}

function loadWeirs(river){
  if (!river.weirs) return Promise.resolve(null);
  return getText(river.weirs.url, 20000).then(function(txt){
    var parsed = parseWeirs(txt, river.weirs.list);
    logNet('SacPAS weirs', river.weirs.url, true,
      parsed ? (parsed.over.length + ' over crest on ' + parsed.at) : 'no measured row found');
    return parsed || { failed:'the file had no measured row in it' };
  }, function(e){
    logNet('SacPAS weirs', river.weirs.url, false, String(e && e.message || e));
    return { failed:String(e && e.message || e) };
  });
}

/* The standing indicator. It says which weir, how far over and which river,
   because "a weir is over" is not actionable and "Tisdale is 1.4 ft over,
   water is leaving the Sacramento for the Sutter Bypass" is. */
function updateWeirStrip(){
  var strip = document.getElementById('weirstrip');
  if (!strip) return;
  var over = [];
  RIVERS.forEach(function(r){
    var w = state.weirs[r.id];
    if (!w || w.failed || !w.over) return;
    w.over.forEach(function(o){ over.push({ river:r, o:o }); });
  });
  if (!over.length){ strip.hidden = true; return; }
  over.sort(function(a,b){ return b.o.ft - a.o.ft; });
  var txt = document.getElementById('weirtext');
  txt.innerHTML = '';
  var first = over[0];
  txt.appendChild(el('b',{text:first.o.w.name + ' is ' + fmt(first.o.ft,1) + ' ft over its crest.'}));
  txt.appendChild(document.createTextNode(' Water is leaving the ' + first.river.short +
    ' for ' + first.o.w.into + ', and fish go with it.' +
    (over.length > 1 ? ' ' + (over.length - 1) +
      (over.length === 2 ? ' other weir is over too.' : ' other weirs are over too.') : '')));
  var go = document.getElementById('weirgo');
  go.onclick = function(){
    if (state.riverId !== first.river.id) selectRiver(first.river.id);
    selectTab('water');
    var h = [].slice.call(document.querySelectorAll('#panel-water .sec'))
      .filter(function(n){ return n.textContent === 'The weirs'; })[0];
    if (h) h.scrollIntoView({ block:'start' });
  };
  strip.hidden = false;
}

function weirSection(river){
  var box = el('div',{});
  var w = state.weirs[river.id];
  if (!w){ box.appendChild(el('p',{class:'note',text:'Asking about the weirs…'})); return box; }
  if (w.failed){
    box.appendChild(el('p',{class:'note',
      text:'No weir reading this time — ' + w.failed + '. That is not the same as none of them being over.'}));
    return box;
  }
  if (w.over.length){
    w.over.forEach(function(o){
      var p = el('p',{class:'warnbox'});
      p.appendChild(el('b',{text:o.w.name + ' is ' + fmt(o.ft,1) + ' ft over its crest.'}));
      p.appendChild(document.createTextNode(' Water is leaving the main river for ' +
        o.w.into + ', and fish go with it.'));
      box.appendChild(p);
    });
  } else {
    box.appendChild(el('p',{class:'note',
      text:'None of the four weirs is over its crest, so the river is in its own channel.'}));
  }
  if (w.unknown.length) box.appendChild(el('p',{class:'note',
    text:'No figure published for ' + w.unknown.map(function(x){ return x.w ? x.w.name : x.name; }).join(' or ') +
      ' in this file, so those are unknown rather than quiet.'}));
  box.appendChild(el('p',{class:'note',
    text:'Measured for ' + w.at + ', from ' + river.weirs.source +
      '. The same file carries a forecast for the days ahead; that is somebody’s model and is not repeated here.'}));
  return box;
}

/* =====================================================================
   The last seven days.

   A reading is a number; a trend is a decision. A river that has dropped
   two thousand cubic feet a second since Tuesday fishes differently from
   one that has just come up by the same amount, and in a single figure
   those two look identical.

   It is fetched for the river on screen only, and only for the gauges the
   figures already come from. NWIS publishes instantaneous values every
   fifteen minutes and will not downsample: a week of one parameter at one
   site is 55KB, and asking every gauge on the Sacramento for both flow and
   temperature is 429KB — measured — for a line three hundred pixels wide
   that cannot show a tenth of it. The daily-values service would be a
   twentieth of that and was tried first: it publishes NOTHING for water
   temperature at any of these sites and nothing for flow at two of them,
   so it cannot answer this question at all.
   ===================================================================== */
var TREND_DAYS = 7;
var TREND_MAX_POINTS = 240;   /* more than a phone-width line can show */

/* One series per site per parameter, oldest first. Same refusals as the
   current-reading parser: the sentinel is a missing reading, not a value. */
function parseUsgsSeries(j){
  var out = {};
  var ts = j && j.value && j.value.timeSeries;
  if (!Array.isArray(ts)) return out;
  ts.forEach(function(t){
    var si = t.sourceInfo || {};
    var code = si.siteCode && si.siteCode[0] && si.siteCode[0].value;
    var pc = t.variable && t.variable.variableCode && t.variable.variableCode[0]
             && t.variable.variableCode[0].value;
    if (!code || !pc) return;
    var vals = t.values && t.values[0] && t.values[0].value;
    if (!Array.isArray(vals) || !vals.length) return;
    var pts = [];
    vals.forEach(function(x){
      var v = Number(x.value);
      if (!isFinite(v) || v <= -999998) return;
      var when = Date.parse(x.dateTime);
      if (!isFinite(when)) return;
      pts.push({ t:when, v: pc === '00010' ? cToF(v) : v });
    });
    if (!pts.length) return;
    pts.sort(function(a,b){ return a.t - b.t; });
    (out[code] || (out[code] = {}))[pc === '00010' ? 'temp' : pc === '00060' ? 'flow' : pc] = pts;
  });
  return out;
}

function usgsTrend(ids){
  var url = USGS + '?format=json&sites=' + ids.join(',') +
            '&parameterCd=00060,00010&period=P' + TREND_DAYS + 'D&siteStatus=all';
  /* Longer than the current-reading request, because this one is a hundred
     kilobytes or more and a phone on a bar of signal is the normal case. */
  return getJSON(url, 45000).then(function(j){
    var parsed = parseUsgsSeries(j);
    logNet('USGS trend', url, true, Object.keys(parsed).length + ' site(s) with history');
    return parsed;
  }, function(e){
    logNet('USGS trend', url, false, String(e && e.message || e));
    throw e;
  });
}

/* CDEC does downsample, and hourly is plenty for a week: 27KB a station
   against 27KB an hour's worth of the fifteen-minute record. */
function cdecTrend(river){
  var list = river.cdecGauges || [];
  if (!list.length) return Promise.resolve({});
  var start = new Date(); start.setDate(start.getDate() - TREND_DAYS);
  var end   = new Date(); end.setDate(end.getDate() + 1);
  function ymdDash(d){
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  var url = cdecUrl(CDEC_PATH + '?Stations=' + list.map(function(g){ return g.id; }).join(',') +
    '&SensorNums=20,25&dur_code=H&Start=' + ymdDash(start) + '&End=' + ymdDash(end));
  return getJSON(url, 45000).then(function(rows){
    var out = {};
    (Array.isArray(rows) ? rows : []).forEach(function(r){
      var id = r && r.stationId;
      if (!id) return;
      var v = Number(r.value);
      if (!isNum(v) || v <= -9998) return;
      var when = cdecDate(r.obsDate || r.date);
      if (!when) return;
      var units = String(r.units || '').toUpperCase();
      var site = out[id] || (out[id] = {});
      /* The same unit check as the current reading. A sensor renumbered or
         re-scaled at the far end produces no line rather than a wrong one. */
      if (r.SENSOR_NUM === 20 && units === 'CFS')
        (site.flow || (site.flow = [])).push({ t:when.getTime(), v:v });
      if (r.SENSOR_NUM === 25 && (units === 'DEG F' || units === 'DEG C'))
        (site.temp || (site.temp = [])).push({ t:when.getTime(),
          v: units === 'DEG C' ? cToF(v) : v });
    });
    Object.keys(out).forEach(function(id){
      Object.keys(out[id]).forEach(function(k){
        out[id][k].sort(function(a,b){ return a.t - b.t; });
      });
    });
    logNet('CDEC trend', url, true, Object.keys(out).length + ' station(s) with history');
    return out;
  }, function(e){
    logNet('CDEC trend', url, false, String(e && e.message || e));
    throw e;
  });
}

/* Which gauges to ask. Flow comes from whichever gauge the card already
   names, so the line and the figure above it cannot disagree; temperature
   from that same gauge if it has a thermometer, and otherwise from the
   first on-river gauge that does — Verona measures the Sacramento's
   discharge and has no thermometer at all, so on that river these are two
   different sites and the panel says which is which. */
function trendSites(river){
  var payload = state.gauges[river.id];
  if (!payload || !payload.rows) return null;
  var flow = downstreamFlow(river);
  var rows = payload.rows.filter(function(r){ return !r.context && isNum(r.tempF); });
  /* Nearest first, along the river's own axis, so the temperature comes
     from near the water the flow figure describes rather than from
     whichever gauge happens to be listed first. */
  if (flow){
    var at = null;
    payload.rows.forEach(function(r){ if (r.id === flow.id) at = axisValue(river, r); });
    if (isNum(at)) rows = rows.slice().sort(function(a,b){
      var da = isNum(axisValue(river,a)) ? Math.abs(axisValue(river,a) - at) : 1e9;
      var db = isNum(axisValue(river,b)) ? Math.abs(axisValue(river,b) - at) : 1e9;
      return da - db;
    });
  }
  /* TWO temperature candidates, not one, and this is why: Verona reports a
     temperature right now and publishes no history for it at all, so the
     obvious rule — ask the gauge the flow figure came from — produced a
     Sacramento with a flow line and the words "no temperature history" on
     the river with the most instrumented reach in the state. Whether a site
     publishes a week of a parameter cannot be known without asking, so ask
     two and draw whichever answers. */
  var temp = rows.slice(0, 2).map(function(r){
    return { id:r.id, name:r.name || r.id, source:r.source };
  });
  if (!flow && !temp.length) return null;
  return {
    flow: flow ? { id:flow.id, name:flow.name, source:flow.source, tidal:flow.tidal } : null,
    temp: temp
  };
}

function loadTrend(river){
  var want = trendSites(river);
  if (!want) return Promise.resolve({ failed:'no gauge to read a trend from yet' });
  var ids = {};
  if (want.flow) ids[want.flow.id] = want.flow.source || 'USGS';
  want.temp.forEach(function(t){ ids[t.id] = t.source || 'USGS'; });
  var usgs = Object.keys(ids).filter(function(k){ return ids[k] !== 'CDEC'; });
  var cdec = Object.keys(ids).filter(function(k){ return ids[k] === 'CDEC'; });

  /* Which request failed matters, and it took a live run to notice why: a
     USGS timeout with no CDEC request beside it left an empty series set and
     every gauge was then reported as publishing NO HISTORY — a confident
     claim about the American River, which publishes a full week, produced by
     a request that never arrived. A refusal and an absence are different
     facts and this app is not allowed to print one as the other. */
  var failed = [];
  var jobs = [
    usgs.length ? usgsTrend(usgs).catch(function(){ failed.push('USGS'); return null; })
                : Promise.resolve({}),
    cdec.length ? cdecTrend(river).catch(function(){ failed.push('CDEC'); return null; })
                : Promise.resolve({})
  ];
  return Promise.all(jobs).then(function(res){
    if (failed.length){
      var cached = sget(river.id,'trend');
      if (cached){ cached.stale = true; return cached; }
      return { failed: failed.join(' and ') + ' did not answer' };
    }
    var series = {};
    [res[0] || {}, res[1] || {}].forEach(function(set){
      Object.keys(set).forEach(function(k){ series[k] = set[k]; });
    });
    var out = { fetchedAt: Date.now(), days: TREND_DAYS,
      flow: null, temp: null, tidal: !!(want.flow && want.flow.tidal) };
    if (want.flow && series[want.flow.id] && series[want.flow.id].flow)
      out.flow = { site:want.flow.id, name:want.flow.name, source:want.flow.source || 'USGS',
                   pts:series[want.flow.id].flow };
    want.temp.some(function(t){
      if (!series[t.id] || !series[t.id].temp) return false;
      out.temp = { site:t.id, name:t.name, source:t.source || 'USGS', pts:series[t.id].temp };
      return true;
    });
    /* A site that answers the current-reading request and publishes no
       history is a real state, not an error: every Mokelumne gauge does
       exactly that. Say which gauge was asked, so it is a fact rather
       than an absence. */
    /* CDEC's date range starts at midnight, so a seven-day request comes
       back with eight days in it and the sentence under the line said
       "over 8 days" beneath a heading that said seven. Clip to the window
       actually claimed. */
    var floor = Date.now() - TREND_DAYS * 24 * 3600 * 1000;
    ['flow','temp'].forEach(function(k){
      if (out[k]) out[k].pts = out[k].pts.filter(function(pt){ return pt.t >= floor; });
      if (out[k] && out[k].pts.length < 2) out[k] = null;
    });
    out.noHistory = [];
    if (want.flow && !out.flow) out.noHistory.push({ what:'flow', name:want.flow.name, id:want.flow.id });
    if (want.temp.length && !out.temp) out.noHistory.push({ what:'temperature',
      name: want.temp.map(function(t){ return t.name; }).join(' or '),
      id: want.temp.map(function(t){ return t.id; }).join(', ') });
    /* Stored trimmed: the drawn line cannot use more points than this and
       a week of fifteen-minute values will not fit a storage quota. */
    var slim = { fetchedAt:out.fetchedAt, days:out.days, tidal:out.tidal, noHistory:out.noHistory,
      flow: out.flow ? { site:out.flow.site, name:out.flow.name, source:out.flow.source,
                         pts:thin(out.flow.pts, TREND_MAX_POINTS) } : null,
      temp: out.temp ? { site:out.temp.site, name:out.temp.name, source:out.temp.source,
                         pts:thin(out.temp.pts, TREND_MAX_POINTS) } : null };
    sput(river.id,'trend', slim);
    return out;
  });
}

/* Keep the ends and the extremes, drop from the middle. A line that loses
   its peak has lost the only part of it anybody was looking for. */
function thin(pts, max){
  if (!pts || pts.length <= max) return pts || [];
  var keep = {}, lo = 0, hi = 0;
  pts.forEach(function(p,i){ if (p.v < pts[lo].v) lo = i; if (p.v > pts[hi].v) hi = i; });
  keep[0] = keep[pts.length-1] = keep[lo] = keep[hi] = true;
  var step = (pts.length - 1) / (max - 1);
  for (var i = 0; i < max; i++) keep[Math.round(i * step)] = true;
  return pts.filter(function(p,i){ return keep[i]; });
}

/* What the line says, in words, because a shape is not a fact and colour
   is never the only thing carrying one here. */
function trendStats(pts, band){
  if (!pts || pts.length < 2) return null;
  var first = pts[0], last = pts[pts.length-1];
  var lo = pts[0], hi = pts[0];
  pts.forEach(function(p){ if (p.v < lo.v) lo = p; if (p.v > hi.v) hi = p; });
  var delta = last.v - first.v;
  var base = Math.abs(first.v) > 1e-6 ? Math.abs(first.v) : null;
  var pct = base ? (delta / base) * 100 : null;
  var dir = Math.abs(delta) < band ? 'steady' : (delta > 0 ? 'up' : 'down');
  var day = null;
  var cutoff = last.t - 24*3600*1000;
  for (var i = pts.length - 1; i >= 0; i--){ if (pts[i].t <= cutoff){ day = pts[i]; break; } }
  return { first:first, last:last, lo:lo, hi:hi, delta:delta, pct:pct, dir:dir,
           dayDelta: day ? last.v - day.v : null,
           span: (last.t - first.t) / (24*3600*1000) };
}

/* The line. Drawn at the width it is actually rendered at, for the reason
   the ribbon is: a fixed viewBox squeezed into a phone renders every
   figure at a fraction of its stated size and leaves the difference as
   dead space. */
function svgText(attrs, str){
  var n = svg('text', attrs); n.textContent = str; return n;
}

function sparkline(pts, opts){
  var W = Math.max(opts.width || 320, 220), H = opts.height || 64;
  var padL = 4, padR = 4, padT = 8, padB = 14;
  var host = svg('svg', { viewBox:'0 0 ' + W + ' ' + H, width:W, height:H,
    class:'spark', role:'img', 'aria-label':opts.label || '' });
  if (!pts || pts.length < 2) return host;
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  var lo = pts[0].v, hi = pts[0].v;
  pts.forEach(function(p){ if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; });
  var pad = (hi - lo) || Math.abs(hi) * 0.02 || 1;
  lo -= pad * 0.12; hi += pad * 0.12;
  function X(t){ return padL + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - padL - padR); }
  function Y(v){ return padT + (1 - (v - lo) / ((hi - lo) || 1)) * (H - padT - padB); }

  /* A day grid, so "how fast" has something to be fast against. */
  var dayMs = 24*3600*1000;
  for (var t = t1; t > t0; t -= dayMs)
    host.appendChild(svg('line', { x1:X(t), x2:X(t), y1:padT, y2:H-padB, class:'spark-grid' }));

  var d = pts.map(function(p,i){ return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
  host.appendChild(svg('path', { d:d + ' L' + X(t1).toFixed(1) + ' ' + (H-padB) +
    ' L' + X(t0).toFixed(1) + ' ' + (H-padB) + ' Z', class:'spark-fill',
    fill: opts.stroke || 'currentColor' }));
  host.appendChild(svg('path', { d:d, class:'spark-line',
    'vector-effect':'non-scaling-stroke',
    stroke: opts.stroke || 'currentColor' }));
  var last = pts[pts.length-1];
  host.appendChild(svg('circle', { cx:X(last.t), cy:Y(last.v), r:3, class:'spark-now',
    fill: opts.stroke || 'currentColor' }));
  host.appendChild(svgText({ x:padL, y:H-3, class:'spark-ax' }, opts.days + ' days ago'));
  host.appendChild(svgText({ x:W-padR, y:H-3, class:'spark-ax', 'text-anchor':'end' }, 'now'));
  return host;
}

/* A box the line is drawn INTO after it is on the page, not a line drawn
   at a width guessed beforehand. The ribbon was built the other way and
   rendered every figure at half size inside a viewBox four times the space
   it had; the difference is invisible until it is measured, so the width
   comes from the element itself. */
function sparkHost(pts, opts){
  var host = el('div',{class:'spark-host'});
  host._draw = function(w){
    host.innerHTML = '';
    var o = {}; for (var k in opts) o[k] = opts[k];
    o.width = w;
    host.appendChild(sparkline(pts, o));
  };
  return host;
}

function drawTrendLines(){
  var hosts = document.querySelectorAll('#panel-water .spark-host');
  Array.prototype.forEach.call(hosts, function(h){
    if (h._draw) h._draw(Math.max(h.clientWidth || 300, 220));
  });
}

function trendSection(river){
  var box = el('div',{});
  var tr = state.trends[river.id];
  if (!tr){ box.appendChild(el('p',{class:'note',text:'Loading the last seven days…'})); return box; }
  if (tr.failed){
    box.appendChild(el('p',{class:'note',
      text:'No history this time — ' + tr.failed + '. The readings above are unaffected.'}));
    return box;
  }
  if (tr.stale) box.appendChild(el('div',{class:'warnbox',
    text:'Stored history, ' + ageText(Date.now() - tr.fetchedAt) +
         '. The network did not answer, so this is the last week that arrived.'}));

  if (tr.flow){
    var fs = trendStats(tr.flow.pts, Math.max(Math.abs(tr.flow.pts[0].v) * 0.03, 5));
    var line = el('p',{class:'trend-say'});
    if (tr.tidal){
      line.textContent = 'Flow at ' + tr.flow.name + ' swings with the tide, so the ' +
        'shape below is the tide rather than what the river is carrying. There is no ' +
        'gauge above the tide on this river to ask instead.';
    } else if (fs){
      var word = fs.dir === 'steady' ? 'Steady' : fs.dir === 'up' ? 'Rising' : 'Falling';
      line.textContent = word + ' — ' + commas(fmt(fs.last.v,0)) + ' cfs now, ' +
        (fs.dir === 'steady' ? 'within ' : fs.delta > 0 ? 'up ' : 'down ') +
        commas(fmt(Math.abs(fs.delta),0)) + ' cfs' +
        (fs.pct === null ? '' : ' (' + fmt(Math.abs(fs.pct),0) + '%)') +
        ' over ' + fmt(fs.span,0) + ' days' +
        (fs.dayDelta === null ? '' :
          ', ' + (Math.abs(fs.dayDelta) < 1 ? 'level' :
            (fs.dayDelta > 0 ? 'up ' : 'down ') + commas(fmt(Math.abs(fs.dayDelta),0))) +
          ' in the last day') + '.';
    }
    box.appendChild(el('h3',{class:'trend-h',text:'Flow — ' + tr.flow.name}));
    box.appendChild(line);
    box.appendChild(sparkHost(tr.flow.pts, { days:tr.days, stroke:'var(--cyan)',
      label: 'Flow at ' + tr.flow.name + ' over ' + tr.days + ' days. ' + line.textContent }));
    box.appendChild(el('p',{class:'rdg-id',
      text: (tr.flow.source || 'USGS') + ' ' + tr.flow.site + ' · low ' +
        commas(fmt(trendStats(tr.flow.pts,0).lo.v,0)) + ', high ' +
        commas(fmt(trendStats(tr.flow.pts,0).hi.v,0)) + ' cfs over the week'}));
  }

  if (tr.temp){
    var ts = trendStats(tr.temp.pts, 0.5);
    var tline = el('p',{class:'trend-say'});
    if (ts){
      var tword = ts.dir === 'steady' ? 'Steady' : ts.dir === 'up' ? 'Warming' : 'Cooling';
      tline.textContent = tword + ' — ' + fmt(ts.last.v,1) + 'F now, ' +
        (ts.dir === 'steady' ? 'within ' : ts.delta > 0 ? 'up ' : 'down ') +
        fmt(Math.abs(ts.delta),1) + 'F over ' + fmt(ts.span,0) + ' days' +
        (ts.dayDelta === null ? '' :
          ', ' + (Math.abs(ts.dayDelta) < 0.2 ? 'level' :
            (ts.dayDelta > 0 ? 'up ' : 'down ') + fmt(Math.abs(ts.dayDelta),1)) +
          ' in the last day') + '.';
    }
    box.appendChild(el('h3',{class:'trend-h',text:'Water temperature — ' + tr.temp.name}));
    box.appendChild(tline);
    box.appendChild(sparkHost(tr.temp.pts, { days:tr.days,
      stroke: tempColour(tr.temp.pts[tr.temp.pts.length-1].v),
      label: 'Water temperature at ' + tr.temp.name + ' over ' + tr.days + ' days. ' + tline.textContent }));
    box.appendChild(el('p',{class:'rdg-id',
      text: (tr.temp.source || 'USGS') + ' ' + tr.temp.site + ' · low ' +
        fmt(trendStats(tr.temp.pts,0).lo.v,1) + ', high ' +
        fmt(trendStats(tr.temp.pts,0).hi.v,1) + 'F over the week'}));
  }

  (tr.noHistory || []).forEach(function(n){
    var many = n.id.indexOf(',') !== -1;
    box.appendChild(el('p',{class:'note',
      text:'No ' + n.what + ' history at ' + n.name + ' (' + n.id + '). ' +
        (many ? 'They answer' : 'It answers') + ' for right now and ' +
        (many ? 'publish' : 'publishes') +
        ' nothing back over the week, so there is no line to draw.'}));
  });

  if (!tr.flow && !tr.temp && !(tr.noHistory || []).length)
    box.appendChild(el('p',{class:'note',text:'No history published for this reach.'}));

  box.appendChild(el('p',{class:'note',
    text:'What the line is: every reading the service published over the last ' +
      tr.days + ' days, thinned to fit the width, with the day marks behind it. ' +
      'Nothing here is smoothed, predicted or extended past the last reading.'}));
  return box;
}

/* =====================================================================
   How deep is it HERE.

   The published surveys are already drawn as a coloured surface; reading a
   colour off a ramp is not a depth. This asks the service for the number
   under the point.

   Two requests, in order, because one is not enough. `identify` returns the
   pixel and is exact — but a survey's rectangular extent is mostly land: of
   four hundred points sampled across the Sacramento survey's whole box,
   ONE had a value. A fingertip covers about a hundred metres at the zoom
   people actually use, so a single-pixel question misses the surveyed
   ribbon nearly every time and answers NoData, which reads as "no survey
   here" when it means "not that exact pixel". So a miss falls through to
   `getSamples` over a hundred metres square, and the nearest point with a
   value is reported WITH ITS DISTANCE, which is the honest form of the
   answer: not the depth where you tapped, but the depth of the nearest
   place anybody measured, and how far away that is.
   ===================================================================== */
var DEPTH_SPAN_M = 100;      /* half-width of the fallback search box */
var DEPTH_MAX_SURVEYS = 3;   /* how many overlapping surveys to ask */

function metresBetween(aLat, aLon, bLat, bLon){
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (bLat - aLat) * rad, dLon = (bLon - aLon) * rad;
  var s = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(aLat*rad) * Math.cos(bLat*rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

/* DWR names these services with the survey date in them. It is read rather
   than assumed: a name without one yields no date and the panel says the
   date is unknown instead of inventing one. */
function surveyDate(name){
  var m = /_(\d{4})(\d{2})(\d{2})_/.exec(String(name || ''));
  if (!m) return null;
  return m[1] + '-' + m[2] + '-' + m[3];
}

/* DWR's service names are machine names: Bathy_NCRO_20230208_SacramentoRiver.
   The reader gets the readable part and the machine name stays beside it, so
   what is on screen can still be matched to what is in the catalogue. */
function surveyLabel(name){
  /* Two naming schemes, both machine names: Bathy_NCRO_20230208_River for a
     multibeam service and i06_Bathy_AGENCY_YEAR_Place for a single beam
     layer. Strip the scheme, keep the place, and leave any year in it —
     a reader choosing between a 1933 survey and a 2024 one needs that. */
  var rest = String(name || '')
    .replace(/^i\d+[_\s]*/i, '')
    .replace(/^Bathy[_\s]*/i, '')
    .replace(/^NCRO[_\s]*/i, '')
    .replace(/^\d{8}[_\s]*/, '');
  rest = rest.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2')
             .replace(/\s+/g, ' ').trim();
  return rest || String(name || 'unnamed survey');
}

function boxHas(box, lat, lon){
  return !!box && lat >= box.s && lat <= box.n && lon >= box.w && lon <= box.e;
}

/* Which surveys cover this point, newest first, with whatever is switched
   on put at the front so the number agrees with the colours on screen. */
function surveysAt(lat, lon){
  var cat = state.catalog;
  if (!cat || !cat.raster) return [];
  var hits = cat.raster.filter(function(r){ return boxHas(r.box, lat, lon); });
  hits.forEach(function(r){ r._date = surveyDate(r.name); });
  hits.sort(function(a, b){
    var aOn = state.layers['r:' + a.name] ? 1 : 0, bOn = state.layers['r:' + b.name] ? 1 : 0;
    if (aOn !== bOn) return bOn - aOn;
    return String(b._date || '').localeCompare(String(a._date || ''));
  });
  return hits;
}

function identifyDepth(path, lat, lon){
  var url = dwr(path + '/identify?f=json&returnGeometry=false&geometryType=esriGeometryPoint' +
    '&geometry=' + encodeURIComponent(JSON.stringify({ x:lon, y:lat, spatialReference:{ wkid:4326 } })));
  return getJSON(url, 20000).then(function(j){
    var v = j && j.value;
    if (v === undefined || v === null || v === '' || v === 'NoData') return null;
    var n = Number(v);
    return isNum(n) ? n : null;
  });
}

/* A square of samples, in the coordinate system the app already works in,
   so nothing here has to know how the survey was projected. */
function sampleNearest(path, lat, lon){
  var d = DEPTH_SPAN_M / 111320;                      /* metres to degrees */
  var dx = d / Math.max(Math.cos(lat * Math.PI / 180), 0.2);
  var g = { xmin:lon-dx, ymin:lat-d, xmax:lon+dx, ymax:lat+d, spatialReference:{ wkid:4326 } };
  var url = dwr(path + '/getSamples?f=json&outSR=4326&geometryType=esriGeometryEnvelope' +
    '&sampleCount=100&geometry=' + encodeURIComponent(JSON.stringify(g)));
  return getJSON(url, 20000).then(function(j){
    var best = null;
    (j && j.samples || []).forEach(function(s){
      if (s.value === '' || s.value === 'NoData' || s.value === null || s.value === undefined) return;
      var v = Number(s.value);
      if (!isNum(v) || !s.location) return;
      var sl = Number(s.location.y), so = Number(s.location.x);
      if (!isNum(sl) || !isNum(so)) return;
      var m = metresBetween(lat, lon, sl, so);
      if (!best || m < best.m) best = { v:v, m:m, lat:sl, lon:so };
    });
    return best;
  });
}

/* The answer, in the order a person would want it: the number under the
   point; failing that the nearest measured point and how far; failing that
   which surveys cover here and could not answer; failing that that none
   does. Each of those is a different fact and none of them is a dash. */
function depthAt(lat, lon){
  /* Not knowing and knowing there is nothing are different answers, and the
     first must never be printed as the second: with no catalogue loaded,
     "no survey covers this point" is a claim about California made by an
     app that has not asked. Same shape as a history request that timed out
     being reported as a gauge publishing nothing. */
  if (!state.catalog || !state.catalog.raster || !state.catalog.raster.length)
    return Promise.resolve({ none:'nocatalog', covering:[] });
  var covering = surveysAt(lat, lon);
  if (!covering.length)
    return Promise.resolve({ none:'nowhere', covering:[] });
  var list = covering.slice(0, DEPTH_MAX_SURVEYS);

  function tryIdentify(i){
    if (i >= list.length) return Promise.resolve(null);
    return identifyDepth(list[i].path, lat, lon).then(function(v){
      if (isNum(v)) return { value:v, survey:list[i], exact:true };
      return tryIdentify(i + 1);
    }, function(){ return tryIdentify(i + 1); });
  }

  return tryIdentify(0).then(function(hit){
    if (hit) return hit;
    return sampleNearest(list[0].path, lat, lon).then(function(near){
      if (near) return { value:near.v, survey:list[0], exact:false,
                         away:near.m, lat:near.lat, lon:near.lon };
      return { none:'notmeasured', covering:list };
    }, function(e){
      return { failed:String(e && e.message || e), covering:list };
    });
  });
}

/* The reading, as a label on the map where the finger is. */
function showDepthAt(lat, lon){
  if (!state.map) return;
  var pop = L.popup(LABEL).setLatLng([lat, lon])
    .setContent(depthNode({ loading:true }, lat, lon)).openOn(state.map);
  depthAt(lat, lon).then(function(res){
    pop.setContent(depthNode(res, lat, lon));
    pop.update();
    announce(depthSentence(res));
  });
}

function depthSentence(res){
  if (res.loading) return 'Reading the depth…';
  if (res.failed)  return 'The depth service did not answer.';
  if (res.none === 'nocatalog') return 'The survey directory has not arrived, so this cannot be answered yet.';
  if (res.none === 'nowhere') return 'No published survey covers this point.';
  if (res.none === 'notmeasured')
    return 'No measured depth within ' + DEPTH_SPAN_M + ' metres of this point.';
  return fmt(Math.abs(res.value), 1) + ' feet ' +
    (res.value <= 0 ? 'deep' : 'ABOVE the survey datum — bank, not bottom') +
    (res.exact ? ' here' : ', ' + fmt(res.away, 0) + ' metres away') + '.';
}

function depthNode(res, lat, lon){
  var box = el('div',{});
  box.appendChild(el('span',{class:'pop-name',text:'Depth here'}));

  if (res.loading){
    box.appendChild(el('p',{class:'note',text:'Asking the survey…'}));
    return box;
  }
  if (res.failed){
    box.appendChild(el('p',{class:'err',
      text:'The survey did not answer: ' + res.failed + '. Nothing is shown, because nothing is known.'}));
    return box;
  }
  if (res.none === 'nocatalog'){
    box.appendChild(el('p',{class:'note',
      text:'The survey directory has not arrived, so this cannot be answered yet. That is not the same as there being no survey here — it means nothing has been asked.'}));
    return box;
  }
  if (res.none === 'nowhere'){
    box.appendChild(el('p',{class:'note',
      text:'No published survey covers this point. Where the state has not measured, this app has nothing to tell you and will not guess.'}));
    return box;
  }
  if (res.none === 'notmeasured'){
    box.appendChild(el('p',{class:'note',
      text:'Nothing measured within ' + DEPTH_SPAN_M + ' metres. ' +
        (res.covering.length === 1 ? 'One survey covers' : res.covering.length + ' surveys cover') +
        ' this point and none of them has a reading here — weed stops a sounder returning, and those patches are dropped rather than filled in.'}));
    return box;
  }

  /* A survey publishes elevation against its own datum: below it is
     negative and that is the depth. A POSITIVE reading is ground above the
     datum — bank, or a bar that was dry when the boat went past — and
     printing its absolute value as a depth would turn dry land into eleven
     feet of water. It is said as what it is instead. */
  var below = res.value <= 0;
  var v = el('div',{class:'pop-vals'});
  var s = el('span',{class:'v water'});
  s.appendChild(document.createTextNode(fmt(Math.abs(res.value), 1)));
  s.appendChild(el('small',{text:'ft'}));
  v.appendChild(s);
  box.appendChild(v);
  if (!below) box.appendChild(el('div',{class:'err',
    text:'That reading is ABOVE the survey’s datum, not below it. This is bank or a bar that was dry when the survey boat went past, not depth of water.'}));

  box.appendChild(el('span',{class:'pop-sub',
    text: res.exact
      ? 'at the point you asked for'
      : fmt(res.away, 0) + ' m away — the nearest place this survey measured'}));
  box.appendChild(el('span',{class:'pop-sub',
    text: surveyLabel(res.survey.name) +
      (res.survey._date ? ', surveyed ' + res.survey._date : ', survey date not published') +
      ' · ' + res.survey.name}));
  box.appendChild(el('p',{class:'note',
    text:'As the survey published it. Thalweg does not restate a vertical datum it has not checked, so treat this as relative, not as a chart sounding. Not for navigation.'}));

  var keep = el('button',{type:'button',text:'Keep this as a mark'});
  keep.addEventListener('click', function(){
    addMark(res.exact ? lat : res.lat, res.exact ? lon : res.lon, {
      depth: res.value, depthFrom: surveyLabel(res.survey.name), depthDate: res.survey._date,
      depthAway: res.exact ? 0 : Math.round(res.away) });
    state.map.closePopup();
  });
  if (state.riverId) box.appendChild(el('div',{class:'rowline'},[keep]));
  else box.appendChild(el('p',{class:'note',
    text:'Pick a river and this can be kept as a mark; a mark belongs to one river.'}));
  return box;
}

/* Which device this is, so the install instructions lead with the one that
   applies. iPadOS Safari calls itself macOS, so the touch count is what
   separates an iPad from a Mac. */
function platformGuess(){
  var ua = navigator.userAgent || '', touch = (navigator.maxTouchPoints || 0) > 1;
  if (/iPhone|iPod/.test(ua)) return 'iphone';
  if (/iPad/.test(ua) || (touch && /Macintosh/.test(ua))) return 'ipad';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}
var INSTALL = [
  { id:'iphone',  label:'iPhone, in Safari',

    how:'Tap the three-dot menu, then Install app, or Add to home screen.' },

];
function installList(){

    li.appendChild(el('b',{ text:p.label + (p.id === here ? ' — this device. ' : '. ') }));
    li.appendChild(document.createTextNode(p.how));
    ul.appendChild(li);
  });
  return ul;
}

  });

  h('Something looks wrong');
  para('Two taps. Copy the diagnostic, then open a report and paste it in. The diagnostic is plain text you can read before you send it: it says which build you have, what kind of device, which of the services answered and which did not, and how old the readings are. It contains nothing you typed and none of your marks — only how many you have.');
  var btn = el('button',{type:'button',text:'Copy diagnostic report'});
  var ta = el('textarea',{readonly:'readonly','aria-label':'Diagnostic report'});
  btn.addEventListener('click', function(){
    diagnostic().then(function(txt){
      ta.value = txt; ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
      btn.textContent = 'Copied';
      setTimeout(function(){ btn.textContent = 'Copy diagnostic report'; }, 2500);
      announce('Diagnostic report copied.');
    });
  });
  var row = el('div',{class:'rowline'});
  row.appendChild(btn);
  row.appendChild(el('a',{ href:reportUrl(), target:'_blank', rel:'noopener noreferrer',
    text:'Open a report' }));
  b.appendChild(row);
  diagnostic().then(function(t){ ta.value = t; });
  b.appendChild(ta);

  h('Where the numbers come from');
  para('Nothing here is measured by this app. It redraws what four public services publish, and says which one each number came from.');
  var u3 = el('ul',{class:'tight'});
  [ ['River flow, height and temperature — the US Geological Survey',
     'https://waterdata.usgs.gov/ca/nwis/current/?type=flow'],
    ['The Feather River’s gauges — California DWR, through CDEC, because USGS publishes nothing current for that river',
     'https://cdec.water.ca.gov/'],
    ['Tide predictions — NOAA, to the MLLW datum',
     'https://tidesandcurrents.noaa.gov/'],
    ['Depth surveys — California DWR',
     'https://data.cnra.ca.gov/dataset/i06-singlebeam-bathymetry'],
    ['Season and limits — CDFW, Title 14 section 7.40',
     'https://wildlife.ca.gov/Regulations/Freshwater-Sport-Fishing']
  ].forEach(function(s){
    var li = el('li',{});
    li.appendChild(el('a',{href:s[1],rel:'noopener noreferrer',target:'_blank',text:s[0]}));
    u3.appendChild(li);
  });
  b.appendChild(u3);
  para('Each of those sets its own terms and is the authority on its own data. Where a reading is missing you get a dash, never a zero.');

  h('Reading depth honestly');
  para('Weed beats a depth sounder. Where the growth is thick the survey boat gets no return from the bottom, and those patches are dropped — so a blank space beside a tule edge is water nobody measured, not flat ground. In weedy water a reading may be the top of the weed rather than the bed.');
  para('The single beam surveys are lines, not sheets: dots along the track the boat drove. Between two tracks nothing was measured, and nothing is drawn. And every survey is a photograph of one day — sand moves.');
  para('Where a reach has no published survey at all, the Layers panel says so in words instead of offering you a switch that turns nothing on.');

  h('Getting around it without a pointer');
  para('Every control takes the keyboard, with a visible focus ring, and the panels are a proper tab list you can walk with the arrow keys. The map pans with the arrow keys and zooms with plus and minus once it has focus. Two things that look like they need a finger do not: Add at map centre in the Marks panel drops a mark, and Read the depth at the map centre in the Layers panel asks the survey the same question a tap on the map asks.');
  para('Colour is never the only thing carrying a fact: every temperature dot has its figure beside it and every provenance flag is a word. Reduced motion is honoured. If anything here is unusable for you that is a fault worth reporting, and the button above is how.');

  h('Where this came from');
  para('Thalweg is one of a set of free apps, all of them built the same way: no account, no tracking, no third-party code, and yours to keep. The accessibility statement below is shared across all of them, so the commitments it makes are the same ones this app is held to.');
  var hubRow = el('div',{class:'rowline'});
  hubRow.appendChild(el('a',{href:'https://noahjefferson.pages.dev',
    rel:'noopener noreferrer', target:'_blank', text:'The rest of the apps'}));
  hubRow.appendChild(el('a',{href:'https://noahjefferson.pages.dev/accessibility',
    rel:'noopener noreferrer', target:'_blank', text:'Accessibility statement'}));
  b.appendChild(hubRow);

  h('Licence');
  para('PolyForm Noncommercial 1.0.0 — free to use, study and change for anything that is not commercial. The map library is Leaflet 1.9.4, included under its own BSD-2-Clause licence.');
}

/* Which build is live, for the panel and for a screenshot. */
function buildLine(){
  return fetch('version', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.commit) return 'build not identified on this host';
      return 'build ' + j.commit.slice(0,7) + (j.branch ? ' (' + j.branch + ')' : '');
    })
    .catch(function(){ return 'build unknown — offline'; });
}

/* Doctrine §7f: a text report that carries what the browser string hides.
   iPadOS Safari reports itself as macOS, so maxTouchPoints is what tells
   an iPad from a Mac. */
function diagnostic(){
  var lines = [];
  function L(k,v){ lines.push(k + ': ' + v); }
  L('Thalweg', VERSION);
  L('When', new Date().toISOString());
  L('User agent', navigator.userAgent);
  L('maxTouchPoints', navigator.maxTouchPoints);
  L('Platform hint', (navigator.maxTouchPoints > 1 &&
      /Macintosh/.test(navigator.userAgent)) ? 'touch device reporting as macOS (an iPad)' : 'as reported');
  L('Viewport', window.innerWidth + 'x' + window.innerHeight +
      ' at dpr ' + (window.devicePixelRatio || 1));
  L('Display mode', window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
      ? 'standalone (installed)' : 'browser tab');
  L('Storage backend', Store.kind);
  L('Ribbon', document.getElementById('ribbonwrap').hidden
      ? 'hidden — not enough height for ' + (state.riverId ? 1 : RIVERS.length) + ' row(s)'
      : 'shown, row height ' + (RIB ? RIB.rowH : '?') + 'px');
  L('Reduced motion', reduceMotion ? 'yes' : 'no');
  L('Online', navigator.onLine ? 'yes' : 'no');
  L('BATHY_PROXY', BATHY_PROXY || '(empty — talking to DWR directly)');
  L('River', state.riverId || 'All');
  L('Depth ramp', state.ramp ? 'on' : 'off');
  L('NOAA chart probe', state.chartUsable === null ? 'not run' : String(state.chartUsable));
  if (state.catalog){
    L('Catalog age', ageText(Date.now() - state.catalog.at));
    L('Multibeam services', state.catalog.raster.length +
      (state.catalog.rasterError ? ' (error: ' + state.catalog.rasterError + ')' : ''));
    L('Single beam layers', state.catalog.single.length +
      (state.catalog.singleError ? ' (error: ' + state.catalog.singleError + ')' : ''));
    var un = state.catalog.raster.concat(state.catalog.single)
      .filter(function(r){ return r.box && r.box.unknownWkid; });
    if (un.length) L('Unplaced (projection not converted)',
      un.map(function(r){ return (r.name || r.title) + ' [wkid ' + r.box.unknownWkid + ']'; }).join('; '));
  } else L('Catalog', 'not loaded');
  RIVERS.forEach(function(r){
    var g = state.gauges[r.id];
    L('Gauges ' + r.id, g ? (g.rows.length + ' rows, ' +
      (g.fetchedAt ? ageText(Date.now() - g.fetchedAt) : 'never') +
      (g.stale ? ', STALE' : '')) : 'not loaded');
  });
  L('Marks on this river', String(state.marks.length) + ' (positions not included)');
  lines.push('');
  lines.push('Service worker:');
  var swPart = Promise.resolve('  not supported');
  if ('serviceWorker' in navigator){
    swPart = navigator.serviceWorker.getRegistration().then(function(reg){
      if (!reg) return '  none registered';
      return '  active=' + (reg.active ? reg.active.state : 'none') +
             ' waiting=' + (reg.waiting ? 'yes' : 'no') +
             ' installing=' + (reg.installing ? 'yes' : 'no');
    }).catch(function(e){ return '  query failed: ' + e; });
  }
  var cachePart = Promise.resolve('  caches API unavailable');
  if (window.caches && caches.keys){
    cachePart = caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){
        return caches.open(k).then(function(c){ return c.keys(); })
          .then(function(rs){ return '  ' + k + ': ' + rs.length + ' entries'; });
      })).then(function(rows){ return rows.join('\n') || '  none'; });
    }).catch(function(e){ return '  cache read failed: ' + e; });
  }
  /* Which build is actually live. The page cannot know this on its own —
     there is no build step to stamp a commit into a static file — so it
     asks the deployment, and says plainly when there is nothing to ask. */
  var buildPart = fetch('version', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j) return '  no /version endpoint on this host';
      return '  commit ' + (j.commit || 'unknown') +
             (j.branch ? ' on ' + j.branch : '') +
             (j.commit ? '' : ' — ' + j.source);
    })
    .catch(function(){ return '  /version did not answer'; });

  return Promise.all([swPart, cachePart, buildPart]).then(function(r){
    lines.push(r[0]);
    lines.push('');
    lines.push('Caches:');
    lines.push(r[1]);
    lines.push('');
    lines.push('Deployed build:');
    lines.push(r[2]);
    lines.push('');
    lines.push('Last network attempts (newest last):');
    state.net.slice(-25).forEach(function(n){
      lines.push('  ' + (n.ok ? 'ok  ' : 'FAIL') + ' ' + n.label +
                 (n.detail ? ' — ' + n.detail : ''));
    });
    return lines.join('\n');
  });
}

/* =====================================================================
   First run. The orientation survives whatever you press to begin: it is
   moved into the About panel, not copied there, so there is one copy of
   these words in the app.
   ===================================================================== */
/* The way out is wired at start-up, before there is any content for it to
   depend on, and it is one handler on the dialog rather than one per button,
   so Close, Start and the Escape key cannot drift into meaning different
   things. A dismiss that depends on the panel's own content is a trap the
   moment that content fails. */
function initWelcome(){
  var dlg = $('#welcome');
  if (!dlg.showModal) return;
  dlg.addEventListener('close', function(){
    try { Store.s.setItem('thalweg:_shared:welcomed', VERSION); } catch(e){}
    /* Closing a dialog returns focus to whatever opened it, and nothing
       opened this one — so focus fell to BODY and a reader on a keyboard or
       a screen reader was left with no position in the app at all. */
    var tab = document.querySelector('[role=tab][aria-selected=true]');
    if (tab) tab.focus();
  });
  $('#welcomeclose').addEventListener('click', function(){ dlg.close(); });
}

function maybeWelcome(){
  var seen = Store.s.getItem('thalweg:_shared:welcomed');
  if (seen === VERSION || !$('#welcome').showModal) return;
  showWelcome();
}

/* Also reachable from the (i) afterwards, which is what makes the panel
   testable more than once per device: dismissing it is remembered, so
   without a way back the only way to see it again is to clear storage. */
function showWelcome(){
  var dlg = $('#welcome');
  var b = $('#welcomebody'); b.innerHTML = '';
  function para(t, cls){ b.appendChild(el('p', cls ? {class:cls, text:t} : {text:t})); }
  function head(t){ b.appendChild(el('h3',{text:t})); }

  para('Three numbers for four rivers, in one place: how deep the water is, when the tide turns, and how much water is coming down. The Sacramento, the Feather, the American and the Mokelumne, and the Delta they run into.');

  head('What you are looking at');
  para('It opens on all four rivers at once, because that is usually the real question — not what the Feather is doing, but which of the four is worth the drive. Each bar is one river with its gauges where they sit along it, downstream on the left, and every dot is coloured by water temperature on the same scale, so the four can be read against each other.');
  para('Pick a single river from the top and you get its tide, its published depth surveys, and somewhere to drop your own marks. On a phone the map is a tab of its own beside Water, Layers, Marks and Brief, so the readings keep the screen until you ask for it.');

  head('Worth knowing before you rely on it');
  var u = el('ul',{class:'tight'});
  [ 'It works with no signal once it has loaded, which on most of this water is the normal condition. Tide predictions are fetched a week ahead so they stay good in your pocket.',
    'Flow and temperature are the exception — those need a signal, and when they go stale the top of the screen says so in orange rather than letting an old number sit there looking current.',
    'No account, no sign-up, no tracking, no third-party code. Your marks stay on this device.',
    'Depth is only where the state has actually surveyed. Where nothing has been surveyed it says so, rather than showing you an empty switch.'
  ].forEach(function(t){ u.appendChild(el('li',{text:t})); });
  b.appendChild(u);

  var installed = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if (!installed){
    head('Put it on your home screen');
    para('It opens full screen, loses the browser chrome, and keeps everything it had already loaded when you are out of signal.');
    b.appendChild(installList());
  }

  b.appendChild(el('div',{class:'magbox',
    text:'It does not know where fish are being caught and will not guess — no live catch feed exists for these rivers. It is not a navigation aid: the depth surveys come from the state, whose own notes say they are not for navigating by.'}));

  para('This is the first release. Every number comes from USGS, NOAA, DWR or CDFW and is labelled with which one — but it is a first release, so treat what you see as new until it has agreed with something you trust.', 'note');

  var row = el('div',{class:'rowline'});
  var ok = el('button',{type:'button',text:'Start'});
  ok.addEventListener('click', function(){ dlg.close(); });
  row.appendChild(ok);
  row.appendChild(el('span',{class:'note',
    text:'All of this, the install steps and what changed since last time live under the (i) button.'}));
  b.appendChild(row);

  dlg.showModal();
  /* Left to itself the dialog hands focus to the first thing it can find,
     which is the Start button at the very end of the body — so it opened
     scrolled past everything it exists to say, showing a button and no
     reason for it, with nothing to suggest there was anything above.
     Focus the title instead: the reader starts at the top, and the next
     Tab is the Close beside it. */
  b.scrollTop = 0;
  $('#welcometitle').focus();
}

/* =====================================================================
   Updates. The new version waits; it never takes over under the open
   page. An app that caches itself cannot notice it has gone stale, so
   the noticing has to be built on purpose.
   ===================================================================== */
function initSW(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if (reg.waiting) offerUpdate(reg);
    reg.addEventListener('updatefound', function(){
      var w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', function(){
        if (w.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(reg);
      });
    });
    /* Ask once on load and again when the app is brought back up. */
    setTimeout(function(){ reg.update().catch(function(){}); }, 8000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) reg.update().catch(function(){});
    });
  }).catch(function(e){ logNet('service worker', 'sw.js', false, String(e)); });

  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloading) return;
    reloading = true;
    window.location.reload();
  });
}

function offerUpdate(reg){
  var strip = $('#updatestrip');
  strip.hidden = false;
  $('#updatetext').textContent =
    'A new version of Thalweg is ready. It is waiting — nothing has changed under you.';
  $('#updatebtn').onclick = function(){
    try { Store.s.setItem('thalweg:_shared:justUpdated', '1'); } catch(e){}
    if (reg.waiting) reg.waiting.postMessage({ type:'SKIP_WAITING' });
    $('#updatetext').textContent = 'Loading…';
  };
  $('#updatedismiss').onclick = function(){ strip.hidden = true; };
  announce('A new version of Thalweg is waiting.');
}

/* The page that shows the strip is the old build and has never heard of
   the release it is offering. The only moment anything in the app knows
   what changed is after the reload, so that is when it says so. */
function maybeWhatChanged(){
  if (Store.s.getItem('thalweg:_shared:justUpdated') !== '1') return;
  try { Store.s.removeItem('thalweg:_shared:justUpdated'); } catch(e){}
  renderAbout();
  var dlg = $('#about');
  if (dlg.showModal) dlg.showModal();
  announce('Updated to ' + VERSION + '.');
}

/* =====================================================================
   Boot
   ===================================================================== */
function boot(){
  initPicker();
  initTabs();
  initMap();

  initWelcome();
  $('#aboutbtn').addEventListener('click', function(){
    renderAbout();
    var d = $('#about');
    if (d.showModal) d.showModal(); else d.setAttribute('open','open');
    $('#aboutbody').scrollTop = 0;
    $('#abouttitle').focus();
  });
  $('#aboutclose').addEventListener('click', function(){ $('#about').close(); });

  var initial = Store.s.getItem('thalweg:_shared:river');
  selectRiver(initial === null ? '' : initial);
  selectTab('water');

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      drawRibbon();
      drawTrendLines();
      if (state.map) state.map.invalidateSize();
    }, 180);
  });

  window.addEventListener('online',  function(){ refreshData(); announce('Back online.'); });
  window.addEventListener('offline', function(){ updateStaleness(); announce('Offline. Stored readings only.'); });
  setInterval(function(){ if (navigator.onLine) refreshData(); }, 10 * 60 * 1000);
  setInterval(updateStaleness, 60 * 1000);

  buildLine().then(function(txt){
    var chip = document.getElementById('verchip');
    if (!chip) return;
    var m = /build ([0-9a-f]{7})/.exec(txt);
    if (m) chip.textContent = 'v' + VERSION + ' · ' + m[1];
    chip.title = 'Thalweg ' + VERSION + ' · ' + txt;
  });

  initSW();
  maybeWhatChanged();
  maybeWelcome();
}

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
