<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thalweg — Central Valley depth &amp; conditions</title>
<meta name="description" content="Depth, tide and flow for the Sacramento, Feather, American and Mokelumne rivers and the Delta. Not for navigation.">
<!-- A link to this app shared anywhere showed nothing at all: there was no
     preview image and no card metadata. The image is the same one GitHub
     takes as the repository's social preview, built from social-card.html.
     It is deliberately NOT in the service worker's precache: half a megabyte
     that only a link unfurler ever asks for should not be part of what an
     angler downloads to have the app work with no signal. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Thalweg">
<meta property="og:title" content="Thalweg — Central Valley depth &amp; conditions">
<meta property="og:description" content="Depth, tide and flow for the Sacramento, Feather, American and Mokelumne — and the Delta they run into. Published surveys and gauges only. Not for navigation.">
<meta property="og:url" content="https://cv-thalweg.pages.dev/">
<meta property="og:image" content="https://cv-thalweg.pages.dev/social-preview.png">
<meta property="og:image:width" content="2560">
<meta property="og:image:height" content="1280">
<meta property="og:image:alt" content="Thalweg — depth, tide and flow for four Central Valley rivers. Marked: not for navigation.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0A1214">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --bg:#0A1214; --panel:#11201F; --panel-2:#0D1A19;
  --teal:#1F5B57; --teal-line:#2E7C76; --teal-bright:#3E8F88;
  --cyan:#7BD5D9; --buff:#C9A96A; --magenta:#DA4A85; --magenta-ink:#E76F9F;
  --ink:#E6F0EF; --mute:#9FB3B1; --warn:#F2A65A;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --water:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua","Times New Roman",serif;
  --rail:340px;
}
*{box-sizing:border-box}
/* The hidden attribute has to beat every display rule below it, or a panel
   that is switched off still draws. It cost a strip announcing an update
   on a first load, before there was anything to update from. */
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45;
  display:flex; flex-direction:column;
  -webkit-text-size-adjust:100%;
}
/* Sloping serif for anything in or on the water; upright sans for fixed
   features and system chrome. Cartographic lettering convention, used here
   to say which numbers are readings and which are furniture. */
.water{font-family:var(--water); font-style:italic}
h1,h2,h3{font-weight:600; line-height:1.25; margin:0}
a{color:var(--cyan)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,
[tabindex]:focus-visible,.leaflet-container:focus-visible{
  outline:3px solid var(--cyan); outline-offset:2px; border-radius:2px;
}
.skip{position:absolute; left:-9999px; top:0; z-index:2000; background:var(--panel);
  color:var(--ink); padding:.6rem .9rem; border:1px solid var(--teal-line)}
.skip:focus{left:.5rem; top:.5rem}

/* ---------- header ---------- */
header{
  flex:0 0 auto; background:var(--panel-2);
  border-bottom:1px solid var(--teal); padding:.45rem .7rem;
  display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
  padding-top:calc(.45rem + env(safe-area-inset-top));
}
/* At 200% text on a 320px screen the name and the version chip together
   measured 400px and pushed the document 80px past its own edge. A row of
   fixed-size things in a header is the shape that does this. */
.brand{display:flex; align-items:baseline; gap:.45rem; margin-right:auto;
  flex-wrap:wrap; min-width:0; max-width:100%}
.brand h1{font-size:1.05rem; letter-spacing:.08em; text-transform:uppercase;
  font-weight:700; margin:0}
.brand span{color:var(--mute); font-size:.72rem; letter-spacing:.04em}
/* Visible on every screen and therefore in every screenshot, which is the
   only reason it is here: a problem report that says which build it came
   from is worth several that do not. */
.ver{font-size:.66rem!important; letter-spacing:.06em!important;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.notnav{
  color:var(--magenta-ink); border:1px solid var(--magenta);
  font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
  padding:.18rem .45rem; white-space:nowrap; font-weight:600;
}
.pickwrap{display:inline-flex; align-items:center; gap:.35rem}
.stale{color:var(--warn); font-size:.72rem; max-width:100%}
.stale:empty{display:none}
button{font-family:inherit; font-size:inherit; color:inherit; background:none;
  border:1px solid var(--teal-line); padding:.3rem .55rem; cursor:pointer; border-radius:2px}
button:hover{background:#16302e}
button[aria-pressed=true]{background:var(--teal); border-color:var(--teal-bright)}
.iconbtn{width:2rem; height:2rem; line-height:1; padding:0; font-weight:700}
label{font-size:.8rem; color:var(--mute)}
select,input[type=text]{font-family:inherit; font-size:.9rem; color:var(--ink);
  background:var(--panel); border:1px solid var(--teal-line); padding:.3rem .4rem; border-radius:2px}

/* ---------- ribbon ---------- */
#ribbonwrap{flex:0 0 auto; background:var(--panel-2); border-bottom:1px solid var(--teal);
  padding:.35rem .5rem .1rem; overflow-x:auto}
#ribbon{display:block; width:100%; min-width:520px}
@media (max-width:900px){ #ribbon{min-width:0} }
.ribbon-note{color:var(--mute); font-size:.7rem; padding:0 .2rem .3rem}

/* ---------- main ---------- */
main{flex:1 1 auto; display:flex; min-height:0}
/* The map is per-river — depth is, marks are — so on All it can only show
   ungrounded dots. All is the compare-and-choose view and gets the whole
   stage; the map returns the moment a river is picked. */
/* The map panel takes role="tabpanel" under the breakpoint, which pulled in
   the padding and the scrolling meant for a panel of prose and inset the
   map eleven pixels on every side. Styling hung off a role reaches whatever
   later takes that role. */
#panel-map{flex:1 1 auto; display:flex; min-height:0; min-width:0;
  padding:0!important; overflow:hidden!important}
#panel-map > #map{flex:1 1 auto; min-width:0}
/* All rivers has no map — the map is per-river, and on All it could only
   show ungrounded dots — so neither the panel nor its tab exists there. */
body.all-rivers #panel-map, body.all-rivers #tab-map{display:none}
/* Wide enough for both at once: the map sits beside the rail as a column
   rather than as one of the rail's tabs, so the tab is not offered. */
@media (min-width:901px){ #tab-map{display:none} }
#map{flex:1 1 auto; min-height:260px; background:#08100f}
#rail{
  flex:0 0 var(--rail); width:var(--rail); background:var(--panel);
  border-left:1px solid var(--teal); display:flex; flex-direction:column;
  min-height:0; min-width:0;
}
/* DWR service names are one unbroken word sixty characters long. Without
   this they push the whole rail wider than its column and the panel
   headings slide off the left edge of the screen. */
#rail, #rail * { min-width:0 }
#rail button, #rail h2, #rail h3, #rail p, #rail .rdg-name, #rail .markrow{
  overflow-wrap:anywhere; word-break:break-word;
}
#rail button{ text-align:left; max-width:100% }
[role=tablist]{display:flex; border-bottom:1px solid var(--teal); flex:0 0 auto}
[role=tab]{flex:1 1 0; border:0; border-bottom:2px solid transparent; border-radius:0;
  padding:.5rem .2rem; color:var(--mute); font-size:.8rem; letter-spacing:.04em}
[role=tab][aria-selected=true]{color:var(--ink); border-bottom-color:var(--cyan); background:#16302e}
[role=tabpanel]{padding:.7rem; overflow-y:auto; flex:1 1 auto; min-height:0}
[role=tabpanel][hidden]{display:none}
h2.sec{font-size:.72rem; letter-spacing:.11em; text-transform:uppercase;
  color:var(--mute); margin:1.1rem 0 .35rem; border-bottom:1px solid var(--teal); padding-bottom:.2rem}
h2.sec:first-child{margin-top:0}

/* ---------- readings ---------- */
/* One card per river: what decides the drive, and nothing else. */
.rivercard{display:block; width:100%; text-align:left; margin:.5rem 0;
  padding:.6rem .65rem; border:1px solid var(--teal-line); border-radius:3px;
  background:var(--panel-2); cursor:pointer}
.rivercard:hover{background:#16302e}
.rivercard .rc-top{display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap}
.rivercard .rc-name{font-size:1rem; font-weight:600; letter-spacing:.02em}
.rivercard .rc-season{font-size:.66rem; letter-spacing:.07em; text-transform:uppercase;
  border:1px solid currentColor; padding:.05rem .3rem; border-radius:2px; white-space:nowrap}
.rivercard .rc-temp{display:flex; align-items:baseline; gap:.45rem; margin:.35rem 0 .1rem}
.rivercard .rc-deg{font-family:var(--water); font-style:italic; font-size:1.7rem; line-height:1}
.rivercard .rc-read{font-size:.8rem; color:var(--ink)}
.rivercard .rc-line{font-size:.78rem; color:var(--mute); margin-top:.15rem}
.rivercard .rc-line b{color:var(--ink); font-weight:400;
  font-family:var(--water); font-style:italic}
.rdg{border-bottom:1px solid #16302e; padding:.45rem 0}
.rdg:last-child{border-bottom:0}
.rdg-name{font-size:.85rem; display:flex; gap:.4rem; align-items:baseline; flex-wrap:wrap}
.rdg-id{color:var(--mute); font-size:.7rem; font-variant-numeric:tabular-nums}
.rdg-vals{display:flex; gap:1rem; flex-wrap:wrap; margin-top:.15rem}

/* ---------- the last seven days ---------- */
/* The line is the shape and nothing else. Every fact it carries — which way,
   how far, over how long, and the week's low and high — is written beside it
   in words and figures, because a stroke on a dark ground is exactly the kind
   of encoding that disappears in grayscale, at 200% text, or under a thumb. */
.trend-h{font-size:.82rem; color:var(--cyan); margin:.9rem 0 .1rem}
.trend-h:first-child{margin-top:0}
.trend-say{font-size:.85rem; margin:.1rem 0 .3rem}
.spark{display:block; max-width:100%;
  background:var(--panel-2); border:1px solid #16302e; border-radius:2px}
.spark-line{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.spark-fill{opacity:.10; stroke:none}
.spark-grid{stroke:#25514c; stroke-width:1}
.spark-ax{fill:var(--mute); font-size:9px; font-family:var(--sans)}
@media (prefers-contrast:more){
  .spark-fill{opacity:0}
  .spark-line{stroke-width:3}
}
.v{font-family:var(--water); font-style:italic; font-size:1.05rem; white-space:nowrap}
.v small{font-style:normal; font-family:var(--sans); font-size:.62rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin-left:.2rem}
.err{color:var(--warn); font-size:.78rem}
.flag{font-size:.62rem; letter-spacing:.07em; text-transform:uppercase;
  border:1px solid currentColor; padding:.05rem .3rem; border-radius:2px; white-space:nowrap}
.flag-unver{color:var(--warn)}
.flag-ver{color:var(--cyan)}
.flag-found{color:var(--buff)}
.note{color:var(--mute); font-size:.78rem; margin:.4rem 0}
.warnbox{border:1px solid var(--warn); color:var(--warn); padding:.45rem .55rem;
  font-size:.78rem; margin:.5rem 0; background:#1a150c}
.magbox{border:1px solid var(--magenta); color:var(--magenta-ink); padding:.45rem .55rem;
  font-size:.78rem; margin:.5rem 0; background:#1a0e15}
ul.tight{margin:.3rem 0; padding-left:1.1rem}
ul.tight li{margin:.2rem 0; font-size:.82rem}
.rowline{display:flex; gap:.5rem; align-items:center; margin:.35rem 0; flex-wrap:wrap}
.grow{flex:1 1 auto}
input[type=range]{accent-color:var(--cyan); flex:1 1 90px; min-width:80px}
.layer{border:1px solid #16302e; padding:.45rem .5rem; margin:.4rem 0}
.layer h3{font-size:.82rem; font-weight:600}
.layer p{margin:.25rem 0 0; font-size:.74rem; color:var(--mute)}
.swatch{display:inline-block; width:.7rem; height:.7rem; border-radius:50%; vertical-align:-1px}
#tidechart{display:block; width:100%; height:110px}
.hilo{display:flex; justify-content:space-between; font-size:.8rem;
  border-bottom:1px solid #16302e; padding:.22rem 0}
.hilo b{font-family:var(--water); font-style:italic; font-weight:400}
.markrow{display:flex; gap:.4rem; align-items:center; border-bottom:1px solid #16302e; padding:.3rem 0}
.markrow .grow{font-size:.8rem}
textarea{width:100%; min-height:6rem; background:var(--panel-2); color:var(--ink);
  border:1px solid var(--teal-line); font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- dialogs / strips ---------- */
.strip{background:var(--teal); color:var(--ink); padding:.5rem .7rem; display:flex;
  gap:.6rem; align-items:center; flex-wrap:wrap; font-size:.82rem; flex:0 0 auto}
/* The weir strip is not the update strip: one is about the app, the other is
   about the river, and they must not read as the same kind of news. */
.strip.weir{background:#4A2A12; border-bottom:1px solid var(--warn)}
.strip.weir b{color:var(--warn)}
dialog{background:var(--panel); color:var(--ink); border:1px solid var(--teal-line);
  max-width:min(46rem,94vw); width:100%; padding:0; border-radius:3px}
dialog::backdrop{background:rgba(4,9,10,.8)}
.dlg-head{display:flex; align-items:center; gap:.6rem; padding:.6rem .8rem;
  border-bottom:1px solid var(--teal); position:sticky; top:0; background:var(--panel)}
.dlg-body{padding:.8rem; max-height:min(70vh,44rem); overflow-y:auto}
.dlg-body h3{font-size:.9rem; margin:1.1rem 0 .3rem; color:var(--cyan)}
.dlg-body h3:first-child{margin-top:0}
.dlg-body p,.dlg-body li{font-size:.85rem}
.leaflet-container{background:#08100f; font-family:var(--sans)}
.leaflet-control-attribution{background:rgba(10,18,20,.82)!important; color:var(--mute)!important}
/* The attribution sits on a photograph. An underline is what makes the
   link a link there without depending on the colour surviving it. */
.leaflet-control-attribution a{color:var(--cyan)!important; text-decoration:underline}
.leaflet-bar a{background:var(--panel)!important; color:var(--ink)!important;
  border-bottom-color:var(--teal)!important}
/* Leaflet's popups are white with a white tail. Unstyled they read as a
   piece of a different application dropped on the map. */
.leaflet-popup-content-wrapper{
  background:var(--panel); color:var(--ink);
  border:1px solid var(--teal-line); border-radius:3px;
  box-shadow:0 3px 14px rgba(0,0,0,.55);
}
.leaflet-popup-content{ margin:.5rem .6rem; font-size:.82rem; line-height:1.4 }
.leaflet-popup-tip{ background:var(--panel); border:0; box-shadow:none }
.leaflet-popup-close-button{ color:var(--mute)!important; font-size:1.1rem!important }
.leaflet-popup-close-button:hover{ color:var(--ink)!important }
/* Room for the close button, which sits over the first line. */
.leaflet-popup-content .pop-name{ font-weight:600; display:block; margin-bottom:.15rem;
  padding-right:1.2rem }
.leaflet-popup-content .pop-vals{ display:flex; gap:.7rem; flex-wrap:wrap; margin:.15rem 0 }
.leaflet-popup-content .pop-sub{ color:var(--mute); font-size:.72rem; display:block; margin-top:.15rem }
.legend{background:rgba(13,26,25,.9); border:1px solid var(--teal-line); padding:.4rem .5rem;
  font-size:.7rem; color:var(--ink); line-height:1.35}
.legend b{font-weight:600; display:block; margin-bottom:.2rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mute); font-size:.62rem}

@media (max-width:900px){
  main{flex-direction:column}
  #rail{flex:1 1 auto; width:auto; border-left:0; border-top:1px solid var(--teal); min-height:0}
  :root{--rail:auto}

  /* The tagline is the first thing to go: the name says it, and on a
     667px screen a hundred and seventeen pixels of header is a sixth of
     everything before a single reading. */
  .brand span{display:none}
  .brand .ver{display:inline}
  header{padding:.35rem .5rem; gap:.4rem;
    padding-top:calc(.35rem + env(safe-area-inset-top))}
  .brand h1{font-size:.95rem}
  .notnav{font-size:.6rem; padding:.15rem .35rem; letter-spacing:.06em}
  header label{font-size:.72rem}
  select,input[type=text]{font-size:.82rem}

  #ribbonwrap{padding:.3rem .4rem 0}
  .ribbon-note{font-size:.66rem; line-height:1.25}

  /* The map is the canvas, not a panel, and on a phone it cannot be both
     visible and out of the way. It is off by default and takes the whole
     stage when asked for; the readings get the screen the rest of the
     time. Above this width nothing changes: map and rail sit side by
     side as before. */
  /* Under the breakpoint the map is one of the tabs: selected, it takes
     the stage and the rail shrinks to its tab strip; unselected it is not
     there at all. */
  #panel-map{display:none}
  body.show-map #panel-map{display:flex}
  body.show-map #rail{flex:0 0 auto}
  body.show-map [role=tabpanel]:not(#panel-map){display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important; transition-duration:.001ms!important}
}
@media (prefers-contrast:more){
  :root{--mute:#C3D4D2}
}
</style>
</head>
<body>
<a class="skip" href="#map">Skip to map</a>

<header>
  <div class="brand">
    <h1>Thalweg</h1>
    <span class="ver" id="verchip">v0.1.0</span>
    <span>Central Valley depth &amp; conditions</span>
  </div>
  <span class="notnav">Not for navigation</span>
  <span class="pickwrap">
    <label for="riverpick">River</label>
    <select id="riverpick"></select>
  </span>
  <span class="stale" id="staleness" role="status"></span>
  <button class="iconbtn" id="aboutbtn" aria-haspopup="dialog" title="About Thalweg"
          aria-label="About Thalweg, data sources, install and accessibility">i</button>
</header>

<!-- A weir over its crest changes where the river IS, so it is said where a
     reader is standing rather than only inside a panel they may not open. It
     is a standing indicator, not an interruption: nothing is dismissed and
     nothing is covered, and it goes when the weir does. -->
<div id="weirstrip" class="strip weir" role="status" aria-label="Weir overtopping" hidden>
  <span class="grow" id="weirtext"></span>
  <button id="weirgo" type="button">Show me</button>
</div>

<div id="updatestrip" class="strip" role="region" aria-label="App update" hidden>
  <span class="grow" id="updatetext">A new version of Thalweg is ready.</span>
  <button id="updatebtn">Load it</button>
  <button id="updatedismiss">Later</button>
</div>

<!-- Focusable because it scrolls sideways on a narrow screen, and a
     region you can only reach by dragging it is a region a keyboard
     cannot read. -->
<div id="ribbonwrap" role="region" aria-label="River ribbon" tabindex="0">
  <svg id="ribbon" role="img" aria-labelledby="ribbontitle ribbondesc" preserveAspectRatio="xMidYMid meet">
    <title id="ribbontitle">River ribbon</title>
    <desc id="ribbondesc">Gauges plotted at their latitude, downstream on the left, coloured by water temperature.</desc>
  </svg>
  <p class="ribbon-note" id="ribbonnote"></p>
</div>

<main>
  <div id="panel-map">
    <div id="map" tabindex="0" role="application"
         aria-label="Map. Arrow keys pan, plus and minus zoom. Use the Marks tab to add a mark without a pointer."></div>
  </div>
  <div id="rail">
    <div role="tablist" aria-label="Panels">
      <button role="tab" id="tab-water"  aria-controls="panel-water"  aria-selected="true"  tabindex="0">Water</button>
      <button role="tab" id="tab-map"    aria-controls="panel-map"    aria-selected="false" tabindex="-1">Map</button>
      <button role="tab" id="tab-layers" aria-controls="panel-layers" aria-selected="false" tabindex="-1">Layers</button>
      <button role="tab" id="tab-marks"  aria-controls="panel-marks"  aria-selected="false" tabindex="-1">Marks</button>
      <button role="tab" id="tab-brief"  aria-controls="panel-brief"  aria-selected="false" tabindex="-1">Brief</button>
    </div>
    <div role="tabpanel" id="panel-water"  aria-labelledby="tab-water"  tabindex="0"></div>
    <div role="tabpanel" id="panel-layers" aria-labelledby="tab-layers" tabindex="0" hidden></div>
    <div role="tabpanel" id="panel-marks"  aria-labelledby="tab-marks"  tabindex="0" hidden></div>
    <div role="tabpanel" id="panel-brief"  aria-labelledby="tab-brief"  tabindex="0" hidden></div>
  </div>
</main>

<dialog id="about" aria-labelledby="abouttitle">
  <div class="dlg-head">
    <h2 class="grow" id="abouttitle" tabindex="-1" style="font-size:1rem">About Thalweg</h2>
    <button id="aboutclose" aria-label="Close">Close</button>
  </div>
  <div class="dlg-body" id="aboutbody"></div>
</dialog>

<dialog id="welcome" aria-labelledby="welcometitle">
  <div class="dlg-head">
    <h2 class="grow" id="welcometitle" tabindex="-1" style="font-size:1rem">Thalweg</h2>
    <button id="welcomeclose" type="button">Close</button>
  </div>
  <div class="dlg-body" id="welcomebody"></div>
</dialog>

<script src="vendor/leaflet.js"></script>
<script>
/* =====================================================================
   Thalweg — depth and conditions for the Central Valley fall-run fishery.
   No build step. No framework. No CDN. No account. No analytics.
   ===================================================================== */
'use strict';

/* Where the bathymetry proxy lives.
   The default is same-origin, because functions/bathy/[[path]].js ships the
   proxy with the site: deploying to Pages deploys the proxy too, and there
   is nothing to paste in here. Set it to a standalone Worker's origin if you
   would rather run it separately. Set it to an empty string to talk to
   gis.water.ca.gov directly — fine on a laptop, and not fine in public,
   because then every visitor's pan and zoom lands on California's GIS
   infrastructure one tile at a time. The Layers panel says so if you do. */
var BATHY_PROXY = '/bathy';

var VERSION = '0.1.0';

/* Provenance. Every fact carried by this app declares where it came from,
   and the UI renders the three weaker kinds differently from the strong one.
   VERIFIED     checked against the live service and known good
   CORROBORATED supported by published documentation, not executed here
   UNCONFIRMED  recalled, guessed, or contradicted — never shown as fact
   FOUND        returned by the live API during this session */
var PROV = { VERIFIED:'verified', CORROBORATED:'corroborated',
             UNCONFIRMED:'unconfirmed', FOUND:'found' };

/* ---------------------------------------------------------------------
   RIVERS — the only place river-specific values live.

   Map centres and bounding boxes are viewport and query extents, not
   measurements: they decide what you look at, they are not presented as
   data. No gauge, station or reach coordinate is written here. Gauge

/* =====================================================================
   Storage. Tries window.storage, falls back to localStorage, falls back
   to memory. Nothing here assumes any of them exists or will accept a
   write: a private window, a full quota and an embedded webview all fail
   in different places, and none of them should cost you the app.
   ===================================================================== */
var Store = (function(){
  function usable(s){
    try { var k='__thalweg_probe'; s.setItem(k,'1'); s.removeItem(k); return true; }
    catch(e){ return false; }
  }
  try { if (window.storage && usable(window.storage))
          return { kind:'window.storage', s:window.storage }; } catch(e){}
  try { if (window.localStorage && usable(window.localStorage))
          return { kind:'localStorage', s:window.localStorage }; } catch(e){}
  var mem = {};
  return { kind:'memory (not persisted)', s:{
    getItem:function(k){ return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null; },
    setItem:function(k,v){ mem[k]=String(v); },
    removeItem:function(k){ delete mem[k]; }
  }};
})();

/* Keys are namespaced by river so two rivers never share a slot. */
function skey(riverId, name){ return 'thalweg:' + riverId + ':' + name; }
function sget(riverId, name){
  try { var raw = Store.s.getItem(skey(riverId,name));
        return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function sput(riverId, name, value){
  try { Store.s.setItem(skey(riverId,name), JSON.stringify(value)); return true; }
  catch(e){ return false; }
}

    else if (k === 'html') n.innerHTML = attrs[k];
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }

}
/* isFinite(null) is true, because null converts to zero. Every position
   and every reading in this app arrives from JSON where a missing value is
   null, so "is this a number" has to mean the type as well as the value —
   the loose test drew a gauge that had answered with nothing at latitude
   zero, in the Gulf of Guinea, coloured as though it had a temperature. */
function isNum(v){ return typeof v === 'number' && isFinite(v); }
function cToF(c){ return c * 9 / 5 + 32; }
function fmt(n, dp){
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return Number(n).toFixed(dp === undefined ? 0 : dp);
}
function commas(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function ageText(ms){
  if (!isFinite(ms)) return 'unknown age';
  var m = Math.round(ms / 60000);
  if (m < 1)  return 'seconds old';
  if (m < 60) return m + ' min old';
  var h = Math.round(m / 60);
  if (h < 48) return h + ' h old';
  return Math.round(h / 24) + ' days old';
}
function clockLocal(iso){
  var d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}
function dayLocal(iso){
  var d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
}

/* Temperature colour. Below the floor clamps cyan, above the ceiling clamps
   red; the ramp itself is linear between the declared stops so the same
   degree is the same colour on every river, which is the point of the
   stacked view. */
function tempColour(f){
  if (f === null || f === undefined || !isFinite(f)) return '#4A5F5E';
  var i, a, b, t;
  if (f <= TEMP_STOPS[0][0]) return TEMP_STOPS[0][1];
  for (i = 0; i < TEMP_STOPS.length - 1; i++){
    a = TEMP_STOPS[i]; b = TEMP_STOPS[i+1];
    if (f <= b[0]){
      t = (f - a[0]) / (b[0] - a[0]);
      return mixHex(a[1], b[1], t);
    }
  }
  return TEMP_STOPS[TEMP_STOPS.length-1][1];
}
function mixHex(x, y, t){
  function p(h,i){ return parseInt(h.slice(i,i+2),16); }
  var r = Math.round(p(x,1) + (p(y,1) - p(x,1)) * t),
      g = Math.round(p(x,3) + (p(y,3) - p(x,3)) * t),
      b = Math.round(p(x,5) + (p(y,5) - p(x,5)) * t);
  return '#' + [r,g,b].map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
}
/* What the number describes, in words, because FNU means nothing to anyone
   who has not met it. These bands are THIS APP'S OWN plain-language
   description of how water at that reading looks — they are not a published
   standard and they are not a statement about fishing. Turbidity is what
   the light does in the water; what the fish do with that is not something
   this app knows. */
var TURB_BANDS = [
  { under: 5,   word:'clear' },
  { under: 25,  word:'lightly coloured' },
  { under: 100, word:'stained' },
  { under: Infinity, word:'muddy' }
];
/* Which way the water is going, from a sign — and only when the discharge at
   the same gauge signs the same way. A velocity and a discharge that disagree
   at one instrument is not a fact about the river; it is two instruments
   disagreeing, and this app says that instead of choosing. */
function velReading(r){
  if (!isNum(r.vel)) return null;
  var down = r.vel >= 0;
  if (isNum(r.flow) && (r.flow >= 0) !== down)
    return { conflict:true,
      text:'velocity and discharge disagree about which way this water is going' };
  return { conflict:false, down:down,
    text: down ? 'running downstream'
               : 'running upstream — the tide is pushing in' };
}

function turbReading(f){
  if (!isNum(f)) return null;
  for (var i = 0; i < TURB_BANDS.length; i++)
    if (f < TURB_BANDS[i].under) return TURB_BANDS[i].word;
  return null;
}

function tempReading(f){
  if (f === null || f === undefined || !isFinite(f)) return null;
  for (var i = 0; i < TEMP_READING.length; i++)
    if (f < TEMP_READING[i].under) return TEMP_READING[i].text;
  return null;
}

  return el('span',{class:'flag flag-unver', text:'unconfirmed'});

/* Fetch with a timeout, because a hung request on a boat is worse than a
   failed one: a failure can fall back to the stored payload, a hang cannot. */
function getJSON(url, ms){
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, ms || 15000);
  return fetch(url, { signal: ctrl ? ctrl.signal : undefined, credentials:'omit' })
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .finally(function(){ clearTimeout(timer); });
}

/* The same request, for a source that publishes CSV rather than JSON. */

  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, ms || 15000);
  return fetch(url, { signal: ctrl ? ctrl.signal : undefined, credentials:'omit' })
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .finally(function(){ clearTimeout(timer); });
}

/* =====================================================================
   USGS instantaneous values.
   Two requests per river: the declared identifiers, and a bounding-box
   sweep that returns whatever active gauges actually exist in the reach.
   The sweep is why no gauge identifier in this app has to be a guess —
   anything the app did not already know arrives with the name the API
   gives it, and a declared identifier that answers with nothing is shown
   as an error row rather than quietly disappearing.
   ===================================================================== */
var USGS = 'https://waterservices.usgs.gov/nwis/iv/';
/* Turbidity is 63680, in Formazin Nephelometric Units. It rides in the same
   request as flow, stage and temperature, so it costs one more series per
   site that has a sensor and nothing at all at the sites that do not — and
   most do not. Verified on 2026-08-28: published at Rio Vista, Freeport and
   Verona on the Sacramento and at two of the Mokelumne's three, at NONE of
   the American's four, and CDEC publishes none for the Feather. */
/* And 72255, mean water velocity, in feet per second. It is signed, and on
   this water the sign is the useful part: negative means the water is running
   the wrong way, which on a tidal reach is the tide pushing in. The
   convention is not assumed — checked on 2026-08-29 at all seven gauges that
   publish both, the velocity sign matched the discharge sign at the same
   timestamp every time, and the app re-checks that per gauge and says so when
   they disagree rather than picking a side. */
var USGS_PARAMS = '00060,00065,00010,63680,72255';

/* The DISCOVERY sweep asks for less, and this cost a run to notice. A bBox
   over one river's whole basin returns 234KB and takes nine and a half
   seconds with three parameters; adding turbidity and velocity took it to
   354KB, and four of those fire at once on a cold open. Discovery exists to
   FIND gauges this app has not declared, so it needs only enough to show one.
   The extra readings are enrichment for the river's own named gauges, which
   are asked for separately and cheaply — 34KB in ninety milliseconds. */
var USGS_DISCOVER_PARAMS = '00060,00065,00010';

function usgsBySites(ids){
  var url = USGS + '?format=json&sites=' + ids.join(',') +
            '&parameterCd=' + USGS_PARAMS + '&siteStatus=all';
  return getJSON(url).then(function(j){
    logNet('USGS sites', url, true, ids.length + ' requested');
    return parseUsgs(j);
  }, function(e){
    logNet('USGS sites', url, false, String(e && e.message || e));
    throw e;
  });
}

function usgsByBox(bbox){
  var url = USGS + '?format=json&bBox=' + bbox.map(function(v){ return v.toFixed(3); }).join(',') +
            '&parameterCd=' + USGS_DISCOVER_PARAMS + '&siteStatus=active';
  return getJSON(url).then(function(j){
    logNet('USGS bBox', url, true, '');
    return parseUsgs(j);
  }, function(e){
    logNet('USGS bBox', url, false, String(e && e.message || e));
    return {};   /* discovery is a bonus; its failure must not cost the panel */
  });
}

/* NWIS returns one timeSeries per site per parameter. Fold them into one
   row per site, keyed by site code, carrying the name the API supplied. */
function parseUsgs(j){
  var out = {};
  var ts = j && j.value && j.value.timeSeries;
  if (!Array.isArray(ts)) return out;
  ts.forEach(function(t){
    var si = t.sourceInfo || {};
    var code = si.siteCode && si.siteCode[0] && si.siteCode[0].value;
    if (!code) return;
    var geo = si.geoLocation && si.geoLocation.geogLocation;
    var row = out[code] || (out[code] = {
      id: code,
      name: si.siteName || '',
      lat: geo ? Number(geo.latitude) : null,
      lon: geo ? Number(geo.longitude) : null,
      flow: null, stage: null, tempF: null, turb: null, vel: null, at: null
    });
    var pc = t.variable && t.variable.variableCode && t.variable.variableCode[0]
             && t.variable.variableCode[0].value;
    var vals = t.values && t.values[0] && t.values[0].value;
    if (!Array.isArray(vals) || !vals.length) return;
    var last = vals[vals.length - 1];
    var v = Number(last.value);
    /* NWIS sends -999999 for "no reading". A missing temperature must show
       a dash, never a zero, and never a minus one million. */
    if (!isFinite(v) || v <= -999998) return;
    if (pc === '00060') row.flow  = v;
    if (pc === '00065') row.stage = v;
    /* USGS publishes Celsius; CDEC publishes Fahrenheit. Both are converted
       here, at the edge, so that exactly one unit exists downstream and no
       renderer has to know where a reading came from. */
    if (pc === '00010') row.tempF = cToF(v);
    /* Only if the service says FNU. A turbidity series in another unit is a
       different measurement wearing the same parameter code, and this app
       does not convert by guesswork. */
    if (pc === '63680'){
      var unit = t.variable && t.variable.unit && t.variable.unit.unitCode;
      if (String(unit || '').toUpperCase() === 'FNU') row.turb = v;
    }
    if (pc === '72255'){
      var vu = String((t.variable && t.variable.unit && t.variable.unit.unitCode) || '').toLowerCase();
      if (vu === 'ft/sec') row.vel = v;
    }
    if (last.dateTime && (!row.at || last.dateTime > row.at)) row.at = last.dateTime;
  });
  return out;
}

function loadGauges(river){
  var all = river.gauges.concat(river.contextGauges || []);
  var declared = all.map(function(g){ return g.id; });
  var jobs = [];
  jobs.push(declared.length ? usgsBySites(declared).catch(function(){ return null; })
                            : Promise.resolve({}));
  /* Discovery is a sweep over a whole river basin — 234KB and about nine
     seconds — and it runs for the river being READ, not for all four at
     once on a landing screen whose cards are built from the gauges this app
     names anyway. Four of these on a cold open was most of what made the
     first fifteen seconds unreliable. */
  var sweep = river.discover && state.riverId === river.id;
  jobs.push(sweep ? usgsByBox(river.bbox) : Promise.resolve({}));
  jobs.push(loadCdec(river));

  return Promise.all(jobs).then(function(res){
    var byId = res[0], found = res[1] || {}, cdec = res[2];
    var rows = [], seen = {};

    /* CDEC first, because on the Feather it is the river and USGS is not.
       Names and positions come from the RIVERS entry because the servlet
       returns neither; they were read from CDEC's own station pages. */
    (river.cdecGauges || []).forEach(function(g){
      seen[g.id] = true;
      var hit = cdec && cdec[g.id];
      if (hit){
        hit.name = g.name; hit.lat = g.lat; hit.lon = g.lon;
        hit.status = g.status; hit.declared = true; hit.source = 'CDEC';
        rows.push(hit);
      } else {
        rows.push({ id:g.id, name:g.name, status:g.status, declared:true,
          source:'CDEC', lat:g.lat, lon:g.lon,
          error: cdec === null ? 'CDEC did not answer'
                               : 'no reading returned for this station',
          flow:null, stage:null, tempF:null, at:null });
      }
    });

    /* Declared identifiers first, in the order they were declared, each
       keeping its own provenance flag whatever the API said. */
    var contextIds = {};
    (river.contextGauges || []).forEach(function(g){ contextIds[g.id] = true; });
    all.forEach(function(g){
      var hit = byId && byId[g.id];
      seen[g.id] = true;
      if (hit){
        hit.status = g.status;
        hit.declared = true;
        hit.hint = g.hint;
        /* A tributary is shown because it tells you what is arriving, and
           it is marked because it is not this river. It never goes on the
           ribbon: the ribbon is positions along one river. */
        hit.context = !!contextIds[g.id];
        rows.push(hit);
      } else {
        rows.push({ id:g.id, name:'', status:g.status, declared:true,
                    context: !!contextIds[g.id],
                    error: byId === null ? 'request failed'
                                         : 'no data returned for this identifier',
                    hint:g.hint, flow:null, stage:null, tempF:null, at:null,
                    lat:null, lon:null });
      }
    });

    /* Then whatever the sweep turned up whose name names this river. */
    var re = river.discover ? new RegExp(river.discover.match, 'i') : null;
    Object.keys(found).forEach(function(id){
      if (seen[id]) return;
      if (re && !re.test(found[id].name || '')) return;
      found[id].status = PROV.FOUND;
      rows.push(found[id]);
    });

    /* A round in which every site errored is the network failing, not six
       new facts about six gauges. It must not overwrite a payload that had
       real readings in it, or one bad minute on a levee road costs you the
       last reading you had. */
    var anyData = rows.some(function(r){ return !r.error; });
    var payload = { rows:rows, fetchedAt:Date.now(), noData:!anyData };
    if (anyData){ sput(river.id, 'gauges', payload); return payload; }
    var kept = sget(river.id, 'gauges');
    if (kept){ kept.stale = true; return kept; }
    return payload;
  }).catch(function(){
    /* Everything failed. Fall back to the last good payload and let the
       header say how old it is; flow and temperature go stale and must
       say so rather than sitting there looking current. */
    var cached = sget(river.id, 'gauges');
    if (cached){ cached.stale = true; return cached; }
    return { rows:[], fetchedAt:null, failed:true };
  });
}

/* =====================================================================
   CDEC — the Feather River's gauges, which are DWR's rather than USGS's.

   Three things about this service shape the code. It answers with a plain
   array rather than an envelope. It sends no Access-Control-Allow-Origin
   at all, so the browser can only read it through this app's own proxy —
   which is why /cdec exists and why direct mode cannot work here. And its
   timestamps carry no offset, being Pacific by convention.

   Every reading is checked against the units the row declares rather than
   against the sensor number alone. A sensor renumbered or re-scaled at
   the far end then produces no reading instead of a wrong one.
   ===================================================================== */
var CDEC_DIRECT = 'https://cdec.water.ca.gov';
var CDEC_PATH = '/dynamicapp/req/JSONDataServlet';
var CDEC_SENSORS = '1,20,25';   /* river stage, flow, water temperature */

function cdecUrl(path){
  return BATHY_PROXY ? (BATHY_PROXY + '/cdec' + path) : (CDEC_DIRECT + path);
}

/* "2026-8-25 23:00" — no offset, Pacific by convention.
 *
 * Built from parts rather than handed to the Date parser, which treats the
 * same string differently depending on the browser. And anchored to
 * America/Los_Angeles rather than to the device, because those are only
 * the same thing on a device that happens to be in California: read
 * anywhere else the reading arrives hours adrift, and "how old is this"
 * is the one question this app must not get wrong.
 */
function cdecDate(str){
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/.exec(String(str || ''));
  if (!m) return null;
  var y = +m[1], mo = +m[2], d = +m[3], h = +m[4], mi = +m[5];
  var guess = Date.UTC(y, mo - 1, d, h, mi);
  try {
    var fmt = new Intl.DateTimeFormat('en-US', {
      timeZone:'America/Los_Angeles', hour12:false,
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit'
    });
    var g = {};
    fmt.formatToParts(new Date(guess)).forEach(function(p){ g[p.type] = p.value; });
    var back = Date.UTC(+g.year, +g.month - 1, +g.day,
                        +g.hour === 24 ? 0 : +g.hour, +g.minute);
    return new Date(guess + (guess - back));
  } catch (e) {
    /* No Intl, or no zone data: fall back to the device's own zone, which
       is right in California and wrong elsewhere. */
    return new Date(y, mo - 1, d, h, mi);
  }
}

function parseCdec(rows){
  var out = {};
  if (!Array.isArray(rows)) return out;
  rows.forEach(function(r){
    var id = r && r.stationId;
    if (!id) return;
    var v = Number(r.value);
    /* CDEC marks a missing reading with a large negative sentinel. */
    if (!isNum(v) || v <= -9998) return;
    var when = cdecDate(r.obsDate || r.date);
    if (!when) return;
    var t = when.getTime();
    var row = out[id] || (out[id] = { id:id, name:'', flow:null, stage:null,
      tempF:null, at:null, lat:null, lon:null, _at:{} });
    var units = String(r.units || '').toUpperCase();

    function take(field, ok){
      if (!ok) return;
      if (row._at[field] !== undefined && row._at[field] >= t) return;
      row._at[field] = t;
      row[field] = field === 'tempF' && units === 'DEG C' ? cToF(v) : v;
      /* The reading time is the newest value actually used, never the
         newest row seen. A row refused for its units contributed nothing,
         and letting it move the clock forward would print a timestamp
         newer than anything on screen. */
      if (!row.at || t > new Date(row.at).getTime()) row.at = when.toISOString();
    }
    if (r.SENSOR_NUM === 20) take('flow',  units === 'CFS');
    if (r.SENSOR_NUM === 1)  take('stage', units === 'FEET');
    if (r.SENSOR_NUM === 25) take('tempF', units === 'DEG F' || units === 'DEG C');
  });
  return out;
}

function loadCdec(river){
  var list = river.cdecGauges || [];
  if (!list.length) return Promise.resolve({});
  var start = new Date(); start.setDate(start.getDate() - 2);
  var end   = new Date(); end.setDate(end.getDate() + 1);
  function ymdDash(d){
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  var url = cdecUrl(CDEC_PATH + '?Stations=' + list.map(function(g){ return g.id; }).join(',') +
    '&SensorNums=' + CDEC_SENSORS + '&dur_code=E' +
    '&Start=' + ymdDash(start) + '&End=' + ymdDash(end));
  return getJSON(url, 25000).then(function(j){
    var parsed = parseCdec(j);
    logNet('CDEC', url, true, Object.keys(parsed).length + ' station(s)');
    return parsed;
  }, function(e){
    logNet('CDEC', url, false, String(e && e.message || e));
    return null;
  });
}

/* =====================================================================
   NOAA CO-OPS tide predictions.
   Seven days of hourly heights and of highs and lows are fetched at once
   and stored, so the curve and the table stay valid with no network. A
   prediction is arithmetic about the future; unlike flow it does not go
   stale sitting in a pocket.
   ===================================================================== */
var COOPS = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter';
var COOPS_MD = 'https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=tidepredictions&units=english';

function ymd(d){
  return d.getFullYear() +
    ('0'+(d.getMonth()+1)).slice(-2) +
    ('0'+d.getDate()).slice(-2);
}

function coopsUrl(station, interval, days){
  var begin = new Date(); begin.setDate(begin.getDate() - 1);
  var end   = new Date(); end.setDate(end.getDate() + (days || 7));
  return COOPS + '?product=predictions&application=thalweg' +
    '&begin_date=' + ymd(begin) + '&end_date=' + ymd(end) +
    '&datum=MLLW&station=' + station + '&time_zone=lst_ldt' +
    '&units=english&interval=' + interval + '&format=json';
}

/* CO-OPS answers an unusable request with HTTP 200 and an error object,
   so the body has to be read rather than the status. */
function coopsPredictions(url){
  return getJSON(url).then(function(j){
    if (j && j.error) return { error: j.error.message || 'no data' };
    return { rows: j.predictions || [] };
  });
}

function loadTide(river, station){
  if (!station) return Promise.resolve(null);
  var uH = coopsUrl(station, 'h'), uL = coopsUrl(station, 'hilo');
  /* The highs and lows are the part that matters and every prediction
     station has them. The hourly curve is a reference-station luxury:
     a subordinate station — New Hope Bridge, Terminous — answers
     interval=h with an error, and drawing an interpolated line through
     its highs and lows would be inventing the water in between. So the
     curve is optional and its absence is said out loud. */
  return Promise.all([
    coopsPredictions(uH).catch(function(e){ return { error:String(e && e.message || e) }; }),
    coopsPredictions(uL)
  ]).then(function(r){
    var hourly = r[0].rows || [], hilo = r[1].rows || [];
    if (!hilo.length) throw new Error(r[1].error || 'no predictions in response');
    logNet('CO-OPS predictions', uL, true, 'station ' + station +
      (hourly.length ? '' : ', highs and lows only'));
    var payload = {
      station: station,
      hourly: hourly.map(function(p){ return { t:p.t, v:Number(p.v) }; }),
      hourlyUnavailable: !hourly.length,
      hilo: hilo.map(function(p){ return { t:p.t, v:Number(p.v), type:p.type }; }),
      fetchedAt: Date.now()
    };
    sput(river.id, 'tide:' + station, payload);
    return payload;
  }).catch(function(e){
    logNet('CO-OPS predictions', uH, false, String(e && e.message || e));
    var cached = sget(river.id, 'tide:' + station);
    if (cached){ cached.offline = true; return cached; }
    return { station:station, failed:String(e && e.message || e) };
  });
}

/* Station discovery. The lower Mokelumne is tidal and its prediction
   stations were not known when this was written, so they are looked up
   from NOAA's own station index by position rather than typed in from
   memory. The index is large and changes rarely, so it is stored once. */
/* NOAA's whole prediction-station index is TWO MEGABYTES, it ignores the
   state filter, and this app was fetching it once per tidal river on every
   cold open: four megabytes of the five and a half a first-time reader was
   paying, to learn the position of four stations it already names. The
   per-station endpoint is 2.6KB and carries the same name and coordinate,
   so the principle holds — no station position is ever typed into this app —
   at one eight-hundredth of the cost. A position does not move, so it is
   kept once and not asked for again. */
var COOPS_STATION = 'https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/';

function stationMeta(id){
  var cached = sget('_shared', 'station:' + id);
  if (cached && cached.lat !== undefined) return Promise.resolve(cached);
  var url = COOPS_STATION + id + '.json';
  /* One catch at the end, not a rejection handler beside the fulfilment
     one: a throw inside the fulfilled branch is not caught by its own
     sibling, and this threw six unhandled rejections onto the page before
     the tests said so. A station this app cannot place is returned without
     a position rather than raised — the caller drops it. */
  return getJSON(url, 20000).then(function(j){
    var st = (j && j.stations && j.stations[0]) || null;
    var out = st ? { id:String(id), name:st.name || '',
                     lat:Number(st.lat), lon:Number(st.lng) } : null;
    if (!out || !isNum(out.lat) || !isNum(out.lon)){
      logNet('CO-OPS station', url, false, 'no usable record for ' + id);
      return { id:String(id), name:'', lat:null, lon:null };
    }
    sput('_shared', 'station:' + id, out);
    logNet('CO-OPS station', url, true, out.name);
    return out;
  }).catch(function(e){
    logNet('CO-OPS station', url, false, String(e && e.message || e));
    return { id:String(id), name:'', lat:null, lon:null };
  });
}

/* The declared stations only. The full index is a separate, deliberate act —
   see nearbyTideStations — because it costs two megabytes and nobody should
   pay that to read the tide at a station this app already knows. */
function discoverTideStations(river){
  var wanted = (river.tideStations || []).map(function(s){ return s.id; });
  var extra = sget(river.id, 'tidestations');
  if (extra && extra.list) wanted = wanted.concat(extra.list.map(function(s){ return s.id; }));
  var seen = {};
  wanted = wanted.filter(function(id){ if (seen[id]) return false; seen[id] = true; return true; });
  return Promise.all(wanted.map(stationMeta)).then(function(rows){
    return rows.filter(function(r){ return isNum(r.lat) && isNum(r.lon); })
               .map(function(r){ r.status = PROV.FOUND; return r; });
  });
}

/* Two megabytes, on purpose, because somebody asked to see what else is out
   there. Once per device: the reduced result is kept and the declared
   stations then come from it without asking again. */
function nearbyTideStations(river){
  return getJSON(COOPS_MD, 30000).then(function(j){
    logNet('CO-OPS station index', COOPS_MD, true, 'asked for on purpose');
    var b = river.bbox, list = [];
    (j.stations || []).forEach(function(s){
      var lat = Number(s.lat), lon = Number(s.lng);
      if (!isFinite(lat) || !isFinite(lon)) return;
      if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) return;
      list.push({ id:String(s.id), name:s.name, lat:lat, lon:lon, status:PROV.FOUND });
    });
    sput(river.id, 'tidestations', { at:Date.now(), list:list });
    return list;
  }, function(e){
    logNet('CO-OPS station index', COOPS_MD, false, String(e && e.message || e));
    throw e;
  });
}

/* =====================================================================
   DWR bathymetry.
   Two different data types, and the difference is the product. A
   multibeam raster is a continuous surface and draws as tiles. Single
   beam soundings are discrete points along the boat's track and are not
   a surface; drawing them as one would invent bottom between the lines.
   ===================================================================== */
var DWR_DIRECT = 'https://gis.water.ca.gov';
var IMG_FOLDER = '/arcgisimg/rest/services/Bathymetry';
var SBM_SERVICE = '/arcgis/rest/services/Elevation/i06_Singlebeam_Bathymetry/MapServer';

function dwr(path){ return (BATHY_PROXY || DWR_DIRECT) + path; }

/* The depth ramp.
 *
 * This rule was run against the live ImageServer before it was written
 * down, which is the only way to know: a rendering rule ArcGIS does not
 * understand does NOT come back as an error. It comes back as HTTP 200,
 * content-type image/png, and a hundred-odd bytes of empty picture. So
 * there is no probe that can tell a working rule from a broken one by
 * watching for a failure — the failure looks exactly like clear water.
 *
 * Two things were measured and both are load-bearing. An explicit
 * ColorRamp object is silently ignored, so the ramp has to be named.
 * "Elevation #2" over a percent-clip stretch with dynamic range
 * adjustment is the one that picks the thalweg out from the flats either
 * side of it, which is the line this app is named after.
 */
var RAMP = encodeURIComponent(JSON.stringify({
  rasterFunction:'Colormap',
  rasterFunctionArguments:{
    ColorrampName:'Elevation #2',
    Raster:{ rasterFunction:'Stretch',
      rasterFunctionArguments:{ StretchType:6, MinPercent:0.5, MaxPercent:0.5,
        DRA:true, UseGamma:false } }
  }
}));

var EsriImg = L.TileLayer.extend({
  options:{ opacity:0.8, maxZoom:19, ramp:false },
  getTileUrl:function(coords){
    var b  = this._tileCoordsToBounds(coords);
    var sw = L.CRS.EPSG3857.project(b.getSouthWest());
    var ne = L.CRS.EPSG3857.project(b.getNorthEast());
    var u = this._baseUrl + '/exportImage?bbox=' + [sw.x,sw.y,ne.x,ne.y].join(',')
          + '&bboxSR=3857&imageSR=3857&size=256,256&format=png32'
          + '&transparent=true&f=image';
    if(this.options.ramp) u += '&renderingRule=' + RAMP;
    return u;
  },
  initialize:function(baseUrl,opts){
    this._baseUrl = baseUrl;
    L.TileLayer.prototype.initialize.call(this,'',opts);
  }
});

/* --- extents -------------------------------------------------------- */
/* ArcGIS reports each service's extent in that service's own projection,
   and DWR's bathymetry is published in State Plane California — usually
   as a WKT string with no EPSG code at all, occasionally as wkid 2226 or
   2227. Every one of the twenty multibeam services is Lambert Conformal
   Conic; every one of the eighty-one single beam layers is Web Mercator.
   So both are converted here rather than guessed at: an extent placed in
   the wrong projection puts a survey in the wrong river, which is the
   class of mistake this whole app is arranged to refuse. */
function extentToLatLng(ext){
  if (!ext || !isNum(ext.xmin) || !isNum(ext.ymin) ||
      !isNum(ext.xmax) || !isNum(ext.ymax)) return null;
  var sr = ext.spatialReference || {};
  var wkid = sr.latestWkid || sr.wkid;
  if (wkid === 4326 || wkid === 4269){
    /* NAD83 and WGS84 differ by about a metre here. That is far inside the
       tolerance of "does this survey touch this river". */
    return { w:ext.xmin, s:ext.ymin, e:ext.xmax, n:ext.ymax,
             approx: wkid === 4269, wkid:wkid };
  }
  if (wkid === 3857 || wkid === 102100 || wkid === 900913){
    var a = invMercator(ext.xmin, ext.ymin), b = invMercator(ext.xmax, ext.ymax);
    return { w:a.lon, s:a.lat, e:b.lon, n:b.lat, approx:false, wkid:wkid };
  }
  var lcc = sr.wkt ? parseWkt(sr.wkt) : STATE_PLANE[wkid];
  if (lcc && lcc.projection === 'Lambert_Conformal_Conic' && isNum(lcc.lon0)){
    var c = lccInverse(lcc, ext.xmin, ext.ymin),
        d = lccInverse(lcc, ext.xmax, ext.ymax);
    return { w:c.lon, s:c.lat, e:d.lon, n:d.lat, approx:false,
             wkid: wkid || (lcc.name || 'WKT'), unit:lcc.toMetre };
  }
  return { unknownWkid: wkid === undefined ? (sr.wkt ? 'WKT this build cannot read' : 'absent') : wkid };
}
function invMercator(x, y){
  var R = 6378137;
  return { lon: x / R * 180 / Math.PI,
           lat: (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI };
}

/* The two State Plane zones DWR publishes without a WKT. */
var STATE_PLANE = {
  2226:{ name:'CA State Plane II (US ft)', projection:'Lambert_Conformal_Conic',
    a:6378137, invf:298.257222101, fe:6561666.667, fn:1640416.667, lon0:-122,
    lat1:38.3333333333333, lat2:39.8333333333333, lat0:37.6666666666667,
    toMetre:0.3048006096012192 },
  2227:{ name:'CA State Plane III (US ft)', projection:'Lambert_Conformal_Conic',
    a:6378137, invf:298.257222101, fe:6561666.667, fn:1640416.667, lon0:-120.5,
    lat1:37.0666666666667, lat2:38.4333333333333, lat0:36.5,
    toMetre:0.3048006096012192 }
};

/* Esri WKT carries every parameter the inverse needs, so it is read
   rather than matched to an EPSG code. */
function parseWkt(wkt){
  function num(k){
    var m = wkt.match(new RegExp('PARAMETER\\["' + k + '",(-?[\\d.eE+]+)\\]', 'i'));
    return m ? Number(m[1]) : null;
  }
  var sph = wkt.match(/SPHEROID\["[^"]*",([\d.]+),([\d.]+)\]/);
  var proj = wkt.match(/PROJECTION\["([^"]+)"\]/);
  var name = wkt.match(/PROJCS\["([^"]+)"/);
  /* The horizontal unit is the LAST UNIT inside PROJCS. A WKT that also
     carries a VERTCS ends with the VERTICAL unit, and reading that one
     runs a survey measured in feet through a metre conversion — which put
     two Delta surveys in the Trinity Alps before it was noticed. */
  var horiz = wkt.split(/,\s*VERTCS\[/)[0];
  var units = horiz.match(/UNIT\["[^"]+",[\d.]+\]/g) || [];
  var last = units.length ? units[units.length - 1].match(/,([\d.]+)\]$/) : null;
  return {
    name: name ? name[1] : null,
    projection: proj ? proj[1] : null,
    a: sph ? Number(sph[1]) : 6378137,
    invf: sph ? Number(sph[2]) : 298.257222101,
    fe:num('False_Easting'), fn:num('False_Northing'),
    lon0:num('Central_Meridian'), lat1:num('Standard_Parallel_1'),
    lat2:num('Standard_Parallel_2'), lat0:num('Latitude_Of_Origin'),
    toMetre: last ? Number(last[1]) : 1
  };
}

/* Snyder's inverse for the two-standard-parallel case. */
function lccInverse(p, x, y){
  var D = Math.PI / 180, f = 1 / p.invf, e = Math.sqrt(2 * f - f * f), a = p.a;
  var X = (x - p.fe) * p.toMetre, Y = (y - p.fn) * p.toMetre;
  function m(phi){ return Math.cos(phi) / Math.sqrt(1 - e * e * Math.pow(Math.sin(phi), 2)); }
  function t(phi){
    return Math.tan(Math.PI / 4 - phi / 2) /
           Math.pow((1 - e * Math.sin(phi)) / (1 + e * Math.sin(phi)), e / 2);
  }
  var p1 = p.lat1 * D, p2 = p.lat2 * D, p0 = p.lat0 * D;
  var n = Math.abs(p1 - p2) < 1e-12 ? Math.sin(p1)
        : (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t(p1)) - Math.log(t(p2)));
  var F = m(p1) / (n * Math.pow(t(p1), n));
  var rho0 = a * F * Math.pow(t(p0), n);
  var rho = (n < 0 ? -1 : 1) * Math.sqrt(X * X + Math.pow(rho0 - Y, 2));
  var tp = Math.pow(rho / (a * F), 1 / n);
  var lon = Math.atan2(X, rho0 - Y) / n + p.lon0 * D;
  var phi = Math.PI / 2 - 2 * Math.atan(tp);
  for (var i = 0; i < 12; i++){
    var es = e * Math.sin(phi);
    phi = Math.PI / 2 - 2 * Math.atan(tp * Math.pow((1 - es) / (1 + es), e / 2));
  }
  return { lat: phi / D, lon: lon / D };
}
function boxesIntersect(a, b){
  return !(a.e < b[0] || a.w > b[2] || a.n < b[1] || a.s > b[3]);
}

/* --- enumeration ---------------------------------------------------- */
/* The layer list is never typed into this file. It is read from the REST
   directory, each layer's own extent decides which rivers it belongs to,
   and a layer whose extent cannot be placed is listed separately rather
   than assigned to a river on a hunch. */
function pool(items, n, fn){
  var out = new Array(items.length), i = 0;
  function next(){
    if (i >= items.length) return Promise.resolve();
    var k = i++;
    return Promise.resolve(fn(items[k], k)).then(function(v){ out[k] = v; }, function(){ out[k] = null; })
      .then(next);
  }
  var runners = [];
  for (var r = 0; r < Math.min(n, items.length); r++) runners.push(next());
  return Promise.all(runners).then(function(){ return out; });
}

function loadCatalog(force){
  if (state.catalog && !force) return Promise.resolve(state.catalog);
  var cached = sget('_shared', 'catalog');
  if (cached && !force && (Date.now() - cached.at) < 7 * 24 * 3600 * 1000){
    state.catalog = cached; return Promise.resolve(cached);
  }
  var folderUrl = dwr(IMG_FOLDER + '?f=json');
  var sbmUrl    = dwr(SBM_SERVICE + '/layers?f=json');

  var raster = getJSON(folderUrl, 25000).then(function(j){
    logNet('DWR bathymetry folder', folderUrl, true,
           ((j.services||[]).length) + ' services');
    var svcs = (j.services || []).filter(function(s){ return s.type === 'ImageServer'; });
    return pool(svcs, 5, function(s){
      var u = dwr('/arcgisimg/rest/services/' + s.name + '/ImageServer?f=json');
      return getJSON(u, 20000).then(function(m){
        return {
          kind:'raster',
          name:s.name.replace(/^Bathymetry\//, ''),
          path:'/arcgisimg/rest/services/' + s.name + '/ImageServer',
          title: String(m.name || s.name).replace(/^Bathymetry\//, ''),
          description: plainText(m.description || m.serviceDescription).slice(0, 400),
          pixel: (m.pixelSizeX && m.pixelSizeY) ? [m.pixelSizeX, m.pixelSizeY] : null,
          box: extentToLatLng(m.extent)
        };
      });
    }).then(function(rows){ return rows.filter(Boolean); });
  }).catch(function(e){
    logNet('DWR bathymetry folder', folderUrl, false, String(e && e.message || e));
    if (BATHY_PROXY && BATHY_PROXY.charAt(0) === '/') state.proxyMissing = true;
    return { error: String(e && e.message || e) };
  });

  var single = getJSON(sbmUrl, 25000).then(function(j){
    logNet('DWR singlebeam layers', sbmUrl, true, ((j.layers||[]).length) + ' layers');
    return (j.layers || []).filter(function(l){
      return l.type !== 'Group Layer';
    }).map(function(l){
      return {
        kind:'single',
        id:l.id,
        name:l.name,
        title:l.name,
        description: plainText(l.description).slice(0, 400),
        depthField: pickDepthField(l.fields),
        maxRecords: isNum(l.maxRecordCount) ? l.maxRecordCount : null,
        fields:(l.fields || []).map(function(f){ return f.name; }),
        box: extentToLatLng(l.extent)
      };
    });
  }).catch(function(e){
    logNet('DWR singlebeam layers', sbmUrl, false, String(e && e.message || e));
    return { error: String(e && e.message || e) };
  });

  return Promise.all([raster, single]).then(function(r){
    var cat = { at:Date.now(),
                raster: Array.isArray(r[0]) ? r[0] : [],
                rasterError: Array.isArray(r[0]) ? null : r[0].error,
                single: Array.isArray(r[1]) ? r[1] : [],
                singleError: Array.isArray(r[1]) ? null : r[1].error };
    state.catalog = cat;
    sput('_shared', 'catalog', cat);
    return cat;
  });
}

/* The depth attribute is whatever the layer calls it, so it is read from
   the layer's own field list rather than assumed. If nothing looks like a
   depth the points still draw, in one colour, saying why. */
/* ArcGIS publishes descriptions as HTML fragments. They go into the page
   as text, so the markup has to come off first or the reader gets a
   paragraph of DIV tags. */
function plainText(html){
  if (!html) return '';
  var d = document.createElement('div');
  d.innerHTML = String(html);
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}

function pickDepthField(fields){
  if (!Array.isArray(fields)) return null;
  var numeric = fields.filter(function(f){
    return /Double|Single|Integer|Float/i.test(f.type || '') &&
           !/^(OBJECTID|FID|Shape)/i.test(f.name || '');
  });
  var order = [/^z$/i, /elev/i, /depth/i, /bed/i, /bottom/i, /sounding/i, /_z$/i];
  for (var i = 0; i < order.length; i++){
    for (var k = 0; k < numeric.length; k++)
      if (order[i].test(numeric[k].name)) return numeric[k].name;
  }
  return null;
}

/* Layers whose extent places them inside this river's box. */
/* Overlap area, so a survey that sits squarely in this reach comes before
   one that clips its corner. Both are honestly "in the box"; only one is
   what you were looking for. */
function overlapArea(box, b){
  var w = Math.min(box.e, b[2]) - Math.max(box.w, b[0]);
  var h = Math.min(box.n, b[3]) - Math.max(box.s, b[1]);
  return (w > 0 && h > 0) ? w * h : 0;
}
function catalogFor(cat, river){
  function rank(rows){
    return rows.filter(function(row){
        return row.box && !row.box.unknownWkid && boxesIntersect(row.box, river.bbox);
      })
      .map(function(row){
        row.overlap = overlapArea(row.box, river.bbox);
        return row;
      })
      .sort(function(a, b){ return b.overlap - a.overlap; });
  }
  function unplaced(row){ return row.box && row.box.unknownWkid; }
  return {
    raster: rank(cat.raster),
    single: rank(cat.single),
    unplaced: cat.raster.filter(unplaced).concat(cat.single.filter(unplaced))
  };
}

/* --- single beam query ---------------------------------------------- */
/* Queried by the current map bounds and hard capped. The whole layer is
   never requested: these are point clouds, and one of them at full extent
   would be tens of megabytes onto a phone on a levee road. */
function querySoundings(layer, bounds){
  var b = bounds;
  var cap = Math.min(FEATURE_CAP, layer.maxRecords || FEATURE_CAP);
  var env = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
  var url = dwr(SBM_SERVICE + '/' + layer.id + '/query' +
    '?f=json&where=1%3D1' +
    '&geometry=' + encodeURIComponent(env) +
    '&geometryType=esriGeometryEnvelope&inSR=4326' +
    '&spatialRel=esriSpatialRelIntersects' +
    '&outFields=' + encodeURIComponent(layer.depthField || '*') +
    '&returnGeometry=true&outSR=4326' +
    '&resultRecordCount=' + cap);
  return getJSON(url, 30000).then(function(j){
    if (j.error) throw new Error(j.error.message || 'service error');
    var feats = j.features || [];
    logNet('DWR soundings', url, true, feats.length + ' features');
    return {
      features: feats,
      truncated: !!j.exceededTransferLimit || feats.length >= cap,
      cap: cap,
      field: layer.depthField
    };
  }, function(e){
    logNet('DWR soundings', url, false, String(e && e.message || e));
    throw e;
  });
}

/* =====================================================================
   The ribbon.
   Gauges at their true position along the river's axis, downstream on the
   left, each dot coloured by water temperature, with the tidal reach
   drawn as a fade rather than a line because that is what it is. On the
   All view the four rivers stack against one temperature scale, which is
   the comparison this app exists to make.
   ===================================================================== */
var SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined)
    n.setAttribute(k, attrs[k]);
  return n;
}
function axisValue(river, row){
  return river.axis === 'lon' ? row.lon : row.lat;
}

/* The upstream end of tidal influence is not a fixed point and this app
   will not draw it as one. What it draws instead is a fact: the furthest
   upstream place NOAA publishes a tide prediction for this river. That is
   a real limit with a real name, and it comes from the station index
   rather than from anybody's memory of where the tide stops. */
function tidalEdge(river){
  var t = state.tides[river.id];
  if (!t || !t.stations || !t.stations.length) return null;
  /* Declared stations only. The discovered ones come from a bounding box
     over the lower Delta, which catches most of the bay: taking the
     furthest upstream of THOSE had the Mokelumne's tide reaching Stockton,
     which is on the San Joaquin. A declared station was checked against
     the river it is on; a box hit was not. */
  var declared = {};
  (river.tideStations || []).forEach(function(s){ declared[s.id] = true; });
  var best = null;
  t.stations.forEach(function(st){
    if (!declared[st.id]) return;
    var v = river.axis === 'lon' ? st.lon : st.lat;
    if (!isNum(v)) return;
    if (best === null || v > best.v) best = { v:v, name:st.name || st.id };
  });
  return best;
}

/* On a phone the ribbon is drawn tighter. Four stacked rivers at the
   desktop pitch is half a 667px screen, and the comparison is the point of
   the view — but not at the price of the readings underneath it. */
var RIB = { rowH:52, top:24, foot:30, dot:6, fig:11, name:11, note:9, narrow:false };
/* The ribbon has a height budget now, and it did not before.
   Width was fixed once and height never was: four rows at 44px plus its
   chrome is 218px of SVG and 263px of band whatever screen it is on, which
   on an iPhone 13's real 664px viewport left the readings 237px, on an
   iPhone SE 125px, and with the software keyboard up TWENTY-TWO — the same
   failure that was found and fixed at 34px, back again because the fix was
   measured against 390x844. That is a phone's SCREEN; the page gets 664.
   So rows shrink to fit a share of the viewport, and below a floor where a
   dot and its figure no longer fit, the ribbon is not drawn at all: a floor
   that exceeds the space available is just the next fixed size that fails. */
function ribbonMetrics(W, rowCount, budget){
  var n = W < 620;
  var m = n ? { rowH:44, top:18, foot:24, dot:5, fig:10, name:10, note:8, narrow:true }
            : { rowH:52, top:24, foot:30, dot:6, fig:11, name:11, note:9, narrow:false };
  if (isNum(budget) && rowCount > 0){
    var avail = budget - m.top - m.foot;
    var fit = Math.floor(avail / rowCount);
    if (fit < m.rowH) m.rowH = fit;
  }
  m.tooTight = m.rowH < 22;
  RIB = m;
}

function ribbonRow(g, river, rows, x0, x1, y, showName){
  var edge = river.tidal ? tidalEdge(river) : null;
  rows = rows.filter(function(r){ return !r.context; });
  var pts = rows.filter(function(r){ return isNum(axisValue(river, r)); });
  var vals = pts.map(function(r){ return axisValue(river, r); });
  var lo, hi;
  if (vals.length){
    lo = Math.min.apply(null, vals); hi = Math.max.apply(null, vals);
  } else { lo = 0; hi = 1; }
  if (edge){ lo = Math.min(lo, edge.v); hi = Math.max(hi, edge.v); }
  if (hi - lo < 1e-6){ lo -= 0.05; hi += 0.05; }
  var pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  var sx = function(v){ return x0 + (v - lo) / (hi - lo) * (x1 - x0); };

  /* the channel */
  g.appendChild(svg('rect', { x:x0, y:y-5, width:(x1-x0), height:10,
    fill:'#16302e', stroke:'#1F5B57' }));

  /* tidal reach, fading out where the influence is said to stop */
  if (edge){
    var gid = 'tidegrad-' + river.id;
    var defs = svg('defs', {});
    var lg = svg('linearGradient', { id:gid, x1:'0', x2:'1', y1:'0', y2:'0' });
    lg.appendChild(svg('stop', { offset:'0',   'stop-color':'#7BD5D9', 'stop-opacity':'.55' }));
    lg.appendChild(svg('stop', { offset:'.55', 'stop-color':'#7BD5D9', 'stop-opacity':'.28' }));
    lg.appendChild(svg('stop', { offset:'1',   'stop-color':'#7BD5D9', 'stop-opacity':'0' }));
    defs.appendChild(lg); g.appendChild(defs);
    var tx = sx(edge.v);
    var left = Math.min(x0, tx), right = Math.max(x0, tx);
    g.appendChild(svg('rect', { x:left, y:y-5, width:Math.max(0, right-left),
      height:10, fill:'url(#' + gid + ')' }));
    /* Below the lower band of figures, not through it, and never past the
       edge of the drawing — a caption clipped mid-word says less than no
       caption, and the right-hand end of the ribbon is upstream. */
    var text = (RIB.narrow ? 'tide to ' : 'tide predicted to ') + edge.name;
    var half = text.length * RIB.note * 0.29;
    var anchor = 'middle', lx = tx;
    if (tx + half > x1){ anchor = 'end'; lx = x1; }
    else if (tx - half < x0){ anchor = 'start'; lx = x0; }
    var lab = svg('text', { x:lx, y:y + RIB.dot + (RIB.narrow ? 25 : 31),
      fill:'#9FB3B1', 'font-size':String(RIB.note), 'text-anchor':anchor });
    lab.textContent = text;
    g.appendChild(lab);
  }

  if (showName){
    var rn = svg('text', { x:6, y:y+4, fill:'#E6F0EF', 'font-size':String(RIB.name),
      'font-weight':'600' });
    rn.textContent = river.short;
    g.appendChild(rn);
  }

  /* Gauges bunch up — three of them sit within a few miles on the lower
     river — so the figures stagger rather than print on top of each
     other. Sorted first so "the one before me" means the one to my left. */
  pts.sort(function(a, b){ return axisValue(river, a) - axisValue(river, b); });
  /* Two bands, above the channel and below it, each remembering where it
     last printed. A figure that fits in neither is not printed at all —
     stacked digits are less use than none, and the reading is on the dot. */
  var lastAt = { hi:-1e9, lo:-1e9 }, gap = RIB.fig * 2.4;
  pts.forEach(function(r){
    var f = isNum(r.tempF) ? r.tempF : null;
    var x = sx(axisValue(river, r));
    var band = (x - lastAt.hi >= gap) ? 'hi'
             : ((x - lastAt.lo >= gap) ? 'lo' : null);
    var high = band === 'hi';
    var c = svg('circle', { cx:x, cy:y, r:RIB.dot, fill:tempColour(f),
      stroke:'#0A1214', 'stroke-width':'1.5' });
    var ttl = svg('title');
    ttl.textContent = (r.name || r.id) + (f === null ? ' — no temperature'
      : ' — ' + fmt(f,1) + 'F');
    c.appendChild(ttl);
    g.appendChild(c);
    if (band){
      lastAt[band] = x;
      var t = svg('text', { x:x, y: high ? y - (RIB.dot + 5) : y + (RIB.dot + 13),
        fill:'#E6F0EF', 'font-size':String(RIB.fig),
        'text-anchor':'middle', 'font-family':'Georgia,serif', 'font-style':'italic' });
      t.textContent = f === null ? '—' : fmt(f,0);
      g.appendChild(t);
    }
  });
  return pts.length;
}

function tempScale(g, x, y, w){
  var id = 'tempscale';
  var defs = svg('defs', {});
  var lg = svg('linearGradient', { id:id, x1:'0', x2:'1', y1:'0', y2:'0' });
  TEMP_STOPS.forEach(function(s){
    lg.appendChild(svg('stop', {
      offset: ((s[0]-TEMP_MIN)/(TEMP_MAX-TEMP_MIN)*100) + '%', 'stop-color':s[1] }));
  });
  defs.appendChild(lg); g.appendChild(defs);
  g.appendChild(svg('rect', { x:x, y:y, width:w, height:8, fill:'url(#'+id+')',
    stroke:'#1F5B57' }));
  [[TEMP_MIN, x, 'start'], [TEMP_MAX, x+w, 'end']].forEach(function(p){
    var t = svg('text', { x:p[1], y:y+19, fill:'#9FB3B1', 'font-size':'9',
      'text-anchor':p[2] });
    t.textContent = p[0] + 'F';
    g.appendChild(t);
  });
}

function drawRibbon(again){
  var host = $('#ribbon');
  /* Keep the title and desc; they are the accessible name of the figure. */
  Array.prototype.slice.call(host.childNodes).forEach(function(n){
    if (n.nodeName !== 'title' && n.nodeName !== 'desc') host.removeChild(n);
  });

  /* Draw at the width the ribbon is actually rendered at, so the scale is
     1 and an 11px figure is 11 pixels. A fixed 1000-unit viewBox squeezed
     into a phone made the figures unreadable and left the difference as
     dead space above and below them. */
  /* Under the breakpoint the ribbon fits the screen rather than scrolling:
     the right-hand end is upstream, and a view you have to drag sideways to
     finish reading is one nobody finishes reading. */
  var narrow = window.matchMedia && window.matchMedia('(max-width:900px)').matches;
  var W = narrow ? Math.max(host.clientWidth || 360, 300)
                 : Math.max(host.clientWidth || 1000, 520);
  var list = state.riverId ? [byId(state.riverId)] : RIVERS;
  /* Under the breakpoint the ribbon and the readings share one screen, so
     the ribbon takes a share of it rather than whatever it wants. Above it
     they are side by side and there is nothing to take it from.
     The budget is for the BAND, not the drawing: the legend, the note and
     the padding are two thirds of the height on a short screen, and a
     budget that only bounds the SVG bounds the wrong thing. */
  var wrapEl = document.getElementById('ribbonwrap');
  var budget = null;
  if (narrow){
    var cs = window.getComputedStyle(wrapEl);
    var extra = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    Array.prototype.forEach.call(wrapEl.children, function(c){
      if (c !== host) extra += c.getBoundingClientRect().height;
    });
    budget = Math.round((window.innerHeight || 800) * 0.32) - extra
             - (again && isNum(again) ? again : 0);
  }
  ribbonMetrics(W, list.length, budget);
  var wrap = document.getElementById('ribbonwrap');
  wrap.hidden = !!RIB.tooTight;
  if (RIB.tooTight) return;
  wrap.hidden = false;
  var rowH = RIB.rowH, top = RIB.top;
  var H = top + list.length * rowH + RIB.foot;
  host.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  host.setAttribute('height', H);
  host.setAttribute('width', W);
  var g = svg('g', {});
  var plotted = 0, missing = 0;

  list.forEach(function(river, i){
    var payload = state.gauges[river.id];
    var rows = (payload && payload.rows) || [];
    var onRiver = rows.filter(function(r){ return !r.context; });
    var n = ribbonRow(g, river, rows, list.length > 1 ? (RIB.narrow ? 74 : 96) : 30,
                      W - 20, top + i * rowH, list.length > 1);
    plotted += n;
    missing += onRiver.length - n;
  });
  /* Bottom left on a phone, bottom right where there is room. Off the
     right-hand edge it was simply invisible, and it is the key to every
     colour above it. */
  tempScale(g, RIB.narrow ? 6 : W - 190, H - (RIB.narrow ? 20 : 26),
            RIB.narrow ? 104 : 170);
  host.appendChild(g);

  var note = RIB.narrow
    ? 'Downstream left. ' + plotted + ' gauge' + (plotted === 1 ? '' : 's') + ' plotted'
    : 'Downstream on the left; ' +
      (state.riverId ? byId(state.riverId).axisLabel
                     : 'each river on its own axis, one temperature scale') + '. ' +
      plotted + ' gauge' + (plotted === 1 ? '' : 's') + ' plotted';
  if (missing) note += RIB.narrow ? ', ' + missing + ' not' : ', ' + missing + ' not plotted (no position or no data)';
  $('#ribbonnote').textContent = note + '.';

  /* And then check. The legend and the note are measured at the size they
     had BEFORE this draw, so the first pass can still overshoot; one
     corrective pass with the measured overshoot subtracted converges,
     and a guard stops it becoming a loop. Raising a number until it looks
     better is not debugging — reading what the browser actually did is. */
  if (narrow && !again){
    var over = Math.round(wrapEl.getBoundingClientRect().height) -
               Math.round((window.innerHeight || 800) * 0.32);
    if (over > 2) drawRibbon(over);
  }
  $('#ribbondesc').textContent = note + '. Readings are listed in the Water panel.';
}

function byId(id){
  for (var i = 0; i < RIVERS.length; i++) if (RIVERS[i].id === id) return RIVERS[i];
  return null;
}

/* =====================================================================
   Map
   ===================================================================== */
var BASEMAPS = [
  { id:'imagery', label:'Esri imagery',
    url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr:'Imagery: Esri, Maxar, Earthstar Geographics' },
  { id:'topo', label:'Esri topo',
    url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    attr:'Topography: Esri' },
  { id:'dark', label:'CARTO dark',
    url:'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    attr:'&copy; OpenStreetMap contributors, &copy; CARTO' }
];
var NOAA_CHART = {
  url:'https://tileservice.charts.noaa.gov/tiles/50000_1/{z}/{x}/{y}.png',
  attr:'Charts: NOAA Office of Coast Survey',
  /* Chart coverage of these waters ends upstream of about Verona. Drawn as
     a band rather than a line because the exact end was not confirmed. */
  limitBand: [[38.74,-121.75],[38.82,-121.45]],
  limitStatus: PROV.UNCONFIRMED
};

var reduceMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Every label on the map is a popup rather than a tooltip.
 *
 * A tooltip is drawn beside its marker and left there. It is not panned
 * into view and it is not flipped, so a marker near an edge — which on a
 * phone, where the map is half a screen tall, is most of them — puts its
 * label partly or wholly outside the map frame, where the container's
